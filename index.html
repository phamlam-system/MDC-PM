        return r;
      })()
    + pjRow('Ngày bắt đầu', esc(d['Ngày bắt đầu']||'—'))
    + pjRow('Ngày kết thúc dự kiến', d['Ngày kết thúc DK']
        ? esc(d['Ngày kết thúc DK']) + (daysLeft(d['Ngày kết thúc DK'])<0&&d['Trạng thái']==='Đang triển khai'
            ? ' <span class="tag t-bad">Trễ '+Math.abs(daysLeft(d['Ngày kết thúc DK']))+' ngày</span>'
            : daysLeft(d['Ngày kết thúc DK'])>=0?' <span class="muted">còn '+daysLeft(d['Ngày kết thúc DK'])+' ngày</span>':'')
        : '—')
    + pjRow('Ngân sách chi phí', ns?fmtTr(ns):'Chưa đặt')
    + (d['Mã KH (CRM)']?pjRow('Lead gốc từ CRM','<span class="tag t-brass">'+esc(d['Mã KH (CRM)'])+'</span>'):'')
    + (d['Ghi chú']?pjRow('Ghi chú', esc(d['Ghi chú'])):'')
    + '</tbody></table></div></div></div>';

  // Việc sắp tới
  const sapTo = cv.filter(c=>c['Trạng thái']!=='Hoàn thành'&&c['Hạn hoàn thành'])
    .sort((a,b)=>(a['Hạn hoàn thành']>b['Hạn hoàn thành']?1:-1)).slice(0,6);
  html += '<div class="card"><div class="card-head"><h3>Công việc cần làm tiếp</h3>'
    + '<button class="btn btn-ghost" style="padding:6px 12px;font-size:12.5px" onclick="pjSetTab(\'congviec\')">Xem tất cả →</button></div>';
  if(sapTo.length){
    html += '<div class="card-body" style="padding:0"><div class="tbl-wrap"><table class="tbl"><tbody>';
    html += sapTo.map(c=>{
      const dl = daysLeft(c['Hạn hoàn thành']);
      return '<tr class="row-click" onclick="formTask(\''+c['Mã CV']+'\')"><td><b>'+esc(c['Tên công việc'])+'</b><div class="muted">'+esc(c['Giai đoạn']||'')+' · '+esc(c['Phụ trách']||'—')+'</div></td>'
        + '<td class="num">'+(dl<0?'<span class="tag t-bad">Trễ '+Math.abs(dl)+'n</span>':dl===0?'<span class="tag t-bad">Hôm nay</span>':dl<=3?'<span class="tag t-warn">Còn '+dl+'n</span>':'<span class="muted">'+esc(c['Hạn hoàn thành'])+'</span>')+'</td>'
        + '<td>'+tagTT(c['Trạng thái'])+'</td></tr>';
    }).join('');
    html += '</tbody></table></div></div>';
  } else html += '<div class="empty">Không còn công việc nào chưa hoàn thành</div>';
  html += '</div>';
  return html;
}
function pjRow(k,v){ return '<tr><td class="muted" style="width:190px;white-space:nowrap">'+k+'</td><td>'+v+'</td></tr>'; }

/* ----- TAB 2: CÔNG VIỆC — Bảng Kanban kéo-thả ----- */
function pjCongViec(d){
  const code = d['Mã DA'];
  const canEd = canEditProject(d);
  const allCV = tvSong(S.congviec).filter(x=>x['Mã DA']===code);
  const daXoa = (S.congviec||[]).filter(x=>x['Mã DA']===code && String(x['Đã xóa']||'')==='1');
  const hm = (S.hangmuc||[]).filter(x=>x['Mã DA']===code);
  const view = window._cvView || 'kanban';
  const fHM = window._cvHM || '';

  let list = allCV.filter(c=>!fHM || (fHM==='__none' ? !c['Mã HM'] : c['Mã HM']===fHM));

  /* ---- Thanh công cụ ---- */
  let html = '<div class="kb-bar">'
    + '<select onchange="window._cvHM=this.value;render()" style="min-width:190px">'
      + '<option value="">Tất cả hạng mục</option>'
      + hm.map(h=>'<option value="'+esc(h['Mã HM'])+'"'+(fHM===h['Mã HM']?' selected':'')+'>'+esc(h['Tên hạng mục'])+'</option>').join('')
      + '<option value="__none"'+(fHM==='__none'?' selected':'')+'>— Chưa gán hạng mục —</option>'
      + '</select>'
    + '<span class="hint">'+(view==='kanban'?'Kéo-thả thẻ để đổi trạng thái. ':'')+'Tổng <b>'+list.length+'</b> đầu việc.</span>'
    + '<div style="margin-left:auto;display:flex;gap:7px;flex-wrap:wrap">'
    + '<div class="fin-pills" style="margin:0">'
      + '<button class="'+(view==='kanban'?'on':'')+'" style="padding:6px 13px" onclick="window._cvView=\'kanban\';render()">▦ Bảng</button>'
      + '<button class="'+(view==='list'?'on':'')+'" style="padding:6px 13px" onclick="window._cvView=\'list\';render()">☰ Danh sách</button>'
    + '</div>'
    + (daXoa.length?'<button class="btn btn-ghost" style="padding:7px 12px;font-size:12.5px" onclick="cvTrash(\''+code+'\')">🗑 Đã xóa ('+daXoa.length+')</button>':'')
    + (canEd?'<button class="btn btn-brass" style="padding:7px 14px;font-size:12.5px" onclick="window._ftp=\''+code+'\';formTask()">+ Tạo đầu việc</button>':'')
    + '</div></div>';

  if(!allCV.length){
    return html + '<div class="empty" style="padding:30px 20px"><b>Chưa có đầu việc</b>'
      + '<b style="color:var(--brass-deep)">⚡ Nhanh nhất:</b> sang tab <b>Kế hoạch</b> → "Lập từ thư viện" để tạo cả bộ hạng mục + đầu việc chuẩn MDC.<br>'
      + 'Hoặc bấm "+ Tạo đầu việc" — trong form có ô chọn nhanh từ thư viện.<br><br>'
      + (canEd?'<button class="btn btn-brass" onclick="pjSetTab(\'kehoach\')">⚡ Sang tab Kế hoạch</button> '
        + '<button class="btn btn-ghost" onclick="window._ftp=\''+code+'\';formTask()">+ Tạo 1 đầu việc</button>':'')
      + '</div>';
  }

  /* ---- Chế độ danh sách (bảng nhóm theo giai đoạn) ---- */
  if(view==='list') return html + cvListView(list, hm);

  /* ---- Bảng Kanban ---- */
  const cols = KB_COLS.map(()=>[]);
  list.forEach(c=>cols[kbColOf(c['Trạng thái'])].push(c));
  cols.forEach(arr=>arr.sort((a,b)=>{
    const pa = {'Cao':0,'Trung bình':1,'Thấp':2}[a['Ưu tiên']] ?? 1;
    const pb = {'Cao':0,'Trung bình':1,'Thấp':2}[b['Ưu tiên']] ?? 1;
    if(pa!==pb) return pa-pb;
    return (a['Hạn hoàn thành']||'9999')>(b['Hạn hoàn thành']||'9999')?1:-1;
  }));

  html += '<div class="kb-wrap">';
  KB_COLS.forEach((col,i)=>{
    html += '<div class="kb-col '+col.cls+'">'
      + '<div class="kb-h">'+esc(col.label)+'<span class="n">'+cols[i].length+'</span></div>'
      + '<div class="kb-body" id="kb'+i+'"'
        + ' ondragover="kbOver(event,'+i+')" ondragleave="kbLeave('+i+')" ondrop="kbDrop(event,'+i+')">';
    html += cols[i].length
      ? cols[i].map(c=>kbCard(c, hm, canEd)).join('')
      : '<div class="kb-empty">Kéo đầu việc vào đây</div>';
    html += '</div></div>';
  });
  html += '</div>';

  /* ---- Thống kê nhanh dưới bảng ---- */
  const treHan = list.filter(c=>c['Trạng thái']!=='Hoàn thành'&&c['Hạn hoàn thành']&&daysLeft(c['Hạn hoàn thành'])<0);
  const vuong = list.filter(c=>kbColOf(c['Trạng thái'])===2);
  const chuaGan = list.filter(c=>!c['Phụ trách']);
  if(treHan.length||vuong.length||chuaGan.length){
    html += '<div class="card" style="margin-top:4px"><div class="card-body" style="display:flex;gap:18px;flex-wrap:wrap;font-size:12.5px">'
      + (treHan.length?'<span>⚠ <b style="color:var(--bad)">'+treHan.length+'</b> việc trễ hạn</span>':'')
      + (vuong.length?'<span>🚧 <b style="color:var(--bad)">'+vuong.length+'</b> việc đang vướng</span>':'')
      + (chuaGan.length?'<span>👤 <b style="color:var(--warn)">'+chuaGan.length+'</b> việc chưa gán người phụ trách</span>':'')
      + '</div></div>';
  }
  return html;
}

/* ----- Thẻ Kanban ----- */
function kbCard(c, hm, canEd){
  const h = hm.find(x=>x['Mã HM']===c['Mã HM']);
  const pri = c['Ưu tiên']==='Cao'?'p-cao':c['Ưu tiên']==='Thấp'?'p-thap':'p-tb';
  const dl = c['Hạn hoàn thành'] ? daysLeft(c['Hạn hoàn thành']) : null;
  const done = c['Trạng thái']==='Hoàn thành';
  let dueCls = '', dueTxt = '';
  if(c['Hạn hoàn thành']){
    const dmy = fmtDMY(c['Hạn hoàn thành']);
    if(done){ dueCls='ok'; dueTxt = dmy; }
    else if(dl<0){ dueCls='late'; dueTxt = dmy+' — trễ '+Math.abs(dl)+' ngày'; }
    else if(dl<=3){ dueCls='soon'; dueTxt = dmy+(dl===0?' — hôm nay':' — còn '+dl+' ngày'); }
    else dueTxt = dmy;
  }
  const nguoi = c['Phụ trách']||'';
  const col = kbColOf(c['Trạng thái']);
  const note = (col===2 && c['Lý do vướng']) ? c['Lý do vướng'] : '';
  const tg = String(c['Người tham gia']||'').split(',').map(s=>s.trim()).filter(Boolean);
  return '<div class="kb-card '+pri+'" draggable="'+(canEd?'true':'false')+'"'
    + ' ondragstart="kbStart(event,\''+esc(c['Mã CV'])+'\')" ondragend="kbEnd(event)"'
    + ' onclick="formTask(\''+esc(c['Mã CV'])+'\')">'
    + (h?'<div class="kb-hm">'+esc(h['Tên hạng mục'])+'</div>':(c['Giai đoạn']?'<div class="kb-hm">'+esc(c['Giai đoạn'])+'</div>':''))
    + '<div class="kb-t">'+esc(c['Tên công việc'])+'</div>'
    + (c['Điều kiện hoàn thành']?'<div class="kb-dod" title="Điều kiện hoàn thành">🎯 '+esc(c['Điều kiện hoàn thành'])+'</div>':'')
    + (note?'<div class="kb-note"><b>Cần chỉnh sửa:</b> '+esc(note)+'</div>':'')
    + '<div class="kb-f">'
      + (nguoi?'<span class="kb-av" style="background:'+avColor(nguoi)+'" title="'+esc(nguoi)+'">'+esc(iniOf(nguoi))+'</span>':'')
      + (tg.length?'<span class="kb-tg" title="Người tham gia: '+esc(tg.join(', '))+'">👥 +'+tg.length+'</span>':'')
      + (dueTxt?'<span class="kb-due '+dueCls+'">🕐 '+dueTxt+'</span>':'')
      + (canEd?'<span class="kb-mv">'
        + (col>0?'<button title="Chuyển sang '+esc(KB_COLS[col-1].label)+'" onclick="event.stopPropagation();kbMove(\''+esc(c['Mã CV'])+'\',-1)">‹</button>':'')
        + (col<KB_COLS.length-1?'<button title="Chuyển sang '+esc(KB_COLS[col+1].label)+'" onclick="event.stopPropagation();kbMove(\''+esc(c['Mã CV'])+'\',1)">›</button>':'')
        + '</span>':'')
    + '</div>'
    + (c['Thầu phụ']?'<div class="kb-sub">◈ '+esc(c['Thầu phụ'])+'</div>':'')
    + '</div>';
}
function iniOf(t){
  // Lấy 2 ký tự đầu của từ đầu tiên — khớp cách hiển thị "Hứa Phạm Tuấn" → HỨ
  const w = String(t||'?').trim().split(/\s+/).filter(Boolean);
  return (w.length ? w[0].slice(0,2) : '?').toUpperCase();
}
/* ★ v3.0 — gợi ý cấp phê duyệt theo giá trị khoản chi */
function eCapDuyet(){
  const el = document.getElementById('eCapHint'); if(!el) return;
  const v = Number(V('eST'))||0;
  if(!v){ el.innerHTML=''; el.style.display='none'; return; }
  const n = capDuyetTheoTien(v);
  const ds = goiYNguoiDuyet(v);
  el.style.display='';
  el.innerHTML = 'Khoản chi <b>'+fmtTr(v)+'</b> thuộc thẩm quyền <b>'+n.cap+'</b>'
    + (n.max===Infinity?' (từ 200 triệu trở lên)':' (dưới '+fmtTr(n.max)+')')
    + (ds.length?' · người đủ thẩm quyền: '+esc(ds.slice(0,3).map(x=>x['Họ tên']).join(', ')):' · <span style="color:var(--warn)">chưa có nhân sự đủ thẩm quyền trong hệ thống</span>');
}
/* Hiện/ẩn ô lý do vướng theo trạng thái đang chọn trong form */
function tOnPickTT(){
  const tt = V('tTT');
  const w = document.getElementById('tVuongWrap');
  if(w) w.style.display = (tt==='Đang vướng'||tt==='Từ chối') ? '' : 'none';
}
function avColor(t){
  const pal = ['#D81B60','#8E24AA','#3949AB','#00897B','#C77B30','#5D4037','#546E7A','#B3261E'];
  let s=0; const str=String(t||''); for(let i=0;i<str.length;i++) s=(s*31+str.charCodeAt(i))%9973;
  return pal[s%pal.length];
}
function fmtDMY(s){
  if(!s) return '';
  const p = String(s).split('-');
  return p.length===3 ? p[2]+'/'+p[1]+'/'+p[0] : s;
}

/* ----- Kéo & thả ----- */
function kbStart(e, code){
  window.__kbDrag = code;
  e.currentTarget.classList.add('dragging');
  try{ e.dataTransfer.setData('text/plain', code); e.dataTransfer.effectAllowed='move'; }catch(_){}
}
function kbEnd(e){ e.currentTarget.classList.remove('dragging'); }
function kbOver(e, i){ e.preventDefault(); const el=document.getElementById('kb'+i); if(el) el.classList.add('over'); }
function kbLeave(i){ const el=document.getElementById('kb'+i); if(el) el.classList.remove('over'); }
function kbDrop(e, i){
  e.preventDefault();
  const el = document.getElementById('kb'+i); if(el) el.classList.remove('over');
  const code = window.__kbDrag || (e.dataTransfer && e.dataTransfer.getData('text/plain'));
  window.__kbDrag = null;
  if(code) kbSetStatus(code, KB_COLS[i].k);
}
function kbMove(code, delta){
  const c = S.congviec.find(x=>x['Mã CV']===code); if(!c) return;
  const i = kbColOf(c['Trạng thái']) + delta;
  if(i<0 || i>=KB_COLS.length) return;
  kbSetStatus(code, KB_COLS[i].k);
}
/* Đổi trạng thái + xử lý nghiệp vụ kèm theo */
function kbSetStatus(code, tt){
  const c = S.congviec.find(x=>x['Mã CV']===code);
  if(!c) return toast('Không tìm thấy đầu việc', true);
  const d = S.duan.find(x=>x['Mã DA']===c['Mã DA']);
  if(d && !canEditProject(d)) return toast('Bạn không có quyền sửa dự án này', true);
  if(c['Trạng thái']===tt) return;

  // Vào cột "Đang vướng" → bắt buộc nhập lý do
  if(tt==='Đang vướng'){
    const ly = prompt('Vướng mắc / nội dung cần chỉnh sửa:', c['Lý do vướng']||'');
    if(ly===null) return;
    if(!ly.trim()) return toast('Cần ghi rõ vướng mắc', true);
    c['Lý do vướng'] = ly.trim();
  }
  // Sang trạng thái khác → xóa cờ vướng
  if(tt!=='Đang vướng' && tt!=='Từ chối') c['Lý do vướng'] = '';

  c['Trạng thái'] = tt;
  if(tt==='Hoàn thành'){ c['Tiến độ (%)'] = 100; c['Ngày hoàn thành'] = c['Ngày hoàn thành']||today(); }
  else { if(c['Ngày hoàn thành']) c['Ngày hoàn thành']=''; 
         if(tt==='Chưa bắt đầu') c['Tiến độ (%)'] = 0;
         else if(Number(c['Tiến độ (%)'])>=100) c['Tiến độ (%)'] = 50; }

  pushOp('saveTask', {'Mã CV':code,'Trạng thái':tt,'Tiến độ (%)':c['Tiến độ (%)'],
    'Ngày hoàn thành':c['Ngày hoàn thành']||'','Lý do vướng':c['Lý do vướng']||''});
  toast('→ '+tt+': '+(c['Tên công việc']||''));
}

/* ----- Thùng rác đầu việc ----- */
function cvTrash(daCode){
  const list = (S.congviec||[]).filter(x=>x['Mã DA']===daCode && String(x['Đã xóa']||'')==='1');
  openModal('Đầu việc đã xóa ('+list.length+')',
    '<p class="muted" style="margin-bottom:11px">Đầu việc xóa mềm không tính vào tiến độ dự án. Có thể khôi phục lại bất cứ lúc nào.</p>'
    + (list.length?'<div class="tbl-wrap"><table class="tbl"><thead><tr><th>Đầu việc</th><th>Giai đoạn</th><th>Phụ trách</th><th></th></tr></thead><tbody>'
      + list.map(c=>'<tr><td><b>'+esc(c['Tên công việc'])+'</b></td>'
        + '<td class="muted">'+esc(c['Giai đoạn']||'—')+'</td>'
        + '<td class="muted">'+esc(c['Phụ trách']||'—')+'</td>'
        + '<td class="num"><button class="btn btn-ghost" style="padding:4px 10px;font-size:11.5px" onclick="cvRestore(\''+esc(c['Mã CV'])+'\')">↩ Khôi phục</button></td></tr>').join('')
      + '</tbody></table></div>' : '<div class="empty">Không có đầu việc nào bị xóa</div>'), null);
}
function cvRestore(code){
  const c = S.congviec.find(x=>x['Mã CV']===code); if(!c) return;
  c['Đã xóa'] = '';
  pushOp('saveTask', {'Mã CV':code,'Đã xóa':''});
  closeModal(); toast('↩ Đã khôi phục: '+(c['Tên công việc']||''));
}

/* ----- Chế độ danh sách (bảng nhóm theo giai đoạn) ----- */
function cvListView(list, hm){
  if(!list.length) return '<div class="empty">Không có đầu việc khớp bộ lọc</div>';
  const groups = GIAI_DOAN.map(g=>({g,items:[]})); const other={g:'Ngoài quy trình',items:[]};
  list.forEach(c=>{const i=GIAI_DOAN.indexOf(c['Giai đoạn']);(i>-1?groups[i]:other).items.push(c);});
  const all = groups.concat([other]).filter(x=>x.items.length);
  let html = '<div class="card">';
  all.forEach(grp=>{
    const done = grp.items.filter(x=>x['Trạng thái']==='Hoàn thành').length;
    const gi = GIAI_DOAN.indexOf(grp.g);
    html += '<div class="phase-head"><span>'+(gi>-1?'GĐ'+(gi+1)+' · ':'')+esc(grp.g)+'</span>'
      + '<span class="cnt">'+done+'/'+grp.items.length+' hoàn thành</span></div>'
      + '<div class="tbl-wrap"><table class="tbl"><thead><tr><th>Công việc</th><th>Hạng mục</th><th>Phụ trách</th>'
      + '<th>Hạn</th><th>Tiến độ</th><th>Trạng thái</th></tr></thead><tbody>';
    grp.items.sort((a,b)=>(a['Trạng thái']==='Hoàn thành')-(b['Trạng thái']==='Hoàn thành')
      ||((a['Hạn hoàn thành']||'9999')>(b['Hạn hoàn thành']||'9999')?1:-1));
    html += grp.items.map(c=>{
      const dl = daysLeft(c['Hạn hoàn thành']);
      const cls = c['Trạng thái']==='Hoàn thành'?'':dl===null?'':dl<0?'t-bad':dl<=3?'t-warn':'';
      const h = hm.find(x=>x['Mã HM']===c['Mã HM']);
      return '<tr class="row-click" onclick="formTask(\''+esc(c['Mã CV'])+'\')">'
        + '<td><b>'+esc(c['Tên công việc'])+'</b>'
          + (c['Lý do vướng']?'<div class="muted" style="color:var(--warn)">🚧 '+esc(c['Lý do vướng'])+'</div>':'')
          + (c['Thầu phụ']?'<div class="muted">◈ '+esc(c['Thầu phụ'])+'</div>':'')+'</td>'
        + '<td class="muted">'+(h?esc(h['Tên hạng mục']):'<span style="opacity:.5">—</span>')+'</td>'
        + '<td>'+esc(c['Phụ trách']||'—')+'</td>'
        + '<td>'+(c['Hạn hoàn thành']?(cls?'<span class="tag '+cls+'">':'')+fmtDMY(c['Hạn hoàn thành'])+(cls?'</span>':''):'—')+'</td>'
        + '<td><div class="bar" style="width:70px"><i style="width:'+(Number(c['Tiến độ (%)'])||0)+'%"></i></div></td>'
        + '<td>'+tagTT(c['Trạng thái'])+'</td></tr>';
    }).join('');
    html += '</tbody></table></div>';
  });
  return html+'</div>';
}

/* ----- TAB 3: KẾ HOẠCH (Gantt phân cấp Giai đoạn → Hạng mục → Đầu việc) ----- */
function pjKeHoach(d){
  const code = d['Mã DA'];
  const hm = (S.hangmuc||[]).filter(x=>x['Mã DA']===code);
  const cv = tvSong(S.congviec).filter(x=>x['Mã DA']===code);
  if(window._pjShowKH===undefined) window._pjShowKH = true;
  if(window._pjShowTT===undefined) window._pjShowTT = true;
  window._pjOpen = window._pjOpen || {};

  let html = '<div class="card"><div class="card-head"><h3>Biểu đồ tiến độ (Gantt) — Kế hoạch và thực tế</h3></div>'
    + '<div class="card-body" style="padding:12px 18px 0"><p class="muted" style="font-size:12.5px;line-height:1.6">'
    + 'Giai đoạn dự án → hạng mục → đầu việc. % tính theo số đầu việc hoàn thành ở tab Công việc — bấm hạng mục để xem đầu việc bên trong. '
    + 'Hạng mục chưa có đầu việc không tính vào % dự án.</p></div>'
    + '<div class="plan-legend">'
    + '<label><input type="checkbox" '+(window._pjShowKH?'checked':'')+' onchange="window._pjShowKH=this.checked;render()"><i class="kh"></i>Kế hoạch</label>'
    + '<label><input type="checkbox" '+(window._pjShowTT?'checked':'')+' onchange="window._pjShowTT=this.checked;render()"><i class="tt"></i>Thực tế</label>'
    + (canEditProject(d)?'<button class="btn btn-brass" style="margin-left:auto;padding:6px 13px;font-size:12.5px" onclick="formApplyTemplate(\''+code+'\')">⚡ Lập từ thư viện</button>'
        + '<button class="btn btn-ghost" style="padding:6px 13px;font-size:12.5px" onclick="formHangMuc(null,\''+code+'\')">+ Hạng mục thủ công</button>':'')
    + '</div>';

  if(!hm.length && !cv.length){
    const cnt = tvCount(d['Loại hình']);
    return html + '<div class="empty" style="padding:28px 20px"><b>Chưa lập kế hoạch hạng mục</b>'
      + 'Hạng mục là nhóm công việc lớn trong mỗi giai đoạn (vd: Khảo sát hiện trạng, Phối cảnh 3D, Lắp đặt nội thất…).<br><br>'
      + '<b style="color:var(--brass-deep);font-size:14px">⚡ Cách nhanh nhất:</b> dùng thư viện chuẩn MDC — '
      + '<b>'+cnt.gd+'</b> giai đoạn · <b>'+cnt.hm+'</b> hạng mục · <b>'+cnt.cv+'</b> đầu việc đã soạn sẵn theo loại hình '
      + '<b>'+esc(d['Loại hình']||'—')+'</b>. Chỉ cần bỏ chọn phần không làm, hệ thống tự xếp ngày kế hoạch.<br><br>'
      + (canEditProject(d)?'<button class="btn btn-brass" onclick="formApplyTemplate(\''+code+'\')" style="margin-top:4px">⚡ Lập kế hoạch từ thư viện</button>':'')
      + '</div></div>';
  }

  // Khoảng thời gian: từ mọi ngày KH của hạng mục + ngày thực tế của việc
  const ds = [];
  hm.forEach(h=>{ if(h['Ngày bắt đầu KH'])ds.push(new Date(h['Ngày bắt đầu KH'])); if(h['Ngày kết thúc KH'])ds.push(new Date(h['Ngày kết thúc KH'])); });
  cv.forEach(c=>{ if(c['Ngày bắt đầu'])ds.push(new Date(c['Ngày bắt đầu'])); if(c['Hạn hoàn thành'])ds.push(new Date(c['Hạn hoàn thành'])); });
  if(!ds.length){
    let inner = '<div class="empty"><b>Chưa có ngày để vẽ biểu đồ</b>Đặt Ngày bắt đầu/kết thúc cho hạng mục, hoặc Ngày bắt đầu/Hạn hoàn thành cho đầu việc, để hiện trên Gantt.</div>';
    if(hm.length) inner += pjHangMucList(hm,cv,d);
    if(cv.length) inner += '<div class="tbl-wrap"><table class="tbl"><thead><tr><th>Đầu việc</th><th>Giai đoạn</th><th>Hạng mục</th><th>Phụ trách</th><th>Trạng thái</th></tr></thead><tbody>'
      + cv.map(c=>{const h=hm.find(x=>x['Mã HM']===c['Mã HM']);return '<tr class="row-click" onclick="formTask(\''+c['Mã CV']+'\')"><td><b>'+esc(c['Tên công việc'])+'</b></td><td class="muted">'+esc(c['Giai đoạn']||'—')+'</td><td class="muted">'+(h?esc(h['Tên hạng mục']):'<span style="color:var(--warn)">chưa gán</span>')+'</td><td>'+esc(c['Phụ trách']||'—')+'</td><td>'+tagTT(c['Trạng thái'])+'</td></tr>';}).join('')
      + '</tbody></table></div>';
    return html + inner + '</div>';
  }
  let minD = new Date(Math.min(...ds)), maxD = new Date(Math.max(...ds));
  minD.setDate(minD.getDate()-3); maxD.setDate(maxD.getDate()+3);
  const totalDays = Math.max(1, Math.round((maxD-minD)/86400000));
  const dayW = totalDays<=40?26:totalDays<=90?14:totalDays<=200?8:5;
  const trackW = (totalDays+1)*dayW;
  const todayD = new Date(today());
  const todayOff = Math.round((todayD-minD)/86400000)*dayW;
  const todayIn = todayD>=minD && todayD<=maxD;
  const posOf = dt => Math.max(0, Math.round((new Date(dt)-minD)/86400000))*dayW;
  const widOf = (a,b) => Math.max(1, Math.round((new Date(b)-new Date(a))/86400000)+1)*dayW;

  // header ngày (gộp nhãn theo tuần/tháng cho gọn)
  let hdr = '';
  for(let i=0;i<=totalDays;i++){
    const dt = new Date(minD); dt.setDate(dt.getDate()+i);
    const showLbl = dayW>=14 ? true : (dt.getDate()===1||dt.getDate()===15);
    hdr += '<div style="min-width:'+dayW+'px;border-right:1px solid var(--line);text-align:center;font-size:9.5px;color:var(--ink-faint);padding:5px 0;overflow:hidden;white-space:nowrap">'
      + (showLbl?(dt.getDate()===1?'<b>'+dt.getDate()+'/'+(dt.getMonth()+1)+'</b>':dt.getDate()):'')+'</div>';
  }

  html += '<div class="gantt-wrap"><div class="pl-grid" style="grid-template-columns:300px '+trackW+'px">';
  html += '<div class="pl-row head"><div class="pl-name">Hạng mục</div>'
    + '<div style="position:relative;padding:0!important"><div style="display:flex">'+hdr+'</div>'
    + (todayIn?'<div class="pl-today" style="left:'+todayOff+'px"></div>':'')+'</div></div>';

  GIAI_DOAN.forEach((g,gi)=>{
    const items = hm.filter(h=>h['Giai đoạn']===g);
    if(!items.length) return;
    // dòng giai đoạn
    const gTasks = cv.filter(c=>items.some(h=>h['Mã HM']===c['Mã HM']));
    const gDone = gTasks.filter(c=>c['Trạng thái']==='Hoàn thành').length;
    html += '<div class="pl-row phase" onclick="pjToggleAll(\''+esc(g)+'\')"><div class="pl-name">'
      + '<span class="pl-caret '+(window._pjOpen['g_'+g]?'open':'')+'">▶</span> GĐ'+(gi+1)+' · '+esc(g)
      + (gTasks.length?'<span class="pl-pct '+(gDone===gTasks.length?'full':gDone?'':'zero')+'">'+Math.round(gDone/gTasks.length*100)+'%</span>':'')
      + '</div><div></div></div>';

    items.forEach(h=>{
      const tasks = cv.filter(c=>c['Mã HM']===h['Mã HM']);
      const done = tasks.filter(c=>c['Trạng thái']==='Hoàn thành').length;
      const pct = tasks.length?Math.round(done/tasks.length*100):null;
      // thực tế: từ ngày bắt đầu nhỏ nhất → hạn lớn nhất của đầu việc
      const tds = tasks.flatMap(c=>[c['Ngày bắt đầu'],c['Hạn hoàn thành']].filter(Boolean)).sort();
      const ttStart = tds[0], ttEnd = tds[tds.length-1];
      const isLate = ttEnd && new Date(ttEnd)<todayD && done<tasks.length;
      let bars = '';
      if(window._pjShowKH && h['Ngày bắt đầu KH'] && h['Ngày kết thúc KH']){
        bars += '<div class="pl-bar kh" style="left:'+posOf(h['Ngày bắt đầu KH'])+'px;width:'+widOf(h['Ngày bắt đầu KH'],h['Ngày kết thúc KH'])+'px" title="Kế hoạch: '+esc(h['Ngày bắt đầu KH'])+' → '+esc(h['Ngày kết thúc KH'])+'">Kế hoạch</div>';
      }
      if(window._pjShowTT && ttStart && ttEnd){
        bars += '<div class="pl-bar tt '+(done===tasks.length&&tasks.length?'done':isLate?'late':'')+'" style="left:'+posOf(ttStart)+'px;width:'+widOf(ttStart,ttEnd)+'px" title="Thực tế: '+esc(ttStart)+' → '+esc(ttEnd)+' · '+done+'/'+tasks.length+' việc xong">'+(pct!==null?pct+'%':'')+'</div>';
      }
      html += '<div class="pl-row"><div class="pl-name" style="cursor:pointer" onclick="pjToggleHM(\''+esc(h['Mã HM'])+'\')">'
        + '<span class="pl-caret '+(window._pjOpen[h['Mã HM']]?'open':'')+'">▶</span> <b>'+esc(h['Tên hạng mục'])+'</b>'
        + (pct!==null?'<span class="pl-pct '+(pct===100?'full':pct?'':'zero')+'">'+pct+'%</span>':'')
        + '<div class="muted" style="font-size:11px;margin-top:2px">'
        + (tasks.length?done+'/'+tasks.length+' đầu việc hoàn thành':'<span style="color:var(--bad)">chưa có đầu việc</span>')+'</div>'
        + '<div class="hm-badges">'
        + '<span class="'+(h['Tính chất']==='Tùy chọn'?'b-opt':'b-req')+'">'+esc(h['Tính chất']||'Bắt buộc')+'</span>'
        + (!h['Ngày bắt đầu KH']||!h['Ngày kết thúc KH']?'<span class="b-nokh">Chưa lập kế hoạch</span>':'')
        + (!tasks.length?'<span class="b-nodv">Chưa lập đầu việc</span>':'')
        + '</div></div>'
        + '<div class="pl-track">'+bars+(todayIn?'<div class="pl-today" style="left:'+todayOff+'px"></div>':'')+'</div></div>';

      // đầu việc bên trong hạng mục (khi mở)
      if(window._pjOpen[h['Mã HM']]){
        tasks.forEach(c=>{
          let tb = '';
          if(window._pjShowTT && c['Ngày bắt đầu'] && c['Hạn hoàn thành']){
            const late = new Date(c['Hạn hoàn thành'])<todayD && c['Trạng thái']!=='Hoàn thành';
            tb = '<div class="pl-bar tt '+(c['Trạng thái']==='Hoàn thành'?'done':late?'late':'')+'" style="left:'+posOf(c['Ngày bắt đầu'])+'px;width:'+widOf(c['Ngày bắt đầu'],c['Hạn hoàn thành'])+'px" title="'+esc(c['Tên công việc'])+' · '+esc(c['Phụ trách']||'')+'" onclick="event.stopPropagation();formTask(\''+c['Mã CV']+'\')">'+(Number(c['Tiến độ (%)'])||0)+'%</div>';
          }
          html += '<div class="pl-row task"><div class="pl-name" style="cursor:pointer" onclick="formTask(\''+c['Mã CV']+'\')">'
            + esc(c['Tên công việc'])+'<div class="muted" style="font-size:10.5px">'+esc(c['Phụ trách']||'—')+' · '+esc(c['Trạng thái']||'')+'</div></div>'
            + '<div class="pl-track">'+tb+(todayIn?'<div class="pl-today" style="left:'+todayOff+'px"></div>':'')+'</div></div>';
        });
        html += '<div class="pl-row task"><div class="pl-name">'
          + '<button class="btn btn-ghost" style="padding:4px 10px;font-size:11.5px" onclick="window._ftp=\''+code+'\';window._fhm=\''+esc(h['Mã HM'])+'\';formTask()">+ Đầu việc</button>'
          + ' <button class="btn btn-ghost" style="padding:4px 10px;font-size:11.5px" onclick="formHangMuc(\''+esc(h['Mã HM'])+'\')">✎ Sửa hạng mục</button></div><div class="pl-track"></div></div>';
      }
    });
  });
  // hạng mục ngoài quy trình
  const orphan = hm.filter(h=>GIAI_DOAN.indexOf(h['Giai đoạn'])===-1);
  if(orphan.length){
    html += '<div class="pl-row phase"><div class="pl-name">Ngoài quy trình</div><div></div></div>';
    orphan.forEach(h=>{
      html += '<div class="pl-row"><div class="pl-name" style="cursor:pointer" onclick="formHangMuc(\''+esc(h['Mã HM'])+'\')"><b>'+esc(h['Tên hạng mục'])+'</b></div><div class="pl-track"></div></div>';
    });
  }
  // ===== Đầu việc CHƯA GÁN HẠNG MỤC — vẫn hiện để không bị ẩn khỏi Kế hoạch =====
  const hmCodes = new Set(hm.map(h=>h['Mã HM']));
  const orphanTasks = cv.filter(c=>!c['Mã HM'] || !hmCodes.has(c['Mã HM']));
  if(orphanTasks.length){
    const oOpen = window._pjOpen['__orphan'] !== false; // mặc định mở
    const oDone = orphanTasks.filter(c=>c['Trạng thái']==='Hoàn thành').length;
    html += '<div class="pl-row phase" onclick="window._pjOpen[\'__orphan\']='+(oOpen?'false':'true')+';render()"><div class="pl-name">'
      + '<span class="pl-caret '+(oOpen?'open':'')+'">▶</span> Chưa gán hạng mục'
      + '<span class="pl-pct '+(oDone===orphanTasks.length?'full':oDone?'':'zero')+'">'+orphanTasks.length+' việc</span>'
      + '<div class="muted" style="font-size:11px;margin-top:2px;font-weight:400">Đầu việc tạo trực tiếp, chưa thuộc hạng mục nào — mở việc để gán vào hạng mục.</div>'
      + '</div><div></div></div>';
    if(oOpen) orphanTasks.forEach(c=>{
      let tb = '';
      if(window._pjShowTT && c['Ngày bắt đầu'] && c['Hạn hoàn thành']){
        const late = new Date(c['Hạn hoàn thành'])<todayD && c['Trạng thái']!=='Hoàn thành';
        tb = '<div class="pl-bar tt '+(c['Trạng thái']==='Hoàn thành'?'done':late?'late':'')+'" style="left:'+posOf(c['Ngày bắt đầu'])+'px;width:'+widOf(c['Ngày bắt đầu'],c['Hạn hoàn thành'])+'px" title="'+esc(c['Tên công việc'])+' · '+esc(c['Phụ trách']||'')+'" onclick="event.stopPropagation();formTask(\''+c['Mã CV']+'\')">'+(Number(c['Tiến độ (%)'])||0)+'%</div>';
      }
      html += '<div class="pl-row task"><div class="pl-name" style="cursor:pointer" onclick="formTask(\''+c['Mã CV']+'\')">'
        + esc(c['Tên công việc'])+'<div class="muted" style="font-size:10.5px">'+esc(c['Giai đoạn']||'—')+' · '+esc(c['Phụ trách']||'—')+' · '+esc(c['Trạng thái']||'')+'</div></div>'
        + '<div class="pl-track">'+tb+(todayIn?'<div class="pl-today" style="left:'+todayOff+'px"></div>':'')+'</div></div>';
    });
  }
  html += '</div>';
  html += '<div class="gantt-legend"><span><i style="background:repeating-linear-gradient(45deg,#B0BEC5 0,#B0BEC5 3px,#CFD8DC 3px,#CFD8DC 6px)"></i> Kế hoạch</span>'
    + '<span><i></i> Thực tế đang chạy</span><span><i class="done"></i> Hoàn thành</span><span><i class="late"></i> Trễ hạn</span>'
    + '<span style="margin-left:auto">Hôm nay: <span style="color:#E53935;font-weight:700">|</span></span></div>';
  html += '</div></div>';
  return html;
}
function pjToggleHM(ma){ window._pjOpen = window._pjOpen||{}; window._pjOpen[ma] = !window._pjOpen[ma]; render(); }
function pjToggleAll(g){
  window._pjOpen = window._pjOpen||{};
  const key = 'g_'+g; const open = !window._pjOpen[key];
  window._pjOpen[key] = open;
  (S.hangmuc||[]).filter(h=>h['Mã DA']===window._pjCode&&h['Giai đoạn']===g).forEach(h=>{ window._pjOpen[h['Mã HM']] = open; });
  render();
}
// Bảng hạng mục dạng list (dùng khi chưa có ngày kế hoạch)
function pjHangMucList(hm,cv,d){
  let html = '<div class="tbl-wrap"><table class="tbl"><thead><tr><th>Hạng mục</th><th>Giai đoạn</th><th>Tính chất</th><th>Đầu việc</th><th>KH bắt đầu</th><th>KH kết thúc</th></tr></thead><tbody>';
  html += hm.map(h=>{
    const t = cv.filter(c=>c['Mã HM']===h['Mã HM']);
    return '<tr class="row-click" onclick="formHangMuc(\''+esc(h['Mã HM'])+'\')"><td><b>'+esc(h['Tên hạng mục'])+'</b></td>'
      + '<td class="muted">'+esc(h['Giai đoạn']||'—')+'</td><td>'+esc(h['Tính chất']||'Bắt buộc')+'</td>'
      + '<td class="num">'+t.filter(c=>c['Trạng thái']==='Hoàn thành').length+'/'+t.length+'</td>'
      + '<td class="muted">'+esc(h['Ngày bắt đầu KH']||'—')+'</td><td class="muted">'+esc(h['Ngày kết thúc KH']||'—')+'</td></tr>';
  }).join('');
  return html+'</tbody></table></div>';
}
/* Form hạng mục */
function formHangMuc(code, daCode){
  const h = code ? (S.hangmuc||[]).find(x=>x['Mã HM']===code) : null;
  const isNew = !h;
  const da = h ? h['Mã DA'] : (daCode||window._pjCode);
  openModal(isNew?'Thêm hạng mục kế hoạch':'Hạng mục '+code,
    fld('Tên hạng mục *', inp('hmTen',h?.['Tên hạng mục'],'text','vd: Lên phương án thiết kế'))
    + '<div class="grid2">'
    + fld('Thuộc giai đoạn *', sel('hmGD',GIAI_DOAN,h?.['Giai đoạn']||GIAI_DOAN[1]))
    + fld('Tính chất', sel('hmTC',TINH_CHAT_HM,h?.['Tính chất']||'Bắt buộc'))
    + fld('Ngày bắt đầu kế hoạch', inp('hmBD',h?.['Ngày bắt đầu KH'],'date'))
    + fld('Ngày kết thúc kế hoạch', inp('hmKT',h?.['Ngày kết thúc KH'],'date'))
    + fld('Thứ tự hiển thị', inp('hmTT',h?.['Thứ tự']||'','number'))
    + '</div>'
    + fld('Ghi chú','<textarea id="hmGC" rows="2">'+esc(h?.['Ghi chú']||'')+'</textarea>'),
    function save(){
      if(!V('hmTen')) return toast('Chưa nhập tên hạng mục',true);
      if(V('hmBD')&&V('hmKT')&&V('hmKT')<V('hmBD')) return toast('Ngày kết thúc phải sau ngày bắt đầu',true);
      const rec={'Mã HM':code||'','Mã DA':da,'Tên hạng mục':V('hmTen'),'Giai đoạn':V('hmGD'),
        'Tính chất':V('hmTC'),'Ngày bắt đầu KH':V('hmBD'),'Ngày kết thúc KH':V('hmKT'),
        'Thứ tự':V('hmTT'),'Ghi chú':V('hmGC')};
      if(isNew){rec['Mã HM']=tempCode('HM',S.hangmuc||[],'Mã HM');(S.hangmuc=S.hangmuc||[]).push(rec);}
      else Object.assign(h,rec);
      closeModal(); pushOp('saveHangMuc',rec);
    },
    (!isNew&&canEditProject(S.duan.find(x=>x['Mã DA']===da)))?function(){
      const n = S.congviec.filter(c=>c['Mã HM']===code).length;
      if(!confirm('Xóa hạng mục "'+h['Tên hạng mục']+'"?'+(n?'\n'+n+' đầu việc sẽ không còn gắn hạng mục (việc vẫn giữ nguyên).':''))) return;
      S.hangmuc=(S.hangmuc||[]).filter(x=>x['Mã HM']!==code); closeModal(); pushOp('deleteHangMuc',{code}); toast('Đã xóa hạng mục');
    }:null
  );
}

/* ----- TAB 4: THẦU PHỤ ----- */
function pjThauPhu(d){
  const code = d['Mã DA'];
  const cv = tvSong(S.congviec).filter(x=>x['Mã DA']===code && x['Thầu phụ']);
  const cp = S.chiphi.filter(x=>x['Mã DA']===code && x['Loại chi phí']==='Thầu phụ');
  // gom theo tên thầu phụ
  const map = {};
  cv.forEach(c=>{ const k=c['Thầu phụ']; (map[k]=map[k]||{ten:k,tasks:[],chi:0}); map[k].tasks.push(c); });
  cp.forEach(x=>{ // khớp chi phí theo hạng mục chứa tên thầu
    Object.keys(map).forEach(k=>{ if((x['Hạng mục']||'').includes(k)||(x['Ghi chú']||'').includes(k)) map[k].chi += Number(x['Số tiền (đ)'])||0; });
  });
  const list = Object.values(map);
  let html = '<div class="toolbar">'
    + (canEditProject(d)?'<button class="btn btn-brass" onclick="formSubContract(null,\''+code+'\')">+ Hợp đồng giao thầu</button>':'')
    + '<button class="btn btn-ghost" onclick="window._ftp=\''+code+'\';formTask()">+ Giao việc cho thầu phụ</button>'
    + '<button class="btn btn-ghost" onclick="go(\'thaubo\')">Danh sách thầu phụ →</button></div>';
  const hds = (S.hdthauphu||[]).filter(x=>x['Mã DA']===code);
  const tongHD = hds.reduce((a,h)=>a+(Number(h['Giá trị HĐ (đ)'])||0),0);
  html += '<div class="kpis">'
    + kpi('Hợp đồng giao thầu',hds.length,tongHD?'Tổng '+fmtTr(tongHD):'Chưa ký hợp đồng')
    + kpi('Thầu phụ tham gia',list.length,'Đơn vị đang phối hợp')
    + kpi('Đầu việc giao thầu',cv.length,cv.filter(c=>c['Trạng thái']==='Hoàn thành').length+' đã hoàn thành')
    + kpi('Đã chi thầu phụ',fmtTr((S.ttthauphu||[]).filter(x=>x['Mã DA']===code&&x['Trạng thái']==='Đã thanh toán').reduce((a,x)=>a+ttpChi(x),0)),'Không tính phần giữ lại')
    + '</div>';
  // Hợp đồng giao thầu
  if(hds.length){
    html += '<div class="card"><div class="card-head"><h3>Hợp đồng giao thầu</h3></div>';
    hds.forEach(hd=>{
      const st = hdtpStats(hd['Mã HĐTP']);
      html += '<div class="sub-card" onclick="formSubContract(\''+esc(hd['Mã HĐTP'])+'\')">'
        + '<div style="display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap">'
        + '<div style="flex:1;min-width:170px"><b>'+esc(hd['Thầu phụ'])+'</b> '+tagTT(hd['Trạng thái']||'Đang hiệu lực')
        + '<div class="muted" style="margin-top:3px">'+esc(hd['Hạng mục']||'')+(hd['Số HĐ']?' · '+esc(hd['Số HĐ']):'')+'</div>'
        + '<div class="muted">'+st.dot.length+' đợt · đã chi '+fmtTr(st.daChi)+(st.giu?' · giữ '+fmtTr(st.giu):'')+'</div></div>'
        + '<div style="text-align:right"><b>'+fmtTr(st.gt)+'</b>'
        + '<div class="bar" style="width:100px;margin-top:5px;margin-left:auto"><i style="width:'+st.pct+'%"></i></div>'
        + '<div class="muted" style="font-size:11px;margin-top:2px">'+st.pct+'% đã chi</div></div></div></div>';
    });
    html += '</div>';
  }
  if(!list.length) return html+'<div class="empty"><b>Chưa giao việc cho thầu phụ nào</b>Khi giao việc, chọn thầu phụ ở ô "Thầu phụ / Đối tác" — họ sẽ hiện ở đây</div>';
  html += '<div class="card">';
  list.forEach(t=>{
    const info = (S.thaubo||[]).find(x=>x['Tên / Công ty']===t.ten);
    const done = t.tasks.filter(c=>c['Trạng thái']==='Hoàn thành').length;
    const late = t.tasks.filter(c=>c['Trạng thái']!=='Hoàn thành'&&c['Hạn hoàn thành']&&daysLeft(c['Hạn hoàn thành'])<0).length;
    const star = Number(info?.['Đánh giá'])||0;
    html += '<div class="sub-card" style="cursor:default">'
      + '<div style="display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:flex-start">'
      + '<div><b style="font-size:14.5px">'+esc(t.ten)+'</b>'
      + (star?' <span class="rating">'+'★'.repeat(star)+'<span style="opacity:.3">'+'★'.repeat(5-star)+'</span></span>':'')
      + '<div class="muted" style="margin-top:3px">'
      + (info?.['Loại thầu']?esc(info['Loại thầu'])+' · ':'')
      + (info?.['Người liên hệ']?esc(info['Người liên hệ'])+' · ':'')
      + (info?.['SĐT']?'📞 '+esc(info['SĐT']):'<span style="color:var(--warn)">chưa có trong danh sách thầu phụ</span>')
      + '</div>'
      + '<div class="muted" style="margin-top:4px">'+done+'/'+t.tasks.length+' đầu việc hoàn thành'
      + (late?' · <span style="color:var(--bad)">⚠ '+late+' việc trễ</span>':'')
      + (t.chi?' · Đã chi '+fmtTr(t.chi):'')+'</div></div>'
      + '<div style="text-align:right;display:flex;flex-direction:column;gap:5px;align-items:flex-end">'
      + (info?tagTT(info['Trạng thái']||'Đang hợp tác'):'<span class="tag t-warn">Chưa lập hồ sơ</span>')
      + (info?.['SĐT']?btnZalo(info['SĐT'],'Zalo'):'')
      + '</div></div>'
      // danh sách việc
      + '<div class="tbl-wrap" style="margin-top:8px"><table class="tbl"><tbody>'
      + t.tasks.map(c=>'<tr class="row-click" onclick="formTask(\''+c['Mã CV']+'\')"><td>'+esc(c['Tên công việc'])+'<div class="muted">'+esc(c['Giai đoạn']||'')+'</div></td>'
        + '<td class="num">'+(c['Hạn hoàn thành']?esc(c['Hạn hoàn thành']):'—')+'</td><td>'+tagTT(c['Trạng thái'])+'</td></tr>').join('')
      + '</tbody></table></div></div>';
  });
  html += '</div>';
  return html;
}

/* ----- TAB 5: TÀI CHÍNH ----- */
function pjTaiChinh(d){
  const code = d['Mã DA'];
  const cp = S.chiphi.filter(x=>x['Mã DA']===code);
  const ps = (S.phatsinh||[]).filter(x=>x['Mã DA']===code);
  const ms = (S.muasam||[]).filter(x=>x['Mã DA']===code);
  const hd = Number(d['Giá trị HĐ (đ)'])||0;
  const ns = Number(d['Ngân sách (đ)'])||0;
  const psOk = ps.filter(x=>x['Trạng thái']==='Đã chấp thuận').reduce((a,x)=>a+(Number(x['Giá trị (đ)'])||0),0);
  const psCho = ps.filter(x=>x['Trạng thái']!=='Đã chấp thuận'&&x['Trạng thái']!=='Từ chối').reduce((a,x)=>a+(Number(x['Giá trị (đ)'])||0),0);
  const C = projCost(code);
  const chi = C.tong;   // ★ v3.0 gồm chi trực tiếp + thầu phụ + mua sắm, không tính trùng
  const chiDuyet = cp.filter(c=>c['Trạng thái duyệt']==='Đã duyệt').reduce((a,c)=>a+(Number(c['Số tiền (đ)'])||0),0);
  const chiCho = cp.filter(c=>(c['Trạng thái duyệt']||'Chờ duyệt')==='Chờ duyệt').reduce((a,c)=>a+(Number(c['Số tiền (đ)'])||0),0);
  const tongHD = hd+psOk;
  const lai = tongHD-chi;
  const pctNS = ns?Math.min(100,Math.round(chi/ns*100)):0;

  let html = '<div class="kpis">'
    + kpi('Giá trị HĐ gốc', fmtTr(hd),'Theo hợp đồng ban đầu')
    + kpi('Phát sinh đã chấp thuận', (psOk>=0?'+':'')+fmtTr(psOk), psCho?('còn '+fmtTr(psCho)+' chờ xử lý'):'Không có chờ xử lý', psOk<0?'bad':'accent')
    + kpi('Tổng giá trị thực tế', fmtTr(tongHD),'HĐ gốc + phát sinh','accent')
    + kpi('Đã chi', fmtTr(chi), chiCho?(fmtTr(chiCho)+' chờ duyệt'):cp.length+' khoản', ns&&chi>ns?'bad':'')
    + kpi('Lợi nhuận ước tính', fmtTr(lai), tongHD?Math.round(lai/tongHD*100)+'% biên lãi':'—', lai<0?'bad':'accent')
    + '<div class="kpi"><div class="lbl">Sử dụng ngân sách</div><div class="val">'+(ns?pctNS+'%':'—')+'</div>'
    + '<div class="bar '+(pctNS>=100?'red':pctNS>=80?'':'green')+'" style="margin-top:8px"><i style="width:'+pctNS+'%"></i></div>'
    + '<div class="hint">'+(ns?'NS '+fmtTr(ns):'Chưa đặt ngân sách')+'</div></div>'
    + '</div>';

  // Chi phí theo loại
  const byLoai = {};
  cp.forEach(c=>{ const k=c['Loại chi phí']||'Khác'; byLoai[k]=(byLoai[k]||0)+(Number(c['Số tiền (đ)'])||0); });
  if(Object.keys(byLoai).length){
    html += '<div class="card fin-section"><h4>Cơ cấu chi phí theo loại</h4><div class="card-body">';
    Object.keys(byLoai).sort((a,b)=>byLoai[b]-byLoai[a]).forEach(k=>{
      const w = chi?Math.round(byLoai[k]/chi*100):0;
      html += '<div style="margin-bottom:9px"><div style="display:flex;justify-content:space-between;font-size:12.5px;margin-bottom:3px">'
        + '<span>'+esc(k)+'</span><b>'+fmtTr(byLoai[k])+' <span class="muted" style="font-weight:400">('+w+'%)</span></b></div>'
        + '<div class="bar"><i style="width:'+w+'%"></i></div></div>';
    });
    html += '</div></div>';
  }

  // ★ v2.3 — Đợt thu tiền theo hợp đồng (tách theo loại HĐ: Thiết kế / Thi công)
  const dot = (S.thanhtoan||[]).filter(x=>x['Mã DA']===code);
  const thuDu = dot.reduce((a,x)=>a+(Number(x['Đã thu (đ)'])||0),0);
  const conThu = dot.reduce((a,x)=>a+Math.max(0,(Number(x['Giá trị (đ)'])||0)-(Number(x['Đã thu (đ)'])||0)),0);
  html += '<div class="card fin-section"><h4>Thu tiền theo hợp đồng ('+dot.length+' đợt)</h4>';
  if(dot.length){
    // Nhóm đợt theo Loại HĐ
    const nhom = {};
    dot.forEach(x=>{ const k=x['Loại HĐ']||'Chung'; (nhom[k]=nhom[k]||[]).push(x); });
    const thuTuLoai = ['Thiết kế','Thi công','Chung'];
    const cacLoai = Object.keys(nhom).sort((a,b)=>thuTuLoai.indexOf(a)-thuTuLoai.indexOf(b));
    const rowHtml = x=>{
      const g=Number(x['Giá trị (đ)'])||0, t=Number(x['Đã thu (đ)'])||0, con=g-t;
      const dl=daysLeft(x['Ngày đến hạn']);
      const late = con>0 && dl!==null && dl<0;
      return '<tr class="row-click" onclick="formPayment(\''+esc(x['Mã TT'])+'\')">'
        + '<td><b>'+esc(x['Tên đợt'])+'</b></td>'
        + '<td class="muted">'+(x['Ngày đến hạn']?(late?'<span class="tag t-bad">'+esc(x['Ngày đến hạn'])+' · trễ '+Math.abs(dl)+'n</span>':esc(x['Ngày đến hạn'])):'—')+'</td>'
        + '<td class="num">'+fmt(g)+'</td><td class="num" style="color:var(--ok)">'+fmt(t)+'</td>'
        + '<td class="num"><b style="color:'+(con>0?'var(--bad)':'var(--ok)')+'">'+fmt(con)+'</b></td>'
        + '<td>'+tagTT(x['Trạng thái'])+'</td>'
        + '<td>'+xnBadge(code,'Đợt thu',[x['Mã TT'],x['Tên đợt']],{emptyDash:true})+'</td></tr>';
    };
    cacLoai.forEach(loai=>{
      const arr=nhom[loai];
      const sg=arr.reduce((a,x)=>a+(Number(x['Giá trị (đ)'])||0),0);
      const st=arr.reduce((a,x)=>a+(Number(x['Đã thu (đ)'])||0),0);
      const sc=sg-st;
      const nhan = loai==='Chung' ? 'Hợp đồng (chưa phân loại)' : 'HĐ '+loai;
      html += '<div class="section-label" style="margin-top:8px;color:var(--brass-deep)">'+nhan+' — '+arr.length+' đợt · tổng '+fmtTr(sg)+'</div>'
        + '<div class="tbl-wrap"><table class="tbl"><thead><tr><th>Đợt</th><th>Đến hạn</th><th class="num">Giá trị</th><th class="num">Đã thu</th><th class="num">Còn lại</th><th>Trạng thái</th><th>Khách duyệt</th></tr></thead><tbody>'
        + [...arr].sort((a,b)=>(a['Ngày đến hạn']||'')>(b['Ngày đến hạn']||'')?1:-1).map(rowHtml).join('')
        + '</tbody></table></div>'
        + '<div class="fin-total"><span class="ft-lbl">'+nhan+': đã thu '+fmtTr(st)+' · còn thu</span><span class="ft-val" style="color:'+(sc>0?'var(--bad)':'var(--ok)')+'">'+fmtTr(sc)+'</span></div>';
    });
    if(cacLoai.length>1)
      html += '<div class="fin-total" style="border-top:2px solid var(--brass);margin-top:6px"><span class="ft-lbl"><b>TỔNG CỘNG: đã thu '+fmtTr(thuDu)+' · còn phải thu</b></span><span class="ft-val"><b>'+fmtTr(conThu)+'</b></span></div>';
  } else html += '<div class="empty">Chưa lập đợt thu tiền — dùng "⚡ Lập lịch từ mẫu" để tạo cả bộ theo từng hợp đồng đã ký</div>';
  html += '<div class="card-body" style="border-top:1px solid var(--line);display:flex;gap:7px;flex-wrap:wrap">'
    + (canEditProject(d)?'<button class="btn btn-brass" onclick="formPaymentSchedule(\''+code+'\')">⚡ Lập lịch từ mẫu</button>':'')
    + '<button class="btn btn-ghost" onclick="window._dsDA=\''+code+'\';formPayment()">+ Thêm 1 đợt</button></div></div>';

  // ★ v2.4 — Hợp đồng giao thầu phụ (mỗi HĐ nhiều đợt)
  html += pjHopDongThauPhu(code, canEditProject(d));

  // Phát sinh
  html += '<div class="card fin-section"><h4>Phát sinh hợp đồng ('+ps.length+')</h4>';  if(ps.length){
    html += '<div class="tbl-wrap"><table class="tbl"><thead><tr><th>Mô tả</th><th>Loại</th><th class="num">Giá trị</th><th>Trạng thái</th></tr></thead><tbody>'
      + ps.map(x=>{const v=Number(x['Giá trị (đ)'])||0;return '<tr class="row-click" onclick="formVariation(\''+esc(x['Mã PS'])+'\')"><td><b>'+esc(x['Mô tả'])+'</b></td><td class="muted">'+esc(x['Loại']||'')+'</td>'
      + '<td class="num" style="color:'+(v>=0?'var(--ok)':'var(--bad)')+'"><b>'+(v>=0?'+':'')+fmt(v)+'</b></td><td>'+tagTT(x['Trạng thái'])+'</td></tr>';}).join('')
      + '</tbody></table></div>';
  } else html += '<div class="empty">Chưa có phát sinh hợp đồng</div>';
  html += '<div class="card-body" style="border-top:1px solid var(--line)"><button class="btn btn-ghost" onclick="window._psDA=\''+code+'\';formVariation()">+ Ghi phát sinh</button></div></div>';

  // Chi phí chi tiết
  html += '<div class="card fin-section"><h4>Khoản chi chi tiết ('+cp.length+')</h4>';
  if(cp.length){
    html += '<div class="tbl-wrap"><table class="tbl"><thead><tr><th>Ngày</th><th>Hạng mục</th><th>Loại</th><th class="num">Số tiền</th><th>Duyệt</th></tr></thead><tbody>'
      + [...cp].sort((a,b)=>(a['Ngày chi']||'')<(b['Ngày chi']||'')?1:-1).map(c=>
        '<tr class="row-click" onclick="formExpense(\''+c['Mã CP']+'\')"><td class="muted">'+esc(c['Ngày chi']||'—')+'</td>'
        + '<td><b>'+esc(c['Hạng mục'])+'</b></td><td>'+esc(c['Loại chi phí']||'')+'</td>'
        + '<td class="num"><b>'+fmt(c['Số tiền (đ)'])+'</b></td><td>'+tagTT(c['Trạng thái duyệt']||'Chờ duyệt')+'</td></tr>').join('')
      + '</tbody></table></div>'
      + '<div class="fin-total"><span class="ft-lbl">Tổng đã chi</span><span class="ft-val">'+fmtTr(chi)+'</span></div>';
  } else html += '<div class="empty">Chưa ghi khoản chi nào</div>';
  html += '<div class="card-body" style="border-top:1px solid var(--line)"><button class="btn btn-ghost" onclick="window._fcp=\''+code+'\';formExpense()">+ Ghi chi phí</button></div></div>';

  // Mua sắm
  if(ms.length){
    html += '<div class="card fin-section"><h4>Đơn mua sắm ('+ms.length+')</h4><div class="tbl-wrap"><table class="tbl"><thead><tr><th>Hạng mục</th><th>NCC</th><th class="num">Tổng tiền</th><th>Trạng thái</th></tr></thead><tbody>'
      + ms.map(x=>'<tr class="row-click" onclick="formPurchase(\''+esc(x['Mã MS'])+'\')"><td><b>'+esc(x['Hạng mục'])+'</b></td><td class="muted">'+esc(x['NCC / Thầu phụ']||'—')+'</td>'
      + '<td class="num">'+fmt(x['Tổng tiền'])+'</td><td>'+tagTT(x['Trạng thái'])+'</td></tr>').join('')
      + '</tbody></table></div></div>';
  }
  return html;
}

/* ----- TAB 6: HIỆN TRƯỜNG ----- */
function pjHienTruong(d){
  const code = d['Mã DA'];
  const list = (S.hientruong||[]).filter(x=>x['Mã DA']===code).sort((a,b)=>(b['Ngày']||'')>(a['Ngày']||'')?1:-1);
  let html = '<div class="toolbar"><button class="btn btn-brass" onclick="window._stDA=\''+code+'\';formSiteLog()">+ Ghi nhật ký hiện trường</button></div>';
  const suco = list.filter(x=>x['Loại']==='Sự cố').length;
  html += '<div class="kpis">'
    + kpi('Lượt ghi nhận',list.length,'Nhật ký công trình')
    + kpi('Sự cố',suco,suco?'Cần theo dõi':'Không có sự cố',suco?'bad':'')
    + kpi('Ảnh hiện trường',list.reduce((a,x)=>a+parsePhotos(x['Ảnh']).length,0),'Đã tải lên Drive')
    + '</div>';
  if(!list.length) return html+'<div class="empty"><b>Chưa có nhật ký hiện trường</b>Ghi lại tiến độ hàng ngày, sự cố, giao vật tư kèm ảnh chụp tại công trình</div>';
  const byDay = {};
  list.forEach(x=>{ const k=x['Ngày']||'—'; (byDay[k]=byDay[k]||[]).push(x); });
  html += '<div class="card"><div class="timeline">';
  Object.keys(byDay).forEach(day=>{
    const hasSC = byDay[day].some(x=>x['Loại']==='Sự cố');
    const hasOk = byDay[day].some(x=>x['Loại']==='Hoàn thành hạng mục');
    html += '<div class="tl-item"><div class="tl-dot '+(hasSC?'bad':hasOk?'ok':'')+'"></div>'
      + '<div class="tl-time">'+esc(day)+'</div>';
    byDay[day].forEach(x=>{
      const ph = parsePhotos(x['Ảnh']);
      html += '<div class="tl-content" style="margin-bottom:8px;padding:11px 13px;background:var(--paper);border-radius:var(--r-sm);cursor:pointer" onclick="formSiteLog(\''+esc(x['Mã HT'])+'\')">'
        + '<div style="display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap"><b>'+esc(x['Tiêu đề']||x['Loại']||'Nhật ký')+'</b>'
        + '<span class="tag '+(x['Loại']==='Sự cố'?'t-bad':x['Loại']==='Hoàn thành hạng mục'?'t-ok':'t-brass')+'">'+esc(x['Loại']||'')+'</span></div>'
        + '<div class="muted">'+esc(x['Người ghi']||'')+(x['Tiến độ (%)']?' · tiến độ hạng mục '+esc(x['Tiến độ (%)'])+'%':'')+'</div>'
        + (x['Nội dung']?'<p style="margin-top:5px;font-size:13px">'+esc(x['Nội dung'])+'</p>':'')
        + (ph.length?'<div style="display:flex;gap:5px;margin-top:7px;flex-wrap:wrap">'
            + ph.slice(0,5).map(p=>{const id=(p&&typeof p==='object')?p.id:p;return '<img src="https://drive.google.com/thumbnail?id='+esc(id)+'&sz=w200" style="width:58px;height:58px;object-fit:cover;border-radius:6px;border:1px solid var(--line-strong)" loading="lazy">';}).join('')
            + (ph.length>5?'<span class="muted" style="align-self:center">+'+(ph.length-5)+'</span>':'')+'</div>':'')
        + '</div>';
    });
    html += '</div>';
  });
  html += '</div></div>';
  return html;
}

/* ----- TAB 7: HỒ SƠ ----- */
function pjHoSo(d){
  const code = d['Mã DA'];
  const canEd = canEditProject(d);
  const me = user['Họ tên'];
  if(window._docLatest === undefined) window._docLatest = true;

  /* --- Gom hồ sơ: bản ghi thật + ảnh tự động từ hiện trường/công việc/chi phí --- */
  const real = (S.hosoTL||[]).filter(x=>x['Mã DA']===code);
  const auto = docAutoPhotos(code);
  let all = real.concat(auto);

  /* --- Lọc "bản mới nhất": mỗi Mã hồ sơ chỉ giữ phiên bản cao nhất --- */
  const latestOf = arr => {
    const best = {};
    arr.forEach(x=>{
      const k = x['Mã hồ sơ'] || x['Mã TL'];
      const v = Number(x['Phiên bản'])||1;
      if(!best[k] || v > (Number(best[k]['Phiên bản'])||1)) best[k] = x;
    });
    return Object.values(best);
  };
  const base = window._docLatest ? latestOf(all) : all;

  /* --- KPI --- */
  const choToi = base.filter(x=>x['Trạng thái']==='Chờ lãnh đạo phê duyệt'
    && (!x['Người duyệt được giao'] || x['Người duyệt được giao']===me));
  const banHanh = base.filter(x=>x['Trạng thái']==='Đã ban hành');
  const daKy = base.filter(x=>x['Trạng thái']==='Đã ký');
  const kf = window._docKpi||'';
  let html = '<div class="doc-kpis">'
    + dkCard('', 'Tổng số hồ sơ', base.length, '🗄', '#E8EEF7', '#2E5A8F', kf==='')
    + dkCard('cho', 'Chờ tôi duyệt', choToi.length, '◷', '#FFF3E0', '#E65100', kf==='cho')
    + dkCard('bh', 'Đã ban hành', banHanh.length, '✓', 'var(--ok-bg)', 'var(--ok)', kf==='bh')
    + dkCard('ky', 'Đã ký', daKy.length, '🖊', '#EDE7F6', '#5E35B1', kf==='ky')
    + '</div>';

  /* --- Đếm theo loại (trước khi lọc loại) --- */
  const cnt = {};
  LOAI_DOC.forEach(l => cnt[l] = base.filter(x=>x['Loại']===l).length);
  const catSel = window._docCat||'';

  html += '<div class="doc-layout">';
  /* --- Cột trái: phân loại --- */
  html += '<div class="doc-cats"><h5>Phân loại hồ sơ</h5>'
    + '<div class="doc-cat '+(catSel===''?'on':'')+'" onclick="window._docCat=\'\';render()" title="Toàn bộ hồ sơ của dự án">'
    + '<span>🗂</span>Tất cả loại<span class="dcn">'+base.length+'</span></div>'
    + LOAI_DOC.map(l=>'<div class="doc-cat '+(catSel===l?'on':'')+'" onclick="window._docCat=\''+esc(l)+'\';render()" title="'+esc(DOC_DESC[l]||l)+'">'
        + '<span>'+(DOC_ICON[l]||'📁')+'</span>'+esc(l)+'<span class="dcn">'+cnt[l]+'</span></div>').join('')
    + '</div>';

  /* --- Cột phải: bảng hồ sơ --- */
  let list = base.slice();
  if(catSel) list = list.filter(x=>x['Loại']===catSel);
  if(kf==='cho') list = list.filter(x=>choToi.includes(x));
  if(kf==='bh')  list = list.filter(x=>x['Trạng thái']==='Đã ban hành');
  if(kf==='ky')  list = list.filter(x=>x['Trạng thái']==='Đã ký');

  const tabs = [
    ['', 'Tất cả', list.length],
    ['cho','Chờ duyệt', list.filter(x=>x['Trạng thái']==='Chờ lãnh đạo phê duyệt').length],
    ['bh', 'Đã ban hành', list.filter(x=>x['Trạng thái']==='Đã ban hành'||x['Trạng thái']==='Đã ký').length],
    ['nhap','Nháp', list.filter(x=>x['Trạng thái']==='Nháp').length]
  ];
  const tabSel = window._docTab||'';
  let show = list.slice();
  if(tabSel==='cho')  show = show.filter(x=>x['Trạng thái']==='Chờ lãnh đạo phê duyệt');
  if(tabSel==='bh')   show = show.filter(x=>x['Trạng thái']==='Đã ban hành'||x['Trạng thái']==='Đã ký');
  if(tabSel==='nhap') show = show.filter(x=>x['Trạng thái']==='Nháp');
  const q = (window._docQ||'').toLowerCase();
  if(q) show = show.filter(x=>((x['Tiêu đề']||'')+(x['Mã hồ sơ']||'')+(x['Loại']||'')+(x['Người tải lên']||'')).toLowerCase().includes(q));
  // sắp xếp: chờ duyệt lên đầu, rồi theo ngày mới nhất
  show.sort((a,b)=>{
    const pa = a['Trạng thái']==='Chờ lãnh đạo phê duyệt'?0:1;
    const pb = b['Trạng thái']==='Chờ lãnh đạo phê duyệt'?0:1;
    if(pa!==pb) return pa-pb;
    return (b['Ngày']||'')>(a['Ngày']||'')?1:-1;
  });

  html += '<div class="doc-panel">'
    + '<div class="doc-ph"><span>📁</span><b>'+esc(d['Tên dự án'])+'</b>'
    + '<div class="doc-tools">'
    + '<input type="search" placeholder="Tìm trong mục này…" value="'+esc(window._docQ||'')+'" oninput="window._docQ=this.value;render()">'
    + '<label><input type="checkbox" '+(window._docLatest?'checked':'')+' onchange="window._docLatest=this.checked;render()">Bản mới nhất</label>'
    + '<button class="btn btn-ghost" style="padding:6px 11px;font-size:12px" onclick="docDownloadAll(\''+code+'\')">⬇ Tải xuống toàn bộ ('+base.length+')</button>'
    + (canEd?'<button class="btn btn-dark" style="padding:6px 13px;font-size:12.5px" onclick="window._hdDA=\''+code+'\';formDocument()">⬆ Tải hồ sơ lên</button>':'')
    + '</div></div>';

  html += '<div class="doc-tabs">' + tabs.map(t=>
      '<button class="'+(tabSel===t[0]?'on':'')+'" onclick="window._docTab=\''+t[0]+'\';render()">'
      + t[1]+'<span class="n">'+t[2]+'</span></button>').join('') + '</div>';

  if(!show.length){
    html += '<div class="empty" style="padding:34px 18px"><b>Chưa có hồ sơ</b>'
      + (catSel?'Không có hồ sơ loại "'+esc(catSel)+'" ':'')
      + 'Bấm "⬆ Tải hồ sơ lên" để thêm hợp đồng, bản vẽ, báo giá, biên bản nghiệm thu…<br>'
      + '<span class="muted">Ảnh chụp trong Nhật ký hiện trường, Công việc và Chi phí tự động xuất hiện ở mục "Ảnh hiện trường".</span></div>';
  } else {
    html += '<div class="doc-row hdr"><div></div><div>Tên hồ sơ</div><div class="c-ma">Mã</div><div>Phiên bản</div>'
      + '<div>Trạng thái</div><div class="c-up">Người tải lên</div><div style="text-align:right">Thao tác</div></div>';
    html += show.map(x=>docRow(x, canEd, me)).join('');
  }
  html += '</div></div>';
  return html;
}

/* --- Một dòng hồ sơ --- */
function docRow(x, canEd, me){
  const pend = x['Trạng thái']==='Chờ lãnh đạo phê duyệt';
  const isAuto = !!x.__auto;
  const files = parsePhotos(x['File đính kèm']||x['Ảnh']);
  const first = files[0];
  const fid = first && (typeof first==='object' ? first.id : first);
  const isImg = first && !(typeof first==='object' && first.doc);
  const thumb = fid && isImg
    ? '<img src="https://drive.google.com/thumbnail?id='+esc(fid)+'&sz=w120" loading="lazy">'
    : (DOC_ICON[x['Loại']]||'📎');
  const ver = Number(x['Phiên bản'])||1;
  const chain = isAuto ? 0 : (S.hosoTL||[]).filter(r=>r['Mã hồ sơ'] && r['Mã hồ sơ']===x['Mã hồ sơ']).length;
  const up = x['Người tải lên']||'';
  const ini = up ? up.trim().split(' ').pop()[0].toUpperCase() : '?';
  const canApprove = pend && meCanApprove() && (!x['Người duyệt được giao'] || x['Người duyệt được giao']===me);

  return '<div class="doc-row '+(pend?'pend':'')+'">'
    + '<div class="doc-thumb">'+thumb+'</div>'
    + '<div class="doc-nm" onclick="'+(isAuto?'docOpenAuto(\''+esc(fid||'')+'\')':'formDocument(\''+esc(x['Mã TL'])+'\')')+'">'
      + '<b>'+esc(x['Tiêu đề']||'—')+'</b>'
      + '<span>'+esc(x['Loại']||'')+(x['Nguồn']?' · '+esc(x['Nguồn']):'')+(files.length>1?' · '+files.length+' file':'')+'</span></div>'
    + '<div class="c-ma"><span class="muted" style="font-size:12px">'+esc(x['Mã hồ sơ']||'—')+'</span></div>'
    + '<div>'+(isAuto?'<span class="muted">—</span>'
        :'<span class="vchip" onclick="docHistory(\''+esc(x['Mã hồ sơ']||'')+'\')" title="'+(chain>1?'Xem '+chain+' phiên bản':'Chỉ có 1 phiên bản')+'">v'+ver+(chain>1?' ⌄':'')+'</span>')+'</div>'
    + '<div>'+docStat(x['Trạng thái'])+(function(){var b=xnBadge(x['Mã DA'],'Hồ sơ',[x['Mã hồ sơ'],x['Mã TL'],x['Tiêu đề']]);return b?'<div style="margin-top:5px">'+b+'</div>':'';})()+'</div>'
    + '<div class="c-up">'+(up?'<span class="up-chip"><span class="av">'+esc(ini)+'</span>'+esc(up)+'</span>':'<span class="muted">—</span>')+'</div>'
    + '<div class="doc-acts">'
      + (canApprove?'<button class="ap" onclick="docApprove(\''+esc(x['Mã TL'])+'\',1)">✓ Duyệt</button>':'')
      + (!isAuto?'<button class="lk" onclick="formDocument(\''+esc(x['Mã TL'])+'\')">Chi tiết</button>':'')
      + (fid?'<button class="lk" title="Mở file" onclick="window.open(\'https://drive.google.com/file/d/'+esc(fid)+'/view\',\'_blank\')">⬇</button>':'')
      + '</div></div>';
}
function docStat(s){
  const m = {'Nháp':'ds-nhap','Chờ lãnh đạo phê duyệt':'ds-cho','Đã phê duyệt':'ds-duyet',
             'Đã ban hành':'ds-banhanh','Đã ký':'ds-ky','Hết hiệu lực':'ds-het'};
  const ic = {'Nháp':'✎','Chờ lãnh đạo phê duyệt':'◷','Đã phê duyệt':'✓','Đã ban hành':'✓','Đã ký':'🖊','Hết hiệu lực':'⊘'};
  return '<span class="dstat '+(m[s]||'ds-nhap')+'">'+(ic[s]||'')+' '+esc(s||'Nháp')+'</span>';
}

/* --- Ảnh tự động từ Hiện trường / Công việc / Chi phí --- */
function docAutoPhotos(daCode){
  const out = [];
  const push = (arr, nguon, tenField, codeField) => {
    arr.filter(x=>x['Mã DA']===daCode).forEach(r=>{
      parsePhotos(r['Ảnh']).forEach((p,i)=>{
        const id = (p&&typeof p==='object')?p.id:p;
        const nm = (p&&typeof p==='object'&&p.name)?p.name:('image_'+String(id||'').slice(0,6)+'.jpg');
        out.push({__auto:true,'Mã TL':'AUTO_'+codeField+'_'+r[codeField]+'_'+i,'Mã DA':daCode,
          'Mã hồ sơ':'','Loại':'Ảnh hiện trường','Tiêu đề':nm,
          'Nguồn':nguon+': '+(r[tenField]||''),'Phiên bản':'',
          'Trạng thái':'Đã ban hành','Ngày':r['Ngày']||r['Ngày chi']||r['Hạn hoàn thành']||'',
          'Người tải lên':r['Người ghi']||r['Phụ trách']||'','File đính kèm':JSON.stringify([p])});
      });
    });
  };
  push(S.hientruong||[], 'Nhật ký hiện trường', 'Tiêu đề', 'Mã HT');
  push(S.congviec||[],   'Công việc',           'Tên công việc', 'Mã CV');
  push(S.chiphi||[],     'Chứng từ chi phí',    'Hạng mục', 'Mã CP');
  return out;
}

/* --- Tải xuống toàn bộ: liệt kê link Drive --- */
function docDownloadAll(daCode){
  const d = S.duan.find(x=>x['Mã DA']===daCode);
  const all = (S.hosoTL||[]).filter(x=>x['Mã DA']===daCode).concat(docAutoPhotos(daCode));
  const items = [];
  all.forEach(x=>parsePhotos(x['File đính kèm']||x['Ảnh']).forEach(p=>{
    const id = (p&&typeof p==='object')?p.id:p;
    const nm = (p&&typeof p==='object'&&p.name)?p.name:(x['Tiêu đề']||'file');
    if(id) items.push({id, nm, loai:x['Loại'], ma:x['Mã hồ sơ']||''});
  }));
  if(!items.length) return toast('Chưa có file nào để tải', true);
  openModal('Tải xuống hồ sơ — '+(d?d['Tên dự án']:''),
    '<p class="muted" style="margin-bottom:10px">'+items.length+' file trên Google Drive. Bấm "Mở tất cả" để mở đồng loạt (trình duyệt có thể hỏi cho phép mở nhiều tab), hoặc tải từng file.</p>'
    + '<button class="btn btn-brass" style="margin-bottom:12px" onclick="docOpenAll()">↗ Mở tất cả '+items.length+' file</button>'
    + '<div class="tbl-wrap" style="max-height:44vh;overflow-y:auto"><table class="tbl"><tbody>'
    + items.map(f=>'<tr><td><b>'+esc(f.nm)+'</b><div class="muted">'+esc(f.loai||'')+(f.ma?' · '+esc(f.ma):'')+'</div></td>'
      + '<td class="num"><button class="lk" onclick="window.open(\'https://drive.google.com/file/d/'+esc(f.id)+'/view\',\'_blank\')">⬇ Tải</button></td></tr>').join('')
    + '</tbody></table></div>', null);
  window.__dlList = items;
}
function docOpenAll(){
  const list = window.__dlList||[];
  if(list.length>15 && !confirm('Sẽ mở '+list.length+' tab. Tiếp tục?')) return;
  list.forEach((f,i)=>setTimeout(()=>window.open('https://drive.google.com/file/d/'+f.id+'/view','_blank'), i*250));
}

/* --- Sinh mã hồ sơ tự động theo loại --- */
function docNextCode(daCode, loai){
  const pre = DOC_PREFIX[loai]||'HS';
  let max = 0;
  (S.hosoTL||[]).filter(x=>x['Mã DA']===daCode).forEach(x=>{
    const m = String(x['Mã hồ sơ']||'').match(new RegExp('^'+pre+'-(\\d+)$'));
    if(m) max = Math.max(max, +m[1]);
  });
  return pre+'-'+String(max+1).padStart(3,'0');
}
function docOnPickLoai(){
  const el = document.getElementById('tlMa');
  if(el && !el.dataset.touched) el.value = docNextCode(V('tlDA'), V('tlLoai'));
  const ds = document.getElementById('tlDesc');
  if(ds) ds.textContent = DOC_DESC[V('tlLoai')] || '';
}

/* ----- TAB 8: THÀNH VIÊN ----- */
function pjThanhVien(d){
  const code = d['Mã DA'];
  const memberCodes = String(d['Thành viên']||'').split(',').map(s=>s.trim()).filter(Boolean);
  const members = S.nhansu.filter(n=>memberCodes.includes(n['Mã NV']));
  const pt = S.nhansu.find(n=>n['Họ tên']===d['Phụ trách']);
  const cv = tvSong(S.congviec).filter(x=>x['Mã DA']===code);
  const canEd = canEditProject(d);

  let html = canEd ? '<div class="toolbar"><button class="btn btn-brass" onclick="pjEditMembers()">✎ Sửa danh sách thành viên</button></div>' : '';
  // Phụ trách
  html += '<div class="card"><div class="card-head"><h3>Người phụ trách dự án (PM)</h3></div>';
  if(pt){
    const myTasks = cv.filter(c=>c['Phụ trách']===pt['Họ tên']);
    html += '<div class="card-body" style="display:flex;align-items:center;gap:14px;flex-wrap:wrap">'
      + '<div class="avatar" style="width:46px;height:46px;font-size:17px">'+esc((pt['Họ tên']||'?').trim().split(' ').pop()[0].toUpperCase())+'</div>'
      + '<div style="flex:1;min-width:160px"><b style="font-size:15px">'+esc(pt['Họ tên'])+'</b>'
      + '<div class="muted">'+esc(pt['Chức danh']||VAI_TRO[pt['Vai trò']]||'')+(pt['SĐT']?' · 📞 '+esc(pt['SĐT']):'')+'</div>'
      + '<div class="muted">'+myTasks.filter(c=>c['Trạng thái']==='Hoàn thành').length+'/'+myTasks.length+' đầu việc trực tiếp phụ trách</div></div>'
      + '<div style="display:flex;gap:6px;flex-wrap:wrap">'+((pt['Cấp duyệt']||'').trim()?'<span class="tag t-brass">Cấp duyệt: '+esc(pt['Cấp duyệt'])+'</span>':'')
      + (pt['SĐT']?btnZalo(pt['SĐT'],'Zalo'):'')+'</div></div>';
  } else html += '<div class="empty">Chưa gán người phụ trách — bấm "Sửa thông tin" ở đầu trang để chọn PM</div>';
  html += '</div>';

  // Thành viên
  html += '<div class="card"><div class="card-head"><h3>Thành viên tham gia ('+members.length+')</h3></div>';
  if(members.length){
    html += '<div class="card-body" style="padding:0"><div class="tbl-wrap"><table class="tbl"><thead><tr><th>Họ tên</th><th>Chức danh</th><th>Vai trò</th><th>Đầu việc</th><th>Liên hệ</th></tr></thead><tbody>';
    html += members.map(n=>{
      const t = cv.filter(c=>c['Phụ trách']===n['Họ tên']);
      const late = t.filter(c=>c['Trạng thái']!=='Hoàn thành'&&c['Hạn hoàn thành']&&daysLeft(c['Hạn hoàn thành'])<0).length;
      return '<tr><td><b>'+esc(n['Họ tên'])+'</b><div class="muted">'+esc(n['Mã NV'])+'</div></td>'
        + '<td>'+esc(n['Chức danh']||'—')+'</td>'
        + '<td>'+esc(VAI_TRO[n['Vai trò']]||n['Vai trò'])+((n['Cấp duyệt']||'').trim()?'<div class="muted">Duyệt: '+esc(n['Cấp duyệt'])+'</div>':'')+'</td>'
        + '<td>'+t.filter(c=>c['Trạng thái']==='Hoàn thành').length+'/'+t.length+(late?' <span class="tag t-bad" style="font-size:10px">'+late+' trễ</span>':'')+'</td>'
        + '<td>'+(n['SĐT']?esc(n['SĐT'])+' '+btnZalo(n['SĐT'],''):'—')+'</td></tr>';
    }).join('');
    html += '</tbody></table></div></div>';
  } else html += '<div class="empty">Chưa có thành viên nào'+(canEd?' — bấm "Sửa danh sách thành viên"':'')+'</div>';
  html += '</div>';

  // Phân bổ việc theo người (kể cả người ngoài danh sách)
  const byPerson = {};
  cv.forEach(c=>{ const k=c['Phụ trách']||'(chưa gán)'; (byPerson[k]=byPerson[k]||[]).push(c); });
  const keys = Object.keys(byPerson);
  if(keys.length){
    html += '<div class="card"><div class="card-head"><h3>Phân bổ đầu việc theo người</h3></div><div class="card-body">';
    keys.sort((a,b)=>byPerson[b].length-byPerson[a].length).forEach(k=>{
      const t = byPerson[k]; const done = t.filter(c=>c['Trạng thái']==='Hoàn thành').length;
      const w = Math.round(done/t.length*100);
      html += '<div style="margin-bottom:11px"><div style="display:flex;justify-content:space-between;font-size:13px;margin-bottom:3px">'
        + '<span><b>'+esc(k)+'</b>'+(memberCodes.length&&!members.some(m=>m['Họ tên']===k)&&k!=='(chưa gán)'?' <span class="tag t-warn" style="font-size:10px">ngoài danh sách</span>':'')+'</span>'
        + '<span class="muted">'+done+'/'+t.length+' xong</span></div>'
        + '<div class="bar '+(w===100?'green':'')+'"><i style="width:'+w+'%"></i></div></div>';
    });
    html += '</div></div>';
  }
  return html;
}
function pjEditMembers(){
  const d = pjProj(); if(!d) return;
  if(!canEditProject(d)) return toast('Chỉ người phụ trách dự án mới sửa được',true);
  const memberCodes = String(d['Thành viên']||'').split(',').map(s=>s.trim()).filter(Boolean);
  const staff = S.nhansu.filter(n=>n['Trạng thái']!=='Nghỉ việc');
  openModal('Thành viên dự án — '+d['Tên dự án'],
    '<p class="muted" style="margin-bottom:12px">Danh sách tham khảo để phân bổ việc. Mọi nhân sự có tài khoản đều xem được dự án; quyền sửa thuộc cấp Quản lý trở lên và người phụ trách.</p>'
    + '<div style="border:1px solid var(--line-strong);border-radius:var(--r-sm);padding:10px 13px;max-height:320px;overflow-y:auto">'
    + staff.map(n=>'<label style="display:block;padding:5px 0;font-size:13.5px;cursor:pointer;border-bottom:1px solid var(--line)">'
        + '<input type="checkbox" class="pjMem" value="'+esc(n['Mã NV'])+'" '+(memberCodes.includes(n['Mã NV'])?'checked':'')+'> '
        + '<b>'+esc(n['Họ tên'])+'</b>'+(n['Chức danh']?' <span class="muted">— '+esc(n['Chức danh'])+'</span>':'')
        + (n['Họ tên']===d['Phụ trách']?' <span class="tag t-brass" style="font-size:10px">PM</span>':'')
        + '</label>').join('')
    + '</div>',
    function save(){
      const sel = Array.from(document.querySelectorAll('.pjMem:checked')).map(el=>el.value).join(',');
      d['Thành viên'] = sel;
      closeModal();
      pushOp('saveProject', {'Mã DA':d['Mã DA'],'Thành viên':sel});
      toast('Đã cập nhật thành viên');
    }
  );
}

/* ----- Hành động nhanh trên header dự án ----- */
function pjSetStatus(tt){
  const d = pjProj(); if(!d) return;
  if(!canEditProject(d)) return toast('Không có quyền',true);
  d['Trạng thái'] = tt;
  pushOp('saveProject', {'Mã DA':d['Mã DA'],'Trạng thái':tt});
  toast('Đã chuyển trạng thái: '+tt);
}
function pjNextPhase(){
  const d = pjProj(); if(!d) return;
  if(!canEditProject(d)) return toast('Không có quyền',true);
  const i = GIAI_DOAN.indexOf(d['Giai đoạn']);
  if(i === -1) { d['Giai đoạn'] = GIAI_DOAN[0]; }
  else if(i >= GIAI_DOAN.length-1){
    if(!confirm('Dự án đang ở giai đoạn cuối "'+d['Giai đoạn']+'". Đánh dấu HOÀN THÀNH dự án?')) return;
    d['Trạng thái'] = 'Hoàn thành';
    pushOp('saveProject', {'Mã DA':d['Mã DA'],'Trạng thái':'Hoàn thành'});
    return toast('✓ Đã hoàn thành dự án');
  } else d['Giai đoạn'] = GIAI_DOAN[i+1];
  pushOp('saveProject', {'Mã DA':d['Mã DA'],'Giai đoạn':d['Giai đoạn']});
  toast('Đã chuyển sang: '+d['Giai đoạn']);
}

/* ----- Cấu hình API từ màn hình đăng nhập ----- */
function openApiSetup(){
  const cur = store.api;
  const url = prompt('Dán URL Apps Script Web App (kết thúc bằng /exec):', cur || 'https://script.google.com/macros/s/.../exec');
  if(url === null) return;
  store.api = url;
  apiGet('ping').then(j=>{
    if(j.ok){ alert('✓ Kết nối thành công! Giờ anh có thể đăng nhập.'); syncAll(false); }
    else alert('Máy chủ trả về lỗi: ' + (j.error||''));
  }).catch(e=>alert('Không kết nối được: ' + e.message + '\nKiểm tra: URL đúng /exec, deploy "Anyone".'));
}

/* Mã tạm phía client — server sẽ cấp mã chính thức khi đồng bộ */
function tempCode(prefix, arr, field){
  let max = 0;
  arr.forEach(x=>{ const m = String(x[field]||'').match(new RegExp('^'+prefix+'(\\d+)$')); if(m) max = Math.max(max, +m[1]); });
  return prefix + String(max+1).padStart(4,'0');
}

   KHỞI ĐỘNG
================================================================ */
(function init(){
  store.loadState();
  // Phiên đăng nhập cũ
  const ses = store.session;
  if(ses && S.nhansu.length){
    const found = S.nhansu.find(n=>n['Mã NV']===ses.code && n['Trạng thái']!=='Nghỉ việc');
    if(found){ user = found; enterApp(); }
  }
  // Fix lỗi mobile lệch dữ liệu: đồng bộ lại mỗi khi quay lại app
  document.addEventListener('visibilitychange', ()=>{ if(!document.hidden && user) syncAll(false); });
  window.addEventListener('online', ()=>{ if(user) syncAll(false); });
  setInterval(()=>{ if(user && !document.hidden) syncAll(false); }, 90000); // 90 giây/lần
  // Enter để đăng nhập
  document.getElementById('loginPass').addEventListener('keydown', e=>{ if(e.key==='Enter') doLogin(); });
})();

/* ---------- Tiện ích thư viện ---------- */
// Lọc thư viện theo Loại hình dự án — theo nhóm ngành (v4.2)
function tvFilter(loaiHinh){
  const nh = nhomTheoLoaiHinh(loaiHinh);
  return TV_KH.filter(g => nh.includes(g[1]));
}
// Danh sách phẳng đầu việc — dùng cho ô chọn nhanh trong form công việc
function tvFlat(loaiHinh){
  const out = [];
  tvFilter(loaiHinh).forEach(g => g[2].forEach(hm => hm[2].forEach(cv => {
    out.push({gd:g[0], hm:hm[0], ten:cv[0], d:cv[1], p:cv[2], r:cv[3], f:cv[4]||''});
  })));
  return out;
}
// Đếm tổng
function tvCount(loaiHinh){
  let hm=0, cv=0;
  tvFilter(loaiHinh).forEach(g => { hm += g[2].length; g[2].forEach(h => cv += h[2].length); });
  return {gd: tvFilter(loaiHinh).length, hm, cv};
}
// Nhãn cờ
function tvFlag(f){
  const m = {ap:'<span class="tv-f ap" title="Cần trình Ban lãnh đạo phê duyệt">BLĐ duyệt</span>',
             tp:'<span class="tv-f tp" title="Thường giao cho nhà thầu phụ">Thầu phụ</span>',
             kh:'<span class="tv-f kh" title="Có làm việc trực tiếp với khách hàng">Khách hàng</span>',
             qc:'<span class="tv-f qc" title="Điểm kiểm soát chất lượng">Kiểm soát</span>'};
  return m[f]||'';
}

/* ================================================================
   ★ CHỌN NHANH ĐẦU VIỆC TỪ THƯ VIỆN (trong form Công việc)
================================================================ */
function selTVTask(id, loaiHinh){
  const list = tvFlat(loaiHinh);
  let cur = '', opts = '<option value="">— Gõ tay hoặc chọn từ thư viện —</option>';
  list.forEach((t,i) => {
    const key = t.gd + ' › ' + t.hm;
    if(key !== cur){ if(cur) opts += '</optgroup>'; opts += '<optgroup label="'+esc(key)+'">'; cur = key; }
    opts += '<option value="'+i+'">'+esc(t.ten)+'</option>';
  });
  if(cur) opts += '</optgroup>';
  return '<select id="'+id+'" onchange="tvPickTask(this.value)">'+opts+'</select>';
}
// Khi chọn 1 đầu việc từ thư viện → tự điền tên, giai đoạn, ưu tiên, hạn
function tvPickTask(idx){
  if(idx === '') return;
  const proj = S.duan.find(x => x['Mã DA'] === (V('tDA')||''));
  const t = tvFlat(proj ? proj['Loại hình'] : '')[Number(idx)];
  if(!t) return;
  const set = (id,v) => { const el = document.getElementById(id); if(el && v!=null) el.value = v; };
  set('tTen', t.ten);
  set('tGD', t.gd);
  set('tUT', t.p);
  // Hạn = ngày bắt đầu (hoặc hôm nay) + số ngày chuẩn
  const bd = V('tBD') || today();
  const han = new Date(new Date(bd).getTime() + t.d*86400000).toISOString().slice(0,10);
  set('tBD', bd); set('tHan', han);
  // Gợi ý hạng mục cùng tên nếu dự án đã có
  const hm = (S.hangmuc||[]).find(h => h['Mã DA']===V('tDA') && h['Tên hạng mục']===t.hm);
  if(hm) set('tHM', hm['Mã HM']);
  const hint = document.getElementById('tvHint');
  if(hint) hint.innerHTML = '✓ Đã điền từ thư viện · <b>'+esc(t.hm)+'</b> · '+t.d+' ngày · vai trò: '+esc(t.r)
    + (t.f?' · '+tvFlag(t.f):'')
    + (hm?'':' <span style="color:var(--warn)">· dự án chưa có hạng mục "'+esc(t.hm)+'" — có thể tạo ở tab Kế hoạch</span>');
}

        + '<input type="checkbox" class="tv-h" data-g="'+gi+'" data-h="'+hi+'" '+(dup?'':'checked')+' onchange="tvToggleH('+gi+','+hi+',this.checked)"> '
