// ---- Kho lưu dữ liệu Kế hoạch chung theo Mã DA (localStorage) ----
function khcStore(){ try{ return JSON.parse(localStorage.getItem('mdc_pm_khc')||'{}'); }catch(e){ return {}; } }
function khcSaveStore(o){ try{ localStorage.setItem('mdc_pm_khc', JSON.stringify(o)); }catch(e){} }
function khcGet(ma){ return khcStore()[ma] || {}; }
function khcSet(ma, key, val){ const s=khcStore(); (s[ma]=s[ma]||{})[key]= (val==null?'':String(val)); khcSaveStore(s); }
function khcRaw(ma, key){ const s=khcGet(ma); return (key in s) ? s[key] : undefined; }
// ---- Helper dùng chung ----
function ksDiff(a,b){ if(!a||!b) return null; return Math.round((new Date(b)-new Date(a))/86400000); }
function ksSoHDStore(){ try{ return JSON.parse(localStorage.getItem('mdc_pm_sohd')||'{}'); }catch(e){ return {}; } }
function ksSoHD(maDA){ const d=(S.duan||[]).find(x=>x['Mã DA']===maDA); return (d&&(d['Số hợp đồng']||d['Số HĐ'])) || ksSoHDStore()[maDA] || ''; }
function ksSetSoHD(maDA,v){ if(!maDA) return; const s=ksSoHDStore(); if(v) s[maDA]=String(v); else delete s[maDA]; try{ localStorage.setItem('mdc_pm_sohd', JSON.stringify(s)); }catch(e){} }

const KHC_MODES = ['Lịch (cả CN, lễ)','Trừ Chủ nhật','Trừ CN & ngày lễ'];
// Ngày lễ mặc định (dương lịch cố định + Tết/Giỗ Tổ 2026 gần đúng — SỬA LẠI được ở "🗓 Ngày lễ")

// Cộng "n ngày làm việc" vào ngày bắt đầu theo cách tính → trả ISO ngày hoàn thành
function khcAddDays(startISO, n, mode){
  n=Number(n)||0; if(!/^\d{4}-\d{2}-\d{2}$/.test(String(startISO||'')) || n<=0) return '';
  mode = mode || KHC_MODES[0];
  const hols = (mode===KHC_MODES[2]) ? holList() : [];
  let d=new Date(startISO+'T00:00:00'), c=0, guard=0;
  while(c<n && guard<200000){
    d.setDate(d.getDate()+1); guard++;
    const dow=d.getDay(); // 0 = Chủ nhật
    const iso=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
    if(mode===KHC_MODES[0]) c++;
    else if(mode===KHC_MODES[1]){ if(dow!==0) c++; }
    else { if(dow!==0 && !hols.includes(iso)) c++; }
  }
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}
/* ===== Quản lý danh mục ngày lễ ===== */
function holManage(){
  const render=()=>{
    const list=holList();
    let h='<div class="muted" style="margin-bottom:10px;line-height:1.55">Ngày lễ dùng cho cách tính <b>“Trừ CN & ngày lễ”</b>. Thêm/bớt cho đúng lịch nghỉ công ty. Ngày dạng dd/mm/yyyy.</div>'
      + '<div style="display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap">'
      + '<input id="holAdd" type="date" class="khc-in khc-date" style="border:1px solid var(--line-strong);border-radius:var(--r-sm);padding:7px 9px">'
      + '<button type="button" class="btn btn-brass" style="padding:7px 12px;font-size:12.5px" onclick="holAdd()">+ Thêm ngày lễ</button>'
      + '<button type="button" class="btn btn-ghost" style="padding:7px 12px;font-size:12.5px" onclick="if(confirm(\'Nạp lại danh sách ngày lễ mẫu?\')){holSave(HOL_DEFAULT.slice());holManage();}">↻ Nạp lại mẫu</button></div>'
      + '<div class="tbl-wrap" style="max-height:300px;overflow:auto"><table class="tbl"><thead><tr><th>Ngày</th><th>Thứ</th><th></th></tr></thead><tbody>';
    const THU=['Chủ nhật','Thứ 2','Thứ 3','Thứ 4','Thứ 5','Thứ 6','Thứ 7'];
    if(!list.length) h+='<tr><td colspan="3"><div class="empty">Chưa có ngày lễ nào</div></td></tr>';
    list.forEach(iso=>{ const dt=new Date(iso+'T00:00:00'); h+='<tr><td><b>'+fmtDMY(iso)+'</b></td><td class="muted">'+THU[dt.getDay()]+'</td><td style="text-align:right"><button class="btn btn-ghost" style="padding:3px 9px;font-size:11px" onclick="holDel(\''+iso+'\')">Xóa</button></td></tr>'; });
    h+='</tbody></table></div>';
    document.getElementById('modalBody').innerHTML=h;
  };
  openModal('Danh mục ngày lễ', '', null);
  document.getElementById('modalSave').classList.add('hide');
  window.__holRender=render; render();
}
function holAdd(){ const el=document.getElementById('holAdd'); if(!el||!el.value) return; holSave([...holList(), el.value]); if(window.__holRender) window.__holRender(); toast('✓ Đã thêm ngày lễ'); }
function holDel(iso){ holSave(holList().filter(x=>x!==iso)); if(window.__holRender) window.__holRender(); }

// Danh sách phẳng mọi cột "thật" (không tính calc/STT/tên) — cho xuất/nhập
function khcAllCols(){
  const out=[...KHC_CHUNG, ...KHC_KQHD];
  KHC_DEPTS.forEach(dp=>dp.cols.forEach(c=>out.push({...c, dept:dp.ten})));
  return out;
}
// Giá trị hiển thị của 1 ô: giá trị đã nhập > mặc định suy từ dự án
function khcVal(d, col){
  const ma=d['Mã DA']; const raw=khcRaw(ma, col.key);
  if(raw!==undefined) return raw;                 // đã nhập (kể cả rỗng do xoá)
  if(col.key==='soHD'){ const s=ksSoHD(ma); if(s) return s; }
  if(col.def){ try{ return col.def(d)||''; }catch(e){ return ''; } }
  return '';
}
// Số ngày HT của 1 phòng = khoảng (min..max) các mốc ngày đã có
function khcSpanDays(d, span){
  let min=null,max=null;
  span.forEach(k=>{ const v=khcRaw(d['Mã DA'],k); const val=(v!==undefined)?v:''; if(val && /^\d{4}-\d{2}-\d{2}$/.test(val)){ if(!min||val<min)min=val; if(!max||val>max)max=val; } });
  return (min&&max)?Math.max(1,ksDiff(min,max)+1):'';
}
function khcColByKey(key){ return KHC_CHUNG.find(c=>c.key===key); }
function khcCalc(d){
  const ma=d['Mã DA'];
  const ngayKy = khcVal(d, khcColByKey('ngayKy'));
  const tienDo = Number(khcVal(d, khcColByKey('tienDoHD')))||0;
  const mode   = khcVal(d, khcColByKey('hd_mode')) || KHC_MODES[0];
  // Hoàn thành HĐ = ngày ký + tiến độ (theo cách tính); nếu thiếu → dùng giá trị nhập tay/ngày kết thúc DK
  let htHD = (ngayKy && tienDo>0) ? khcAddDays(ngayKy, tienDo, mode) : '';
  if(!htHD){ const raw=khcRaw(ma,'htHD'); htHD = (raw!==undefined && raw!=='') ? raw : (d['Ngày kết thúc DK']||''); }
  const soNgayTH = ngayKy?Math.max(0,ksDiff(ngayKy,today())):'';
  const soNgayCL = htHD?ksDiff(today(),htHD):'';
  const deptHT={};
  KHC_DEPTS.forEach(dp=>dp.cols.forEach(c=>{ if(c.t==='calc') deptHT[c.key]=khcSpanDays(d,c.span); }));
  return {htHD, soNgayTH, soNgayCL, mode, ngayKy, tienDo, deptHT};
}
// Render nội dung 1 ô (input/select/calc) — dùng chung cho lưới & form chi tiết
function khcInput(d, col, canEd){
  const ma=d['Mã DA'];
  if(col.t==='calc'){
    let val='';
    if(col.span) val=khcSpanDays(d,col.span);
    else { const c=khcCalc(d); val=(col.key==='soNgayTH')?c.soNgayTH:(col.key==='soNgayCL')?c.soNgayCL:(col.key==='htHD')?(c.htHD?fmtDMY(c.htHD):''):''; }
    return '<span class="khc-calc" id="khc_'+esc(ma)+'_'+col.key+'">'+esc((val===''||val==null)?'—':val)+'</span>';
  }
  const v=khcVal(d,col);
  const dis=canEd?'':' disabled';
  const oc='onchange="khcEdit(\''+esc(ma)+'\',\''+col.key+'\',this)"';
  if(col.t==='sel'){
    const list=col.opts||['','Đạt','Không'];
    const opts=(col.opts?col.opts:['','Đạt','Không']).map(o=>'<option'+(String(v)===String(o)?' selected':'')+'>'+esc(o)+'</option>').join('');
    const kqCls=col.opts?'':(v==='Đạt'?' ok':v==='Không'?' no':'');
    return '<select class="khc-in khc-kq'+kqCls+'" '+oc+dis+'>'+opts+'</select>';
  }
  const type=col.t==='num'?'number':col.t==='date'?'date':'text';
  const cls=col.t==='date'?'khc-in khc-date':col.t==='num'?'khc-in khc-num':'khc-in khc-txt';
  return '<input type="'+type+'" class="'+cls+'" value="'+esc(v)+'" '+oc+dis+'>';
}
// Ô trong lưới
function khcCell(d, col, canEd){ return '<td class="ks-c">'+khcInput(d,col,canEd)+'</td>'; }
// Trường label+input trong form chi tiết dự án
function khcField(d, col, canEd, labelOverride){
  return '<div class="khc-f"><label>'+esc(labelOverride||col.leaf)+'</label>'+khcInput(d,col,canEd)+'</div>';
}

  if(view==='hm') return seg + pjKeHoachHangMuc(d);

  let html='<div class="card"><div class="ct">Kế hoạch chi tiết theo bộ phận <span class="muted" style="font-weight:400">— dòng chảy công việc qua các phòng</span>'

    + (canEd?' <button class="btn btn-ghost" style="padding:6px 12px;font-size:12.5px" onclick="khcAutoFill(\''+esc(ma)+'\')">⚡ Gợi ý mốc từ công việc</button>':'')+'</span>'
    + '</div><div class="card-body">';
  // Khối Hợp đồng + Kết quả HĐ
  html += '<div class="khc-sec"><div class="khc-sec-h" style="border-color:var(--brass)">HỢP ĐỒNG <span class="muted" style="font-weight:400;text-transform:none;letter-spacing:0;font-size:11px">— Ngày ký + Tiến độ (số ngày) theo cách tính → tự ra Ngày hoàn thành, áp vào tiến độ dự án</span></div><div class="khc-form">'
    + KHC_CHUNG.map(c=>khcField(d,c,canEd)).join('')
    + KHC_KQHD.map(c=>khcField(d,c,canEd,'Kết quả HĐ · '+c.leaf)).join('')
    + '</div></div>';
  // 4 phòng ban
  KHC_DEPTS.forEach(dp=>{
    html += '<div class="khc-sec"><div class="khc-sec-h" style="border-color:'+dp.mau+'">'+esc(dp.ten)+'</div><div class="khc-form">'
      + dp.cols.map(c=>khcField(d,c,canEd)).join('')

  });
  html += '</div></div>'

  return seg + html;
}

function khhmSaveStore(o){ try{ localStorage.setItem('mdc_pm_khhm', JSON.stringify(o)); }catch(e){} }

/* Nhập hạng mục từ hợp đồng (dán từ Excel/Sheet hoặc chọn file CSV) */
function khhmImport(ma){
  if(!khhmCanEd(ma)) return toast('Bạn không có quyền sửa', true);
  window.__khhmImp=null; window.__khhmImpMa=ma;
  const body='<div class="muted" style="margin-bottom:10px;line-height:1.55">Chọn <b>file Excel (.xlsx)</b> của hợp đồng — hoặc dán bảng hạng mục copy từ Excel/Google Sheet vào ô dưới — mỗi hạng mục 1 dòng. '
    + 'Tự nhận diện cột: <b>Chi tiết đơn hàng / Mã sản phẩm</b> (tên), <b>Phân loại hạng mục</b>, <b>ĐVT</b>, <b>Số lượng / Khối lượng</b>, và <b>Phân bổ</b> (Nhà máy MDC · Thương mại · Thầu phụ). '
    + 'Dòng tiêu đề, dòng nhóm (Tầng/Phòng) và dòng tổng sẽ được bỏ qua. Nếu không có dòng tiêu đề, hệ đọc theo đúng thứ tự cột của file HĐ.</div>'
    + '<div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px">'
    + '<label class="btn btn-ghost" style="cursor:pointer">📂 Chọn file Excel / CSV<input type="file" accept=".xlsx,.xls,.xlsm,.csv,text/csv,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet,application/vnd.ms-excel" style="display:none" onchange="khhmImpFile(this)"></label>'
    + '</div>'
    + '<div id="khhmSheetPick"></div>'
    + '<textarea id="khhmImpTxt" placeholder="…hoặc dán bảng hạng mục ở đây (copy từ Excel/Google Sheet)…" style="width:100%;min-height:120px;border:1px solid var(--line-strong);border-radius:var(--r-sm);padding:9px;font-size:12px;font-family:monospace" oninput="khhmImpParse()"></textarea>'
    + '<div id="khhmImpPv" style="margin-top:10px"></div>';
  openModal('Nhập hạng mục từ hợp đồng', body, khhmImpConfirm);
  document.getElementById('modalSave').classList.add('hide');
}
function khhmImpFile(inputEl){
  const f=inputEl.files&&inputEl.files[0]; if(!f) return;
  const nm=(f.name||'').toLowerCase();
  const sp=document.getElementById('khhmSheetPick'); if(sp) sp.innerHTML='';
  if(/\.(xlsx|xls|xlsm)$/.test(nm)){
    if(typeof XLSX==='undefined'){ toast('Chưa nạp được thư viện đọc Excel — hãy dán trực tiếp', true); return; }
    const rd=new FileReader();
    rd.onload=()=>{ try{
        const wb=XLSX.read(new Uint8Array(rd.result), {type:'array'}); window.__khhmWb=wb;
        const names=wb.SheetNames||[]; if(!names.length){ throw new Error('File không có sheet nào'); }
        const nz=s=>vnorm(s);
        let def=names.find(n=>/hop dong|\bhd\b/.test(nz(n))) || names.find(n=>nz(n).indexOf('hd')>=0) || names[0];
        if(names.length>1){
          if(sp) sp.innerHTML='<div class="field" style="margin:2px 0 8px"><label style="font-size:12px;color:var(--ink-soft);font-weight:600">Chọn sheet chứa bảng hạng mục hợp đồng</label>'
            + '<select id="khhmSheetSel" onchange="khhmImpSheetPick()" style="border:1px solid var(--line-strong);border-radius:var(--r-sm);padding:7px 9px;font-size:12.5px">'
            + names.map(n=>'<option value="'+esc(n)+'"'+(n===def?' selected':'')+'>'+esc(n)+'</option>').join('')+'</select></div>';
        }
        khhmImpUseSheet(def);
      }catch(e){ const pv=document.getElementById('khhmImpPv'); if(pv) pv.innerHTML='<span class="tag t-bad">Không đọc được file Excel: '+esc(e.message||String(e))+'</span>'; }
    };
    rd.readAsArrayBuffer(f);
  } else {
    const rd=new FileReader();
    rd.onload=()=>{ const ta=document.getElementById('khhmImpTxt'); if(ta){ ta.value=rd.result; khhmImpParse(); } };
    rd.readAsText(f,'UTF-8');
  }
}
function khhmImpSheetPick(){ const s=document.getElementById('khhmSheetSel'); if(s) khhmImpUseSheet(s.value); }
function khhmImpUseSheet(name){
  const wb=window.__khhmWb; if(!wb||!wb.Sheets||!wb.Sheets[name]) return;
  let csv=''; try{ csv=XLSX.utils.sheet_to_csv(wb.Sheets[name], {FS:',', RS:'\n', blankrows:false}); }catch(e){ csv=''; }
  const ta=document.getElementById('khhmImpTxt'); if(ta){ ta.value=csv; khhmImpParse(); }
}
function khhmImpParse(){
  const ta=document.getElementById('khhmImpTxt'); const pv=document.getElementById('khhmImpPv'); if(!pv) return;
  const src=(ta?ta.value:'').trim();
  const saveBtn=document.getElementById('modalSave');
  if(!src){ pv.innerHTML=''; window.__khhmImp=null; if(saveBtn) saveBtn.classList.add('hide'); return; }
  let rows;
  if(src.indexOf('\t')>=0){ rows=src.split(/\r?\n/).map(l=>l.split('\t')); }
  else { try{ rows=parseCSV(src); }catch(e){ rows=src.split(/\r?\n/).map(l=>l.split(',')); } }
  rows=rows.filter(r=>r && r.some(c=>String(c).trim()!==''));
  if(!rows.length){ pv.innerHTML='<span class="tag t-bad">Không có dữ liệu</span>'; window.__khhmImp=null; if(saveBtn) saveBtn.classList.add('hide'); return; }
  const norm=s=>vnorm(s).replace(/[^a-z0-9]+/g,' ').trim();
  // Tìm DÒNG TIÊU ĐỀ = dòng có nhiều nhãn cột nhất (tránh nhầm dòng tựa "HẠNG MỤC NỘI THẤT")
  const HDRKEYS=['chi tiet don hang','ma san pham','phan loai','don vi tinh','dvt','so luong','khoi luong','phan bo','thanh tien','don gia','kich thuoc'];
  let hdr=-1, best=0;
  for(let i=0;i<Math.min(rows.length,8);i++){
    const H=rows[i].map(norm);
    const score=HDRKEYS.reduce((s,k)=>s+(H.some(h=>h.indexOf(k)>=0)?1:0),0);
    if(score>best){ best=score; hdr=i; }
  }
  if(best<2) hdr=-1;                                  // không đủ tin cậy → đọc theo thứ tự cột
  const positional = hdr<0;
  let idx={};
  if(!positional){
    // quét CẢ dòng tiêu đề + dòng tiêu đề phụ (Nhà máy/Thương mại/Thầu phụ, Dài/Rộng/Cao thường ở dòng dưới)
    const scan=[hdr, hdr+1];
    const findCol=(...keys)=>{ for(const ri of scan){ const H=(rows[ri]||[]).map(norm);
        for(let c=0;c<H.length;c++){ if(H[c] && keys.some(k=>H[c].indexOf(k)>=0)) return c; } } return -1; };
    idx.chiTiet=findCol('chi tiet don hang','chi tiet');
    idx.ma     =findCol('ma san pham','ma sp');
    idx.phanLoai=findCol('phan loai hang muc','phan loai');
    idx.dvt    =findCol('don vi tinh','dvt');
    idx.kl     =findCol('khoi luong');
    idx.sl     =findCol('so luong');
    idx.nm     =findCol('nha may','mdc');
    idx.tm     =findCol('thuong mai');
    idx.tp     =findCol('thau phu');
    if(idx.chiTiet<0 && idx.ma<0) hdr=-1;             // không thấy cột tên → chuyển sang positional
  }
  const posMode = hdr<0;
  const P={chiTiet:1, ma:2, dvt:7, kl:8, sl:9, dg:10, phanLoai:12, nm:13, tm:14, tp:15};
  const get=(row,key)=>{ let ci=posMode?P[key]:idx[key]; if(ci==null||ci<0) return ''; return String(row[ci]==null?'':row[ci]).trim(); };
  const start=posMode?0:hdr+1; const drafts=[];
  for(let r=start;r<rows.length;r++){
    const row=rows[r]; const maSp=get(row,'ma'), ct=get(row,'chiTiet'); let ten=maSp||ct;
    if(!ten) continue;
    const dvt=get(row,'dvt'), kl=get(row,'kl'), sl=get(row,'sl');
    if(!dvt && !sl && !kl) continue;                 // bỏ dòng nhóm/tổng (không có ĐVT/SL/KL)
    if(/^[\d.,\s\-]+$/.test(ten)) continue;          // bỏ dòng chỉ toàn số
    const phanLoai=get(row,'phanLoai');
    let phanBo=''; if(get(row,'nm')) phanBo='Nhà máy'; else if(get(row,'tm')) phanBo='Thương mại'; else if(get(row,'tp')) phanBo='Thầu phụ';
    drafts.push({ten, phanLoai, phanBo, dvt, sl:sl||kl});
  }
  window.__khhmImp=drafts;
  if(!drafts.length){ pv.innerHTML='<span class="tag t-bad">Không nhận diện được hạng mục nào — kiểm tra lại các cột.</span>'; if(saveBtn) saveBtn.classList.add('hide'); return; }
  let h='<div style="margin:2px 0 8px;font-size:13px"><b>'+drafts.length+'</b> hạng mục nhận diện '+(posMode?'<span class="muted">(đọc theo thứ tự cột file HĐ)</span>':'<span class="muted">(đọc theo tiêu đề cột)</span>')+'</div>';
  h+='<div class="tbl-wrap" style="max-height:260px;overflow:auto"><table class="tbl"><thead><tr><th>#</th><th>Tên hạng mục</th><th>Phân loại</th><th>Phân bổ</th><th>ĐVT</th><th>SL/KL</th></tr></thead><tbody>';
  drafts.forEach((d,i)=>{ h+='<tr><td class="muted">'+(i+1)+'</td><td>'+esc(d.ten)+'</td><td>'+esc(d.phanLoai)+'</td><td>'+esc(d.phanBo||'—')+'</td><td>'+esc(d.dvt)+'</td><td>'+esc(d.sl)+'</td></tr>'; });
  h+='</tbody></table></div><div class="muted" style="margin-top:8px">Bấm <b>Lưu</b> để thêm '+drafts.length+' hạng mục (nối tiếp danh sách hiện có).</div>';
  pv.innerHTML=h; if(saveBtn) saveBtn.classList.remove('hide');
}
function khhmImpConfirm(){
  const ma=window.__khhmImpMa; const drafts=window.__khhmImp||[];
  if(!ma||!drafts.length){ toast('Không có hạng mục để nhập', true); return; }

}
function khhmExportCsv(ma){

  const cols=khhmCols(); const head=['STT']; cols.forEach(c=>head.push(c.leaf));
  const out=[head];
  rows.forEach((r,i)=>{ const line=[i+1]; cols.forEach(c=>{ let v=(r[c.key]==null)?'':r[c.key]; if(c.t==='date'&&v) v=fmtDMY(v); line.push(v); }); out.push(line); });
  dlCsv(out, 'MDC_KeHoachHangMuc_'+(ma||'DA')+'_'+today()+'.csv');
  toast('✓ Đã xuất '+rows.length+' hạng mục ra Excel (CSV)');
}

  KHC_DEPTS.forEach(dp=>dp.cols.forEach(c=>head.push(dp.ten+' — '+c.leaf)));

    if(c.t==='calc'){ if(c.key==='htHD') return calc.htHD?fmtDMY(calc.htHD):''; if(c.key==='soNgayTH') return calc.soNgayTH; if(c.key==='soNgayCL') return calc.soNgayCL; return ''; }
    const v=khcVal(d,c); return c.t==='date'?fmtDMY(v):v;
  };
  const rows=[head];
  list.forEach((d,i)=>{
    const calc=khcCalc(d);

    KHC_CHUNG.forEach(c=>r.push(chungVal(d,c,calc)));
    KHC_KQHD.forEach(c=>r.push(khcVal(d,c)));

    }));
    rows.push(r);
  });
  dlCsv(rows, 'MDC_KeHoachChung_'+today()+'.csv');

function ksImportParse(inputEl){
  const file=inputEl.files&&inputEl.files[0]; if(!file) return;
  const pv=document.getElementById('ksImpPreview');
  const rd=new FileReader();
  rd.onload=()=>{
    let rows; try{ rows=parseCSV(rd.result); }catch(e){ pv.innerHTML='<span class="tag t-bad">Không đọc được file</span>'; return; }
    if(rows.length<2){ pv.innerHTML='<span class="tag t-bad">File rỗng hoặc thiếu dữ liệu</span>'; return; }
    const head=rows[0].map(h=>String(h).trim().toLowerCase());
    const norm=s=>vnorm(s).replace(/[^a-z0-9]+/g,' ').trim();
    const H=head.map(norm);
    const findByLabel=lab=>{ const t=norm(lab); return H.findIndex(h=>h===t || h.endsWith(' '+t) || h.endsWith(t)); };
    const iMa=H.findIndex(h=>h==='ma da'||h==='ma du an');
    const iTen=H.findIndex(h=>h.includes('ten du an'));
    if(iTen<0 && iMa<0){ pv.innerHTML='<span class="tag t-bad">Cần cột "Mã DA" hoặc "Tên dự án"</span>'; return; }
    // map từng cột thật → chỉ số
    const cols=khcAllCols().filter(c=>c.t!=='calc');
    const colIdx={}; cols.forEach(c=>{ const lab=(c.dept?c.dept+' — ':'')+c.leaf; let idx=findByLabel(lab); if(idx<0) idx=findByLabel(c.leaf); colIdx[c.key]=idx; });
    const g=(row,k)=> k>-1?String(row[k]||'').trim():'';
    const drafts=[]; let okN=0;
    for(let r=1;r<rows.length;r++){
      const row=rows[r]; const ten=g(row,iTen); const ma=g(row,iMa);
      if(!ten && !ma) continue;
      const vals={}; const errs=[];
      cols.forEach(c=>{ const idx=colIdx[c.key]; if(idx==null||idx<0) return; let raw=g(row,idx); if(raw==='') return;
        if(c.t==='date'){ const iso=impDate(raw); if(iso===null){ errs.push(c.leaf+' sai ngày'); return; } raw=iso; }
        vals[c.key]=raw; });
      const existed = ma && (S.duan||[]).some(x=>x['Mã DA']===ma);
      drafts.push({ma, ten, vals, existed:!!existed, errs});
      if(!errs.length) okN++;
    }
    window.__ksImp=drafts;
    let h='<div style="margin:6px 0 8px;font-size:13px"><b>'+drafts.length+'</b> dòng · <span style="color:#2E6B3E"><b>'+okN+'</b> hợp lệ</span>'+((drafts.length-okN)?' · <span style="color:#B23A2E"><b>'+(drafts.length-okN)+'</b> lỗi</span>':'')+'</div>';
    h+='<div class="tbl-wrap" style="max-height:300px;overflow:auto"><table class="tbl"><thead><tr><th>#</th><th>Tên/ Mã DA</th><th>Số ô có dữ liệu</th><th>Thao tác</th><th>Kiểm tra</th></tr></thead><tbody>';
    drafts.forEach((d,i)=>{ h+='<tr'+(d.errs.length?' style="background:#FDEEEC"':'')+'><td class="muted">'+(i+1)+'</td><td><b>'+esc(d.ten||'(theo Mã)')+'</b><div class="muted" style="font-size:11px">'+esc(d.ma||'(tạo mới)')+'</div></td><td>'+Object.keys(d.vals).length+'</td><td>'+(d.existed?'<span class="tag t-info">cập nhật</span>':(d.ma?'<span class="tag t-ok">tạo mới</span>':'<span class="tag t-ok">tạo mới</span>'))+'</td><td>'+(d.errs.length?'<span class="tag t-bad">'+esc(d.errs.join('; '))+'</span>':'<span class="tag t-ok">OK</span>')+'</td></tr>'; });
    h+='</tbody></table></div>';
    if(okN) h+='<div class="muted" style="margin-top:8px">Bấm <b>Lưu</b> để nhập <b>'+okN+'</b> dòng hợp lệ.</div>';
    pv.innerHTML=h;
    document.getElementById('modalSave').classList.toggle('hide', okN===0);
  };
  rd.readAsText(file,'UTF-8');
}

/* ================================================================
   ★ v2.3 — TỔNG QUAN ĐIỀU HÀNH DỰ ÁN
   Tiến độ · Dòng tiền · Trách nhiệm — trên một màn hình
================================================================ */
function dashPeriod(){ return window._dsKy || 'nam'; }
function dashInRange(dateStr){
  if(!dateStr) return false;
  const ky = dashPeriod(); if(ky==='all') return true;
  const d = new Date(dateStr), n = new Date();
  if(isNaN(d)) return false;
  if(ky==='thang') return d.getFullYear()===n.getFullYear() && d.getMonth()===n.getMonth();
  if(ky==='quy')   return d.getFullYear()===n.getFullYear() && Math.floor(d.getMonth()/3)===Math.floor(n.getMonth()/3);
  return d.getFullYear()===n.getFullYear();
}
function dashProj(){ return window._dsDA || ''; }
function dashFilterDA(arr){ const p = dashProj(); return p ? arr.filter(x=>x['Mã DA']===p) : arr; }

function vDashboard(){
  const P  = dashProj();
  const duan = dashFilterDA(visibleProjects());
  const cv   = dashFilterDA(visibleTasks());
  const cp   = dashFilterDA(visibleExpenses());
  const ps   = dashFilterDA(S.phatsinh||[]);
  const ms   = dashFilterDA(S.muasam||[]);
  const tt   = dashFilterDA(S.thanhtoan||[]);
  const ttp  = dashFilterDA(S.ttthauphu||[]);

  /* ---------- 6 KPI ---------- */
  const active  = duan.filter(d=>d['Trạng thái']==='Đang triển khai');
  const treHan  = active.filter(d=>d['Ngày kết thúc DK'] && daysLeft(d['Ngày kết thúc DK'])<0);
  const cvQuaHan= cv.filter(c=>c['Trạng thái']!=='Hoàn thành' && c['Hạn hoàn thành'] && daysLeft(c['Hạn hoàn thành'])<0);
  const daThu   = tt.filter(x=>dashInRange(x['Ngày thu'])).reduce((a,x)=>a+(Number(x['Đã thu (đ)'])||0),0);
  const daChi   = cp.filter(x=>dashInRange(x['Ngày chi'])).reduce((a,x)=>a+(Number(x['Số tiền (đ)'])||0),0)
                + ttp.filter(x=>x['Trạng thái']==='Đã thanh toán'&&dashInRange(x['Ngày thanh toán']))
                     .reduce((a,x)=>a+ttpChi(x),0);
  const rong    = daThu - daChi;

/* Thẻ "Ai đang gánh việc" — nhóm việc đang mở theo người phụ trách */
function dashResponsibility(cv){
  const map={};
  (cv||[]).filter(c=>c['Trạng thái']!=='Hoàn thành').forEach(c=>{ const n=c['Phụ trách']||'(chưa gán)';
    const g=(map[n]=map[n]||{n,tong:0,tre:0}); g.tong++;
    if(c['Hạn hoàn thành']&&daysLeft(c['Hạn hoàn thành'])<0) g.tre++; });
  const rows=Object.values(map).sort((a,b)=>b.tre-a.tre||b.tong-a.tong);
  let h='<div class="card"><div class="ct">Ai đang gánh việc<span class="ct-r">'+rows.length+' người</span></div>';
  if(!rows.length){ h+='<div class="empty" style="padding:22px 16px">Không có việc đang mở</div></div>'; return h; }
  h+='<div style="padding:4px 0">'+rows.slice(0,10).map(r=>
    '<div class="od" onclick="go(\'congviec\')"><div class="oi" style="background:var(--brass-soft);color:var(--brass-deep)">'+esc(iniOf(r.n))+'</div>'
    + '<div class="ot"><b>'+esc(r.n)+'</b><span>'+r.tong+' việc đang mở'+(r.tre?' · '+r.tre+' trễ hạn':'')+'</span></div>'
    + (r.tre?'<div class="ov" style="color:var(--bad)">'+r.tre+' trễ</div>':'')+'</div>').join('')+'</div></div>';
  return h;
}

/* Tiền thực chi cho 1 dòng thanh toán thầu phụ (trừ phần giữ lại) */
function ttpGiuLai(x){ return Math.round((Number(x['Giá trị (đ)'])||0) * (Number(x['Tỷ lệ giữ lại (%)'])||0) / 100); }
function ttpChi(x){ return (Number(x['Giá trị (đ)'])||0) - ttpGiuLai(x); }

/* ---------- Hàng chờ duyệt: gom từ mọi nguồn ---------- */
function dashQueue(){
  const me = user ? user['Họ tên'] : '';
  const canAp = meCanApprove();
  const q = [];
  dashFilterDA(S.phatsinh||[]).filter(x=>x['Trạng thái']==='Chờ xử lý'||x['Trạng thái']==='Đang thương lượng')
    .forEach(x=>q.push({t:'ps',lbl:'Phát sinh',ten:x['Mô tả'],v:Number(x['Giá trị (đ)'])||0,
      da:x['Mã DA'],code:x['Mã PS'],open:'formVariation',ok:'Đã chấp thuận',no:'Từ chối',field:'Trạng thái',act:'saveVariation',key:'Mã PS'}));
  dashFilterDA(S.muasam||[]).filter(x=>x['Trạng thái']==='Đang soạn'||x['Trạng thái']==='Đã gửi báo giá')
    .forEach(x=>q.push({t:'mua',lbl:'Đơn mua',ten:x['Hạng mục'],v:Number(x['Tổng tiền'])||0,
      da:x['Mã DA'],code:x['Mã MS'],open:'formPurchase',ok:'Đang đặt hàng',no:'Hủy',field:'Trạng thái',act:'savePurchase',key:'Mã MS'}));
  dashFilterDA(visibleExpenses()).filter(x=>(x['Trạng thái duyệt']||'Chờ duyệt')==='Chờ duyệt' && (!canAp||!x['Người duyệt được giao']||x['Người duyệt được giao']===me))
    .forEach(x=>q.push({t:'cp',lbl:'Chi phí',ten:x['Hạng mục'],v:Number(x['Số tiền (đ)'])||0,
      da:x['Mã DA'],code:x['Mã CP'],open:'formExpense',ok:'Đã duyệt',no:'Từ chối',field:'Trạng thái duyệt',act:'saveExpense',key:'Mã CP'}));
  dashFilterDA(visibleTasks()).filter(x=>x['Trạng thái']==='Chờ duyệt' && (!canAp||!x['Người duyệt được giao']||x['Người duyệt được giao']===me))
    .forEach(x=>q.push({t:'cv',lbl:'Công việc',ten:x['Tên công việc'],v:null,
      da:x['Mã DA'],code:x['Mã CV'],open:'formTask',ok:'Đã phê duyệt',no:'Từ chối',field:'Trạng thái',act:'saveTask',key:'Mã CV'}));
  dashFilterDA(S.ttthauphu||[]).filter(x=>x['Trạng thái']==='Đã nghiệm thu · chờ duyệt')
    .forEach(x=>q.push({t:'tp',lbl:'TT thầu phụ',ten:(x['Thầu phụ']||'')+(x['Hạng mục']?' — '+x['Hạng mục']:''),v:ttpChi(x),
      da:x['Mã DA'],code:x['Mã TTP'],open:'formSubPayment',ok:'Đã duyệt · chờ chi',no:'Chờ nghiệm thu',field:'Trạng thái',act:'saveSubPayment',key:'Mã TTP'}));
  return q.sort((a,b)=>(b.v||0)-(a.v||0));
}

function dashApprove(i, ok){
  const q = window.__aq || []; const x = q[i];
  if(!x) return;
  if(!meCanApprove()) return toast('Bạn không có quyền phê duyệt', true);
  const store_ = {ps:S.phatsinh, mua:S.muasam, cp:S.chiphi, cv:S.congviec, tp:S.ttthauphu}[x.t] || [];
  const rec = store_.find(r=>r[x.key]===x.code);
  if(!rec) return toast('Không tìm thấy bản ghi', true);
  rec[x.field] = ok ? x.ok : x.no;
  rec['Người duyệt'] = user['Họ tên']; rec['Ngày duyệt'] = today();
  const data = {}; data[x.key]=x.code; data[x.field]=rec[x.field];
  data['Người duyệt']=user['Họ tên']; data['Ngày duyệt']=today();
  pushOp(x.act, data);
  toast(ok?'✓ Đã duyệt: '+(x.ten||''):'✕ Đã từ chối: '+(x.ten||''));
}

/* ---------- Biểu đồ dòng tiền (SVG) ---------- */
function dashCashflow(tt, cp, ttp){
  const n = new Date(), Y = n.getFullYear();
  const nMonth = dashPeriod()==='thang' ? 1 : dashPeriod()==='quy' ? 3 : 12;
  const from = new Date(Y, n.getMonth()-(nMonth-1), 1);
  const months = [];
  for(let i=0;i<nMonth;i++){ const d=new Date(from.getFullYear(),from.getMonth()+i,1); months.push({y:d.getFullYear(),m:d.getMonth(),thu:0,chi:0}); }
  const idx = ds => { if(!ds) return -1; const d=new Date(ds); if(isNaN(d)) return -1;
    return months.findIndex(x=>x.y===d.getFullYear()&&x.m===d.getMonth()); };
  tt.forEach(x=>{ const i=idx(x['Ngày thu']); if(i>-1) months[i].thu += Number(x['Đã thu (đ)'])||0; });
  cp.forEach(x=>{ const i=idx(x['Ngày chi']); if(i>-1) months[i].chi += Number(x['Số tiền (đ)'])||0; });
  ttp.filter(x=>x['Trạng thái']==='Đã thanh toán').forEach(x=>{ const i=idx(x['Ngày thanh toán']); if(i>-1) months[i].chi += ttpChi(x); });

  const hasData = months.some(m=>m.thu||m.chi);
  let h = '<div class="card"><div class="ct">Dòng tiền theo tháng<span class="ct-r">'
    + (dashPeriod()==='thang'?'Tháng này':dashPeriod()==='quy'?'Quý này':'Năm '+Y)+'</span></div>'
    + '<div class="cf-legend" style="padding-top:10px">'
    + '<span><i style="background:var(--ok)"></i>Đã thu</span>'
    + '<span><i style="background:var(--bad)"></i>Đã chi</span>'
    + '<span><i style="background:var(--brass-deep)"></i>Ròng</span></div>';
  if(!hasData){
    h += '<div class="empty" style="padding:30px 18px"><b>Chưa có dữ liệu dòng tiền</b>'
       + 'Ghi <b>đợt thu tiền</b> ở mục Tài chính dự án và <b>chi phí</b> để biểu đồ hiển thị.</div></div>';
    return h;
  }
  const W = Math.max(560, months.length*78), H = 190, PL = 52, PR = 14, PT = 12, PB = 26;
  const iw = W-PL-PR, ih = H-PT-PB;
  const vals = months.flatMap(m=>[m.thu, m.chi, m.thu-m.chi]);
  const vmax = Math.max(...vals, 1), vmin = Math.min(...vals, 0);
  const span = (vmax-vmin)||1;
  const X = i => PL + (months.length===1 ? iw/2 : i*iw/(months.length-1));
  const Yc = v => PT + ih - (v-vmin)/span*ih;
  const line = key => months.map((m,i)=>{
    const v = key==='rong' ? m.thu-m.chi : m[key];
    return (i?'L':'M')+X(i).toFixed(1)+' '+Yc(v).toFixed(1);
  }).join(' ');
  const dots = (key,color) => months.map((m,i)=>{
    const v = key==='rong' ? m.thu-m.chi : m[key];
    return '<circle cx="'+X(i).toFixed(1)+'" cy="'+Yc(v).toFixed(1)+'" r="3" fill="'+color+'"><title>T'+(m.m+1)+': '+fmtTr(v)+'</title></circle>';
  }).join('');
  // lưới ngang
  let grid = '', ticks = 4;
  for(let i=0;i<=ticks;i++){
    const v = vmin + span*i/ticks, y = Yc(v);
    grid += '<line x1="'+PL+'" y1="'+y.toFixed(1)+'" x2="'+(W-PR)+'" y2="'+y.toFixed(1)+'" stroke="#F1EBE0" stroke-width="1"/>'
          + '<text x="'+(PL-6)+'" y="'+(y+3.5).toFixed(1)+'" text-anchor="end" font-size="9" fill="#9A8F82">'+fmtTr(v).replace(' đ','')+'</text>';
  }
  const zeroY = Yc(0);
  h += '<div class="cf-wrap"><svg viewBox="0 0 '+W+' '+H+'" style="width:100%;min-width:'+W+'px;height:'+H+'px">'
    + grid
    + (vmin<0?'<line x1="'+PL+'" y1="'+zeroY.toFixed(1)+'" x2="'+(W-PR)+'" y2="'+zeroY.toFixed(1)+'" stroke="#C9BFB2" stroke-width="1.2" stroke-dasharray="3 3"/>':'')
    + '<path d="'+line('thu')+'" fill="none" stroke="#4B7A3F" stroke-width="2" stroke-linejoin="round"/>'
    + '<path d="'+line('chi')+'" fill="none" stroke="#B3261E" stroke-width="2" stroke-linejoin="round"/>'
    + '<path d="'+line('rong')+'" fill="none" stroke="#8A6522" stroke-width="2.4" stroke-linejoin="round" stroke-dasharray="5 3"/>'
    + dots('thu','#4B7A3F') + dots('chi','#B3261E') + dots('rong','#8A6522')
    + months.map((m,i)=>'<text x="'+X(i).toFixed(1)+'" y="'+(H-8)+'" text-anchor="middle" font-size="10" fill="#6F6355">T'+(m.m+1)+'</text>').join('')
    + '</svg></div></div>';
  return h;
}

/* ---------- Thanh toán thầu phụ ---------- */
function dashSubPay(ttp){
  const b1 = ttp.filter(x=>x['Trạng thái']==='Chờ nghiệm thu').reduce((a,x)=>a+(Number(x['Giá trị (đ)'])||0),0);
  const b2 = ttp.filter(x=>x['Trạng thái']==='Đã nghiệm thu · chờ duyệt').reduce((a,x)=>a+(Number(x['Giá trị (đ)'])||0),0);
  const b2b= ttp.filter(x=>x['Trạng thái']==='Đã duyệt · chờ chi').reduce((a,x)=>a+ttpChi(x),0);
  const b3 = ttp.filter(x=>x['Trạng thái']==='Đã thanh toán').reduce((a,x)=>a+ttpChi(x),0);
  const b4 = ttp.filter(x=>x['Trạng thái']==='Đã thanh toán').reduce((a,x)=>a+ttpGiuLai(x),0);
  const tot = b1+b2+b2b+b3+b4 || 1;
  const w = v => (v/tot*100).toFixed(1)+'%';
  let h = '<div class="card"><div class="ct">Thanh toán thầu phụ</div>';
  if(!ttp.length){
    return h + '<div class="empty" style="padding:26px 16px"><b>Chưa có dữ liệu</b>'
      + 'Ghi nhận đợt thanh toán thầu phụ để theo dõi nghiệm thu → duyệt → chi.<br>'
      + '<button class="btn btn-ghost" style="margin-top:10px" onclick="formSubPayment()">+ Thêm đợt thanh toán</button></div></div>';
  }
  h += '<div style="margin-top:6px">'
    + dlRow('#B0BEC5','Chờ nghiệm thu', b1)
    + dlRow('#E8A33D','Đã nghiệm thu · chờ duyệt', b2)
    + (b2b?dlRow('#3A6EA5','Đã duyệt · chờ chi', b2b):'')
    + dlRow('#4B7A3F','Đã thanh toán', b3)
    + dlRow('#7E57C2','Giữ lại (retention)', b4)
    + '</div>'
    + '<div class="stack">'
    + '<i style="width:'+w(b1)+';background:#B0BEC5"></i>'
    + '<i style="width:'+w(b2)+';background:#E8A33D"></i>'
    + '<i style="width:'+w(b2b)+';background:#3A6EA5"></i>'
    + '<i style="width:'+w(b3)+';background:#4B7A3F"></i>'
    + '<i style="width:'+w(b4)+';background:#7E57C2"></i></div>'
    + '<div class="rule">Quy tắc: <b>chưa nghiệm thu → không có đề nghị → không chi.</b> Phần giữ lại được hoàn sau khi hết hạn bảo hành.</div></div>';
  return h;
}
function dlRow(color, lbl, v){
  return '<div class="dl"><span class="dot" style="background:'+color+'"></span>'+lbl+'<span class="dl-v">'+fmtTr(v)+'</span></div>';
}

/* ---------- Sử dụng ngân sách (donut) ---------- */
function dashBudget(duan, cp, ttp){
  const ns = duan.reduce((a,d)=>a+(Number(d['Ngân sách (đ)'])||0),0);
  const chiCP = cp.reduce((a,x)=>a+(Number(x['Số tiền (đ)'])||0),0);
  const chiTP = ttp.filter(x=>x['Trạng thái']==='Đã thanh toán').reduce((a,x)=>a+ttpChi(x),0);
  const chi = chiCP + chiTP;
  const conlai = ns - chi;
  const pct = ns ? Math.min(100, Math.round(chi/ns*100)) : 0;
  // dự án nguy cơ vượt >90%
  const nguyco = duan.filter(d=>{
    const b = Number(d['Ngân sách (đ)'])||0; if(!b) return false;

/* ---------- Công nợ ---------- */
function dashDebt(tt, ms, ttp){
  const phaiThu = tt.reduce((a,x)=>a+Math.max(0,(Number(x['Giá trị (đ)'])||0)-(Number(x['Đã thu (đ)'])||0)),0);
  const phaiTraMS = ms.filter(x=>x['Trạng thái']==='Đã nhận').reduce((a,x)=>a+(Number(x['Tổng tiền'])||0),0);
  const phaiTraTP = ttp.filter(x=>x['Trạng thái']==='Đã duyệt · chờ chi').reduce((a,x)=>a+ttpChi(x),0);
  const phaiTra = phaiTraMS + phaiTraTP;
  let h = '<div class="card"><div class="ct">Công nợ<span class="ct-r">phải thu / phải trả</span></div>'
    + '<div style="margin-top:8px">'
    + '<div class="debt" onclick="go(\'taichinh\')" style="cursor:pointer">'
    + '<div class="di in">↙</div><div class="dtx"><b>Phải thu (Chủ đầu tư)</b><span>Khách hàng chưa thanh toán</span></div>'
    + '<div class="dv" style="color:var(--ok)">'+fmtTr(phaiThu)+'</div></div>'
    + '<div class="debt" onclick="go(\'muasam\')" style="cursor:pointer">'
    + '<div class="di out">↗</div><div class="dtx"><b>Phải trả (NCC & thầu phụ)</b><span>Mình còn nợ đối tác</span></div>'
    + '<div class="dv" style="color:var(--bad)">'+fmtTr(phaiTra)+'</div></div>'
    + '</div>';
  const net = phaiThu - phaiTra;
  h += '<div class="rule">Chênh lệch ròng: <b style="color:'+(net>=0?'var(--ok)':'var(--bad)')+'">'+(net>=0?'+':'')+fmtTr(net)+'</b>'
     + (phaiTraTP?' · trong đó '+fmtTr(phaiTraTP)+' đã duyệt chờ chi cho thầu phụ':'')+'</div></div>';
  return h;
}

/* ---------- Đợt thu đến hạn ≤ 7 ngày ---------- */
function dashDueSoon(tt){
  const list = tt.filter(x=>{
    const con = (Number(x['Giá trị (đ)'])||0)-(Number(x['Đã thu (đ)'])||0);
    if(con<=0 || x['Trạng thái']==='Hủy') return false;
    const dl = daysLeft(x['Ngày đến hạn']);
    return dl!==null && dl>=0 && dl<=7;
  }).sort((a,b)=>(a['Ngày đến hạn']>b['Ngày đến hạn']?1:-1));
  let h = '<div class="card"><div class="ct">Thu tiền theo hợp đồng</div>'
    + '<div style="padding:10px 18px 0;font-size:10.5px;font-weight:700;letter-spacing:.5px;color:var(--ink-faint);text-transform:uppercase">'
    + 'Đợt thanh toán đến hạn ≤ 7 ngày ('+list.length+')</div>';
  if(!list.length){
    h += '<div style="padding:16px 18px;color:var(--ink-soft);font-size:13px">Không có đợt nào chờ xử lý.</div>';
  } else {
    h += list.map(x=>{
      const con = (Number(x['Giá trị (đ)'])||0)-(Number(x['Đã thu (đ)'])||0);
      const dl = daysLeft(x['Ngày đến hạn']);
      return '<div class="od" onclick="formPayment(\''+esc(x['Mã TT'])+'\')">'
        + '<div class="oi" style="background:var(--warn-bg);color:var(--warn)">◷</div>'
        + '<div class="ot"><b>'+esc(x['Tên đợt']||'Đợt thu')+'</b>'
        + '<span>'+esc(projName(x['Mã DA']))+' · hạn '+esc(x['Ngày đến hạn'])+' · '+(dl===0?'hôm nay':'còn '+dl+' ngày')+'</span></div>'
        + '<div class="ov">'+fmtTr(con)+'</div></div>';
    }).join('');
  }
  h += '<div style="padding:10px 18px;border-top:1px solid var(--line)">'
    + '<button class="btn btn-ghost" style="padding:6px 12px;font-size:12.5px" onclick="formPayment()">+ Thêm đợt thu tiền</button></div></div>';
  return h;
}

/* ---------- Công nợ phải thu quá hạn ---------- */
function dashOverdue(tt){
  const list = tt.filter(x=>{
    const con = (Number(x['Giá trị (đ)'])||0)-(Number(x['Đã thu (đ)'])||0);
    if(con<=0 || x['Trạng thái']==='Hủy') return false;
    const dl = daysLeft(x['Ngày đến hạn']);
    return dl!==null && dl<0;
  }).sort((a,b)=>(a['Ngày đến hạn']>b['Ngày đến hạn']?1:-1));
  const tong = list.reduce((a,x)=>a+((Number(x['Giá trị (đ)'])||0)-(Number(x['Đã thu (đ)'])||0)),0);
  let h = '<div class="card"><div class="ct" style="'+(list.length?'':'')+'">Công nợ phải thu quá hạn'
    + '<span class="ct-r">'+(list.length?fmtTr(tong):'không có')+'</span></div>';
  if(!list.length){
    h += '<div class="empty" style="padding:26px 16px">Không có công nợ quá hạn 🎉</div></div>';
    return h;
  }
  h += '<div style="margin-top:6px">' + list.map(x=>{
    const con = (Number(x['Giá trị (đ)'])||0)-(Number(x['Đã thu (đ)'])||0);
    const tre = Math.abs(daysLeft(x['Ngày đến hạn']));
    const dp = (Number(x['Đã thu (đ)'])||0)>0;
    return '<div class="od" onclick="formPayment(\''+esc(x['Mã TT'])+'\')">'
      + '<div class="oi">⚠</div>'
      + '<div class="ot"><b>'+esc(projName(x['Mã DA']))+' — '+esc(x['Tên đợt']||'đợt thu')+'</b>'
      + '<span>Hạn '+esc(x['Ngày đến hạn'])+' · trễ '+tre+' ngày · '+(dp?'đã thu một phần':'còn thiếu')+'</span></div>'
      + '<div class="ov" style="color:var(--bad)">'+fmtTr(con)+'</div></div>';
  }).join('') + '</div></div>';
  return h;
}

function kpi(lbl,val,hint,cls){ return '<div class="kpi '+(cls||'')+'"><div class="lbl">'+lbl+'</div><div class="val">'+val+'</div><div class="hint">'+hint+'</div></div>'; }
function projName(code){ const d = S.duan.find(x=>x['Mã DA']===code); return d ? d['Tên dự án'] : (code||'—'); }

// % tiến độ TỰ TÍNH từ số công việc đã hoàn thành của dự án
function projAutoProgress(code){
  const cv = tvSong(S.congviec).filter(c=>c['Mã DA']===code);
  if(!cv.length) return null; // chưa có việc → dùng số nhập tay
  const done = cv.filter(c=>c['Trạng thái']==='Hoàn thành').length;
  return { pct: Math.round(done/cv.length*100), done, total: cv.length };
}
// Số việc trễ hạn của dự án
function projOverdueCount(code){
  return tvSong(S.congviec).filter(c=>c['Mã DA']===code && c['Trạng thái']!=='Hoàn thành'
    && c['Hạn hoàn thành'] && daysLeft(c['Hạn hoàn thành'])<0).length;
}

function projIsRisk(d){
  const chi=projCost(d['Mã DA']).tong; const ns=Number(d['Ngân sách (đ)'])||0;
  return (ns>0 && chi>ns) || projOverdueCount(d['Mã DA'])>0;
}
function vProjects(){

    + '</div>';

  const myDuan = visibleProjects();
  const q=(window._fp||'').toLowerCase(), loai=window._fpLoai||'', pill=window._fpPill||'all';
  const total=myDuan.length;

  const nCB=myDuan.filter(d=>!tvSong(S.congviec).some(c=>c['Mã DA']===d['Mã DA'])).length;

  // Header

    + (canNew?'<button class="btn btn-brass" onclick="formProject()">+ Tạo dự án</button>':'')+'</div>';
  html += leadSection();
  // KPI
  html+='<div class="kpis">'
    + kpi('Tổng dự án', total, nCB+' đang chuẩn bị')
    + kpi('Đang triển khai', nTrien, 'trên tổng '+total+' dự án','accent')
    + kpi('Rủi ro cao', nRisk, nRisk?'vượt ngân sách / có việc trễ':'không có dự án rủi ro cao', nRisk?'bad':'')
    + kpi('Hoàn thành / bàn giao', nDone, 'đã nghiệm thu / đóng')
    + '</div>';
  // Bộ lọc: pills + tìm + loại dự án
  const loaiList=[...new Set(myDuan.map(d=>d['Loại hình']).filter(Boolean))];
  html+='<div class="cv-filter">'
    + '<button class="cv-pill'+(pill==='all'?' on':'')+'" onclick="window._fpPill=\'all\';render()">Tất cả ('+total+')</button>'
    + '<button class="cv-pill'+(pill==='trienkhai'?' on':'')+'" onclick="window._fpPill=\'trienkhai\';render()">Đang triển khai ('+nTrien+')</button>'
    + '<button class="cv-pill'+(pill==='rui'?' on':'')+'" onclick="window._fpPill=\'rui\';render()">Rủi ro cao ('+nRisk+')</button>'
    + '<input id="fProj" placeholder="🔍 Tìm dự án, khách hàng…" value="'+esc(window._fp||'')+'" onchange="window._fp=this.value;render()" style="min-width:180px">'
    + '<span style="margin-left:auto;display:inline-flex;align-items:center;gap:6px"><span class="muted" style="font-size:12px">LOẠI DỰ ÁN</span>'
      + '<select onchange="window._fpLoai=this.value;render()"><option value="">Tất cả ('+total+')</option>'+loaiList.map(l=>'<option'+(loai===l?' selected':'')+'>'+esc(l)+'</option>').join('')+'</select></span>'
    + '</div>';
  let list=myDuan.filter(d=>
    (!q || (String(d['Tên dự án'])+' '+String(d['Khách hàng']||'')).toLowerCase().includes(q))
    && (!loai || d['Loại hình']===loai)
    && (pill==='all' || (pill==='trienkhai' ? d['Trạng thái']==='Đang triển khai' : projIsRisk(d)))
  );

    : '<div class="empty"><b>Không có dự án phù hợp</b>'+(capBacRank_(user['Vai trò'])==='nhanvien'?'Bạn chỉ thấy dự án được phân làm thành viên.':'Đổi bộ lọc hoặc bấm "+ Tạo dự án"')+'</div>';
  return html;
}

/* ===== Tổng quan Công việc: donut trạng thái + lịch theo hạn ===== */
function cvOverview(list){
  const total=list.length;
  const cnt=KB_COLS.map((col,i)=>list.filter(c=>kbColOf(c['Trạng thái'])===i).length);
  const colors=['#8A8175','#2F6DB5','#C0392B','#E0A82E','#4E9A51'];
  const labels=['Chưa bắt đầu','Đang thực hiện','Đang vướng','Chờ duyệt','Hoàn thành'];
  let acc=0; const stops=[];
  cnt.forEach((n,i)=>{ if(total>0 && n>0){ const a=n/total*100; stops.push(colors[i]+' '+acc.toFixed(3)+'% '+(acc+a).toFixed(3)+'%'); acc+=a; } });
  const donut='<div class="cv-donut" style="background:'+(stops.length?'conic-gradient('+stops.join(',')+')':'#E5E1D8')+'"><div class="cv-donut-hole"><div class="n">'+total+'</div><div class="l">việc</div></div></div>';
  let cards=''; labels.forEach((lb,i)=>{const pct=total?Math.round(cnt[i]/total*100):0;
    cards+='<div class="cv-scard" style="border-left-color:'+colors[i]+'"><div class="t"><span class="dot" style="background:'+colors[i]+'"></span>'+lb+'</div><div class="v">'+cnt[i]+' <span>'+pct+'%</span></div></div>';});
  const left='<div class="cv-ovpanel"><h3>Tình trạng công việc</h3><div class="cv-ovbody">'+donut+'<div class="cv-scards">'+cards+'</div></div></div>';
  const right='<div class="cv-ovpanel">'+cvCalendar(list)+'</div>';
  return '<div class="cv-overview">'+left+right+'</div>';
}
function cvCalendar(list){
  const now=new Date(today());
  const cm=window._calM || (now.getFullYear()+'-'+String(now.getMonth()+1).padStart(2,'0'));
  const Y=+cm.split('-')[0], M=+cm.split('-')[1];
  const first=new Date(Y,M-1,1); const offset=(first.getDay()+6)%7; // Thứ 2 đầu tuần
  const dim=new Date(Y,M,0).getDate(); const todayStr=today();
  const due={};
  list.forEach(c=>{ const h=c['Hạn hoàn thành']; if(!h||!String(h).startsWith(cm)) return;
    const day=+String(h).split('-')[2]; const done=c['Trạng thái']==='Hoàn thành'; const dl=daysLeft(h);
    const st=done?'done':(dl<0?'late':'up');
    (due[day]=due[day]||{late:0,up:0,done:0,items:[]}); due[day][st]++; due[day].items.push(c); });
  let cells=''; for(let i=0;i<offset;i++) cells+='<div class="cal-day off"></div>';
  for(let d=1; d<=dim; d++){
    const ds=Y+'-'+String(M).padStart(2,'0')+'-'+String(d).padStart(2,'0');
    const info=due[d]; const isToday=ds===todayStr; const sel=window._calDay===ds;
    let dot=''; if(info){ const cls=info.late?'late':(info.up?'up':'done'); dot='<span class="cal-dot '+cls+'">'+info.items.length+'</span>'; }
    cells+='<div class="cal-day'+(isToday?' today':'')+(sel?' sel':'')+(info?' has':'')+'" onclick="window._calDay='+(sel?'null':'\''+ds+'\'')+';render()"><span class="d">'+d+'</span>'+dot+'</div>';
  }
  const dows=['T2','T3','T4','T5','T6','T7','CN'];
  const head='<div class="cal-hd"><b>Tháng '+M+'/'+Y+'</b><span class="cal-nav"><button onclick="cvCalNav(0)">Hôm nay</button><button onclick="cvCalNav(-1)">‹</button><button onclick="cvCalNav(1)">›</button></span></div>';
  const grid='<div class="cal-dows">'+dows.map(x=>'<span>'+x+'</span>').join('')+'</div><div class="cal-grid">'+cells+'</div>';
  const legend='<div class="cal-legend"><span><i class="late"></i>Quá hạn</span><span><i class="up"></i>Đang tới</span><span><i class="done"></i>Đã xong</span></div>';
  let selHtml;
  const selDay=window._calDay && String(window._calDay).startsWith(cm) ? due[+String(window._calDay).split('-')[2]] : null;
  if(selDay){ selHtml='<div class="cal-sel"><b>'+fmtDMY(window._calDay)+' — '+selDay.items.length+' việc</b>'
      + selDay.items.map(c=>'<div class="cal-selrow" onclick="formTask(\''+esc(c['Mã CV'])+'\')">'+tagTT(c['Trạng thái'])+'<span>'+esc(c['Tên công việc'])+'</span></div>').join('')+'</div>';
  } else { selHtml='<div class="cal-hint">Bấm một ngày để xem đầu việc. Ngày có tô màu là ngày có việc đến hạn.</div>'; }
  return '<h3>Lịch công việc <span class="muted" style="font-weight:400;font-size:12px">(theo hạn)</span></h3>'+head+grid+legend+selHtml;
}
function cvCalNav(dir){
  if(dir===0){ window._calM=null; render(); return; }
  const now=new Date(today());
  const cm=window._calM || (now.getFullYear()+'-'+String(now.getMonth()+1).padStart(2,'0'));
  let Y=+cm.split('-')[0], M=+cm.split('-')[1]+dir;
  if(M<1){M=12;Y--;} if(M>12){M=1;Y++;}
  window._calM=Y+'-'+String(M).padStart(2,'0'); render();
}

function csvLine(arr){ return arr.map(c=>'"'+String(c==null?'':c).replace(/"/g,'""')+'"').join(','); }
function dlCsv(rows, name){
  const csv = '\uFEFF' + rows.map(csvLine).join('\r\n');

function parseCSV(text){
  const rows=[]; let row=[], cur='', q=false; text=String(text).replace(/^\uFEFF/,'');
  for(let i=0;i<text.length;i++){ const ch=text[i];
    if(q){ if(ch==='"'){ if(text[i+1]==='"'){cur+='"';i++;} else q=false; } else cur+=ch; }
    else if(ch==='"') q=true;
    else if(ch===','){ row.push(cur); cur=''; }
    else if(ch==='\n'){ row.push(cur); rows.push(row); row=[]; cur=''; }
    else if(ch==='\r'){ /* bỏ qua */ }
    else cur+=ch; }
  if(cur!==''||row.length){ row.push(cur); rows.push(row); }
  return rows.filter(r=>r.some(c=>String(c).trim()!==''));
}
function impDate(s){ s=String(s||'').trim(); if(!s) return '';
  let y,mo,da, m=s.match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{4})$/);
  if(m){ da=+m[1]; mo=+m[2]; y=+m[3]; }
  else { m=s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})$/); if(!m) return null; y=+m[1]; mo=+m[2]; da=+m[3]; }
  if(mo<1||mo>12||da<1||da>31) return null;
  const dt=new Date(y, mo-1, da);
  if(dt.getFullYear()!==y||dt.getMonth()!==mo-1||dt.getDate()!==da) return null; // loại ngày không tồn tại (vd 31/02)
  return y+'-'+String(mo).padStart(2,'0')+'-'+String(da).padStart(2,'0'); }
function impUT(s){ s=String(s||'').trim().toLowerCase();
  if(s==='cao') return 'Cao'; if(s==='thấp'||s==='thap') return 'Thấp';
  if(s==='tb'||s==='trung bình'||s==='trung binh'||s==='') return 'Trung bình';
  return UU_TIEN.includes(String(s))?String(s):'Trung bình'; }
function impTT(s){ s=String(s||'').trim(); return TT_CV.includes(s)?s:'Chưa bắt đầu'; }
function taskImportParse(inputEl){
  const file = inputEl.files && inputEl.files[0]; if(!file) return;
  const pv = document.getElementById('impPreview');
  const rd = new FileReader();
  rd.onload = () => {
    let rows; try { rows = parseCSV(rd.result); } catch(e){ pv.innerHTML='<span class="tag t-bad">Không đọc được file</span>'; return; }
    if(rows.length < 2){ pv.innerHTML='<span class="tag t-bad">File rỗng hoặc thiếu dòng dữ liệu</span>'; return; }
    const head = rows[0].map(h=>String(h).trim().toLowerCase());
    const find = names => head.findIndex(h => names.some(n=>h.includes(n)));
    const iGD=find(['giai đoạn','giai doan','hạng mục','hang muc']);
    const iTen=find(['tên đầu việc','tên công việc','ten cong viec','ten dau viec','tên việc']);
    const iPT=find(['phụ trách','phu trach','người phụ']);
    const iBD=find(['ngày bắt đầu','bat dau','bắt đầu']);
    const iHan=find(['hạn hoàn thành','han hoan thanh','hạn','deadline']);
    const iUT=find(['ưu tiên','uu tien']);
    const iTT=find(['trạng thái','trang thai']);
    const iTD=find(['tiến độ','tien do','%']);
    const iGC=find(['ghi chú','ghi chu','mô tả','mo ta','định nghĩa','dinh nghia']);
    if(iTen<0){ pv.innerHTML='<span class="tag t-bad">Không tìm thấy cột "Tên công việc / Tên đầu việc"</span>'; return; }
    const g=(row,k)=> k>-1 ? String(row[k]||'').trim() : '';
    const drafts=[]; let okN=0;
    for(let r=1;r<rows.length;r++){ const row=rows[r]; const ten=g(row,iTen); if(!ten) continue;
      const bd=iBD>-1?impDate(g(row,iBD)):''; const han=iHan>-1?impDate(g(row,iHan)):'';

// Đường găng: tìm chuỗi phụ thuộc dài nhất (theo tổng số ngày) → các việc trên chuỗi là "đường găng"
function ganttCritical(tasks){
  const byId={}; tasks.forEach(t=>byId[t['Mã CV']]=t);
  const dur=t=>{ if(t && t['Ngày bắt đầu'] && t['Hạn hoàn thành']){ const d=Math.round((new Date(t['Hạn hoàn thành'])-new Date(t['Ngày bắt đầu']))/86400000)+1; return Math.max(1,d);} return 1; };
  const preds=t=>String(t['Việc trước']||'').split(',').map(s=>s.trim()).filter(x=>x&&byId[x]);
  const memo={}, from={}, stack={};
  function longest(id){ if(memo[id]!=null) return memo[id]; if(stack[id]) return dur(byId[id]); stack[id]=1;
    const t=byId[id]; let best=dur(t), bp=null;
    preds(t).forEach(p=>{ const v=longest(p)+dur(t); if(v>best){best=v;bp=p;} });
    stack[id]=0; from[id]=bp; memo[id]=best; return best; }
  let hasDep=false; tasks.forEach(t=>{ if(preds(t).length) hasDep=true; longest(t['Mã CV']); });
  const crit=new Set(); if(!hasDep) return crit; // không khai báo phụ thuộc → không vẽ đường găng
  let endId=null,mx=-1; tasks.forEach(t=>{ const v=memo[t['Mã CV']]||0; if(v>mx){mx=v;endId=t['Mã CV'];} });
  let cur=endId; const guard=new Set(); while(cur && !guard.has(cur)){ guard.add(cur); crit.add(cur); cur=from[cur]; }
  return crit;
}
function vGantt(){
  const myDuan = visibleProjects();
  const myCV = visibleTasks();
  const layer = window._gLayer || 'both';
  let html = '<div class="toolbar g-toolbar"><select id="gProj" onchange="window._gp=this.value;render()">'
    + '<option value="">— Chọn dự án để xem Gantt —</option>'
    + myDuan.map(d=>'<option value="'+d['Mã DA']+'"'+(window._gp===d['Mã DA']?' selected':'')+'>'+esc(d['Tên dự án'])+'</option>').join('') + '</select>'
    + (window._gp ? '<span class="g-toggle"><span class="muted" style="font-size:11.5px">Lớp:</span>'
        + '<button class="'+(layer==='both'?'on':'')+'" onclick="gLayer(\'both\')">Kế hoạch + Thực tế</button>'
        + '<button class="'+(layer==='plan'?'on':'')+'" onclick="gLayer(\'plan\')">Kế hoạch</button>'

        + '<button onclick="printGantt()" style="border-color:var(--brass-deep);color:var(--brass-deep);font-weight:600">⎙ Xuất PDF</button>'
        + '</span>' : '')
    + '</div>';

  if(!window._gp) {
    return html + '<div class="empty"><b>Chọn 1 dự án ở trên</b>Gantt sẽ vẽ thanh tiến độ cho tất cả công việc theo timeline. Mỗi việc 1 thanh ngang — xưởng & công trường chạy song song nhìn thấy ngay.</div>';
  }
  const proj = myDuan.find(d => d['Mã DA']===window._gp);
  if(!proj) { window._gp=''; return html; }

  const tasks = myCV.filter(c => c['Mã DA']===window._gp);
  if(!tasks.length) return html + '<div class="card-body"><div class="empty"><b>Dự án này chưa có công việc</b>Vào trang Công việc, bấm "+ Thêm mới"</div></div>';

  // ---- Phụ thuộc công việc & đường găng (critical path) ----
  const gById = {}; tasks.forEach(t=>gById[t['Mã CV']]=t);
  const gDeps = t => String(t['Việc trước']||'').split(',').map(s=>s.trim()).filter(x=>x && gById[x]);
  const critSet = ganttCritical(tasks);
  const gBlocked = t => gDeps(t).some(pid => gById[pid] && gById[pid]['Trạng thái']!=='Hoàn thành');

  // Tính range thời gian: từ min(Ngày bắt đầu) → max(Hạn hoàn thành)
  const dates = [];
  tasks.forEach(t => { if(t['Ngày bắt đầu']) dates.push(new Date(t['Ngày bắt đầu'])); if(t['Hạn hoàn thành']) dates.push(new Date(t['Hạn hoàn thành'])); });
  if(proj['Ngày bắt đầu']) dates.push(new Date(proj['Ngày bắt đầu']));
  if(proj['Ngày kết thúc DK']) dates.push(new Date(proj['Ngày kết thúc DK']));
  if(!dates.length) return html + '<div class="empty"><b>Công việc chưa có ngày</b>Cần đặt Ngày bắt đầu + Hạn hoàn thành cho từng việc</div>';
  let minD = new Date(Math.min(...dates)), maxD = new Date(Math.max(...dates));
  // Đệm trước 2 ngày, sau 2 ngày
  minD.setDate(minD.getDate()-2); maxD.setDate(maxD.getDate()+2);
  const totalDays = Math.max(1, Math.round((maxD - minD)/86400000));
  const dayW = totalDays <= 30 ? 28 : totalDays <= 90 ? 14 : totalDays <= 180 ? 8 : 5; // px/ngày
  const colDay = dayW + 'px';

  // Render header: dải THÁNG (trên) + hàng NGÀY (dưới)
  let headerDays = '';
  const months = {};
  const THU = ['CN','T2','T3','T4','T5','T6','T7'];
  const showThu = dayW >= 20; // đủ rộng mới hiện thứ
  for(let i=0; i<=totalDays; i++){
    const d = new Date(minD); d.setDate(d.getDate()+i);
    const mk = d.getFullYear() + '-' + (d.getMonth()+1);
    if(!months[mk]) months[mk] = {label: 'Tháng '+(d.getMonth()+1)+'/'+d.getFullYear(), count: 0};
    months[mk].count++;
    const dow = d.getDay();
    const first = d.getDate()===1;
    const wend = (dow===0 || dow===6);
    const bg = first ? 'background:#FBF4E6;' : wend ? 'background:#FBFAF7;' : '';
    const bd = first ? 'border-left:1.5px solid var(--brass);' : 'border-right:1px solid var(--line);';
    headerDays += '<div style="'+bd+bg+'text-align:center;padding:5px 0;font-size:10px;color:'+(wend?'#B23A2E':'var(--ink-soft)')+';min-width:'+dayW+'px;width:'+dayW+'px;box-sizing:border-box;line-height:1.25">'
      + '<div style="font-weight:'+(first?'700':'500')+'">'+d.getDate()+'</div>'
      + (showThu ? '<div style="font-size:8.5px;opacity:.7">'+THU[dow]+'</div>' : '')
      + '</div>';
  }
  // Dải tháng: mỗi tháng 1 ô rộng = số ngày × dayW
  let headerMonths = '';
  Object.keys(months).forEach(mk => { const mo = months[mk]; const w = mo.count * dayW;
    headerMonths += '<div style="min-width:'+w+'px;width:'+w+'px;box-sizing:border-box;border-right:1.5px solid var(--line-strong);padding:4px 8px;font-size:11px;font-weight:700;color:var(--brass-deep);background:#FBF8F1;white-space:nowrap;overflow:hidden">'+mo.label+'</div>';
  });

  // Group tasks by giai đoạn
  const groups = GIAI_DOAN.map(g => ({g, items:[]}));
  const other = {g:'Ngoài quy trình', items:[]};
  tasks.forEach(t => { const i = GIAI_DOAN.indexOf(t['Giai đoạn']); (i>-1?groups[i]:other).items.push(t); });
  const all = groups.concat([other]).filter(grp => grp.items.length);

  // Tính vạch hôm nay
  const todayD = new Date(today());
  const todayOffset = Math.round((todayD - minD)/86400000) * dayW;
  const todayInRange = todayD >= minD && todayD <= maxD;

  // Build Gantt
  const barWidth = (totalDays+1) * dayW;
  let gantt = '<div class="gantt-wrap"><div class="gantt" style="grid-template-columns:240px 1fr">';
  // Header row
  gantt += '<div class="gantt-row head"><div class="gantt-name">Công việc</div>'
    + '<div style="position:relative;padding:0!important">'
    + '<div style="display:flex;border-bottom:1px solid var(--line)">' + headerMonths + '</div>'
    + '<div style="display:flex">' + headerDays + '</div>'
    + (todayInRange ? '<div class="gantt-today" style="left:'+todayOffset+'px"></div>' : '')
    + '</div></div>';

  all.forEach(grp => {
    gantt += '<div class="gantt-row phase"><div class="gantt-name">'+esc(grp.g)+'</div><div></div></div>';
    grp.items.forEach(t => {
      const sd = t['Ngày bắt đầu'] ? new Date(t['Ngày bắt đầu']) : null;
      const ed = t['Hạn hoàn thành'] ? new Date(t['Hạn hoàn thành']) : null;
      const tt = t['Trạng thái'] || '';
      const pct = Number(t['Tiến độ (%)']) || 0;
      const off = d => Math.max(0, Math.round((d - minD)/86400000)) * dayW;
      const wid = (a,b) => Math.max(1, Math.round((b - a)/86400000) + 1) * dayW;
      let bars = '';
      const isCrit = critSet.has(t['Mã CV']);
      const isBlk = (t['Trạng thái']||'')!=='Hoàn thành' && gBlocked(t);
      const mkPre = (isCrit?'<span title="Đường găng — trễ là trễ cả dự án">⚡</span>':'') + (isBlk?'<span title="Đang chờ việc trước hoàn thành">⛓</span>':'');
      const critC = isCrit ? ' crit' : '';
      if(sd && ed){
        // ----- Lớp Thực tế: suy ra từ trạng thái + ngày hoàn thành -----
        let aStart = sd, aEnd = null, acls = 'run';
        if(tt==='Hoàn thành'){ aEnd = t['Ngày hoàn thành'] ? new Date(t['Ngày hoàn thành']) : ed; acls = 'done'; }
        else if(tt==='Đang vướng'){ aEnd = todayD; acls = 'blocked'; }
        else if(tt==='Tạm dừng'){ aEnd = todayD; acls = 'pause'; }
        else if(tt==='Chưa bắt đầu' || tt==='Từ chối'){ aEnd = null; }
        else { aEnd = todayD; acls = 'run'; } // Đang làm, Chờ duyệt, Đã phê duyệt
        if(aEnd){ if(aEnd < aStart) aEnd = aStart; if(aEnd > maxD) aEnd = maxD; }
        if(acls !== 'done' && aEnd && ed < todayD) acls = 'late';
        const nm = esc(t['Tên công việc']);
        const dmy = d => esc(d.toISOString().slice(0,10));
        const tip = nm + ' · ' + esc(t['Phụ trách']||'—') + ' · KH: ' + dmy(sd) + '→' + dmy(ed)
                  + (aEnd ? ' · TT: ' + dmy(aStart) + '→' + dmy(aEnd) : '') + ' · ' + esc(tt||'—') + ' · ' + pct + '%';
        const planStart = off(sd), planW = wid(sd, ed);
        const planCls = (layer==='both') ? 'plan thin' : 'plan';
        const planBar = '<div class="gantt-bar '+planCls+'" style="left:'+planStart+'px;width:'+planW+'px" title="'+tip+'" onclick="formTask(\''+t['Mã CV']+'\')">'+(layer==='plan'?nm:'')+'</div>';
        let actBar = '';
        if(aEnd){
          const actCls = (layer==='both' ? 'actual ' : '') + acls + critC;
          actBar = '<div class="gantt-bar '+actCls+'" style="left:'+off(aStart)+'px;width:'+wid(aStart,aEnd)+'px" title="'+tip+(gDeps(t).length?' · sau: '+gDeps(t).map(p=>esc(gById[p]['Tên công việc'])).join(', '):'')+'" onclick="formTask(\''+t['Mã CV']+'\')">'+mkPre+nm+'</div>';
        } else if(layer==='actual'){
          actBar = '<div class="gantt-bar notstarted" style="left:'+planStart+'px;width:'+planW+'px" title="'+tip+'" onclick="formTask(\''+t['Mã CV']+'\')">'+nm+'</div>';
        }
        bars = layer==='plan' ? planBar : layer==='actual' ? actBar : (planBar + actBar);
      }
      gantt += '<div class="gantt-row"><div class="gantt-name" style="cursor:pointer" onclick="formTask(\''+t['Mã CV']+'\')"><b style="font-size:12px">'+mkPre+esc(t['Tên công việc'])+'</b><div class="muted" style="font-size:10.5px">'+esc(t['Phụ trách']||'—')+(isBlk?' · <span style="color:#E65100">chờ việc trước</span>':'')+(isCrit?' · <span style="color:#B71C1C;font-weight:600">đường găng</span>':'')+'</div></div>'
        + '<div class="gantt-bar-cell" style="width:'+barWidth+'px">' + bars
        + (todayInRange ? '<div class="gantt-today" style="left:'+todayOffset+'px"></div>' : '')
        + '</div></div>';
    });
  });
  gantt += '</div>';
  gantt += '<div class="gantt-legend"><span><i class="plan"></i> Kế hoạch</span><span><i class="run"></i> Đang làm</span><span><i class="done"></i> Hoàn thành</span><span><i class="late"></i> Trễ hạn</span><span><i class="blocked"></i> Vướng</span><span><i class="pause"></i> Tạm dừng</span><span><i class="notstarted"></i> Chưa bắt đầu</span><span><span style="color:#B71C1C;font-weight:700">⚡</span> Đường găng</span><span><span style="color:#E65100">⛓</span> Chờ việc trước</span><span style="margin-left:auto">Hôm nay: <span style="color:#E53935;font-weight:700">|</span></span></div>';
  gantt += '</div>';
  // Tiêu đề chỉ hiện khi in / xuất PDF
  const gDone = tasks.filter(t=>t['Trạng thái']==='Hoàn thành').length;
  const gPct = Math.round(gDone / tasks.length * 100);
  const gPM = proj['Quản lý dự án'] || proj['PM'] || proj['Người quản lý'] || '';
  const printHead = '<div class="gantt-print-head">'
    + '<div style="font-size:18px;font-weight:800;color:#1E2329;letter-spacing:.5px">SƠ ĐỒ TIẾN ĐỘ (GANTT)</div>'
    + '<div style="font-size:12px;color:#6B7280;margin-top:2px">'
      + esc(proj['Mã DA']||'') + ' · ' + esc(proj['Tên dự án']||'')
      + (gPM ? ' · PM: ' + esc(gPM) : '')
      + ' · Tiến độ ' + gPct + '% · Xuất ngày ' + fmtDMY(today())
    + '</div></div>';
  return html + '<div id="ganttPrintArea">' + printHead + gantt + '</div>';
}
// Chuyển lớp hiển thị Gantt (Kế hoạch / Thực tế / cả hai)
function gLayer(v){ window._gLayer = v; render(); }
// Xuất PDF sơ đồ Gantt: nhân bản vùng biểu đồ ra ngoài body rồi gọi hộp thoại in (Lưu dạng PDF)
function setPrintPage(o){ let s=document.getElementById('printPageStyle'); if(!s){ s=document.createElement('style'); s.id='printPageStyle'; document.head.appendChild(s); } s.textContent='@page{size:A4 '+o+';margin:'+(o==='landscape'?'9mm':'14mm')+'}'; }
function printGantt(){
  setPrintPage('landscape');
  const area = document.getElementById('ganttPrintArea');
  if(!area){ window.print(); return; }
  const old = document.getElementById('ganttPrintHolder'); if(old) old.remove();
  const holder = document.createElement('div');
  holder.id = 'ganttPrintHolder';
  holder.innerHTML = area.innerHTML;
  document.body.appendChild(holder);
  document.body.classList.add('print-gantt');
  const cleanup = () => { document.body.classList.remove('print-gantt'); const h = document.getElementById('ganttPrintHolder'); if(h) h.remove(); window.removeEventListener('afterprint', cleanup); };
  window.addEventListener('afterprint', cleanup);
  setTimeout(() => { window.print(); setTimeout(cleanup, 800); }, 60);
}

/* ---------- ★ Nhóm 3 — Trang Lịch hẹn (Calendar + List) ---------- */
function vAppointments(){
  const myLH = visibleAppointments();
  // Tháng hiện đang xem
  if(!window._lhM){ const d = new Date(); window._lhM = d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0'); }
  if(!window._lhV) window._lhV = 'calendar'; // calendar | list

  const [yy, mm] = window._lhM.split('-').map(Number);
  const prev = new Date(yy, mm-2, 1); const next = new Date(yy, mm, 1);
  const prevKey = prev.getFullYear()+'-'+String(prev.getMonth()+1).padStart(2,'0');
  const nextKey = next.getFullYear()+'-'+String(next.getMonth()+1).padStart(2,'0');

  let html = '<div class="toolbar">'
    + '<button class="btn btn-ghost" onclick="window._lhM=\''+prevKey+'\';render()" style="padding:7px 12px">‹ Tháng trước</button>'
    + '<b style="font-size:15px;flex:1;text-align:center">Tháng '+mm+' / '+yy+'</b>'
    + '<button class="btn btn-ghost" onclick="window._lhM=\''+nextKey+'\';render()" style="padding:7px 12px">Tháng sau ›</button>'
    + '<button class="btn '+(window._lhV==='calendar'?'btn-brass':'btn-ghost')+'" onclick="window._lhV=\'calendar\';render()" style="padding:7px 12px">📅 Lịch</button>'
    + '<button class="btn '+(window._lhV==='list'?'btn-brass':'btn-ghost')+'" onclick="window._lhV=\'list\';render()" style="padding:7px 12px">📋 Danh sách</button>'
    + '</div>';

  if(window._lhV === 'calendar'){
    // Render calendar
    const first = new Date(yy, mm-1, 1);
    const last = new Date(yy, mm, 0);
    const daysInMonth = last.getDate();
    let startDow = first.getDay(); // CN=0
    startDow = startDow === 0 ? 6 : startDow - 1; // chuyển sang T2-CN: T2=0
    const cells = [];
    for(let i=0; i<startDow; i++) cells.push(null);
    for(let i=1; i<=daysInMonth; i++) cells.push(i);
    while(cells.length % 7 !== 0) cells.push(null);

    let cal = '<div class="cal-grid">';
    ['T2','T3','T4','T5','T6','T7','CN'].forEach(d => cal += '<div class="cal-head">'+d+'</div>');
    const todayStr = today();
    cells.forEach(day => {
      if(day === null){ cal += '<div class="cal-day off"></div>'; return; }
      const ds = yy+'-'+String(mm).padStart(2,'0')+'-'+String(day).padStart(2,'0');
      const isToday = ds === todayStr;
      const events = myLH.filter(l => l['Ngày'] === ds);
      cal += '<div class="cal-day'+(isToday?' today':'')+'"><span class="d">'+day+'</span>';
      events.slice(0,3).forEach(ev => {
        const cls = ev['Trạng thái']==='Đã hoàn thành' ? 'done' : ev['Trạng thái']==='Hủy' ? 'cancel' : '';
        const title = (ev['Giờ']?ev['Giờ']+' ':'') + (ev['Tiêu đề']||ev['Loại lịch hẹn']);
        cal += '<span class="ev '+cls+'" onclick="formAppointment(\''+ev['Mã LH']+'\')" title="'+esc(title)+' — '+esc(ev['Khách']||projName(ev['Mã DA']))+'">'+esc(title)+'</span>';
      });
      if(events.length > 3) cal += '<span class="muted" style="font-size:10px">+ '+(events.length-3)+' nữa</span>';
      cal += '</div>';
    });
    cal += '</div>';
    html += cal;
  } else {
    // List view — tất cả lịch hẹn của tháng đó
    const monthEvents = myLH.filter(l => l['Ngày'] && l['Ngày'].startsWith(window._lhM))
      .sort((a,b) => (a['Ngày']+' '+(a['Giờ']||'')) > (b['Ngày']+' '+(b['Giờ']||'')) ? 1 : -1);
    html += '<div class="card"><div class="card-body" style="padding:0"><div class="tbl-wrap"><table class="tbl"><thead><tr><th>Ngày · Giờ</th><th>Loại</th><th>Tiêu đề</th><th>Dự án</th><th>Khách / Người tham gia</th><th>Trạng thái</th></tr></thead><tbody>';
    html += monthEvents.length ? monthEvents.map(l =>
      '<tr class="row-click" onclick="formAppointment(\''+l['Mã LH']+'\')"><td><b>'+esc(l['Ngày'])+'</b>'+(l['Giờ']?'<div class="muted">'+esc(l['Giờ'])+'</div>':'')+'</td>'
      + '<td><span class="tag t-brass">'+esc(l['Loại lịch hẹn']||'—')+'</span></td>'
      + '<td><b>'+esc(l['Tiêu đề']||'—')+'</b>'+(l['Địa điểm']?'<div class="muted">📍 '+esc(l['Địa điểm'])+'</div>':'')+'</td>'
      + '<td class="muted">'+esc(projName(l['Mã DA'])||'—')+'</td>'
      + '<td>'+esc(l['Khách']||'—')+(l['Tham gia (nội bộ)']?'<div class="muted">'+esc(l['Tham gia (nội bộ)'])+'</div>':'')+'</td>'
      + '<td>'+tagTT(l['Trạng thái']||'Đã lên lịch')+'</td></tr>'
    ).join('') : '<tr><td colspan="6"><div class="empty"><b>Tháng này không có lịch hẹn</b>Bấm "+ Thêm mới" để đặt lịch</div></td></tr>';
    html += '</tbody></table></div></div></div>';
  }
  return html;
}

/* --- Avatar chữ cái đầu, màu suy từ tên --- */
function tpAvatar(ten){
  const t = String(ten||'?').trim();
  const w = t.split(/\s+/).filter(Boolean);
  const ini = (w.length>=2 ? w[0][0]+w[w.length-1][0] : t.slice(0,2)).toUpperCase();
  const pal = ['#2E7D8F','#3A6EA5','#6A5ACD','#C77B30','#4B7A3F','#A0522D','#7E57C2','#B8860B'];
  let s=0; for(let i=0;i<t.length;i++) s = (s*31 + t.charCodeAt(i)) % 9973;
  return '<span class="tp-av" style="background:'+pal[s%pal.length]+'">'+esc(ini)+'</span>';
}

/* --- Tổng hợp số liệu 1 nhà thầu --- */
function tpStats(ten){
  const key = vnorm(ten||'');
  const hds = (S.hdthauphu||[]).filter(h=>vnorm(h['Thầu phụ']||'')===key);
  const dots= (S.ttthauphu||[]).filter(x=>vnorm(x['Thầu phụ']||'')===key);
  const cvs = tvSong(S.congviec).filter(c=>vnorm(c['Thầu phụ']||'')===key);
  const gt  = hds.reduce((a,h)=>a+(Number(h['Giá trị HĐ (đ)'])||0),0);
  const daChi = dots.filter(x=>x['Trạng thái']==='Đã thanh toán').reduce((a,x)=>a+ttpChi(x),0);
  const giu = dots.filter(x=>x['Trạng thái']==='Đã thanh toán').reduce((a,x)=>a+ttpGiuLai(x),0);
  const choChi = dots.filter(x=>x['Trạng thái']==='Đã duyệt · chờ chi').reduce((a,x)=>a+ttpChi(x),0);
  const daHT = cvs.filter(c=>c['Trạng thái']==='Hoàn thành');
  const treHan = daHT.filter(c=>c['Ngày hoàn thành'] && c['Hạn hoàn thành'] && c['Ngày hoàn thành']>c['Hạn hoàn thành']).length
               + cvs.filter(c=>c['Trạng thái']!=='Hoàn thành' && c['Hạn hoàn thành'] && daysLeft(c['Hạn hoàn thành'])<0).length;
  const ncs = (S.khongPH||[]).filter(n=>vnorm((n['Mô tả']||'')+(n['Người xử lý']||'')).includes(key) && key);
  const ats = (S.anToanCL||[]).filter(n=>vnorm(n['Mô tả']||'').includes(key) && key
              && (n['Loại']==='Tai nạn lao động'||n['Loại']==='Sự cố an toàn'));
  const duan = new Set(hds.map(h=>h['Mã DA']).concat(cvs.map(c=>c['Mã DA'])).filter(Boolean));
  return {hds, dots, cvs, gt, daChi, giu, choChi, daHT:daHT.length, tongCV:cvs.length,
          treHan, nc:ncs.length, at:ats.length, soDA:duan.size, conLai:gt-daChi-giu};
}

/* --- ĐIỂM VẬN HÀNH tự động (thang 5) từ dữ liệu thực tế --- */
function tpDiemVanHanh(ten){
  const s = tpStats(ten);
  if(!s.tongCV) return null;                       // chưa có việc → chưa chấm
  let d = 5;
  const tyLeTre = s.tongCV ? s.treHan/s.tongCV : 0;
  d -= tyLeTre * 2.0;                              // trễ hạn: trừ tối đa 2đ
  d -= Math.min(1.5, s.nc * 0.3);                  // sự không phù hợp: trừ tối đa 1.5đ
  d -= Math.min(1.0, s.at * 0.5);                  // sự cố an toàn: trừ tối đa 1đ
  return Math.max(1, Math.round(d*10)/10);
}
function saoHtml(d){
  if(d===null) return '<span class="muted">Chưa chấm</span>';
  const c = d>=4.5?'var(--ok)':d>=3.5?'var(--brass-deep)':d>=2.5?'var(--warn)':'var(--bad)';
  return '<span style="color:'+c+';font-weight:700;white-space:nowrap">☆ '+d.toFixed(1)+'</span>';
}
/* --- Phiếu đánh giá mới nhất của 1 nhà thầu --- */
function tpDanhGiaMoiNhat(ten){
  const key = vnorm(ten||'');
  return (S.danhgiaTP||[]).filter(x=>vnorm(x['Thầu phụ']||'')===key)

}

function tpTongQuan(){

  const hdHL = hds.filter(h=>h['Trạng thái']==='Đang hiệu lực');
  const tongGT = hds.reduce((a,h)=>a+(Number(h['Giá trị HĐ (đ)'])||0),0);
  const daChi = (S.ttthauphu||[]).filter(x=>x['Trạng thái']==='Đã thanh toán').reduce((a,x)=>a+ttpChi(x),0);
  const giu = (S.ttthauphu||[]).filter(x=>x['Trạng thái']==='Đã thanh toán').reduce((a,x)=>a+ttpGiuLai(x),0);
  const choChi = (S.ttthauphu||[]).filter(x=>x['Trạng thái']==='Đã duyệt · chờ chi').reduce((a,x)=>a+ttpChi(x),0);

  let html = '<div class="kpis">'
    + kpi('Nhà thầu đang hợp tác', hoatDong.length, tps.length+' trong danh sách','accent')
    + kpi('Hợp đồng hiệu lực', hdHL.length, 'Tổng '+fmtTr(tongGT))
    + kpi('Đã chi thầu phụ', fmtTr(daChi), giu?'Đang giữ lại '+fmtTr(giu):'Chưa có giữ lại')
    + kpi('Chờ chi', fmtTr(choChi), choChi?'Đã duyệt, chưa thanh toán':'Không có', choChi?'bad':'ok')
    + '</div>';

  /* Cảnh báo quản trị nhà thầu */
  const chuaDG = tps.filter(t=>t['Trạng thái']==='Đang hợp tác' && !tpDanhGiaMoiNhat(t['Tên / Công ty']));
  const dgCu = tps.filter(t=>{
    const dg = tpDanhGiaMoiNhat(t['Tên / Công ty']);
    return dg && dg['Ngày đánh giá'] && daysLeft(dg['Ngày đánh giá']) < -365;
  });
  const loaiCD = tps.filter(t=>{
    const dg = tpDanhGiaMoiNhat(t['Tên / Công ty']);
    return dg && (dg['Xếp loại']==='C'||dg['Xếp loại']==='D') && t['Trạng thái']==='Đang hợp tác';
  });
  if(chuaDG.length||dgCu.length||loaiCD.length){
    html += '<div class="card" style="border-color:var(--warn)"><div class="ct" style="color:var(--warn)">⚠ Cần rà soát</div>'
      + '<div class="card-body" style="padding:0"><div class="tbl-wrap"><table class="tbl"><tbody>'
      + (chuaDG.length?'<tr class="row-click" onclick="window._tpTab=\'danhgia\';render()"><td><b>'+chuaDG.length+' nhà thầu đang hợp tác chưa được đánh giá</b><div class="muted">'+esc(chuaDG.slice(0,3).map(t=>t['Tên / Công ty']).join(' · '))+'</div></td><td class="num"><span class="tag t-warn">Chưa đánh giá</span></td></tr>':'')
      + (dgCu.length?'<tr class="row-click" onclick="window._tpTab=\'danhgia\';render()"><td><b>'+dgCu.length+' nhà thầu quá 12 tháng chưa đánh giá lại</b><div class="muted">'+esc(dgCu.slice(0,3).map(t=>t['Tên / Công ty']).join(' · '))+'</div></td><td class="num"><span class="tag t-warn">Hết hạn</span></td></tr>':'')
      + (loaiCD.length?'<tr class="row-click" onclick="window._tpTab=\'danhgia\';render()"><td><b>'+loaiCD.length+' nhà thầu loại C/D vẫn đang được sử dụng</b><div class="muted">'+esc(loaiCD.slice(0,3).map(t=>t['Tên / Công ty']).join(' · '))+'</div></td><td class="num"><span class="tag t-bad">Rủi ro</span></td></tr>':'')
      + '</tbody></table></div></div></div>';
  }

  /* Phân bố theo loại thầu */
  const byLoai = {};
  tps.forEach(t=>{ const k=t['Loại thầu']||'Khác'; byLoai[k]=(byLoai[k]||0)+1; });
  const keys = Object.keys(byLoai).sort((a,b)=>byLoai[b]-byLoai[a]);
  if(keys.length){
    html += '<div class="dash-2">';
    html += '<div class="card"><div class="ct">Cơ cấu nhà thầu theo chuyên môn</div><div class="card-body">'
      + keys.map(k=>{
          const w = Math.round(byLoai[k]/tps.length*100);
          return '<div style="margin-bottom:9px"><div style="display:flex;justify-content:space-between;font-size:12.5px;margin-bottom:3px">'
            + '<span>'+esc(k)+'</span><b>'+byLoai[k]+' <span class="muted" style="font-weight:400">('+w+'%)</span></b></div>'
            + '<div class="bar"><i style="width:'+w+'%"></i></div></div>';
        }).join('') + '</div></div>';

    /* Top nhà thầu theo giá trị */
    const top = tps.map(t=>({t, s:tpStats(t['Tên / Công ty'])})).filter(x=>x.s.gt>0)
      .sort((a,b)=>b.s.gt-a.s.gt).slice(0,6);
    html += '<div class="card"><div class="ct">Nhà thầu theo giá trị hợp đồng</div>';
    if(top.length){
      html += '<div class="tbl-wrap"><table class="tbl"><tbody>'
        + top.map(x=>'<tr class="row-click" onclick="formSubcontractor(\''+esc(x.t['Mã TP'])+'\')">'
          + '<td>'+tpAvatar(x.t['Tên / Công ty'])+' <b style="vertical-align:middle">'+esc(x.t['Tên / Công ty'])+'</b>'
          + '<div class="muted" style="margin-left:34px">'+esc(x.t['Loại thầu']||'')+' · '+x.s.hds.length+' HĐ · '+x.s.soDA+' dự án</div></td>'
          + '<td class="num"><b>'+fmtTr(x.s.gt)+'</b><div class="muted">đã chi '+fmtTr(x.s.daChi)+'</div></td></tr>').join('')
        + '</tbody></table></div>';
    } else html += '<div class="empty" style="padding:22px">Chưa có hợp đồng giao thầu</div>';
    html += '</div></div>';
  }
  return html;
}

        + '<div class="muted" style="margin-left:34px">'+esc(t['Mã TP'])+(s.soDA?' · '+s.soDA+' dự án':'')+'</div></td>'

      + '<td>'+esc(t['Người liên hệ']||'—')+(t['SĐT']?'<div class="muted">'+esc(t['SĐT'])+' '+btnZalo(t['SĐT'],'')+'</div>':'')+'</td>'
      + '<td>'+(xl?'<span class="tag '+xl[3]+'">Loại '+xl[0]+'</span><div class="muted" style="font-size:10.5px">'+esc(dg['Điểm'])+'/'+TONG_DIEM_TP+'</div>':'<span class="muted">Chưa đánh giá</span>')+'</td>'
