<!DOCTYPE html>
<!-- MDC-PM v2.0 — Bổ sung: Khách hàng, Hiện trường, Mua sắm, Phát sinh HĐ, Tài chính, Hồ sơ & Tài liệu, An toàn & Chất lượng, Sự không phù hợp, Rủi ro. Sidebar phân nhóm như iSolutions. -->
<!-- MDC-PM v4.2 — TOÀN DIỆN XÂY DỰNG & NỘI THẤT: thêm 6 giai đoạn thi công xây dựng/hoàn thiện (Chuẩn bị & Khởi công, Phần ngầm & Móng, Kết cấu phần thô, Xây tô & Hoàn thiện thô, Cơ điện M&E, Hoàn thiện xây dựng) + ~70 đầu việc chi tiết vào thư viện kế hoạch; thêm loại hình "Xây dựng" & "Tổng thầu". Giữ nguyên hành vi 3 loại hình nội thất cũ. -->
<!-- MDC-PM v4.3 — THIẾT KẾ XÂY DỰNG: thêm giai đoạn "Thiết kế kiến trúc & kết cấu" (nhóm TX) với hạng mục Kiến trúc, Kết cấu, M&E, Dự toán & Xin phép — cho loại hình Thiết kế / Xây dựng / Tổng thầu. Loại hình "Thiết kế & Thi công" (nội thất) giữ nguyên phạm vi cũ. GIAI_DOAN = 14 giai đoạn. -->
<!-- MDC-PM v4.4 — KẾ HOẠCH CHUNG CÁC DỰ ÁN: trang mới (nav) hiển thị mọi dự án theo DÒNG CHẢY qua các bộ phận. Có Xuất Excel/PDF, Nhập Excel. -->
<!-- MDC-PM v5.2 — KẾ HOẠCH SẢN XUẤT (module Nhà máy) theo biểu mẫu "PHÂN BỔ & KẾ HOẠCH SẢN XUẤT" (file anh Lâm gửi): bảng đầy đủ nhóm cột — PHÂN BỐ HẠNG MỤC (Hạng mục·Phân loại·Phân bố SX·Tổ SX/Đối tác·Ưu tiên·ĐVT·Khối lượng·Số lượng) · ĐỊNH BIÊN NHÂN SỰ (NC Mộc/Sơn/Lắp đặt) · KẾ HOẠCH HỒ SƠ (SPEC·HS đã ký) · FILE KỸ THUẬT CNC (Ngày HT·Ghi chú) · KH NHẬP VẬT LIỆU (Ngày đặt·Ngày nhận) · SẢN XUẤT & LẮP ĐẶT (Mộc BĐ/HT·Sơn BĐ/HT·Lắp đặt BĐ/HT) · NGHIỆM THU & BÀN GIAO (BĐ/Bàn giao) · TIẾN ĐỘ (DK khả thi·%·Ghi chú). KHSX_GROUPS + khsxPlanHtml/khsxCell + Xuất Excel/PDF (A1 landscape). Lưu chung kho mdc_pm_khhm (khóa sx_pb/sx_to/sx_ut/kl/nc_*/sx_spec/sx_hsky/cnc_*/vl_*/moc_*/son_*/ld_*/nt_*/sx_kt). Hạng mục lấy từ phân bổ Nhà máy. -->
<!-- MDC-PM v5.1 — KẾ HOẠCH THIẾT KẾ theo hạng mục: module Thiết kế thêm card "Kế hoạch thiết kế theo hạng mục" — hiện MỌI hạng mục (mọi phân bổ NM/TM/TP, vì thiết kế/hồ sơ làm cho tất cả), nhóm mốc KẾ HOẠCH HỒ SƠ (Chốt Spec · HS Bắt đầu · HS Hoàn thành · Chuyển hồ sơ · Duyệt mẫu) + có cột Phân bổ để biết ai thực hiện. khhmDeptRows(pb='' → mọi phân bổ); khhmDeptPlanHtml roCols thêm Phân bổ khi pb rỗng. Cùng kho mdc_pm_khhm → đồng bộ 2 chiều với bảng hạng mục của dự án. -->
<!-- MDC-PM v5.0 — KẾ HOẠCH THEO HẠNG MỤC LAN TỎA SANG CÁC PHÒNG (chung kho mdc_pm_khhm): từ Dự án → Kế hoạch chi tiết → 📦 Theo hạng mục, các hạng mục tự chảy về đúng phòng theo cột Phân bổ. Module Nhà máy: card "Kế hoạch sản xuất theo hạng mục" (Hồ sơ + Sản xuất & lắp đặt). Module Thương mại: card "Kế hoạch đặt hàng theo hạng mục" (Đặt hàng). Module Thầu phụ: thêm tab "Kế hoạch thi công" (Thi công thầu phụ). Sửa mốc ở phòng ↔ đồng bộ tức thì với bảng hạng mục của dự án. khhmDeptPlanHtml(pb,groups,da) + khhmDeptRows. -->
<!-- MDC-PM v4.7 — 3 MODULE THEO PHÒNG BAN (nav riêng): Thiết kế · Nhà máy · Thương mại. Bước 1 (chạy ngay, không cần deploy BE): mỗi module = bảng điều hành phòng — gom công việc theo giai đoạn của phòng xuyên suốt mọi dự án + KPI + việc quá hạn + mốc từ Kế hoạch chi tiết (kho mdc_pm_khc) + (Thương mại) bảng Mua sắm/Đặt hàng. Chừa khung "Nghiệp vụ chuyên sâu (bước 2)". Lọc theo dự án. -->
<!-- MDC-PM v4.9 — KẾ HOẠCH CHI TIẾT THEO HẠNG MỤC (bám ĐÚNG mẫu sheet "Kế hoạch HĐ Tuấn Anh"): trong tab "Kế hoạch chi tiết" thêm nút chuyển "🏢 Theo bộ phận ↔ 📦 Theo hạng mục". Nhóm cột: PHÂN BỐ HẠNG MỤC (Hạng mục · Phân loại · Phân bổ NM/TM/TP · ĐVT · Số lượng) · KẾ HOẠCH HỒ SƠ (Chốt Spec · HS Bắt đầu · HS Hoàn thành · Chuyển hồ sơ · Duyệt mẫu) · KẾ HOẠCH SẢN XUẤT & LẮP ĐẶT (Tình trạng · Bắt đầu · Hoàn thành) · KẾ HOẠCH ĐẶT HÀNG-TM (Tình trạng · Ngày đặt · Ngày nhận) · KẾ HOẠCH THI CÔNG-Thầu phụ (Tình trạng · Ngày TC · Hoàn thành) · TIẾN ĐỘ (% HT · Ghi chú). Nhập tay (＋ Thêm hạng mục) hoặc "⬆ Nhập từ hợp đồng": chọn THẲNG file Excel .xlsx (nhúng SheetJS mini, chọn được sheet) hoặc dán từ Excel/Sheet/CSV — tự map cột & bỏ dòng tiêu đề/nhóm/tổng. Xuất Excel/PDF. Kho localStorage mdc_pm_khhm (không cần deploy BE). -->
<!-- MDC-PM v4.8 — QUY RA THỜI GIAN theo tính chất HĐ (tab Kế hoạch chi tiết): thêm ô "Cách tính ngày" (Lịch cả CN&lễ / Trừ Chủ nhật / Trừ CN & ngày lễ). "Hoàn thành HĐ (tính)" TỰ tính = Ngày ký + Tiến độ (số ngày) theo cách tính, và tự áp vào Ngày kết thúc DK của dự án (Số ngày còn lại/Gantt ăn theo). Nút "🗓 Ngày lễ" quản lý danh mục ngày lễ (localStorage mdc_pm_holidays; nạp sẵn lễ 2026-2027, sửa được). khcAddDays() cộng ngày làm việc; áp cho cả lưới Kế hoạch chung + Xuất Excel/PDF + Nhập Excel. -->
<!-- MDC-PM v4.6 — TÍCH HỢP Kế hoạch chung VÀO module DỰ ÁN: (1) Trang Dự án có 2 chế độ xem "Danh sách dự án" ↔ "Kế hoạch chung" (lưới dòng chảy bộ phận) — bỏ mục nav riêng. (2) Chi tiết mỗi dự án có tab "Kế hoạch chi tiết" = kế hoạch phòng ban của riêng dự án đó (Hợp đồng + Thiết kế + SX&Lắp đặt + Thương mại + Đối tác/Thầu phụ), nhập dạng form. Cả hai DÙNG CHUNG 1 kho mdc_pm_khc → sửa ở đâu cũng đồng bộ. Nút "Gợi ý mốc từ công việc" ngay trong tab dự án. -->
<!-- MDC-PM v4.5 — KẾ HOẠCH CHUNG dựng LẠI thành LƯỚI NHẬP LIỆU bám ĐÚNG sheet "KẾ HOẠCH CHUNG CÁC DỰ ÁN": khối HỢP ĐỒNG (Số HĐ, Ngày ký, Tiến độ, Hoàn thành HĐ, Số ngày TH/còn lại) + KẾT QUẢ HĐ + 4 phòng ban đầy đủ cột con — PHÒNG THIẾT KẾ (Khảo sát, NV/Leader, BV sơ bộ BĐ/HT, SPEC/Ký mẫu, Shop DW HT/Ký HS, Deadline chuyển HS, Số ngày HT, Đạt/Không), SẢN XUẤT & LẮP ĐẶT, THƯƠNG MẠI (Dự toán, Đặt/Nhận hàng, BG nội bộ, BG khách), ĐỐI TÁC/THẦU PHỤ (Báo giá, Chốt thầu, Thi công). Nhập từng mốc (date/số/Đạt-Không); số ngày tự tính; "⚡ Gợi ý từ công việc" tự điền mốc từ đầu việc theo giai đoạn. Lưu localStorage (mdc_pm_khc). Xuất Excel/PDF & Nhập Excel theo đầy đủ cột. -->
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#2B211A">
<title>MDC-PM · Quản lý dự án</title>



<style>
:root{
  --wood-900:#241B14; --wood-800:#2B211A; --wood-700:#3D2E22; --wood-600:#54402F;
  --brass:#B98A3C; --brass-soft:#E9DCC3; --brass-deep:#8F6A2B;
  --paper:#F5F3EF; --card:#FFFFFF; --line:#E5E0D6; --line-strong:#D4CDBE;
  --ink:#2B241D; --ink-soft:#6E6457; --ink-faint:#9C9182;
  --ok:#2E7D4F; --ok-bg:#E7F2EB; --warn:#C77F1A; --warn-bg:#FBF0DC;
  --bad:#C0392B; --bad-bg:#F9E7E4; --info:#2C6E9E; --info-bg:#E5EFF6;
  --pause:#6E6457; --pause-bg:#EFECE6;
  --r:12px; --r-sm:8px;
  --serif:Arial, sans-serif;
  --shadow:0 1px 2px rgba(43,33,26,.06),0 4px 14px rgba(43,33,26,.07);
}
*{margin:0;padding:0;box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{font-family:Arial, sans-serif;background:var(--paper);color:var(--ink);font-size:14px;line-height:1.5}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select,textarea{font-family:inherit;font-size:14px;color:var(--ink)}
::selection{background:var(--brass-soft)}

/* ====== ĐĂNG NHẬP ====== */
#loginScreen{position:fixed;inset:0;background:
  radial-gradient(1200px 600px at 80% -10%,rgba(185,138,60,.18),transparent 60%),
  var(--wood-800);display:flex;align-items:center;justify-content:center;z-index:200;padding:20px}
.login-card{width:100%;max-width:380px;background:var(--card);border-radius:18px;padding:36px 32px;box-shadow:0 24px 60px rgba(0,0,0,.35)}
.login-mark{display:flex;align-items:center;gap:12px;margin-bottom:6px}
.mark-block{width:44px;height:44px;border-radius:11px;background:linear-gradient(135deg,var(--wood-700),var(--wood-900));display:flex;align-items:center;justify-content:center;color:var(--brass);font-weight:800;font-size:17px;letter-spacing:.5px;border:1px solid var(--wood-600)}
.login-card h1{font-family:var(--serif);font-size:29px;font-weight:600;letter-spacing:.2px}
.login-card .sub{color:var(--ink-soft);font-size:12.5px;margin-bottom:24px}
.field{margin-bottom:14px}
.field label{display:block;font-size:11.5px;font-weight:600;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.6px;margin-bottom:6px}
.field input,.field select,.field textarea{width:100%;padding:10px 12px;border:1.5px solid var(--line-strong);border-radius:var(--r-sm);background:#FDFCFA;transition:border-color .15s}
.field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--brass)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:10px 18px;border-radius:var(--r-sm);font-weight:600;font-size:14px;transition:transform .08s,box-shadow .15s,background .15s}
.btn:active{transform:translateY(1px)}
.btn-primary{background:var(--wood-800);color:#fff;width:100%}
.btn-primary:hover{background:var(--wood-700)}
.btn-brass{background:var(--brass);color:#fff}
.btn-brass:hover{background:var(--brass-deep)}
.btn-ghost{background:transparent;border:1.5px solid var(--line-strong);color:var(--ink-soft)}
.btn-ghost:hover{border-color:var(--brass);color:var(--ink)}
.btn-danger{background:var(--bad-bg);color:var(--bad)}
.login-err{color:var(--bad);font-size:13px;margin-top:10px;min-height:18px}
.login-foot{margin-top:18px;text-align:center;font-size:12px;color:var(--ink-faint)}
.login-foot button{color:var(--brass-deep);font-weight:600;text-decoration:underline}

/* ====== KHUNG ỨNG DỤNG ====== */
#app{display:none;min-height:100vh}
#app.active{display:block}
.sidebar{position:fixed;left:0;top:0;bottom:0;width:228px;background:var(--wood-800);color:#CFC6BA;display:flex;flex-direction:column;z-index:50}
.side-brand{padding:22px 20px 18px;display:flex;align-items:center;gap:11px;border-bottom:1px solid var(--wood-700)}
.side-brand .name{color:#fff;font-weight:700;font-size:15px;letter-spacing:.2px}
.side-brand .tag{font-size:10.5px;color:var(--brass);text-transform:uppercase;letter-spacing:1.4px;font-weight:600}
.nav{flex:1;padding:14px 12px;display:flex;flex-direction:column;gap:3px;overflow-y:auto}
.nav button{display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:9px;font-size:13.5px;font-weight:500;color:#BBB0A2;text-align:left;width:100%}
.nav button svg{flex:none;opacity:.85}
.nav button:hover{background:var(--wood-700);color:#fff}
.nav button.active{background:var(--wood-700);color:#fff;box-shadow:inset 3px 0 0 var(--brass)}
.side-foot{padding:14px 16px;border-top:1px solid var(--wood-700);font-size:12px}
.side-user{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.avatar{width:32px;height:32px;border-radius:50%;background:var(--brass);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;flex:none}
.side-user b{color:#fff;display:block;font-size:12.5px}
.side-user span{color:#9C9182;font-size:11px}
.main{margin-left:228px;padding:24px 28px 90px;max-width:1180px}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-bottom:20px;flex-wrap:wrap}
.topbar h2{font-family:var(--serif);font-size:27px;font-weight:600;letter-spacing:.2px;color:var(--wood-900)}
.topbar .actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.gsearch{position:relative;flex:1 1 240px;max-width:440px;min-width:180px}
.gsearch input{width:100%;padding:9px 12px 9px 32px;border:1px solid var(--line-strong);border-radius:var(--r-sm);font-size:13px;background:var(--card);color:var(--ink);font-family:inherit}
.gsearch input:focus{outline:none;border-color:var(--brass);box-shadow:0 0 0 3px var(--brass-soft)}
.gs-mag{position:absolute;left:11px;top:50%;transform:translateY(-50%);font-size:15px;color:var(--ink-faint);pointer-events:none}
.gs-panel{position:absolute;top:calc(100% + 5px);left:0;right:0;background:var(--card);border:1px solid var(--line-strong);border-radius:var(--r-sm);box-shadow:0 10px 30px rgba(0,0,0,.14);max-height:400px;overflow:auto;z-index:60;display:none}
.gs-panel.open{display:block}
.gs-grp{font-size:10px;text-transform:uppercase;letter-spacing:.6px;color:var(--ink-faint);padding:9px 12px 3px;font-weight:700;background:var(--paper)}
.gs-item{padding:8px 12px;cursor:pointer;border-top:1px solid var(--line);display:flex;gap:9px;align-items:center}
.gs-item:hover{background:var(--brass-soft)}
.gs-ic{width:20px;text-align:center;color:var(--brass-deep);flex:none}
.gs-empty{padding:16px 12px;color:var(--ink-faint);font-size:12.5px}
.notif-wrap{position:relative}
.notif-btn{position:relative;background:var(--card);border:1px solid var(--line-strong);border-radius:var(--r-sm);padding:7px 10px;cursor:pointer;font-size:16px;line-height:1}
.notif-btn:hover{border-color:var(--brass)}
.notif-badge{position:absolute;top:-6px;right:-6px;min-width:18px;height:18px;padding:0 4px;background:var(--bad);color:#fff;border-radius:9px;font-size:10.5px;font-weight:700;display:flex;align-items:center;justify-content:center;box-shadow:0 0 0 2px var(--card)}
.notif-panel{position:absolute;top:calc(100% + 6px);right:0;width:360px;max-width:88vw;max-height:440px;overflow:auto;background:var(--card);border:1px solid var(--line-strong);border-radius:var(--r-sm);box-shadow:0 12px 34px rgba(0,0,0,.16);z-index:70;display:none}
.notif-panel.open{display:block}
.nf-head{padding:11px 14px;font-weight:700;font-size:14px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:baseline;gap:8px;position:sticky;top:0;background:var(--card)}
.nf-h{font-size:10.5px;text-transform:uppercase;letter-spacing:.5px;color:var(--ink-faint);font-weight:700;padding:9px 14px 3px;background:var(--paper)}
.nf-i{display:flex;gap:10px;align-items:flex-start;padding:9px 14px;border-top:1px solid var(--line);cursor:pointer}
.nf-i:hover{background:var(--brass-soft)}
.nf-ic{width:24px;height:24px;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:13px;flex:none}
.nf-ic.bad{background:var(--bad-bg);color:var(--bad)} .nf-ic.warn{background:var(--warn-bg);color:var(--warn)} .nf-ic.info{background:var(--brass-soft);color:var(--brass-deep)}
.nf-t{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nf-s{font-size:11px;color:var(--ink-soft);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nf-more{padding:6px 14px;font-size:11.5px;color:var(--ink-faint)}
.nf-empty{padding:26px 16px;text-align:center;color:var(--ink-soft);font-size:13px}
.sync-chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--ink-soft);background:var(--card);border:1px solid var(--line);padding:6px 11px;border-radius:99px}
.sync-dot{width:7px;height:7px;border-radius:50%;background:var(--ok)}
.sync-dot.off{background:var(--bad)}
.sync-dot.pending{background:var(--warn)}

/* ====== THẺ & LƯỚI ====== */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin-bottom:22px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;box-shadow:var(--shadow)}
.kpi .lbl{font-size:11.5px;font-weight:600;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.7px}
.kpi .val{font-size:24px;font-weight:800;letter-spacing:-.5px;margin-top:4px;font-variant-numeric:tabular-nums}
.kpi .hint{font-size:11.5px;color:var(--ink-faint);margin-top:2px}
.kpi.accent .val{color:var(--brass-deep)}
.kpi.bad .val{color:var(--bad)}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);margin-bottom:18px}
.card-head{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 18px;border-bottom:1px solid var(--line)}
.card-head h3{font-size:14.5px;font-weight:700}
.card-body{padding:14px 18px}
.empty{padding:34px 18px;text-align:center;color:var(--ink-faint);font-size:13px}
.empty b{display:block;color:var(--ink-soft);font-size:14px;margin-bottom:4px}

/* ====== THANH GIAI ĐOẠN (signature) ====== */
.phase-rail{display:flex;gap:3px;margin-top:10px}
.phase-rail i{flex:1;height:6px;border-radius:3px;background:var(--line)}
.phase-rail i.done{background:linear-gradient(90deg,var(--brass),var(--brass-deep))}
.phase-rail i.now{background:var(--wood-600);animation:pulse 1.8s ease-in-out infinite}
@keyframes pulse{50%{opacity:.55}}
@media (prefers-reduced-motion:reduce){.phase-rail i.now{animation:none}}

/* ====== BẢNG / DANH SÁCH ====== */
.tbl{width:100%;border-collapse:collapse;font-size:13.5px}
.tbl th{text-align:left;padding:9px 10px;font-size:11px;font-weight:700;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.6px;border-bottom:1.5px solid var(--line-strong);white-space:nowrap}
.tbl td{padding:11px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl tr:last-child td{border-bottom:none}
.tbl tr.row-click{cursor:pointer}
.tbl tr.row-click:hover td{background:#FBF9F5}
.num{font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.tag{display:inline-block;padding:3px 9px;border-radius:99px;font-size:11.5px;font-weight:600;white-space:nowrap}
.t-ok{background:var(--ok-bg);color:var(--ok)} .t-warn{background:var(--warn-bg);color:var(--warn)}
.t-bad{background:var(--bad-bg);color:var(--bad)} .t-info{background:var(--info-bg);color:var(--info)}
.t-pause{background:var(--pause-bg);color:var(--pause)} .t-brass{background:var(--brass-soft);color:var(--brass-deep)}
/* ★ v4.4 — Kế hoạch chung các dự án */
.ks-kpi{background:var(--card);border:1px solid var(--line-strong);border-radius:var(--r-sm);padding:7px 15px;min-width:88px;text-align:center}
.ks-kpi b{display:block;font-size:19px;color:var(--brass-deep);line-height:1.15}
.ks-kpi span{font-size:11px;color:var(--ink-soft)}
.ks-kpi.bad b{color:var(--bad)}
.ks-legend{display:flex;gap:15px;flex-wrap:wrap;align-items:center;margin-bottom:11px;font-size:11.5px;color:var(--ink-soft)}
.ks-legend>span{display:inline-flex;align-items:center;gap:5px}
.ks-legend i{width:12px;height:12px;border-radius:3px;display:inline-block}
.ks-lg-today{width:2px!important;height:13px!important;border-radius:0!important;background:#B23A2E}
.ks-table{font-size:12px;min-width:1420px}
.ks-table th{padding:6px 7px;text-transform:none;font-size:10.5px;letter-spacing:.2px;text-align:center;border-right:1px solid var(--line);white-space:nowrap}
.ks-table td{padding:7px;border-right:1px solid var(--line);text-align:center}
.ks-table th.ks-grp{background:#FBF6EC;color:var(--brass-deep);font-weight:700}
.ks-table .ks-name{text-align:left;min-width:158px}
.ks-table .ks-stt{width:28px;color:var(--ink-faint)}
.ks-table td.ks-c{white-space:nowrap;font-variant-numeric:tabular-nums}
.ks-table td.ks-na{color:var(--ink-faint);font-size:11px;background:repeating-linear-gradient(45deg,transparent,transparent 5px,rgba(0,0,0,.02) 5px,rgba(0,0,0,.02) 10px)}
.ks-late{color:var(--bad);font-weight:700} .ks-soon{color:var(--warn);font-weight:700}
.ks-flowh{min-width:196px} td.ks-flowc{min-width:196px;padding:6px 9px!important}
.ks-flow{position:relative;width:180px;display:flex;flex-direction:column;gap:2px;margin:0 auto}
.ks-track{position:relative;height:7px;background:var(--line);border-radius:4px;overflow:hidden}
.ks-seg{position:absolute;top:0;height:7px;border-radius:4px}
.ks-today{position:absolute;top:-2px;bottom:-2px;width:2px;background:#B23A2E;z-index:2}
/* Lưới nhập liệu Kế hoạch chung (v4.5) */
.khc-grid{min-width:2600px;font-size:11px}
.khc-grid th{font-size:9.5px;padding:5px 4px;line-height:1.25}
.khc-grid td{padding:3px 4px}
.khc-grid .ks-name{min-width:170px}
.khc-in{width:100%;border:1px solid transparent;background:transparent;border-radius:4px;padding:3px 4px;font-size:11px;font-family:inherit;color:var(--ink)}
.khc-in:hover{border-color:var(--line-strong)}
.khc-in:focus{border-color:var(--brass);background:#fff;outline:none}
.khc-in:disabled{color:var(--ink-soft);opacity:1}
.khc-date{min-width:110px} .khc-num{width:62px;text-align:center} .khc-txt{min-width:94px}
.khc-kq{min-width:68px} .khc-kq.ok{color:#2E6B3E;font-weight:700} .khc-kq.no{color:#B23A2E;font-weight:700}
.ks-link{color:var(--brass-deep);cursor:pointer} .ks-link:hover{text-decoration:underline}
/* Form Kế hoạch chi tiết trong 1 dự án */
.khc-sec{margin-bottom:18px}
.khc-sec-h{font-size:12px;font-weight:800;letter-spacing:.5px;color:var(--ink);padding-bottom:6px;margin-bottom:11px;border-bottom:2px solid var(--brass)}
.khc-form{display:grid;grid-template-columns:repeat(auto-fill,minmax(155px,1fr));gap:11px 14px}
.khc-f{display:flex;flex-direction:column;gap:4px;min-width:0}
.khc-f>label{font-size:11px;color:var(--ink-soft);font-weight:600;line-height:1.2}
.khc-f .khc-in{width:100%;border:1px solid var(--line-strong);background:var(--card);border-radius:var(--r-sm);padding:7px 9px;font-size:12.5px}
.khc-f .khc-in:focus{border-color:var(--brass);outline:none}
.khc-f .khc-calc{padding:7px 9px;font-weight:700;color:var(--brass-deep);background:var(--paper);border-radius:var(--r-sm);border:1px dashed var(--line-strong);font-variant-numeric:tabular-nums}
/* Kế hoạch chi tiết theo hạng mục (v4.9) */
.khhm-table{min-width:1560px}
.khhm-table td{padding:4px 5px}
.khhm-table .ks-name{min-width:190px;text-align:left}
.khhm-in{width:100%;border:1px solid var(--line-strong);background:var(--card);border-radius:6px;padding:5px 6px;font-size:12px;color:var(--ink)}
.khhm-in:focus{border-color:var(--brass);outline:none}
.khhm-pb.pb-nm{background:#EAF3EC;border-color:#9CC6A6}
.khhm-pb.pb-tm{background:#F3ECF3;border-color:#C6A6C6}
.khhm-pb.pb-tp{background:#F5ECE8;border-color:#D6B3A3}
.khhm-del{border:1px solid var(--line-strong);background:var(--card);color:var(--bad);border-radius:6px;width:26px;height:26px;cursor:pointer;font-size:12px;line-height:1}
.khhm-del:hover{background:var(--bad-bg);border-color:var(--bad)}
.bar{height:7px;background:var(--line);border-radius:4px;overflow:hidden;min-width:70px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--brass),var(--brass-deep));border-radius:4px}
.bar.green i{background:var(--ok)} .bar.red i{background:var(--bad)}
.proj-card{padding:15px 18px;border-bottom:1px solid var(--line);cursor:pointer;transition:background .12s}
.proj-card:hover{background:#FBF9F5}
.proj-card:last-child{border-bottom:none}
.proj-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:4px}
.proj-grid .proj-card{border:1px solid var(--line);border-radius:var(--r);background:var(--card)}
.proj-grid .proj-card:hover{background:#FBF9F5}
@media(max-width:820px){.proj-grid{grid-template-columns:1fr}}
.proj-top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;flex-wrap:wrap}
.proj-top b{font-size:14.5px}
.proj-meta{font-size:12px;color:var(--ink-soft);margin-top:3px;display:flex;gap:12px;flex-wrap:wrap}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.toolbar input,.toolbar select{padding:8px 11px;border:1.5px solid var(--line-strong);border-radius:var(--r-sm);background:var(--card)}
.toolbar input{flex:1;min-width:150px}

/* ====== MODAL ====== */
.modal-bg{position:fixed;inset:0;background:rgba(36,27,20,.5);display:none;align-items:flex-start;justify-content:center;z-index:120;padding:30px 16px;overflow-y:auto;backdrop-filter:blur(2px)}
.modal-bg.open{display:flex}
.modal{background:var(--card);border-radius:16px;width:100%;max-width:560px;box-shadow:0 30px 80px rgba(0,0,0,.35);animation:up .18s ease}
@keyframes up{from{transform:translateY(14px);opacity:0}}
.modal-head{display:flex;justify-content:space-between;align-items:center;padding:16px 20px;border-bottom:1px solid var(--line)}
.modal-head h3{font-size:16px;font-weight:700}
.modal-x{width:30px;height:30px;border-radius:8px;display:flex;align-items:center;justify-content:center;color:var(--ink-soft);font-size:18px}
.modal-x:hover{background:var(--paper)}
.modal-body{padding:18px 20px;max-height:65vh;overflow-y:auto}
.modal-foot{padding:14px 20px;border-top:1px solid var(--line);display:flex;justify-content:space-between;gap:10px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}
@media(max-width:520px){.grid2{grid-template-columns:1fr}}

/* ====== TOAST ====== */
#toasts{position:fixed;bottom:84px;left:50%;transform:translateX(-50%);z-index:300;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
.toast{background:var(--wood-800);color:#fff;padding:10px 18px;border-radius:99px;font-size:13px;font-weight:500;box-shadow:0 8px 24px rgba(0,0,0,.3);animation:up .2s ease}
.toast.err{background:var(--bad)}

/* ====== MOBILE ====== */
.bottom-nav{display:none}
/* Hamburger + drawer (mobile) */
.pm-burger{display:none;background:none;border:none;font-size:22px;color:var(--wood-900);cursor:pointer;padding:2px 10px 2px 0;line-height:1}
.pm-drawer-overlay{display:none;position:fixed;inset:0;background:rgba(20,15,10,.5);z-index:70;opacity:0;transition:opacity .25s}
.pm-drawer-overlay.open{opacity:1}
.pm-drawer{position:fixed;top:0;left:0;bottom:0;width:82%;max-width:320px;background:linear-gradient(180deg,var(--wood-900),var(--wood-800));z-index:71;transform:translateX(-100%);transition:transform .28s cubic-bezier(.4,0,.2,1);display:flex;flex-direction:column;box-shadow:2px 0 24px rgba(0,0,0,.4)}
.pm-drawer.open{transform:translateX(0)}
.pm-drawer-head{padding:calc(16px + env(safe-area-inset-top)) 20px 14px;border-bottom:1px solid var(--wood-700);position:relative}
.pm-drawer-brand{font-family:var(--serif);font-size:25px;font-weight:600;color:var(--brass);letter-spacing:.3px;line-height:1}
.pm-drawer-sub{font-size:9.5px;letter-spacing:3px;color:rgba(203,162,90,.55);text-transform:uppercase;margin-top:4px;font-family:Arial, sans-serif}
.pm-drawer-x{position:absolute;top:calc(14px + env(safe-area-inset-top));right:16px;background:none;border:none;color:#BBB0A2;font-size:18px;cursor:pointer;padding:4px 8px}
.pm-drawer-nav{flex:1;overflow-y:auto;padding:10px 12px}
.pm-drawer-nav .nav-group-label{padding:14px 20px 5px;font-size:9px;font-weight:700;letter-spacing:2.5px;text-transform:uppercase;color:rgba(203,162,90,.42);font-family:Arial, sans-serif}
.pm-drawer-nav .nav-divider{height:1px;background:rgba(255,255,255,.07);margin:8px 6px}
.pm-drawer-nav button{display:flex;align-items:center;gap:11px;width:100%;text-align:left;background:none;border:none;color:rgba(255,255,255,.56);font-family:inherit;font-size:13px;font-weight:500;padding:11px 20px;margin:1px 10px;border-radius:9px;cursor:pointer;min-height:44px;transition:all .18s}
.pm-drawer-nav button:hover{color:rgba(255,255,255,.92);background:rgba(255,255,255,.05)}
.pm-drawer-nav button.active{color:#F1E4C8;background:linear-gradient(90deg,rgba(203,162,90,.22),rgba(203,162,90,.09));font-weight:600;box-shadow:inset 2px 0 0 var(--brass)}
.pm-drawer-nav button:active{background:rgba(185,138,60,.14)}
.pm-drawer-user{padding:14px 18px calc(16px + env(safe-area-inset-bottom));border-top:1px solid rgba(255,255,255,.07)}
@media(max-width:860px){
  .sidebar{display:none}
  .main{margin-left:0;padding:16px 14px 96px}
  .topbar h2{font-size:23px}
  .bottom-nav{display:flex;position:fixed;bottom:0;left:0;right:0;background:rgba(43,33,26,.97);backdrop-filter:blur(12px);z-index:60;padding:6px 4px calc(6px + env(safe-area-inset-bottom));justify-content:space-around;border-top:1px solid var(--wood-700)}
  .pm-burger{display:block}
  .bottom-nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:7px 2px;color:#9C9182;font-size:10px;font-weight:600;border-radius:9px;max-width:90px;min-height:48px;justify-content:center;position:relative}
  .bottom-nav button.active{color:var(--brass)}
  .bottom-nav button.active::after{content:'';position:absolute;top:0;left:50%;transform:translateX(-50%);width:24px;height:3px;border-radius:0 0 4px 4px;background:linear-gradient(90deg,var(--brass),#CBA25A)}
  .tbl-wrap{overflow-x:auto;margin:0 -18px;padding:0 18px}
  .kpi .val{font-size:20px}

  /* — Cỡ chữ & vùng chạm cho công trường — */
  body,td,th,input,select,textarea,button{font-size:13.5px}
  .btn{min-height:40px;padding:9px 14px}
  .icon-btn{width:38px;height:38px}

  /* — BẢNG → THẺ trên điện thoại — */
  table.tbl-mb{width:100%;min-width:0!important;border-collapse:separate;border-spacing:0}
  table.tbl-mb thead{display:none}
  table.tbl-mb tbody,table.tbl-mb tr,table.tbl-mb td{display:block;width:auto}
  table.tbl-mb tr{background:var(--card);border:1px solid var(--line);border-radius:11px;padding:11px 13px;margin-bottom:9px;box-shadow:var(--shadow)}
  table.tbl-mb td{border:none!important;padding:4px 0!important;display:flex;align-items:flex-start;gap:10px;text-align:left!important}
  table.tbl-mb td::before{content:attr(data-label);flex:none;width:92px;font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.4px;color:var(--ink-faint);padding-top:2px}
  table.tbl-mb td:first-child{padding-bottom:8px!important;margin-bottom:6px;border-bottom:1px solid var(--line)!important}
  table.tbl-mb td:first-child::before{display:none}
  table.tbl-mb td:first-child>*{font-size:15px}
  table.tbl-mb .tbl-wrap,.tbl-wrap:has(table.tbl-mb){overflow-x:visible!important;margin:0!important;padding:0!important}

  /* — Modal kiểu bottom-sheet — */
  .modal-bg{align-items:flex-end!important}
  .modal{width:100%!important;max-width:100%!important;max-height:94vh!important;border-radius:16px 16px 0 0!important;margin:0!important}

  /* — Project tabs cuộn ngang mượt — */
  .pj-tabs{overflow-x:auto;flex-wrap:nowrap!important;-webkit-overflow-scrolling:touch}
}
.tbl-wrap{overflow-x:auto}
.hide{display:none!important}
.icon-btn{width:30px;height:30px;border-radius:8px;display:inline-flex;align-items:center;justify-content:center;color:var(--ink-soft)}
.icon-btn:hover{background:var(--paper);color:var(--ink)}
.muted{color:var(--ink-faint);font-size:12px}
.section-label{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:1px;color:var(--brass-deep);margin:18px 0 8px}
.phase-head{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 18px;background:#FBF8F1;border-top:1px solid var(--line);border-left:3px solid var(--brass);font-weight:700;font-size:13px}
.phase-head:first-child{border-top:none;border-radius:var(--r) var(--r) 0 0}
.phase-head .cnt{font-size:11.5px;font-weight:600;color:var(--ink-soft);background:var(--card);border:1px solid var(--line);padding:2px 9px;border-radius:99px}
.photo-grid{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.photo-thumb{position:relative;width:84px;height:84px;border-radius:8px;overflow:hidden;border:1.5px solid var(--line-strong);background:var(--paper)}
.photo-thumb img{width:100%;height:100%;object-fit:cover;cursor:pointer;display:block}
.photo-thumb button{position:absolute;top:3px;right:3px;width:20px;height:20px;border-radius:50%;background:rgba(36,27,20,.75);color:#fff;font-size:11px;line-height:1;display:flex;align-items:center;justify-content:center}
.approve-box{background:#FBF4E6;border:1px solid var(--brass-soft);border-radius:8px;padding:10px 12px;font-size:13px;margin-bottom:12px}

/* ★ Nhóm 3 — Gantt chart */
.gantt-wrap{overflow-x:auto;background:var(--card);border-radius:var(--r);padding:0}
.gantt{display:grid;font-size:12px;min-width:600px}
.gantt-row{display:contents}
.gantt-row > div{padding:8px 10px;border-bottom:1px solid var(--line);background:var(--card)}
.gantt-row.head > div{background:#FBF8F1;font-weight:700;color:var(--ink-soft);font-size:11px;text-transform:uppercase;letter-spacing:.5px;border-bottom:1.5px solid var(--line-strong);position:sticky;top:0;z-index:2}
.gantt-row.phase > div{background:#FBF4E6;font-weight:700;color:var(--brass-deep);border-left:3px solid var(--brass)}
.gantt-name{position:sticky;left:0;z-index:1;background:var(--card);box-shadow:1px 0 0 var(--line)}
.gantt-row.head .gantt-name,.gantt-row.phase .gantt-name{z-index:3}
.gantt-bar-cell{position:relative;height:32px;padding:0!important;background:repeating-linear-gradient(90deg,transparent 0,transparent 23px,#F5EFE3 23px,#F5EFE3 24px)!important}
.gantt-bar{position:absolute;top:6px;height:20px;border-radius:6px;background:linear-gradient(90deg,var(--brass),var(--brass-deep));color:#fff;font-size:10.5px;display:flex;align-items:center;padding:0 6px;white-space:nowrap;overflow:hidden;box-shadow:0 1px 3px rgba(0,0,0,.15);cursor:pointer}
.gantt-bar.done{background:linear-gradient(90deg,#7CB342,#558B2F)}
.gantt-bar.late{background:linear-gradient(90deg,#E53935,#B71C1C)}
.gantt-bar.pause{background:linear-gradient(90deg,#999,#666)}
.gantt-bar:hover{transform:translateY(-1px);box-shadow:0 3px 8px rgba(0,0,0,.25)}
.gantt-today{position:absolute;top:0;bottom:0;width:2px;background:#E53935;z-index:1;pointer-events:none}
.gantt-legend{display:flex;gap:14px;padding:10px 14px;font-size:11.5px;color:var(--ink-soft);flex-wrap:wrap;border-top:1px solid var(--line)}
.gantt-legend span{display:inline-flex;align-items:center;gap:5px}
.gantt-legend i{display:inline-block;width:14px;height:10px;border-radius:3px;background:linear-gradient(90deg,var(--brass),var(--brass-deep))}
.gantt-legend i.done{background:#558B2F} .gantt-legend i.late{background:#B71C1C} .gantt-legend i.pause{background:#666}
/* ★ Gantt v2 — lớp Kế hoạch↔Thực tế + trạng thái + in PDF */
.gantt-bar.run{background:linear-gradient(90deg,var(--brass),var(--brass-deep))}
.gantt-bar.blocked{background:linear-gradient(90deg,#FB8C00,#E65100)}
.gantt-bar.wait{background:linear-gradient(90deg,#42A5F5,#1565C0)}
.gantt-bar.notstarted{background:#E5E1D8;color:#6B7280;box-shadow:none;border:1px dashed #B8B2A4}
.gantt-bar.plan{background:transparent;border:1.5px dashed var(--brass);color:var(--brass-deep);box-shadow:none;opacity:.9}
.gantt-bar.actual{top:11px;height:12px;font-size:9.5px}
.gantt-bar.plan.thin{top:5px;height:8px;padding:0;border-radius:4px}
.gantt-bar.crit{outline:2px solid #B71C1C;outline-offset:1px;box-shadow:0 0 0 1px #fff,0 1px 5px rgba(183,28,28,.45)}
.g-toggle{display:inline-flex;gap:6px;align-items:center;margin-left:8px;flex-wrap:wrap}
.g-toggle button{padding:5px 11px;font-size:12px;border:1px solid var(--line-strong);background:var(--card);border-radius:var(--r-sm);cursor:pointer;color:var(--ink-soft)}
.g-toggle button.on{background:var(--brass);color:#fff;border-color:var(--brass-deep);font-weight:600}
.gantt-legend i.run{background:linear-gradient(90deg,var(--brass),var(--brass-deep))} .gantt-legend i.blocked{background:#E65100} .gantt-legend i.wait{background:#1565C0} .gantt-legend i.notstarted{background:#D8D2C6} .gantt-legend i.plan{background:transparent;border:1.5px dashed var(--brass)}
.gantt-print-head{display:none}
#ganttPrintHolder{display:none}
@media print{
  body.print-gantt{background:#fff!important}
  body.print-gantt>*{display:none!important}
  body.print-gantt>#ganttPrintHolder{display:block!important;position:absolute;left:0;top:0;width:100%}
  #ganttPrintHolder .gantt-print-head{display:block;margin-bottom:10px}
  #ganttPrintHolder .gantt-wrap{overflow:visible!important;border:none!important;box-shadow:none!important;max-height:none!important}
  #ganttPrintHolder .g-toolbar,#ganttPrintHolder .g-toggle{display:none!important}
  #ganttPrintHolder .gantt-bar,#ganttPrintHolder .gantt-legend i{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  #ganttPrintHolder .gantt-bar-cell{background:#fff!important;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  #ganttPrintHolder .gantt-row.phase>div,#ganttPrintHolder .gantt-row.head>div{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}

/* ★ Nhóm 3 — Calendar Lịch hẹn */
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:1px;background:var(--line);border:1px solid var(--line-strong);border-radius:var(--r-sm);overflow:hidden}
.cal-head{background:#FBF8F1;padding:7px;text-align:center;font-size:11px;font-weight:700;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.5px}
.cal-day{background:var(--card);padding:6px;min-height:78px;font-size:11px;position:relative}
.cal-day.off{background:#FAFAF7;color:var(--ink-faint)}
.cal-day.today{background:#FFF9EB;box-shadow:inset 0 0 0 2px var(--brass)}
.cal-day .d{font-weight:700;font-size:12px;color:var(--ink);display:block;margin-bottom:3px}
.cal-day .ev{display:block;background:var(--brass-soft);color:var(--brass-deep);padding:1px 5px;border-radius:4px;margin:1px 0;font-size:10.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer;font-weight:600}
.cal-day .ev:hover{background:var(--brass);color:#fff}
.cal-day .ev.done{background:var(--ok-bg);color:var(--ok)}
.cal-day .ev.cancel{background:var(--bad-bg);color:var(--bad);text-decoration:line-through}
@media(max-width:520px){.cal-day{min-height:54px;padding:4px}.cal-day .ev{font-size:9.5px}.cal-day .d{font-size:11px}}
/* ★ Bảng công việc (module Công việc) — theo mẫu bản Công ty */
.cv-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:14px}
.cv-head h2{font-size:22px}
.cv-filter{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:16px}
.cv-filter input,.cv-filter select{padding:8px 11px;border:1px solid var(--line-strong);border-radius:var(--r-sm);font-size:13px;background:var(--card)}
.cv-filter #cvSearch{min-width:180px}
.cv-pill{padding:8px 12px;border:1px solid var(--line-strong);border-radius:var(--r-sm);background:var(--card);cursor:pointer;font-size:12.5px;color:var(--ink-soft)}
.cv-pill.on{background:var(--brass);color:#fff;border-color:var(--brass-deep);font-weight:600}
.cv-sort{display:inline-flex;align-items:center;gap:4px;font-size:12.5px;color:var(--ink-soft)}
.cv-sort button{padding:5px 10px;border:1px solid var(--line-strong);border-radius:var(--r-sm);background:var(--card);cursor:pointer;font-size:12px;color:var(--ink-soft)}
.cv-sort button.on{background:var(--brass-soft);color:var(--brass-deep);border-color:var(--brass);font-weight:600}
.cv-overview{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:16px}
@media(max-width:900px){.cv-overview{grid-template-columns:1fr}}
.cv-ovpanel{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px}
.cv-ovpanel h3{margin:0 0 14px;font-size:15px}
.cv-ovbody{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.cv-donut{width:132px;height:132px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex:none}
.cv-donut-hole{width:88px;height:88px;border-radius:50%;background:var(--card);display:flex;flex-direction:column;align-items:center;justify-content:center}
.cv-donut-hole .n{font-size:28px;font-weight:800;color:var(--ink);line-height:1}
.cv-donut-hole .l{font-size:11px;color:var(--ink-soft)}
.cv-scards{flex:1;min-width:200px;display:grid;grid-template-columns:1fr 1fr;gap:8px}
.cv-scard{border:1px solid var(--line);border-left:3px solid;border-radius:var(--r-sm);padding:8px 11px;background:var(--paper)}
.cv-scard .t{font-size:11.5px;color:var(--ink-soft);display:flex;align-items:center;gap:5px}
.cv-scard .t .dot{width:8px;height:8px;border-radius:50%;display:inline-block}
.cv-scard .v{font-size:19px;font-weight:800;margin-top:2px}
.cv-scard .v span{font-size:12px;font-weight:600;color:var(--ink-soft)}
.cal-hd{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;font-size:14px}
.cal-nav button{padding:4px 9px;border:1px solid var(--line-strong);background:var(--card);border-radius:var(--r-sm);cursor:pointer;font-size:12px;margin-left:4px}
.cal-dows{display:grid;grid-template-columns:repeat(7,1fr);gap:1px;margin-bottom:2px}
.cal-dows span{text-align:center;font-size:10.5px;font-weight:700;color:var(--ink-soft);padding:3px 0}
.cv-ovpanel .cal-day{min-height:46px;padding:4px;cursor:pointer}
.cv-ovpanel .cal-day.has:hover{background:var(--brass-soft)}
.cv-ovpanel .cal-day.sel{box-shadow:inset 0 0 0 2px var(--brass-deep)}
.cal-dot{display:inline-block;margin-top:2px;min-width:16px;height:16px;line-height:16px;text-align:center;border-radius:8px;font-size:9.5px;font-weight:700;color:#fff;padding:0 3px}
.cal-dot.late{background:#C0392B} .cal-dot.up{background:#2F6DB5} .cal-dot.done{background:#4E9A51}
.cal-legend{display:flex;gap:14px;margin-top:9px;font-size:11.5px;color:var(--ink-soft)}
.cal-legend i{width:9px;height:9px;border-radius:50%;display:inline-block;margin-right:4px}
.cal-legend i.late{background:#C0392B} .cal-legend i.up{background:#2F6DB5} .cal-legend i.done{background:#4E9A51}
.cal-hint{margin-top:10px;font-size:11.5px;color:var(--ink-faint);text-align:center;padding:8px}
.cal-sel{margin-top:10px;border-top:1px solid var(--line);padding-top:8px}
.cal-sel b{font-size:12.5px}
.cal-selrow{padding:5px 6px;font-size:12px;border-radius:5px;cursor:pointer;display:flex;gap:6px;align-items:center}
.cal-selrow:hover{background:var(--paper)}
/* ★ Biên bản nghiệm thu — mẫu chọn loại + trang in */
.kb-dod{font-size:11px;color:#2E6B3E;background:#EAF3EC;border-radius:5px;padding:2px 6px;margin:4px 0 2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kb-tg{font-size:10.5px;color:var(--ink-soft);background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:1px 7px}
.tvp-list{display:flex;flex-wrap:wrap;gap:6px}
.tvp-chip{padding:5px 11px;border:1px solid var(--line-strong);border-radius:14px;font-size:12.5px;cursor:pointer;background:var(--card);color:var(--ink-soft);user-select:none}
.tvp-chip:hover{border-color:var(--brass)}
.tvp-chip.on{background:var(--brass);color:#fff;border-color:var(--brass-deep);font-weight:600}
.bb-loai-list{display:grid;gap:8px}
.bb-loai-card{border:1.5px solid var(--line-strong);border-radius:var(--r-sm);padding:10px 12px;cursor:pointer;background:var(--card)}
.bb-loai-card b{display:block;font-size:13px}
.bb-loai-card span{font-size:11.5px;color:var(--ink-soft)}
.bb-loai-card.on{border-color:var(--brass);background:var(--brass-soft)}
#docPrintHolder{display:none}
.doc-print{display:none}
.doc-head{text-align:center;margin-bottom:6px}
.doc-org{font-weight:800;font-size:14px}
.doc-sub{font-size:11px;color:#555}
.doc-title{text-align:center;font-size:22px;margin:14px 0 2px}
.doc-loai{text-align:center;font-size:13px;font-style:italic;margin-bottom:16px}
.doc-info{width:100%;border-collapse:collapse;margin-bottom:14px;font-size:13px}
.doc-info td{border:1px solid #999;padding:6px 9px;vertical-align:top}
.doc-info td.k{width:32%;font-weight:600;background:#f3f3f3}
.doc-sec{margin:10px 0;font-size:13px}
.doc-sec p{margin:4px 0 0;white-space:pre-wrap}
.doc-sign{display:flex;gap:20px;margin-top:34px;text-align:center;font-size:12px}
.doc-sign>div{flex:1}
.doc-sign .ln{height:58px}
.doc-sign .nm{border-top:1px dotted #999;padding-top:3px}
.doc-foot{margin-top:26px;text-align:right;font-size:11px;color:#666}
@media print{
  body.print-doc>*{display:none!important}
  body.print-doc>#docPrintHolder{display:block!important;position:absolute;left:0;top:0;width:100%}
  #docPrintHolder .doc-print{display:block;font-family:Arial;color:#111}
}

/* ★ Nhóm 3 — Thầu phụ card */
.sub-card{background:var(--card);border:1px solid var(--line);border-radius:var(--r-sm);padding:14px 16px;margin-bottom:8px;cursor:pointer;transition:all .12s}
.sub-card:hover{background:#FBF9F5;border-color:var(--brass-soft)}
.rating{color:var(--brass-deep);font-size:13px;letter-spacing:1px}

/* ★ v2.0 — Sidebar phân nhóm */
.nav-group-label{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:1.2px;color:var(--brass);padding:14px 12px 5px;opacity:.8}
.nav-divider{height:1px;background:var(--wood-700);margin:6px 12px}

/* ★ v2.0 — Stat summary row */
.stat-row{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:18px}
.stat-item{flex:1;min-width:130px;background:var(--card);border:1px solid var(--line);border-radius:var(--r-sm);padding:12px 14px;box-shadow:var(--shadow)}
.stat-item .si-lbl{font-size:10.5px;font-weight:600;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.7px}
.stat-item .si-val{font-size:20px;font-weight:800;margin-top:3px;font-variant-numeric:tabular-nums}
.stat-item .si-sub{font-size:11px;color:var(--ink-faint);margin-top:1px}

/* ★ v2.0 — Timeline hiện trường */
.timeline{padding:0 18px 18px}
.tl-item{position:relative;padding:0 0 18px 28px;border-left:2px solid var(--line)}
.tl-item:last-child{border-left-color:transparent;padding-bottom:0}
.tl-dot{position:absolute;left:-7px;top:3px;width:12px;height:12px;border-radius:50%;background:var(--brass);border:2px solid var(--card)}
.tl-dot.ok{background:var(--ok)} .tl-dot.bad{background:var(--bad)} .tl-dot.warn{background:var(--warn)}
.tl-time{font-size:11px;color:var(--ink-faint);margin-bottom:2px}
.tl-content{font-size:13.5px}

/* ★ v2.0 — Bảng tài chính */
.fin-section{margin-bottom:22px}
.fin-section h4{font-size:12px;font-weight:700;color:var(--brass-deep);text-transform:uppercase;letter-spacing:.7px;padding:10px 18px;background:#FBF8F1;border-bottom:1px solid var(--line);border-top:1px solid var(--line)}
.fin-total{display:flex;justify-content:space-between;align-items:center;padding:12px 18px;background:linear-gradient(90deg,var(--wood-900),var(--wood-800));color:#fff;border-radius:0 0 var(--r) var(--r);font-weight:700}
.fin-total .ft-lbl{font-size:13px;opacity:.85} .fin-total .ft-val{font-size:18px}

/* ★ v2.0 — Risk matrix */
.risk-matrix{display:grid;grid-template-columns:repeat(5,1fr);gap:3px;margin:10px 0}
.risk-cell{padding:6px;text-align:center;border-radius:4px;font-size:11px;font-weight:700;cursor:pointer;transition:.1s}
.risk-cell:hover{transform:scale(1.06)}

/* ★ v2.0 — Document list */
.doc-item{display:flex;align-items:center;gap:12px;padding:11px 18px;border-bottom:1px solid var(--line);cursor:pointer;transition:.12s}
.doc-item:hover{background:#FBF9F5}
.doc-item:last-child{border-bottom:none}
.doc-icon{width:38px;height:38px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:20px;flex:none;background:var(--paper);border:1px solid var(--line)}
.doc-meta{flex:1;min-width:0}
.doc-meta b{display:block;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.doc-meta span{font-size:11.5px;color:var(--ink-faint)}

/* ★ v2.0 — NC/Rủi ro badge */
.sev-1{background:#FFEBEE;color:#C62828} .sev-2{background:#FFF3E0;color:#E65100}
.sev-3{background:#FFFDE7;color:#F9A825} .sev-4{background:#E8F5E9;color:#2E7D32}

/* ★ v2.1 — TRANG CHI TIẾT DỰ ÁN */
.pj-head{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px 20px;margin-bottom:0;box-shadow:var(--shadow)}
.pj-back{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--ink-soft);font-weight:600;margin-bottom:10px}
.pj-back:hover{color:var(--brass-deep)}
.pj-title-row{display:flex;align-items:flex-start;justify-content:space-between;gap:14px;flex-wrap:wrap}
.pj-title-row h3{font-size:19px;font-weight:700;letter-spacing:-.3px;display:inline}
.pj-sub{font-size:12.5px;color:var(--ink-soft);margin-top:5px}
.pj-acts{display:flex;gap:7px;flex-wrap:wrap}
.pj-acts .btn{padding:7px 13px;font-size:12.5px}
.pj-tabs{display:flex;gap:2px;overflow-x:auto;background:var(--card);border:1px solid var(--line);border-top:none;border-radius:0 0 var(--r) var(--r);padding:0 8px;margin-bottom:18px;scrollbar-width:thin}
.pj-tabs button{display:flex;align-items:center;gap:6px;padding:12px 14px;font-size:13px;font-weight:600;color:var(--ink-soft);white-space:nowrap;border-bottom:2.5px solid transparent;flex:none}
.pj-tabs button:hover{color:var(--ink)}
.pj-tabs button.on{color:var(--brass-deep);border-bottom-color:var(--brass)}
.pj-tabs .cnt{font-size:10.5px;font-weight:700;background:var(--paper);border:1px solid var(--line);border-radius:99px;padding:1px 6px;color:var(--ink-faint)}
.pj-tabs button.on .cnt{background:var(--brass-soft);border-color:var(--brass-soft);color:var(--brass-deep)}
@media(max-width:860px){.pj-tabs button{padding:11px 11px;font-size:12.5px}}

/* ★ v2.1 — Gantt kế hoạch phân cấp (Giai đoạn → Hạng mục → Đầu việc) */
.plan-legend{display:flex;gap:16px;align-items:center;flex-wrap:wrap;padding:12px 18px;border-bottom:1px solid var(--line)}
.plan-legend label{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;cursor:pointer}
.plan-legend i{width:16px;height:10px;border-radius:3px;display:inline-block}
.plan-legend i.kh{background:repeating-linear-gradient(45deg,#B0BEC5 0,#B0BEC5 3px,#CFD8DC 3px,#CFD8DC 6px)}
.plan-legend i.tt{background:linear-gradient(90deg,var(--brass),var(--brass-deep))}
.pl-grid{display:grid;font-size:12.5px;min-width:720px}
.pl-row{display:contents}
.pl-row>div{border-bottom:1px solid var(--line);background:var(--card);padding:9px 10px}
.pl-row.head>div{background:#FBF8F1;font-weight:700;font-size:10.5px;text-transform:uppercase;letter-spacing:.6px;color:var(--ink-soft);border-bottom:1.5px solid var(--line-strong);position:sticky;top:0;z-index:3}
.pl-row.phase>div{background:linear-gradient(90deg,#FBF4E6,#FFFDF8);font-weight:700;color:var(--brass-deep);font-size:12px;text-transform:uppercase;letter-spacing:.7px;border-left:3px solid var(--brass);cursor:pointer}
.pl-row.task>div{background:#FDFCFA;font-size:12px}
.pl-name{position:sticky;left:0;z-index:2;background:var(--card);box-shadow:1px 0 0 var(--line)}
.pl-row.head .pl-name{z-index:4;background:#FBF8F1}
.pl-row.phase .pl-name{z-index:3;background:linear-gradient(90deg,#FBF4E6,#FFFDF8)}
.pl-row.task .pl-name{background:#FDFCFA;padding-left:26px}
.pl-track{position:relative;height:38px;padding:0!important;background:repeating-linear-gradient(90deg,transparent 0,transparent 27px,#F1EBE0 27px,#F1EBE0 28px)!important}
.pl-row.task .pl-track{height:30px}
.pl-bar{position:absolute;height:13px;border-radius:4px;font-size:9.5px;color:#fff;display:flex;align-items:center;padding:0 5px;white-space:nowrap;overflow:hidden;cursor:pointer;box-shadow:0 1px 2px rgba(0,0,0,.12)}
.pl-bar.kh{top:5px;background:repeating-linear-gradient(45deg,#B0BEC5 0,#B0BEC5 4px,#CFD8DC 4px,#CFD8DC 8px);color:#37474F;border:1px solid #90A4AE}
.pl-bar.tt{top:20px;background:linear-gradient(90deg,var(--brass),var(--brass-deep))}
.pl-bar.tt.done{background:linear-gradient(90deg,#7CB342,#558B2F)}
.pl-bar.tt.late{background:linear-gradient(90deg,#E53935,#B71C1C)}
.pl-row.task .pl-bar.tt{top:9px;height:12px}
.pl-row.task .pl-bar.kh{top:3px;height:10px}
.pl-bar:hover{filter:brightness(1.08);z-index:5}
.pl-today{position:absolute;top:0;bottom:0;width:2px;background:#E53935;z-index:1;pointer-events:none}
.pl-pct{display:inline-block;background:var(--info);color:#fff;font-size:10px;font-weight:700;padding:1px 6px;border-radius:99px;margin-left:6px}
.pl-pct.zero{background:var(--line-strong);color:var(--ink-soft)}
.pl-pct.full{background:var(--ok)}
.hm-badges{display:flex;gap:4px;flex-wrap:wrap;margin-top:3px}
.hm-badges span{font-size:9.5px;font-weight:700;padding:1px 6px;border-radius:4px;text-transform:uppercase;letter-spacing:.3px}
.b-req{background:#E3F2FD;color:#1565C0} .b-opt{background:var(--pause-bg);color:var(--pause)}
.b-nokh{background:#FFF8E1;color:#F57F17} .b-nodv{background:#FCE4EC;color:#AD1457}
.pl-caret{display:inline-block;width:14px;color:var(--ink-faint);font-size:10px;transition:transform .15s}
.pl-caret.open{transform:rotate(90deg)}

/* ★ v2.2 — Cây chọn thư viện công việc */
.tv-tree{border:1px solid var(--line-strong);border-radius:var(--r-sm);max-height:46vh;overflow-y:auto;background:#FDFCFA}
.tv-gd{border-bottom:1px solid var(--line-strong)}
.tv-gd:last-child{border-bottom:none}
.tv-gd-h{display:flex;align-items:center;gap:8px;padding:9px 12px;background:linear-gradient(90deg,#FBF4E6,#FFFDF8);cursor:pointer;font-size:13px;border-left:3px solid var(--brass);flex-wrap:wrap}
.tv-gd-h b{color:var(--brass-deep)}
.tv-hm{border-top:1px solid var(--line)}
.tv-hm-h{display:flex;align-items:center;gap:7px;padding:7px 12px 7px 26px;cursor:pointer;font-size:12.5px;background:var(--card);flex-wrap:wrap}
.tv-hm-h:hover{background:#FBF9F5}
.tv-cvs{padding:2px 0 6px 46px;background:#FDFCFA}
.tv-cv{display:flex;align-items:flex-start;gap:7px;padding:3px 12px 3px 0;font-size:12px;cursor:pointer;line-height:1.45}
.tv-cv:hover{color:var(--brass-deep)}
.tv-cv input{margin-top:2px;flex:none}
.tv-meta{margin-left:auto;font-size:10.5px;color:var(--ink-faint);white-space:nowrap;padding-left:10px;flex:none}
.tv-badge{font-size:10px;font-weight:700;background:var(--paper);border:1px solid var(--line);border-radius:99px;padding:1px 7px;color:var(--ink-soft);white-space:nowrap}
.tv-badge.opt{background:var(--pause-bg);border-color:var(--pause-bg);color:var(--pause)}
.tv-badge.dup{background:var(--warn-bg);border-color:var(--warn-bg);color:var(--warn)}
.tv-f{font-size:9.5px;font-weight:700;padding:1px 5px;border-radius:4px;white-space:nowrap}
.tv-f.ap{background:#E3F2FD;color:#1565C0} .tv-f.tp{background:#F3E5F5;color:#6A1B9A}
.tv-f.kh{background:#FFF3E0;color:#E65100} .tv-f.qc{background:#E8F5E9;color:#2E7D32}
.tv-hint{font-size:11.5px;color:var(--ok);background:var(--ok-bg);border-radius:6px;padding:6px 9px;margin-top:5px;line-height:1.5}
.tv-hint:empty{display:none}

/* ★ v2.3 — DASHBOARD ĐIỀU HÀNH */
.dash-hd{display:flex;justify-content:space-between;align-items:flex-start;gap:14px;flex-wrap:wrap;margin-bottom:16px}
.dash-hd h2{font-size:20px;font-weight:700;letter-spacing:-.3px}
.dash-hd .sub{font-size:12.5px;color:var(--ink-soft);margin-top:3px}
.dash-hd .sub b{color:var(--brass-deep)}
.dash-filters{display:flex;gap:7px;flex-wrap:wrap;align-items:center}
.dash-filters select{padding:7px 10px;font-size:12.5px;min-width:120px}
.k6{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;margin-bottom:16px}
@media(max-width:1200px){.k6{grid-template-columns:repeat(3,1fr)}}
@media(max-width:640px){.k6{grid-template-columns:repeat(2,1fr)}}
.k6 .kc{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:13px 14px;box-shadow:var(--shadow);position:relative}
.k6 .kc .kl{font-size:9.5px;font-weight:700;text-transform:uppercase;letter-spacing:.7px;color:var(--ink-faint);display:flex;align-items:center;gap:5px}
.k6 .kc .kl::before{content:'';width:6px;height:6px;border-radius:50%;background:var(--info);flex:none}
.k6 .kc.bad .kl::before{background:var(--bad)} .k6 .kc.ok .kl::before{background:var(--ok)}
.k6 .kc.warn .kl::before{background:var(--warn)}
.k6 .kc .kv{font-size:25px;font-weight:800;margin-top:6px;font-variant-numeric:tabular-nums;letter-spacing:-.5px}
.k6 .kc.bad .kv{color:var(--bad)} .k6 .kc.ok .kv{color:var(--ok)}
.k6 .kc .kh2{font-size:10.5px;color:var(--ink-faint);margin-top:2px}
.k6 .kc .kbar{height:4px;background:var(--line);border-radius:99px;margin-top:8px;overflow:hidden}
.k6 .kc .kbar i{display:block;height:100%;background:linear-gradient(90deg,var(--brass),var(--brass-deep));border-radius:99px}

.dash-grid{display:grid;grid-template-columns:1fr 320px;gap:14px;align-items:start}
@media(max-width:1100px){.dash-grid{grid-template-columns:1fr}}
.dash-3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}

/* ★ v4.2 — Nhóm ngành nghề áp dụng cho từng Loại hình dự án (lọc thư viện & bộ việc mẫu).
   TK=thiết kế · TC=nội thất(SX xưởng+lắp đặt, tên cũ) · XD=xây dựng/hoàn thiện · CH=chung mọi loại.
   Giữ NGUYÊN kết quả lọc cho 3 loại hình cũ; chỉ mở rộng cho loại hình xây dựng. */
function nhomTheoLoaiHinh(loaiHinh){
  const n = vnorm(loaiHinh||'');
  if(n === 'thiet ke')                       return ['TK','TX','CH'];          // đơn vị thiết kế: nội thất + kiến trúc/kết cấu
  if(n === 'thi cong')                       return ['TC','CH'];
  if(n.indexOf('xay dung') > -1 && n.indexOf('noi that') > -1) return ['TK','TX','XD','TC','CH']; // Tổng thầu
  if(n.indexOf('xay dung') > -1)             return ['TX','XD','CH'];          // xây dựng: kèm thiết kế kiến trúc/kết cấu
  return ['TK','TC','CH']; // 'Thiết kế & Thi công' (nội thất) và mặc định — GIỮ NGUYÊN phạm vi cũ
}

function seedPreviewHtml(loai){

      + '<b style="color:var(--brass-deep)">Loại hình Xây dựng</b> có bộ đầu việc rất chi tiết theo giai đoạn '
      + '(chuẩn bị & khởi công, móng, kết cấu thô, xây tô, cơ điện M&E, hoàn thiện…).<br>'
      + 'Sau khi tạo dự án, mở dự án → tab <b>Kế hoạch</b> → bấm <b>“⚡ Lập kế hoạch từ thư viện”</b> '
      + 'để chọn đúng các hạng mục & đầu việc xây dựng cần làm (tự xếp lịch theo ngày bắt đầu).</div>';
  }
  const n = (loai||'').toLowerCase();
  const onlyTK = n === 'thiết kế'.toLowerCase();
  const onlyTC = n === 'thi công'.toLowerCase();
  const list = SEED_PREVIEW.filter(t => !(onlyTK && t[2]==='TC') && !(onlyTC && t[2]==='TK'));
  // Nhóm theo giai đoạn giữ thứ tự
  const stages = [];
  list.forEach(t => { if(!stages.includes(t[1])) stages.push(t[1]); });
  let html = '<div style="font-size:12.5px;color:var(--ink-soft);line-height:1.7">';
  html += '<b style="color:var(--brass-deep)">'+list.length+' đầu việc</b> sẽ được tạo theo '+stages.length+' giai đoạn:';
  stages.forEach(s => {
    const items = list.filter(t => t[1]===s);
    html += '<div style="margin-top:6px"><b>'+esc(s)+'</b><ul style="margin:2px 0 0 16px;padding:0">';
    items.forEach(t => { html += '<li>'+esc(t[0])+'</li>'; });
    html += '</ul></div>';
  });
  html += '</div>';
  return html;
}
/* ★ v3.0 — CHỐNG TÍNH TRÙNG CHI PHÍ
   Nguyên tắc MỘT NGUỒN SỰ THẬT cho mỗi loại tiền ra:
   · Thầu phụ  → chỉ lấy từ module Thầu phụ (ttthauphu đã thanh toán)
   · Mua sắm   → chỉ lấy từ module Mua sắm (muasam đã nhận)
   · Chi phí   → các khoản còn lại ghi trực tiếp (vật tư lẻ, nhân công, vận chuyển…)
   Vì vậy 'Thầu phụ' KHÔNG còn trong danh mục Loại chi phí để tránh nhập hai lần. */
const LOAI_CP   = ['Vật tư','Nhân công','Vận chuyển','Máy móc & công cụ','Chi phí quản lý','Chi phí khác'];

/* Tổng chi phí của 1 dự án — dùng THỐNG NHẤT ở mọi màn hình.
   daCode rỗng = toàn công ty. Trả về từng cấu phần để hiển thị minh bạch. */
function projCost(daCode){
  const inDA = x => !daCode || x['Mã DA']===daCode;
  const cpAll = (S.chiphi||[]).filter(inDA);
  // Loại trừ bản ghi cũ có Loại='Thầu phụ' nếu dự án đã quản lý qua module Thầu phụ
  const coTP = (S.ttthauphu||[]).some(x=>inDA(x));
  const cp = cpAll.filter(x=>!(coTP && (x['Loại chi phí']==='Thầu phụ' || x['Khoản mục']==='SUB')));
  const trung = cpAll.filter(x=> coTP && (x['Loại chi phí']==='Thầu phụ' || x['Khoản mục']==='SUB'));
  const vTrucTiep = cp.reduce((a,x)=>a+(Number(x['Số tiền (đ)'])||0),0);
  const vThauPhu  = (S.ttthauphu||[]).filter(x=>inDA(x)&&x['Trạng thái']==='Đã thanh toán')
                      .reduce((a,x)=>a+ttpChi(x),0);
  const vMuaSam   = (S.muasam||[]).filter(x=>inDA(x)&&x['Trạng thái']==='Đã nhận')
                      .reduce((a,x)=>a+(Number(x['Tổng tiền'])||0),0);
  return {
    trucTiep: vTrucTiep, thauPhu: vThauPhu, muaSam: vMuaSam,
    tong: vTrucTiep + vThauPhu + vMuaSam,
    nghiTrung: trung,                                   // bản ghi bị loại vì nghi trùng
    vNghiTrung: trung.reduce((a,x)=>a+(Number(x['Số tiền (đ)'])||0),0),
    soKhoan: cp.length
  };
}
/* Doanh thu ghi nhận của 1 dự án = giá trị HĐ + phát sinh ĐÃ CHẤP THUẬN */
function projRevenue(daCode){
  const d = S.duan.find(x=>x['Mã DA']===daCode) || {};
  const hd = Number(d['Giá trị HĐ (đ)'])||0;
  const ps = (S.phatsinh||[]).filter(x=>x['Mã DA']===daCode && x['Trạng thái']==='Đã chấp thuận')
              .reduce((a,x)=>a+(Number(x['Giá trị (đ)'])||0),0);
  return {hd, ps, tong: hd+ps};
}

/* ★ v3.0 — PHÂN CẤP PHÊ DUYỆT THEO GIÁ TRỊ (theo quy chế MDC) */
const NGUONG_DUYET = [
  {max: 30000000,  cap:'Quản lý',      role:'quanly'},      // < 30 triệu
  {max: 200000000, cap:'Giám đốc',     role:'giamdoc'},     // 30 – 200 triệu
  {max: Infinity,  cap:'Tổng giám đốc',role:'tonggiamdoc'}  // ≥ 200 triệu
];
function capDuyetTheoTien(soTien){
  const v = Number(soTien)||0;
  for(const n of NGUONG_DUYET) if(v < n.max) return n;
  return NGUONG_DUYET[NGUONG_DUYET.length-1];
}
/* Gợi ý người duyệt phù hợp với số tiền */
function goiYNguoiDuyet(soTien){
  const n = capDuyetTheoTien(soTien);
  const rank = {quanly:1, truongphong:1, giamdoc:2, tonggiamdoc:3};
  const min = rank[n.role]||1;
  return (S.nhansu||[]).filter(x=>x['Trạng thái']!=='Nghỉ việc' && (rank[x['Vai trò']]||0) >= min);
}

/* ---------- Lưu trữ cục bộ ---------- */
const store = {
  get api(){
    // Nếu localStorage lưu URL KHÁC với DEFAULT_API hiện tại VÀ chưa được người dùng
    // chỉnh tay (cờ mdcpm_api_custom), thì bỏ URL cũ — luôn theo DEFAULT_API mới nhất.
    // Khắc phục lỗi URL backend cũ kẹt trong localStorage trên từng thiết bị.
    const saved = localStorage.getItem('mdcpm_api');
    // ★ v4.0 — URL nằm trong danh sách phế bỏ thì DỌN NGAY, bất kể cờ custom
    if (saved && OBSOLETE_APIS.indexOf(saved) > -1) {
      localStorage.removeItem('mdcpm_api');
      localStorage.removeItem('mdcpm_api_custom');
      return DEFAULT_API;
    }
    const isCustom = localStorage.getItem('mdcpm_api_custom') === '1';
    if (saved && (isCustom || saved === DEFAULT_API)) return saved;
    if (saved && saved !== DEFAULT_API) localStorage.removeItem('mdcpm_api');
    return DEFAULT_API;
  },
  set api(v){ localStorage.setItem('mdcpm_api', v.trim()); localStorage.setItem('mdcpm_api_custom', '1'); },
  loadState(){ try{ S = JSON.parse(localStorage.getItem('mdcpm_state')) || S; }catch(e){} },
  saveState(){ localStorage.setItem('mdcpm_state', JSON.stringify(S)); },
  get pending(){ try{ return JSON.parse(localStorage.getItem('mdcpm_pending'))||[]; }catch(e){ return []; } },
  set pending(v){ localStorage.setItem('mdcpm_pending', JSON.stringify(v)); },
  get session(){ try{ return JSON.parse(localStorage.getItem('mdcpm_session')); }catch(e){ return null; } },
  set session(v){ v ? localStorage.setItem('mdcpm_session', JSON.stringify(v)) : localStorage.removeItem('mdcpm_session'); }
};

/* ---------- Gọi API ---------- */
async function apiGet(action){
  const url = store.api;
  if(!url) throw new Error('Chưa cấu hình URL Apps Script');
  const res = await fetch(url + '?app=pm&action=' + action, {method:'GET'});
  return res.json();
}
async function apiPost(action, data){
  const url = store.api;
  if(!url) throw new Error('Chưa cấu hình URL Apps Script');
  // Loại field nội bộ __newRef (chỉ dùng ở client để nhận mã thật về) khỏi payload
  const payload = {};
  Object.keys(data||{}).forEach(k=>{ if(k!=='__newRef') payload[k]=data[k]; });
  const res = await fetch(url, {
    method:'POST',
    headers:{'Content-Type':'text/plain;charset=utf-8'}, // chống CORS preflight
    body: JSON.stringify({app:'pm', action, data: payload, user: user ? user['Họ tên'] : ''})
  });
  return res.json();
}

function setSync(state, text){
  const dot = document.getElementById('syncDot'), t = document.getElementById('syncText');
  if(!dot) return;
  dot.className = 'sync-dot' + (state==='off'?' off':state==='pending'?' pending':'');

async function flushPending(){
  const ops = store.pending;
  if(!ops.length) return;
  try{
    const url = store.api;
    const res = await fetch(url, {method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},
      body: JSON.stringify({app:'pm', action:'batch', ops, user: user ? user['Họ tên'] : ''})});
    const j = await res.json();
    if(j.ok && j.results){
      // Lọc bỏ các op có lỗi logic vĩnh viễn (action không tồn tại, sai cấu trúc…)
      // Giữ lại op chỉ fail vì lý do tạm thời
      const keep = [];
      const permanentErrors = [];
      j.results.forEach((r, i) => {
        if(r.ok) return; // OK rồi → bỏ khỏi pending
        const e = String(r.error||'').toLowerCase();
        // Lỗi logic vĩnh viễn — bỏ luôn để không retry mãi
        if(e.includes('không hợp lệ') || e.includes('thiếu') || e.includes('không tìm thấy')) {
          permanentErrors.push(ops[i].action + ': ' + r.error);
        } else {
          keep.push(ops[i]);
        }
      });
      store.pending = keep;
      const cleared = ops.length - keep.length - permanentErrors.length;
      if(cleared) toast('Đã gửi ' + cleared + ' thao tác chờ lên Sheets');
      if(permanentErrors.length) {
        toast('⚠ ' + permanentErrors.length + ' thao tác bị loại bỏ — cần Deploy lại Apps Script', true);
        console.warn('Pending ops bị bỏ:', permanentErrors);
      }
    } else if(j.ok){
      store.pending = []; toast('Đã gửi ' + ops.length + ' thao tác chờ lên Sheets');
    }
  }catch(e){ /* lỗi mạng → giữ hàng đợi, thử lại lần sau */ }
}

function pushOp(action, data){
  // Cập nhật cục bộ ngay (optimistic), sau đó đẩy lên Sheets
  // PHÂN BIỆT 2 loại lỗi:
  //   - Lỗi LOGIC backend (j.ok=false): rollback optimistic, báo lỗi cụ thể, KHÔNG đẩy pending
  //   - Lỗi MẠNG (catch reject): giữ optimistic, đẩy vào pending, tự retry sau
  const snapshot = JSON.stringify({duan:S.duan,congviec:S.congviec,chiphi:S.chiphi,nhansu:S.nhansu,thaubo:S.thaubo,lichhen:S.lichhen});
  store.saveState(); render();

  function rollback(msg){
    try {
      const snap = JSON.parse(snapshot);
      S.duan = snap.duan; S.congviec = snap.congviec; S.chiphi = snap.chiphi;
      S.nhansu = snap.nhansu; S.thaubo = snap.thaubo||[]; S.lichhen = snap.lichhen||[];
      store.saveState(); render();
    } catch(e) {}
    toast('❌ Server từ chối: ' + msg + ' — cần Deploy lại Apps Script', true);
    setSync('off', 'Lỗi: ' + msg);
  }

  apiPost(action, data).then(j=>{
    if(j.ok){
      if(j.code && data.__newRef){
        // Cập nhật mã thật do server sinh vào record local (key 'Mã DA' cho dự án)
        const ref = data.__newRef;
        if('Mã DA' in ref) ref['Mã DA'] = j.code;
        else if('Mã CV' in ref) ref['Mã CV'] = j.code;
        else ref.code = j.code;
      }
      setSync('ok','Đã lưu lên Sheets');
      // KHÔNG syncAll ngay: getAll đọc sớm có thể chưa thấy bản ghi vừa lưu (nhất là
      // hạng mục/kế hoạch) và ghi đè làm mất dữ liệu local vừa tạo. Trạng thái local
      // đã đúng; đồng bộ định kỳ hoặc mở lại app sẽ tự khớp với Sheets.
      return;
    }
    // Lỗi logic — kiểm tra có fallback không
    const errMsg = String(j.error||'').toLowerCase();
    const isUnknownAction = errMsg.includes('không hợp lệ') || errMsg.includes('khong hop le');
    // Fallback: nếu seedNewProject không có ở backend cũ → chuyển sang saveProject (không tạo việc mẫu)
    if(isUnknownAction && action === 'seedNewProject' && data.project){
      return apiPost('saveProject', data.project).then(j2 => {
        if(j2.ok){
          setSync('ok','Đã lưu dự án');
          toast('✓ Đã lưu dự án (cần Deploy backend mới để tự tạo việc mẫu)');
          syncAll(false);
        } else { rollback(j2.error || 'Fallback saveProject cũng fail'); }
      }).catch(() => { rollback('Lỗi mạng khi fallback saveProject'); });
    }
    rollback(j.error || 'Lỗi không rõ');
  }).catch(err=>{
    // Lỗi mạng thật — giữ optimistic, đẩy pending
    const p = store.pending; delete data.__newRef; p.push({action, data}); store.pending = p;
    setSync('pending', p.length + ' thao tác chờ gửi');
    toast('📡 Mất kết nối — đã lưu tạm, sẽ tự gửi lại khi có mạng', true);
  });
}

async function doLogin(){

  if(!store.api){ err.textContent = 'Chưa cấu hình kết nối. Bấm "Cấu hình kết nối" bên dưới.'; return; }
  if(!u || !p){ err.textContent = 'Nhập tài khoản và mật khẩu.'; return; }
  err.textContent = 'Đang kiểm tra…';
  try{
    // ★ v4.0 — xác thực TẠI MÁY CHỦ: mật khẩu không bao giờ rời khỏi Sheets
    const res = await fetch(store.api, {method:'POST',
      headers:{'Content-Type':'text/plain;charset=utf-8'},
      body: JSON.stringify({action:'verifyLogin', username:u, password:p})});
    const j = await res.json();
    if(!j.ok){ err.textContent = j.error || 'Sai tài khoản hoặc mật khẩu.'; return; }
    const q = j.user || {};
    user = {'Mã NV':q.id||'', 'Họ tên':q.name||'', 'Vai trò':q.capBac||q['Vai trò']||'nhanvien',
            'Chức danh':q.roleTitle||'', 'SĐT':q.phone||'', 'Email':q.email||'',
            'Cấp duyệt':q.capDuyet||q['Cấp duyệt']||'', 'Trạng thái':'Đang làm việc'};
    store.session = {code:user['Mã NV']};
    err.textContent = '';
    enterApp();
  }catch(e){
    err.textContent = 'Không kết nối được máy chủ: ' + e.message;
  }
}

function can(action){
  const r = user ? capBacRank_(user['Vai trò']) : '';
  if(r === 'admin') return true;
  if(r === 'quanly') return action !== 'staff' && action !== 'deleteAny';
  if(r === 'nhanvien') return ['addExpense','editTask'].includes(action);
  return false;
}
// Quy đổi 5 cấp bậc → 3 mức quyền nội bộ của PM
function capBacRank_(vaiTro){
  const v = String(vaiTro||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/đ/g,'d').trim();
  if(v==='tonggiamdoc'||v==='giamdoc'||v.indexOf('giam doc')>-1||v==='admin'||v==='super_admin') return 'admin';
  if(v==='truongphong'||v==='quanly'||v.indexOf('truong phong')>-1||v.indexOf('quan ly')>-1||v==='manager'||v==='pm') return 'quanly';
  return 'nhanvien';
}

/* ★ PHÂN QUYỀN PM:
   - XEM: mọi nhân sự có tài khoản đều thấy TẤT CẢ dự án, công việc, chi phí, lịch hẹn.
   - SỬA/CẬP NHẬT: chỉ 3 nhóm:
       (1) cấp Quản lý trở lên (quanly/admin),
       (2) người Phụ trách dự án,
       (3) người Phụ trách công việc đó (chỉ cho riêng công việc mình phụ trách).
   Không còn dùng cột "Thành viên" để xét quyền. */
function canEditProject(d){
  if(!user || !d) return false;
  const r = capBacRank_(user['Vai trò']);
  if(r === 'admin' || r === 'quanly') return true;
  return (d['Phụ trách']||'') === (user['Họ tên']||'');   // phụ trách dự án
}
// Quyền sửa 1 công việc: cấp QL trở lên, HOẶC phụ trách dự án, HOẶC phụ trách chính công việc đó
function canEditTask(c){
  if(!user || !c) return false;
  const r = capBacRank_(user['Vai trò']);
  if(r === 'admin' || r === 'quanly') return true;
  const me = user['Họ tên'] || '';
  if((c['Phụ trách']||'') === me) return true;            // phụ trách công việc
  const d = S.duan.find(x=>x['Mã DA']===c['Mã DA']);
  return !!d && (d['Phụ trách']||'') === me;              // phụ trách dự án chứa việc
}

function visibleProjects(){ return user ? S.duan : []; }
function visibleProjectCodes(){
  return new Set((S.duan||[]).map(d => d['Mã DA']));
}
function visibleTasks(){ return user ? tvSong(S.congviec) : []; }
function visibleExpenses(){ return user ? S.chiphi : []; }
function visibleAppointments(){ return user ? S.lichhen : []; }

/* ★ Nhóm 3 — Zalo deep link (mức 1: dùng được ngay, không cần Zalo OA token)
   - Mobile: zalo://conversation?phone=... mở app Zalo (nếu đã cài)
   - PC/fallback: zalo.me/{sdt} mở web Zalo */
function zaloLink(sdt){
  if(!sdt) return '';
  const num = String(sdt).replace(/[^0-9+]/g,'');
  // Chuẩn hóa số VN: 0xxx → 84xxx
  const clean = num.startsWith('0') ? '84' + num.slice(1) : num.replace(/^\+/,'');
  return 'https://zalo.me/' + clean;
}
function btnZalo(sdt, label){
  if(!sdt) return '';
  return '<a class="btn btn-ghost" style="padding:5px 10px;font-size:12px" target="_blank" rel="noopener" href="' + esc(zaloLink(sdt)) + '">💬 ' + (label||'Zalo') + '</a>';
}

/* ---------- Tiện ích ---------- */
const fmt = n => (Number(n)||0).toLocaleString('vi-VN');
const fmtTr = n => { n = Number(n)||0; return n >= 1e9 ? (n/1e9).toFixed(2).replace('.',',')+' tỷ' : n >= 1e6 ? (n/1e6).toFixed(1).replace('.',',')+' tr' : fmt(n)+' đ'; };
const esc = s => String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const today = () => new Date().toISOString().slice(0,10);
function daysLeft(d){ if(!d) return null; return Math.ceil((new Date(d) - new Date(today())) / 86400000); }
function toast(msg, isErr){
  const t = document.createElement('div'); t.className = 'toast' + (isErr?' err':''); t.textContent = msg;
  document.getElementById('toasts').appendChild(t);
  setTimeout(()=>t.remove(), 3200);
}
function tagTT(v){
  const map = {'Hoàn thành':'t-ok','Đã phê duyệt':'t-ok','Đang làm':'t-info','Đang triển khai':'t-info','Chờ duyệt':'t-warn','Tạm dừng':'t-pause','Chưa bắt đầu':'t-pause','Hủy':'t-bad','Nghỉ việc':'t-bad','Từ chối':'t-bad','Đang làm việc':'t-ok','Đã duyệt':'t-ok'};
  return '<span class="tag ' + (map[v]||'t-brass') + '">' + esc(v||'—') + '</span>';
}
function tagUT(v){ return '<span class="tag ' + (v==='Cao'?'t-bad':v==='Thấp'?'t-pause':'t-warn') + '">' + esc(v||'—') + '</span>'; }

function gSearch(q){
  const panel=document.getElementById('gsPanel'); if(!panel) return;
  q=String(q||'').trim().toLowerCase();
  if(!q){ panel.classList.remove('open'); panel.innerHTML=''; return; }
  const norm=s=>String(s||'').toLowerCase(), hit=(...fs)=>fs.some(f=>norm(f).includes(q));
  window.__gsActs=[];
  const item=(ic,t,s,fn)=>{ const i=window.__gsActs.length; window.__gsActs.push(fn);
    return '<div class="gs-item" onmousedown="gsGo('+i+')"><span class="gs-ic">'+ic+'</span><div style="min-width:0">'
      + '<div style="font-weight:600;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">'+esc(t||'(không tên)')+'</div>'
      + '<div class="muted" style="font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">'+esc(s)+'</div></div></div>'; };
  const grp=(lbl,arr)=> arr.length ? '<div class="gs-grp">'+lbl+' ('+arr.length+')</div>'+arr.join('') : '';
  let html='';
  html += grp('Dự án', (S.duan||[]).filter(d=>hit(d['Tên dự án'],d['Mã DA'],d['Khách hàng'])).slice(0,6)

  html += grp('Công việc', tvSong(S.congviec||[]).filter(c=>hit(c['Tên công việc'],c['Phụ trách'])).slice(0,6)
    .map(c=>item('✓',c['Tên công việc'],projName(c['Mã DA'])+' · '+(c['Trạng thái']||''),()=>formTask(c['Mã CV']))));
  html += grp('Khách hàng', (S.leads||[]).filter(l=>hit(l.ten,l.sdt)).slice(0,6)
    .map(l=>item('◎',l.ten||l.code,(l.sdt||'')+(l.loaiCT?' · '+l.loaiCT:''),()=>khMoHoSo(l.code))));
  html += grp('Hồ sơ & tài liệu', (S.hosoTL||[]).filter(x=>hit(x['Tiêu đề'],x['Mã hồ sơ'],x['Mã TL'],x['Loại'])).slice(0,5)

  html += grp('Thầu phụ', (S.thaubo||[]).filter(x=>hit(x['Tên / Công ty'],x['Loại thầu'],x['SĐT'])).slice(0,4)
    .map(x=>item('◈',x['Tên / Công ty'],(x['Loại thầu']||'')+(x['SĐT']?' · '+x['SĐT']:''),()=>go('thaubo'))));

/* ================= TRUNG TÂM THÔNG BÁO (CHUÔNG) ================= */
function conLeftN(x){ return (Number(x['Giá trị (đ)'])||0)-(Number(x['Đã thu (đ)'])||0); }
function buildNotifs(){
  const cv = tvSong(S.congviec||[]);
  const over = cv.filter(c=>c['Trạng thái']!=='Hoàn thành'&&c['Hạn hoàn thành']&&daysLeft(c['Hạn hoàn thành'])<0)
    .sort((a,b)=>(a['Hạn hoàn thành']>b['Hạn hoàn thành']?1:-1));
  const soon = cv.filter(c=>{const d=daysLeft(c['Hạn hoàn thành']);return c['Trạng thái']!=='Hoàn thành'&&d!==null&&d>=0&&d<=3;})
    .sort((a,b)=>(a['Hạn hoàn thành']>b['Hạn hoàn thành']?1:-1));
  let q=[]; try{ q=dashQueue(); }catch(e){}
  const tt = S.thanhtoan||[];
  const thuOver = tt.filter(x=>conLeftN(x)>0&&x['Trạng thái']!=='Hủy'&&daysLeft(x['Ngày đến hạn'])!==null&&daysLeft(x['Ngày đến hạn'])<0)
    .sort((a,b)=>(a['Ngày đến hạn']>b['Ngày đến hạn']?1:-1));
  const thuSoon = tt.filter(x=>{const d=daysLeft(x['Ngày đến hạn']);return conLeftN(x)>0&&x['Trạng thái']!=='Hủy'&&d!==null&&d>=0&&d<=7;})
    .sort((a,b)=>(a['Ngày đến hạn']>b['Ngày đến hạn']?1:-1));
  const daOver = (S.duan||[]).filter(d=>d['Trạng thái']==='Đang triển khai'&&d['Ngày kết thúc DK']&&daysLeft(d['Ngày kết thúc DK'])<0);
  return {over,soon,q,thuOver,thuSoon,daOver, urgent: over.length+thuOver.length+q.length+daOver.length};
}
function renderNotifBadge(){
  const b=document.getElementById('notifBadge'); if(!b) return;
  let n=0; try{ n=buildNotifs().urgent; }catch(e){}
  b.textContent = n>99?'99+':n; b.style.display = n?'flex':'none';
  if(!window.__notifDocBound){ window.__notifDocBound=true;
    document.addEventListener('click', function(e){ if(!e.target.closest('.notif-wrap')){ const p=document.getElementById('notifPanel'); if(p) p.classList.remove('open'); } });
  }
}
function toggleNotif(e){
  if(e) e.stopPropagation();
  const p=document.getElementById('notifPanel'); if(!p) return;
  if(p.classList.contains('open')){ p.classList.remove('open'); return; }
  const N=buildNotifs(); window.__notifActs=[];
  const row=(sev,ic,t,s,fn)=>{ const i=window.__notifActs.length; window.__notifActs.push(fn);
    return '<div class="nf-i" onclick="notifGo('+i+')"><span class="nf-ic '+sev+'">'+ic+'</span><div style="min-width:0">'

  const sec=(lbl,items)=> items.length ? '<div class="nf-h">'+lbl+' ('+items.length+')</div>'+items.slice(0,6).join('')
      +(items.length>6?'<div class="nf-more">… và '+(items.length-6)+' mục nữa</div>':'') : '';
  const icQ={ps:'📋',mua:'🛒',cp:'₫',cv:'✓',tp:'◈'};
  let html='';
  html += sec('⛔ Quá hạn',
    [...N.daOver.map(d=>row('bad','▤','Dự án trễ hạn: '+(d['Tên dự án']||d['Mã DA']),'Quá ngày kết thúc dự kiến '+(d['Ngày kết thúc DK']||''),()=>openProject(d['Mã DA']))),
     ...N.over.map(c=>row('bad','✓',c['Tên công việc'],projName(c['Mã DA'])+' · trễ '+Math.abs(daysLeft(c['Hạn hoàn thành']))+' ngày',()=>formTask(c['Mã CV']))),
     ...N.thuOver.map(x=>row('bad','₫','Đợt thu quá hạn: '+(x['Tên đợt']||'Đợt thu'),projName(x['Mã DA'])+' · '+fmtTr(conLeftN(x))+' · trễ '+Math.abs(daysLeft(x['Ngày đến hạn']))+' ngày',()=>formPayment(x['Mã TT'])))]);
  html += sec('⏳ Chờ bạn duyệt',
    N.q.map(x=>row('warn', icQ[x.t]||'•', x.lbl+': '+(x.ten||'—'), projName(x.da)+(x.v?' · '+fmtTr(x.v):''), ()=>{ if(window[x.open]) window[x.open](x.code); })));
  html += sec('🔔 Sắp tới hạn',
    [...N.soon.map(c=>row('info','✓',c['Tên công việc'],projName(c['Mã DA'])+' · '+(daysLeft(c['Hạn hoàn thành'])===0?'hạn hôm nay':'còn '+daysLeft(c['Hạn hoàn thành'])+' ngày'),()=>formTask(c['Mã CV']))),
     ...N.thuSoon.map(x=>row('info','₫','Đợt thu: '+(x['Tên đợt']||'Đợt thu'),projName(x['Mã DA'])+' · '+fmtTr(conLeftN(x))+' · '+(daysLeft(x['Ngày đến hạn'])===0?'hạn hôm nay':'còn '+daysLeft(x['Ngày đến hạn'])+' ngày'),()=>formPayment(x['Mã TT'])))]);
  p.innerHTML = '<div class="nf-head">Thông báo <span class="muted" style="font-weight:400;font-size:11px">'+(N.urgent?N.urgent+' việc cần chú ý':'Mọi thứ ổn')+'</span></div>'
    + (html || '<div class="nf-empty">🎉 Không có thông báo — mọi thứ đúng tiến độ.</div>');
  p.classList.add('open');
}
function notifGo(i){ const a=(window.__notifActs||[])[i]; const p=document.getElementById('notifPanel'); if(p) p.classList.remove('open'); if(typeof a==='function') a(); }
function go(view){

  const addable = {
    duan:false,
    congviec:false, chiphi:true, nhansu:can('staff'), bienban:can('edit'),
    thaubo:can('edit'), lichhen:true,
    khachhang:false, // readonly mirror CRM
    hientruong:true, muasam:can('edit'), phatsinh:can('edit'),
    taichinh:false, hosoTL:false, anToanCL:true, khongPH:true, ruiro:true, kiemtra:false,
    duanDetail:false // trang chi tiết có nút riêng trong từng tab
  };
  btnAdd.classList.toggle('hide', !addable[view]);
  render(); window.scrollTo(0,0);
}

    chiphi:vExpenses, lichhen:vAppointments, thaubo:vSubcontractors,

  }[currentView];
  root.innerHTML = fn ? fn() : '<div class="empty">Màn hình đang phát triển</div>';
  try { napBangDienThoai_(); } catch(e){}
  try { renderNotifBadge(); } catch(e){}
}

// ★ CHUẨN HÓA MOBILE: biến bảng thành thẻ trên điện thoại (thêm class tbl-mb + data-label)
function napBangDienThoai_(){
  if(window.innerWidth > 860) return;
  document.querySelectorAll('#viewRoot table').forEach(function(tb){
    if(tb.classList.contains('gantt')) return;      // Gantt giữ nguyên cuộn ngang
    if(tb.classList.contains('no-mb')) return;       // bảng phức tạp (Kế hoạch chung) giữ nguyên, cuộn ngang
    var ths = tb.querySelectorAll('thead th');
    if(!ths.length) return;
    var labels = Array.prototype.map.call(ths, function(th){ return th.textContent.trim(); });
    tb.classList.add('tbl-mb');
    tb.querySelectorAll('tbody tr').forEach(function(tr){
      Array.prototype.forEach.call(tr.children, function(td, i){
        if(labels[i] && !td.getAttribute('data-label')) td.setAttribute('data-label', labels[i]);
      });
    });
  });
}
// Chạy lại khi xoay/đổi kích thước màn hình
window.addEventListener('resize', function(){ try{ napBangDienThoai_(); }catch(e){} });
