  });
  body += '</div>';

  openModal('Lập kế hoạch từ thư viện — '+d['Tên dự án'], body, function save(){
    const start = V('tvStart') || today();
    const picked = [];
    lib.forEach((g,gi) => g[2].forEach((hm,hi) => {
      const hEl = document.querySelector('.tv-h[data-g="'+gi+'"][data-h="'+hi+'"]');
      if(!hEl || !hEl.checked) return;
      const cvs = [];
      hm[2].forEach((cv,ci) => {
        const cEl = document.querySelector('.tv-c[data-g="'+gi+'"][data-h="'+hi+'"][data-c="'+ci+'"]');
        if(cEl && cEl.checked) cvs.push(cv);
      });
      if(cvs.length || hEl.checked) picked.push({gd:g[0], hm:hm[0], tc:hm[1], cvs});
    }));
    if(!picked.length) return toast('Chưa chọn hạng mục nào', true);
    const skipSun = (document.getElementById('tvSkipSun')||{}).checked;
    tvApply(daCode, picked, start, skipSun);
  });
  setTimeout(tvSum, 30);
}
function tvToggleG(gi, on){
  document.querySelectorAll('.tv-h[data-g="'+gi+'"]').forEach(el=>{ el.checked = on; });
  document.querySelectorAll('.tv-c[data-g="'+gi+'"]').forEach(el=>{ el.checked = on; });
  tvSum();
}
function tvToggleH(gi, hi, on){
  document.querySelectorAll('.tv-c[data-g="'+gi+'"][data-h="'+hi+'"]').forEach(el=>{ el.checked = on; });
  tvSum();
}
function tvCheckAll(on){
  document.querySelectorAll('.tv-g,.tv-h,.tv-c').forEach(el=>{ el.checked = on; });
  tvSum();
}
function tvCheckReq(){
  document.querySelectorAll('.tv-h').forEach(el=>{
    const req = el.parentElement.querySelector('.tv-badge:not(.opt):not(.dup)');
    const isOpt = !!el.parentElement.querySelector('.tv-badge.opt');
    el.checked = !isOpt;
    document.querySelectorAll('.tv-c[data-g="'+el.dataset.g+'"][data-h="'+el.dataset.h+'"]').forEach(c=>{ c.checked = !isOpt; });
  });
  tvSum();
}
function tvSum(){
  const h = document.querySelectorAll('.tv-h:checked').length;
  const c = document.querySelectorAll('.tv-c:checked').length;
  const el = document.getElementById('tvSum');
  if(el) el.innerHTML = 'Sẽ tạo <b style="color:var(--brass-deep)">'+h+'</b> hạng mục · <b style="color:var(--brass-deep)">'+c+'</b> đầu việc';
}
// Tạo hàng loạt hạng mục + đầu việc, xếp ngày tuần tự
function tvApply(daCode, picked, startStr, skipSun){
  const d = S.duan.find(x=>x['Mã DA']===daCode);
  const iso = dt => dt.toISOString().slice(0,10);
  // Nhảy qua Chủ nhật nếu người dùng chọn
  const nextWork = dt => { const t = new Date(dt); if(skipSun) while(t.getDay()===0) t.setDate(t.getDate()+1); return t; };
  // Cộng n ngày LÀM VIỆC (không tính Chủ nhật nếu bật)
  const addWork = (dt, n) => {
    let t = nextWork(dt);
    for(let i=0; i<n; i++){ t.setDate(t.getDate()+1); if(skipSun) while(t.getDay()===0) t.setDate(t.getDate()+1); }
    return t;
  };
  let cursor = nextWork(new Date(startStr));
  const ops = [];
  let hmMax = 0, cvMax = 0;
  (S.hangmuc||[]).forEach(x=>{ const m=String(x['Mã HM']||'').match(/^HM(\d+)$/); if(m) hmMax=Math.max(hmMax,+m[1]); });
  S.congviec.forEach(x=>{ const m=String(x['Mã CV']||'').match(/^CV(\d+)$/); if(m) cvMax=Math.max(cvMax,+m[1]); });
  let nHM = 0, nCV = 0, thuTu = (S.hangmuc||[]).filter(h=>h['Mã DA']===daCode).length;

  picked.forEach(p => {
    const hmStart = new Date(cursor);
    const tasks = [];
    p.cvs.forEach(cv => {
      const bd = nextWork(cursor);
      const han = addWork(bd, cv[1]);
      tasks.push({ten:cv[0], bd:iso(bd), han:iso(han), p:cv[2], r:cv[3], f:cv[4]||''});
      cursor = addWork(han, 1); // việc sau bắt đầu ngày làm việc kế tiếp
    });
    const hmEnd = tasks.length ? new Date(tasks[tasks.length-1].han) : addWork(hmStart, 1);

    hmMax++; const maHM = 'HM' + String(hmMax).padStart(4,'0');
    thuTu++;
    const recHM = {'Mã HM':maHM,'Mã DA':daCode,'Tên hạng mục':p.hm,'Giai đoạn':p.gd,
      'Tính chất':p.tc,'Ngày bắt đầu KH':iso(hmStart),'Ngày kết thúc KH':iso(hmEnd),
      'Thứ tự':thuTu,'Ghi chú':'Tạo từ thư viện chuẩn MDC'};
    (S.hangmuc=S.hangmuc||[]).push(recHM);
    ops.push({action:'saveHangMuc', data:recHM});
    nHM++;

    tasks.forEach(t => {
      cvMax++; const maCV = 'CV' + String(cvMax).padStart(4,'0');
      const recCV = {'Mã CV':maCV,'Mã DA':daCode,'Mã HM':maHM,'Tên công việc':t.ten,
        'Giai đoạn':p.gd,'Phụ trách':'','Thầu phụ':'',
        'Ngày bắt đầu':t.bd,'Hạn hoàn thành':t.han,'Ngày hoàn thành':'',
        'Ưu tiên':t.p,'Trạng thái':'Chưa bắt đầu','Tiến độ (%)':0,
        'Ghi chú':'Vai trò đề xuất: '+t.r + (t.f==='ap'?' · cần trình BLĐ duyệt':t.f==='tp'?' · thường giao thầu phụ':t.f==='qc'?' · điểm kiểm soát chất lượng':t.f==='kh'?' · làm việc với khách hàng':'')};
      S.congviec.push(recCV);
      ops.push({action:'saveTask', data:recCV});
      nCV++;
    });
  });

  // Cập nhật ngày kết thúc dự kiến của dự án nếu kế hoạch dài hơn
  const lastEnd = iso(new Date(cursor.getTime() - 86400000));
  if(!d['Ngày kết thúc DK'] || d['Ngày kết thúc DK'] < lastEnd){
    d['Ngày kết thúc DK'] = lastEnd;
    ops.push({action:'saveProject', data:{'Mã DA':daCode,'Ngày kết thúc DK':lastEnd}});
  }

  closeModal();
  store.saveState(); render();
  toast('✓ Đã tạo '+nHM+' hạng mục · '+nCV+' đầu việc — đang gửi lên Sheets…');
  apiBatch(ops).then(j=>{
    if(j.ok){
      // Kiểm tra thật sự đã lưu chưa (đếm kết quả saveHangMuc thành công)
      const okHM = (j.results||[]).filter(r=>r&&r.ok).length;
      setSync('ok','Đã lưu kế hoạch lên Sheets ('+okHM+' mục)');
      // ⚠️ KHÔNG gọi syncAll ngay — tránh việc getAll đọc sớm (chưa kịp cập nhật)
      //   ghi đè & làm biến mất kế hoạch vừa tạo. Trạng thái local đã đúng và đã hiển thị.
      //   Lần đồng bộ định kỳ / mở lại sau sẽ tự khớp với Sheets.
    }
    else { toast('Server báo lỗi: '+(j.error||'?')+' — kiểm tra backend đã có saveHangMuc chưa', true); }
  }).catch(()=>{
    const pend = store.pending; ops.forEach(o=>pend.push(o)); store.pending = pend;
    setSync('pending', pend.length+' thao tác chờ gửi');
    toast('📡 Chưa gửi được — đã lưu tạm, sẽ tự gửi lại khi có mạng', true);
  });
}
// Gửi nhiều thao tác trong 1 lần gọi
async function apiBatch(ops){
  const url = store.api;
  if(!url) throw new Error('Chưa cấu hình URL Apps Script');
  const res = await fetch(url, {method:'POST',
    headers:{'Content-Type':'text/plain;charset=utf-8'},
    body: JSON.stringify({action:'batch', ops, user: user ? user['Họ tên'] : ''})});
  return res.json();
}

</script>
<script>

/* ================================================================
   ★ v2.4 — HỢP ĐỒNG THẦU PHỤ & LỊCH THANH TOÁN
   Quy tắc: 1 thầu phụ × 1 dự án = 1 hợp đồng, mỗi HĐ có nhiều đợt
   (tạm ứng · theo tiến độ · nghiệm thu · quyết toán · giữ lại BH)
================================================================ */

/* ---------- Tổng hợp số liệu 1 hợp đồng thầu phụ ---------- */
function hdtpStats(maHD){
  const hd  = (S.hdthauphu||[]).find(x=>x['Mã HĐTP']===maHD) || {};
  const dot = (S.ttthauphu||[]).filter(x=>x['Mã HĐTP']===maHD);
  const gt  = Number(hd['Giá trị HĐ (đ)'])||0;
  const daLap = dot.reduce((a,x)=>a+(Number(x['Giá trị (đ)'])||0),0);
  const daChi = dot.filter(x=>x['Trạng thái']==='Đã thanh toán').reduce((a,x)=>a+ttpChi(x),0);
  const choChi= dot.filter(x=>x['Trạng thái']==='Đã duyệt · chờ chi').reduce((a,x)=>a+ttpChi(x),0);
  const choDuyet = dot.filter(x=>x['Trạng thái']==='Đã nghiệm thu · chờ duyệt').reduce((a,x)=>a+(Number(x['Giá trị (đ)'])||0),0);
  const giu   = dot.filter(x=>x['Trạng thái']==='Đã thanh toán').reduce((a,x)=>a+ttpGiuLai(x),0);
  return {hd, dot, gt, daLap, daChi, choChi, choDuyet, giu,
          conLai: gt-daChi-giu, pct: gt?Math.round(daChi/gt*100):0, chuaLap: gt-daLap};
}

/* ---------- Form hợp đồng thầu phụ ---------- */
function formSubContract(code, daCode){
  const h = code ? (S.hdthauphu||[]).find(x=>x['Mã HĐTP']===code) : null;
  const isNew = !h;
  if(!can('edit')) return toast('Không có quyền', true);
  const da = h ? h['Mã DA'] : (daCode || window._dsDA || '');
  const st = code ? hdtpStats(code) : null;
  openModal(isNew?'Thêm hợp đồng giao thầu phụ':'Hợp đồng thầu phụ '+code,
    (st && st.dot.length ? '<div class="tv-hint" style="background:var(--paper);color:var(--ink)">'
      + 'Đã lập <b>'+st.dot.length+'</b> đợt · giá trị '+fmtTr(st.daLap)
      + (st.chuaLap>0?' · <span style="color:var(--warn)">chưa lập '+fmtTr(st.chuaLap)+'</span>':'')
      + (st.chuaLap<0?' · <span style="color:var(--bad)">vượt HĐ '+fmtTr(-st.chuaLap)+'</span>':'')
      + ' · đã chi '+fmtTr(st.daChi)+'</div>' : '')
    + fld('Nhà thầu phụ / Đối tác *', inpThauPhu('hcTP', h?.['Thầu phụ']||''))
    + fld('Thuộc dự án *','<select id="hcDA"><option value="">— Chọn dự án —</option>'
      + S.duan.map(d=>'<option value="'+d['Mã DA']+'"'+(da===d['Mã DA']?' selected':'')+'>'+esc(d['Tên dự án'])+'</option>').join('')+'</select>')
    + fld('Hạng mục giao thầu *', inp('hcHM', h?.['Hạng mục'],'text','vd: Thi công trần thạch cao + sơn nước toàn bộ căn hộ'))
    + '<div class="grid2">'
    + fld('Số hợp đồng', inp('hcSo', h?.['Số HĐ'],'text','vd: HĐTP-12/2026'))
    + fld('Ngày ký hợp đồng', inp('hcNgay', h?.['Ngày ký']||today(),'date'))
    + fld('Giá trị hợp đồng (đ) *', inp('hcGT', h?.['Giá trị HĐ (đ)']||'','number'))
    + fld('Tỷ lệ giữ lại (%) <span class="muted">retention</span>', inp('hcTL', h?.['Tỷ lệ giữ lại (%)']??5,'number'))
    + fld('Bảo hành (tháng)', inp('hcBH', h?.['Bảo hành (tháng)']||12,'number'))
    + fld('Trạng thái', sel('hcTT', TT_HDTP, h?.['Trạng thái']||'Đang hiệu lực'))
    + '</div>'
    + fld('Phạm vi công việc / Ghi chú','<textarea id="hcGC" rows="3" placeholder="Mô tả khối lượng, tiêu chuẩn nghiệm thu, vật tư ai cấp…">'+esc(h?.['Ghi chú']||'')+'</textarea>')
    + photoSection(h),
    function save(){
      if(!V('hcTP')) return toast('Chưa chọn thầu phụ', true);
      if(!V('hcDA')) return toast('Chưa chọn dự án', true);
      if(!V('hcHM')) return toast('Chưa nhập hạng mục giao thầu', true);
      if(!V('hcGT')) return toast('Chưa nhập giá trị hợp đồng', true);
      // chặn trùng: 1 thầu phụ × 1 dự án = 1 HĐ
      const dup = (S.hdthauphu||[]).find(x=>x['Mã HĐTP']!==code && x['Mã DA']===V('hcDA')
                   && vnorm(x['Thầu phụ']||'')===vnorm(V('hcTP')) && x['Trạng thái']!=='Hủy');
      if(dup && isNew && !confirm('Thầu phụ này đã có hợp đồng "'+(dup['Hạng mục']||dup['Mã HĐTP'])+'" trong dự án.\nVẫn tạo hợp đồng thứ hai?')) return;
      const rec = {'Mã HĐTP':code||'','Mã DA':V('hcDA'),'Thầu phụ':V('hcTP'),'Hạng mục':V('hcHM'),
        'Số HĐ':V('hcSo'),'Ngày ký':V('hcNgay'),'Giá trị HĐ (đ)':Number(V('hcGT'))||0,
        'Tỷ lệ giữ lại (%)':Number(V('hcTL'))||0,'Bảo hành (tháng)':Number(V('hcBH'))||0,
        'Trạng thái':V('hcTT'),'Ghi chú':V('hcGC'),'Ảnh':JSON.stringify(window.__photos||[])};
      const wasNew = isNew;
      if(isNew){ rec['Mã HĐTP']=tempCode('HĐTP',S.hdthauphu||[],'Mã HĐTP'); (S.hdthauphu=S.hdthauphu||[]).push(rec); }
      else Object.assign(h, rec);
      closeModal(); pushOp('saveSubContract', rec);
      if(wasNew) setTimeout(()=>{ if(confirm('Đã tạo hợp đồng.\nLập luôn lịch thanh toán (tạm ứng + các đợt) từ mẫu?')) formSubSchedule(rec['Mã HĐTP']); }, 250);
    },
    (!isNew && can('deleteAny')) ? function(){
      const n = (S.ttthauphu||[]).filter(x=>x['Mã HĐTP']===code).length;
      if(!confirm('Xóa hợp đồng này?'+(n?'\n'+n+' đợt thanh toán thuộc HĐ sẽ không còn gắn hợp đồng (vẫn giữ lại).':''))) return;
      S.hdthauphu=(S.hdthauphu||[]).filter(x=>x['Mã HĐTP']!==code);
      closeModal(); pushOp('deleteSubContract',{code}); toast('Đã xóa hợp đồng');
    } : null
  );
}

/* ================================================================
   ★ SINH LỊCH THANH TOÁN TỪ MẪU — dùng chung cho khách & thầu phụ
   kind: 'khach' (thu từ khách) | 'tp' (chi cho thầu phụ)
================================================================ */
function schedPreview(kind){
  const mau  = kind==='khach' ? MAU_TT_KHACH : MAU_TT_TP;
  const i    = Number(V('scMau')||0);
  const rows = kind==='khach' ? (mau[i]||[])[2] : (mau[i]||[])[1];
  const gt   = Number(V('scGT'))||0;
  const start= V('scNgay')||today();
  const box  = document.getElementById('scPreview');
  if(!box || !rows) return;
  let sum = 0;
  let h = '<div class="tbl-wrap"><table class="tbl"><thead><tr><th style="width:34%">Đợt thanh toán</th><th>Loại</th>'
        + '<th class="num" style="width:70px">%</th><th class="num" style="width:130px">Số tiền (đ)</th><th style="width:140px">Đến hạn</th></tr></thead><tbody>';
  rows.forEach((r,k)=>{
    const tien = Math.round(gt*r[1]/100);
    sum += tien;
    const due = new Date(new Date(start).getTime() + r[4]*86400000).toISOString().slice(0,10);
    h += '<tr><td><input class="sc-ten" value="'+esc(r[0])+'" style="width:100%;padding:5px 7px;font-size:12px">'
       + '<div class="muted" style="font-size:10.5px;margin-top:2px">'+esc(r[3])+'</div>'
       + '<input type="hidden" class="sc-dk" value="'+esc(r[3])+'"><input type="hidden" class="sc-loai" value="'+esc(r[2])+'"></td>'
       + '<td><span class="tag '+(r[2]==='Tạm ứng'?'t-info':r[2]==='Giữ lại bảo hành'?'t-pause':'t-brass')+'" style="font-size:10px">'+esc(r[2])+'</span></td>'
       + '<td class="num"><input class="sc-pct" type="number" value="'+r[1]+'" style="width:60px;padding:5px;font-size:12px;text-align:right" oninput="schedRecalc()"></td>'
       + '<td class="num"><input class="sc-tien" type="number" value="'+tien+'" style="width:125px;padding:5px;font-size:12px;text-align:right"></td>'
       + '<td><input class="sc-han" type="date" value="'+due+'" style="width:135px;padding:5px;font-size:12px"></td></tr>';
  });
  h += '</tbody></table></div>'
     + '<div class="fin-total" style="border-radius:var(--r-sm);margin-top:8px"><span class="ft-lbl">Tổng cộng '
     + '<span id="scPct">'+rows.reduce((a,r)=>a+r[1],0)+'</span>% giá trị hợp đồng</span>'
     + '<span class="ft-val" id="scSum">'+fmtTr(sum)+'</span></div>';
  box.innerHTML = h;
}
function schedRecalc(){
  const gt = Number(V('scGT'))||0;
  let sp = 0, ss = 0;
  document.querySelectorAll('#scPreview tbody tr').forEach(tr=>{
    const p = Number(tr.querySelector('.sc-pct').value)||0;
    const t = Math.round(gt*p/100);
    tr.querySelector('.sc-tien').value = t;
    sp += p; ss += t;
  });
  const ep = document.getElementById('scPct'), es = document.getElementById('scSum');
  if(ep){ ep.textContent = Math.round(sp*10)/10; ep.style.color = Math.abs(sp-100)>0.5 ? 'var(--warn)' : ''; }
  if(es) es.textContent = fmtTr(ss);
}

/* --- Lịch thu tiền từ KHÁCH (theo dự án, tách theo loại HĐ) --- */
function formPaymentSchedule(daCode){
  const d = S.duan.find(x=>x['Mã DA']===daCode);
  if(!d) return toast('Chưa chọn dự án', true);
  if(!canEditProject(d)) return toast('Chỉ người phụ trách dự án mới lập lịch thanh toán', true);
  const daCo = (S.thanhtoan||[]).filter(x=>x['Mã DA']===daCode);
  // Xác định các loại HĐ dự án này có
  const vtk = Number(d['Giá trị HĐ Thiết kế (đ)'])||0, vtc = Number(d['Giá trị HĐ Thi công (đ)'])||0;
  const hasTK = vtk>0, hasTC = vtc>0;
  // Danh sách loại HĐ để chọn
  const loaiOpts = [];
  if(hasTK) loaiOpts.push('Thiết kế');
  if(hasTC) loaiOpts.push('Thi công');
  if(!loaiOpts.length) loaiOpts.push('Thi công'); // fallback dự án cũ chỉ có tổng
  // gợi ý mẫu khớp loại hình dự án
  let goiY = MAU_TT_KHACH.findIndex(m=>m[1]===d['Loại hình']);
  if(goiY<0) goiY = 3;
  const defLoai = loaiOpts[0];
  const defGT = defLoai==='Thiết kế' ? vtk : (defLoai==='Thi công' && hasTC ? vtc : (Number(d['Giá trị HĐ (đ)'])||0));
  openModal('Lập lịch thu tiền — '+d['Tên dự án'],
    (daCo.length?'<div class="tv-hint" style="background:var(--warn-bg);color:var(--warn)">⚠ Dự án đã có <b>'+daCo.length+'</b> đợt thu. Lịch mới sẽ <b>thêm vào</b>, không xóa đợt cũ.</div>':'')
    + (hasTK&&hasTC?'<div class="tv-hint" style="background:var(--paper);color:var(--ink)">Dự án có <b>2 hợp đồng</b>: Thiết kế '+fmtTr(vtk)+' · Thi công '+fmtTr(vtc)+'. Lập lịch cho <b>từng hợp đồng riêng</b>.</div>':'')
    + '<div class="grid2">'
    + fld('Hợp đồng áp dụng', '<select id="scLoaiHD" onchange="__scSwitchHD()">'
        + loaiOpts.map(o=>'<option value="'+o+'">HĐ '+o+'</option>').join('')+'</select>')
    + fld('Mẫu lịch thanh toán', '<select id="scMau" onchange="schedPreview(\'khach\')">'
        + MAU_TT_KHACH.map((m,i)=>'<option value="'+i+'"'+(i===goiY?' selected':'')+'>'+esc(m[0])+'</option>').join('')+'</select>')
    + '</div>'
    + '<div class="grid2">'
    + fld('Ngày ký hợp đồng', '<input id="scNgay" type="date" value="'+esc(d['Ngày bắt đầu']||today())+'" onchange="schedPreview(\'khach\')">')
    + fld('Giá trị hợp đồng (đ)', '<input id="scGT" type="number" value="'+defGT+'" oninput="schedPreview(\'khach\')">')
    + '</div>'
    + '<input type="hidden" id="scVTK" value="'+vtk+'"><input type="hidden" id="scVTC" value="'+vtc+'">'
    + '<div class="section-label">Các đợt sẽ tạo — sửa trực tiếp nếu cần</div>'
    + '<div id="scPreview"></div>',
    function save(){
      const rows = [...document.querySelectorAll('#scPreview tbody tr')];

        ops.push({action:'savePayment', data:rec});
      });
      closeModal(); store.saveState(); render();
      toast('Đã tạo '+ops.length+' đợt thu (HĐ '+loaiHD+')');
      apiBatch(ops).then(j=>{ if(j.ok){ setSync('ok','Đã lưu lịch thanh toán'); syncAll(false);} })
        .catch(()=>{ const p=store.pending; ops.forEach(o=>p.push(o)); store.pending=p; setSync('pending',p.length+' thao tác chờ gửi'); });
    }
  );
  setTimeout(()=>schedPreview('khach'), 40);
}

/* --- Lịch thanh toán THẦU PHỤ (theo hợp đồng) --- */
function formSubSchedule(hdCode){
  const h = (S.hdthauphu||[]).find(x=>x['Mã HĐTP']===hdCode);
  if(!h) return toast('Chưa có hợp đồng thầu phụ', true);

    + 'Dự án: '+esc(projName(h['Mã DA']))+' · HĐ '+fmtTr(Number(h['Giá trị HĐ (đ)'])||0)

    + (daCo.length?'<div class="tv-hint" style="background:var(--warn-bg);color:var(--warn)">⚠ Hợp đồng đã có <b>'+daCo.length+'</b> đợt. Lịch mới sẽ <b>thêm vào</b>.</div>':'')

    + fld('Mẫu lịch thanh toán', '<select id="scMau" onchange="schedPreview(\'tp\')">'
        + MAU_TT_TP.map((m,i)=>'<option value="'+i+'"'+(i===1?' selected':'')+'>'+esc(m[0])+'</option>').join('')+'</select>')
    + fld('Ngày ký hợp đồng', '<input id="scNgay" type="date" value="'+esc(h['Ngày ký']||today())+'" onchange="schedPreview(\'tp\')">')
    + '</div>'
    + fld('Giá trị hợp đồng (đ)', '<input id="scGT" type="number" value="'+(Number(h['Giá trị HĐ (đ)'])||0)+'" oninput="schedPreview(\'tp\')">')
    + '<div class="section-label">Các đợt sẽ tạo — sửa trực tiếp nếu cần</div>'
    + '<div id="scPreview"></div>',
    function save(){
      const rows = [...document.querySelectorAll('#scPreview tbody tr')];
      if(!rows.length) return toast('Không có đợt nào', true);
      let max = 0;
      (S.ttthauphu||[]).forEach(x=>{ const m=String(x['Mã TTP']||'').match(/^TTP(\d+)$/); if(m) max=Math.max(max,+m[1]); });
      // Nếu lịch đã có đợt "Giữ lại bảo hành" riêng → KHÔNG áp thêm retention lên các đợt khác
      // (tránh giữ trùng hai lần). Ngược lại mới dùng tỷ lệ giữ lại của hợp đồng.
      const coDotGiu = rows.some(tr=>tr.querySelector('.sc-loai').value==='Giữ lại bảo hành');

        if(tien<=0) return;
        const loai = tr.querySelector('.sc-loai').value;
        max++;
        const rec = {'Mã TTP':'TTP'+String(max).padStart(4,'0'),'Mã HĐTP':hdCode,'Mã DA':h['Mã DA'],
          'Thầu phụ':h['Thầu phụ'],'Hạng mục':tr.querySelector('.sc-ten').value.trim(),
          'Loại đợt':loai,'% giá trị HĐ':Number(tr.querySelector('.sc-pct').value)||0,
          'Giá trị (đ)':tien,
          // Tạm ứng và đợt Giữ lại BH không bị trừ retention
          'Tỷ lệ giữ lại (%)': (loai==='Giữ lại bảo hành' || loai==='Tạm ứng') ? 0 : tl,
          'Ngày đến hạn':tr.querySelector('.sc-han').value,
          'Ngày nghiệm thu':'','Ngày thanh toán':'',
          'Trạng thái': loai==='Tạm ứng' ? 'Đã nghiệm thu · chờ duyệt' : 'Chờ nghiệm thu',
          'Điều kiện':tr.querySelector('.sc-dk').value,
          'Ghi chú':'Tạo từ mẫu lịch thanh toán'+(coDotGiu?' · giữ lại tách thành đợt riêng':'')};
        (S.ttthauphu=S.ttthauphu||[]).push(rec);
        ops.push({action:'saveSubPayment', data:rec});
      });
      closeModal(); store.saveState(); render();
      toast('✓ Đã tạo '+ops.length+' đợt thanh toán thầu phụ');
      apiBatch(ops).then(j=>{ if(j.ok){ setSync('ok','Đã lưu lịch thanh toán'); syncAll(false);} })
        .catch(()=>{ const p=store.pending; ops.forEach(o=>p.push(o)); store.pending=p; setSync('pending',p.length+' thao tác chờ gửi'); });
    }
  );
  setTimeout(()=>schedPreview('tp'), 40);
}

/* ================================================================
   ★ KHỐI HỢP ĐỒNG THẦU PHỤ — hiển thị trong tab Tài chính dự án
================================================================ */
function pjHopDongThauPhu(daCode, canEd){
  const hds = (S.hdthauphu||[]).filter(x=>x['Mã DA']===daCode);

    const st = hdtpStats(hd['Mã HĐTP']);

      + '<b style="font-size:14px">'+esc(hd['Thầu phụ'])+'</b> '+tagTT(hd['Trạng thái']||'Đang hiệu lực')
      + '<div class="muted" style="margin-top:3px">'+esc(hd['Hạng mục']||'—')
      + (hd['Số HĐ']?' · '+esc(hd['Số HĐ']):'')+(hd['Ngày ký']?' · ký '+esc(hd['Ngày ký']):'')+'</div>'
      + '<div class="muted" style="margin-top:3px">'+st.dot.length+' đợt · giữ lại '+(Number(hd['Tỷ lệ giữ lại (%)'])||0)+'%'
      + (st.chuaLap>0?' · <span style="color:var(--warn)">chưa lập '+fmtTr(st.chuaLap)+'</span>':'')
      + (st.chuaLap<0?' · <span style="color:var(--bad)">vượt HĐ '+fmtTr(-st.chuaLap)+'</span>':'')
      + '</div></div>'
      + '<div style="text-align:right"><b style="font-size:15px">'+fmtTr(st.gt)+'</b>'
      + '<div class="muted">đã chi '+fmtTr(st.daChi)+(st.giu?' · giữ '+fmtTr(st.giu):'')+'</div>'
      + '<div class="bar" style="width:110px;margin-top:5px;margin-left:auto"><i style="width:'+st.pct+'%"></i></div></div>'
      + '</div></div>';
    if(open){
      h += '<div style="padding:0 0 10px;background:#FDFCFA">';
      if(st.dot.length){
        h += '<div class="tbl-wrap"><table class="tbl"><thead><tr><th>Đợt</th><th>Loại</th><th class="num">Giá trị</th>'
          + '<th class="num">Giữ lại</th><th class="num">Thực chi</th><th>Đến hạn</th><th>Trạng thái</th></tr></thead><tbody>'
          + st.dot.map(x=>{
              const dl = daysLeft(x['Ngày đến hạn']);
              const late = dl!==null && dl<0 && x['Trạng thái']!=='Đã thanh toán';
              return '<tr class="row-click" onclick="event.stopPropagation();formSubPayment(\''+esc(x['Mã TTP'])+'\')">'
              + '<td><b>'+esc(x['Hạng mục']||'Đợt')+'</b>'+(x['Điều kiện']?'<div class="muted" style="font-size:10.5px">'+esc(x['Điều kiện'])+'</div>':'')+'</td>'
              + '<td><span class="tag '+(x['Loại đợt']==='Tạm ứng'?'t-info':x['Loại đợt']==='Giữ lại bảo hành'?'t-pause':'t-brass')+'" style="font-size:10px">'+esc(x['Loại đợt']||'—')+'</span></td>'
              + '<td class="num">'+fmt(x['Giá trị (đ)'])+(x['% giá trị HĐ']?'<div class="muted" style="font-size:10px">'+x['% giá trị HĐ']+'%</div>':'')+'</td>'
              + '<td class="num" style="color:#7E57C2">'+fmt(ttpGiuLai(x))+'</td>'
              + '<td class="num"><b>'+fmt(ttpChi(x))+'</b></td>'
              + '<td class="muted">'+(x['Ngày đến hạn']?(late?'<span class="tag t-bad">'+esc(x['Ngày đến hạn'])+'</span>':esc(x['Ngày đến hạn'])):'—')+'</td>'
              + '<td>'+tagTT(x['Trạng thái'])+'</td></tr>';
            }).join('')
          + '</tbody></table></div>';
      } else h += '<div class="empty" style="padding:16px">Hợp đồng chưa có đợt thanh toán nào</div>';
      if(canEd){
        h += '<div style="padding:9px 18px;display:flex;gap:7px;flex-wrap:wrap">'
          + '<button class="btn btn-brass" style="padding:6px 12px;font-size:12.5px" onclick="event.stopPropagation();formSubSchedule(\''+esc(hd['Mã HĐTP'])+'\')">⚡ Lập lịch từ mẫu</button>'
          + '<button class="btn btn-ghost" style="padding:6px 12px;font-size:12.5px" onclick="event.stopPropagation();window._hdtp=\''+esc(hd['Mã HĐTP'])+'\';formSubPayment()">+ Thêm 1 đợt</button>'
          + '<button class="btn btn-ghost" style="padding:6px 12px;font-size:12.5px" onclick="event.stopPropagation();formSubContract(\''+esc(hd['Mã HĐTP'])+'\')">✎ Sửa hợp đồng</button>'
          + '</div>';
      }
      h += '</div>';
    }
    h += '</div>';
  });
  // đợt lẻ chưa gắn hợp đồng
  if(leHoi.length){
    h += '<div style="padding:9px 18px;background:var(--warn-bg);font-size:12.5px;color:var(--warn)">'
      + '⚠ Có <b>'+leHoi.length+'</b> đợt thanh toán chưa gắn hợp đồng — mở từng đợt để chọn hợp đồng.</div>'
      + '<div class="tbl-wrap"><table class="tbl"><tbody>'
      + leHoi.map(x=>'<tr class="row-click" onclick="formSubPayment(\''+esc(x['Mã TTP'])+'\')">'
        + '<td><b>'+esc(x['Thầu phụ'])+'</b><div class="muted">'+esc(x['Hạng mục']||'')+'</div></td>'
        + '<td class="num">'+fmt(x['Giá trị (đ)'])+'</td><td>'+tagTT(x['Trạng thái'])+'</td></tr>').join('')
      + '</tbody></table></div>';
  }
  if(canEd) h += '<div class="card-body" style="border-top:1px solid var(--line);display:flex;gap:7px;flex-wrap:wrap">'
    + '<button class="btn btn-brass" onclick="formSubContract(null,\''+daCode+'\')">+ Hợp đồng giao thầu</button>'
    + '<button class="btn btn-ghost" onclick="window._dsDA=\''+daCode+'\';formSubPayment()">+ Đợt thanh toán lẻ</button></div>';
  h += '</div>';
  return h;
}
function pjToggleHD(ma){ window._hdOpen=window._hdOpen||{}; window._hdOpen[ma]=!window._hdOpen[ma]; render(); }

<script>
/* ================================================================
   ★ v3.1 — CHUẨN HÓA HỆ THỐNG
   1. Toàn vẹn tham chiếu khi xóa (không để bản ghi mồ côi)
   2. Xóa mềm thống nhất cho dữ liệu tài chính
   3. Chuẩn hóa liên kết bằng MÃ thay vì chuỗi tên
   4. Màn hình "Kiểm tra dữ liệu" để dọn dẹp trước khi gộp CRM
================================================================ */

/* ---------- Bản đồ quan hệ cha → con ---------- */
const REL_DA = [
  {store:'congviec',  key:'Mã DA', ten:'công việc',            ma:'Mã CV'},
  {store:'hangmuc',   key:'Mã DA', ten:'hạng mục kế hoạch',    ma:'Mã HM'},
  {store:'chiphi',    key:'Mã DA', ten:'khoản chi phí',        ma:'Mã CP'},
  {store:'thanhtoan', key:'Mã DA', ten:'đợt thu tiền',         ma:'Mã TT'},
  {store:'hdthauphu', key:'Mã DA', ten:'hợp đồng thầu phụ',    ma:'Mã HĐTP'},
  {store:'ttthauphu', key:'Mã DA', ten:'đợt thanh toán thầu',  ma:'Mã TTP'},
  {store:'muasam',    key:'Mã DA', ten:'đơn mua sắm',          ma:'Mã MS'},
  {store:'phatsinh',  key:'Mã DA', ten:'phát sinh hợp đồng',   ma:'Mã PS'},
  {store:'hosoTL',    key:'Mã DA', ten:'hồ sơ tài liệu',       ma:'Mã TL'},
  {store:'hientruong',key:'Mã DA', ten:'nhật ký hiện trường',  ma:'Mã HT'},
  {store:'anToanCL',  key:'Mã DA', ten:'bản ghi an toàn',      ma:'Mã AT'},
  {store:'khongPH',   key:'Mã DA', ten:'sự không phù hợp',     ma:'Mã NC'},
  {store:'ruiro',     key:'Mã DA', ten:'rủi ro',               ma:'Mã RR'},
  {store:'lichhen',   key:'Mã DA', ten:'lịch hẹn',             ma:'Mã LH'},
  {store:'tamung',    key:'Mã DA', ten:'phiếu tạm ứng',        ma:'Mã TU'}
];
function demCon(daCode){
  return REL_DA.map(r=>({...r, n:(S[r.store]||[]).filter(x=>x[r.key]===daCode).length}))
               .filter(r=>r.n>0);
}

/* ---------- Xóa dự án AN TOÀN ---------- */
function xoaDuAn(code){
  const d = S.duan.find(x=>x['Mã DA']===code);
  if(!d) return;
  if(!can('deleteAny')) return toast('Chỉ Giám đốc trở lên mới xóa được dự án', true);
  const con = demCon(code);
  const tong = con.reduce((a,r)=>a+r.n,0);

  if(!tong){
    if(!confirm('Xóa dự án "'+d['Tên dự án']+'"?\nDự án chưa có dữ liệu con nên xóa an toàn.')) return;
    S.duan = S.duan.filter(x=>x['Mã DA']!==code);
    closeModal(); pushOp('deleteProject',{code}); toast('Đã xóa dự án');
    return;
  }
  // Có dữ liệu con → hiện bảng và bắt chọn cách xử lý
  openModal('⚠ Dự án còn dữ liệu — chọn cách xử lý',
    '<div class="tv-hint" style="background:var(--bad-bg);color:var(--bad)">'
    + 'Dự án <b>'+esc(d['Tên dự án'])+'</b> đang có <b>'+tong+'</b> bản ghi con. '
    + 'Xóa thẳng sẽ để lại dữ liệu <b>mồ côi</b> — vẫn cộng vào số liệu toàn công ty nhưng không còn dự án để tra.</div>'
    + '<div class="tbl-wrap" style="max-height:34vh;overflow-y:auto"><table class="tbl"><tbody>'
    + con.map(r=>'<tr><td>'+esc(r.ten)+'</td><td class="num"><b>'+r.n+'</b></td></tr>').join('')
    + '</tbody></table></div>'
    + '<div class="section-label">Chọn cách xử lý</div>'
    + '<div style="display:flex;flex-direction:column;gap:8px">'
    + '<button type="button" class="btn btn-ghost" style="text-align:left;padding:11px 13px" onclick="daHuy(\''+esc(code)+'\')">'
      + '<b>① Đánh dấu HỦY dự án</b> <span class="muted">— khuyến nghị</span>'
      + '<div class="muted" style="font-size:11.5px;margin-top:2px">Giữ nguyên toàn bộ dữ liệu để truy vết, dự án không còn hiện ở danh sách đang chạy.</div></button>'
    + '<button type="button" class="btn btn-ghost" style="text-align:left;padding:11px 13px;border-color:var(--bad);color:var(--bad)" onclick="daXoaTang(\''+esc(code)+'\')">'
      + '<b>② Xóa dự án VÀ toàn bộ '+tong+' bản ghi con</b>'
      + '<div class="muted" style="font-size:11.5px;margin-top:2px">Không khôi phục được. Chỉ dùng khi nhập nhầm hoàn toàn.</div></button>'
    + '</div>', null);
}
function daHuy(code){
  const d = S.duan.find(x=>x['Mã DA']===code); if(!d) return;
  d['Trạng thái'] = 'Hủy';
  closeModal(); pushOp('saveProject', {'Mã DA':code,'Trạng thái':'Hủy'});
  toast('Đã chuyển dự án sang trạng thái Hủy — dữ liệu được giữ nguyên');
}
function daXoaTang(code){
  const d = S.duan.find(x=>x['Mã DA']===code); if(!d) return;
  const con = demCon(code), tong = con.reduce((a,r)=>a+r.n,0);
  if(!confirm('XÓA VĨNH VIỄN dự án "'+d['Tên dự án']+'" và '+tong+' bản ghi con?\n\nKhông thể hoàn tác.')) return;
  if(prompt('Gõ chính xác  XOA  để xác nhận:')!=='XOA') return toast('Đã hủy thao tác');
  const ops = [];
  const actMap = {congviec:'Task',hangmuc:'HangMuc',chiphi:'Expense',thanhtoan:'Payment',
    hdthauphu:'SubContract',ttthauphu:'SubPayment',muasam:'Purchase',phatsinh:'Variation',
    hosoTL:'Document',hientruong:'SiteLog',anToanCL:'SafetyRecord',khongPH:'NC',
    ruiro:'Risk',lichhen:'Appointment',tamung:'Advance'};
  con.forEach(r=>{
    (S[r.store]||[]).filter(x=>x[r.key]===code).forEach(x=>{
      ops.push({action:'delete'+actMap[r.store], data:{code:x[r.ma]}});
    });
    S[r.store] = (S[r.store]||[]).filter(x=>x[r.key]!==code);
  });
  ops.push({action:'deleteProject', data:{code}});
  S.duan = S.duan.filter(x=>x['Mã DA']!==code);
  closeModal(); store.saveState(); render();
  toast('Đang xóa '+(tong+1)+' bản ghi…');
  apiBatch(ops).then(j=>{ if(j.ok){ setSync('ok','Đã xóa xong'); syncAll(false); } })
    .catch(()=>{ const p=store.pending; ops.forEach(o=>p.push(o)); store.pending=p;
      setSync('pending', p.length+' thao tác chờ gửi'); });
}

/* ---------- Chặn xóa thầu phụ / nhân sự còn ràng buộc ---------- */
function kiemTraXoaThauPhu(ten){
  const key = vnorm(ten||'');
  const hd = (S.hdthauphu||[]).filter(x=>vnorm(x['Thầu phụ']||'')===key).length;
  const dot= (S.ttthauphu||[]).filter(x=>vnorm(x['Thầu phụ']||'')===key).length;
  const cv = tvSong(S.congviec).filter(x=>vnorm(x['Thầu phụ']||'')===key).length;
  return {hd, dot, cv, tong:hd+dot+cv};
}
function kiemTraXoaNhanSu(ten){
  const cv = tvSong(S.congviec).filter(x=>x['Phụ trách']===ten).length;
  const da = (S.duan||[]).filter(x=>x['Phụ trách']===ten).length;
  const duyet = tvSong(S.congviec).filter(x=>x['Người duyệt được giao']===ten).length
              + (S.chiphi||[]).filter(x=>x['Người duyệt được giao']===ten).length;
  return {cv, da, duyet, tong:cv+da+duyet};
}

function dataHealth(){
  const R = [];
  const add = (mucdo, nhom, tieude, mota, n, fix) => R.push({mucdo, nhom, tieude, mota, n, fix});

  /* --- 1. Bản ghi mồ côi: trỏ vào dự án không tồn tại --- */
  const maDA = new Set(S.duan.map(d=>d['Mã DA']));

    const mo = (S[r.store]||[]).filter(x=>x[r.key] && !maDA.has(x[r.key]));
    if(mo.length) add('cao','Toàn vẹn','Bản ghi mồ côi — '+r.ten,
      'Trỏ vào mã dự án không còn tồn tại: '+[...new Set(mo.map(x=>x[r.key]))].slice(0,3).join(', '),
      mo.length, null);
  });

  const maHM = new Set((S.hangmuc||[]).map(h=>h['Mã HM']));

  /* Đợt thanh toán không gắn hợp đồng */
  const maHD = new Set((S.hdthauphu||[]).map(h=>h['Mã HĐTP']));
  const dotLe = (S.ttthauphu||[]).filter(x=>!x['Mã HĐTP'] || !maHD.has(x['Mã HĐTP']));
  if(dotLe.length) add('vua','Toàn vẹn','Đợt thanh toán thầu phụ chưa gắn hợp đồng',
    'Không theo dõi được lũy kế theo hợp đồng, dễ chi vượt giá trị đã ký.', dotLe.length, null);

  /* --- 2. Tên thầu phụ lệch nhau --- */
  const tenTP = new Map();
  const gom = (arr, f) => (arr||[]).forEach(x=>{ const t=(x[f]||'').trim(); if(!t) return;
    const k=vnorm(t); if(!tenTP.has(k)) tenTP.set(k,new Set()); tenTP.get(k).add(t); });
  gom(S.thaubo,'Tên / Công ty'); gom(S.hdthauphu,'Thầu phụ');
  gom(S.ttthauphu,'Thầu phụ'); gom(S.congviec,'Thầu phụ');
  const lech = [...tenTP.values()].filter(s=>s.size>1);
  if(lech.length) add('cao','Chuẩn hóa','Tên thầu phụ ghi lệch nhau',
    'Cùng một nhà thầu nhưng gõ khác nhau nên số liệu bị tách: '
    + lech.slice(0,2).map(s=>[...s].join(' / ')).join(' · '), lech.length, 'fixTenTP');
  /* Thầu phụ có trong việc/hợp đồng nhưng chưa lập hồ sơ */
  const dsTP = new Set((S.thaubo||[]).map(t=>vnorm(t['Tên / Công ty'])));
  const chuaHS = new Set();
  [...(S.hdthauphu||[]),...tvSong(S.congviec)].forEach(x=>{
    const t=(x['Thầu phụ']||'').trim(); if(t && !dsTP.has(vnorm(t))) chuaHS.add(t); });
  if(chuaHS.size) add('vua','Chuẩn hóa','Thầu phụ chưa có trong danh sách',
    'Đang giao việc/ký hợp đồng nhưng chưa lập hồ sơ nhà thầu: '+[...chuaHS].slice(0,3).join(', '),
    chuaHS.size, 'fixThemTP');

  /* --- 3. Tài chính --- */
  const CC = projCost('');
  if(CC.nghiTrung.length) add('cao','Tài chính','Chi phí nghi ghi trùng thầu phụ',
    'Đã tự loại khỏi tổng chi ('+fmtTr(CC.vNghiTrung)+') nhưng nên chuyển hẳn sang module Thầu phụ.',
    CC.nghiTrung.length, null);
  const hdLech = (S.hdthauphu||[]).map(h=>({h, s:hdtpStats(h['Mã HĐTP'])}))
    .filter(x=>x.s.gt>0 && Math.abs(x.s.chuaLap) > x.s.gt*0.02);
  if(hdLech.length) add('vua','Tài chính','Hợp đồng thầu phụ lệch giá trị đợt',
    'Tổng các đợt không khớp giá trị hợp đồng quá 2%.', hdLech.length, null);
  const dtThieu = S.duan.filter(d=>d['Trạng thái']==='Đang triển khai' && !Number(d['Ngân sách (đ)']));
  if(dtThieu.length) add('thap','Tài chính','Dự án chưa đặt ngân sách',
    'Không kiểm soát được mức sử dụng dự toán.', dtThieu.length, null);
  const hdThieu = S.duan.filter(d=>d['Trạng thái']==='Đang triển khai' && !Number(d['Giá trị HĐ (đ)']));
  if(hdThieu.length) add('cao','Tài chính','Dự án chưa nhập giá trị hợp đồng',
    'Không tính được doanh thu và biên lợi nhuận.', hdThieu.length, null);

  const cvChuaGan = tvSong(S.congviec).filter(c=>!c['Phụ trách'] && c['Trạng thái']!=='Hoàn thành');
  if(cvChuaGan.length) add('vua','Vận hành','Đầu việc chưa gán người phụ trách',
    'Không ai chịu trách nhiệm, dễ trôi tiến độ.', cvChuaGan.length, null);
  const cvChuaHan = tvSong(S.congviec).filter(c=>!c['Hạn hoàn thành'] && c['Trạng thái']!=='Hoàn thành');
  if(cvChuaHan.length) add('vua','Vận hành','Đầu việc chưa có hạn hoàn thành',
    'Không vào được biểu đồ tiến độ và không cảnh báo trễ được.', cvChuaHan.length, null);
  const daKhongKH = S.duan.filter(d=>d['Trạng thái']==='Đang triển khai'
    && !(S.hangmuc||[]).some(h=>h['Mã DA']===d['Mã DA']));
  if(daKhongKH.length) add('thap','Vận hành','Dự án chưa lập kế hoạch hạng mục',
    'Chưa dùng được Gantt kế hoạch vs thực tế.', daKhongKH.length, null);
  const tuTre = (S.tamung||[]).filter(x=>{
    const con=(Number(x['Số tiền (đ)'])||0)-(Number(x['Đã hoàn (đ)'])||0);
    return con>0 && x['Hạn hoàn ứng'] && daysLeft(x['Hạn hoàn ứng'])<0; });
  if(tuTre.length) add('cao','Vận hành','Tạm ứng quá hạn chưa hoàn',
    'Tổng '+fmtTr(tuTre.reduce((a,x)=>a+((Number(x['Số tiền (đ)'])||0)-(Number(x['Đã hoàn (đ)'])||0)),0))+' đang treo.',
    tuTre.length, null);

  /* --- 5. Kiểm soát & hồ sơ --- */
  const tpChuaDG = (S.thaubo||[]).filter(t=>t['Trạng thái']==='Đang hợp tác' && !tpDanhGiaMoiNhat(t['Tên / Công ty']));
  if(tpChuaDG.length) add('vua','Kiểm soát','Nhà thầu chưa được đánh giá',
    'Đang hợp tác nhưng chưa có phiếu đánh giá xét chọn.', tpChuaDG.length, null);
  const ncMo = (S.khongPH||[]).filter(x=>x['Trạng thái']!=='Đóng'
    && x['Hạn xử lý'] && daysLeft(x['Hạn xử lý'])<0);
  if(ncMo.length) add('cao','Kiểm soát','Sự không phù hợp quá hạn xử lý',
    'Đã quá hạn khắc phục mà chưa đóng.', ncMo.length, null);
  const hsCho = (S.hosoTL||[]).filter(x=>x['Trạng thái']==='Chờ lãnh đạo phê duyệt');
  if(hsCho.length) add('thap','Kiểm soát','Hồ sơ đang chờ phê duyệt',
    'Có thể đang chặn bước tiếp theo của dự án.', hsCho.length, null);

  /* --- 6. Nhân sự --- */
  const nsTrung = {};
  (S.nhansu||[]).forEach(n=>{ const k=vnorm(n['Họ tên']||''); if(k) nsTrung[k]=(nsTrung[k]||0)+1; });
  const trungTen = Object.values(nsTrung).filter(v=>v>1).length;

  if(nsKhongMail.length) add('vua','Nhân sự','Nhân sự chưa có email đăng nhập',
    'Không đăng nhập được vào hệ thống.', nsKhongMail.length, null);

  return R;
}

/* ---------- Công cụ gộp tên thầu phụ ghi lệch ---------- */
function fixTenTP(){
  const map = new Map();
  const gom = (arr,f)=>(arr||[]).forEach(x=>{ const t=(x[f]||'').trim(); if(!t) return;
    const k=vnorm(t); if(!map.has(k)) map.set(k,new Map());
    map.get(k).set(t, (map.get(k).get(t)||0)+1); });
  gom(S.thaubo,'Tên / Công ty'); gom(S.hdthauphu,'Thầu phụ');
  gom(S.ttthauphu,'Thầu phụ'); gom(S.congviec,'Thầu phụ');
  const nhom = [...map.entries()].filter(([k,v])=>v.size>1);
  if(!nhom.length) return toast('Không còn tên lệch nào');
  openModal('Gộp tên thầu phụ ghi lệch ('+nhom.length+' nhóm)',
    '<p class="muted" style="margin-bottom:12px">Chọn tên chuẩn cho mỗi nhóm. Hệ thống sẽ cập nhật đồng loạt ở '
    + 'hồ sơ nhà thầu, hợp đồng, đợt thanh toán và công việc.</p>'
    + nhom.map((g,i)=>{
        const opts = [...g[1].entries()].sort((a,b)=>b[1]-a[1]);
        return '<div class="field"><label>Nhóm '+(i+1)+'</label>'
          + '<select class="fixTP" data-key="'+esc(g[0])+'">'
          + opts.map(o=>'<option value="'+esc(o[0])+'">'+esc(o[0])+' ('+o[1]+' bản ghi)</option>').join('')
          + '</select></div>';
      }).join(''),
    function save(){
      const sels = [...document.querySelectorAll('.fixTP')];
      const ops = []; let n = 0;
      sels.forEach(s=>{
        const key = s.dataset.key, chuan = s.value;
        const sua = (arr, f, act, ma) => (arr||[]).forEach(x=>{
          if(vnorm(x[f]||'')===key && x[f]!==chuan){
            x[f] = chuan; n++;
            const d = {}; d[ma] = x[ma]; d[f] = chuan;
            ops.push({action:act, data:d});
          }});
        sua(S.thaubo,'Tên / Công ty','saveSubcontractor','Mã TP');
        sua(S.hdthauphu,'Thầu phụ','saveSubContract','Mã HĐTP');
        sua(S.ttthauphu,'Thầu phụ','saveSubPayment','Mã TTP');
        sua(S.congviec,'Thầu phụ','saveTask','Mã CV');
      });
      closeModal(); store.saveState(); render();
      if(!n) return toast('Không có gì thay đổi');
      toast('✓ Đã chuẩn hóa '+n+' bản ghi');
      apiBatch(ops).then(j=>{ if(j.ok){ setSync('ok','Đã chuẩn hóa tên thầu phụ'); syncAll(false);} })
        .catch(()=>{ const p=store.pending; ops.forEach(o=>p.push(o)); store.pending=p;
          setSync('pending', p.length+' thao tác chờ gửi'); });
    });
}
/* ---------- Tạo nhanh hồ sơ cho thầu phụ còn thiếu ---------- */
function fixThemTP(){
  const ds = new Set((S.thaubo||[]).map(t=>vnorm(t['Tên / Công ty'])));
  const thieu = new Set();
  [...(S.hdthauphu||[]),...tvSong(S.congviec)].forEach(x=>{

    '<p class="muted" style="margin-bottom:11px">Các đơn vị này đang được giao việc/ký hợp đồng nhưng chưa có hồ sơ. '
    + 'Chọn chuyên môn rồi lưu — có thể bổ sung liên hệ sau.</p>'
    + list.map((t,i)=>'<div class="field"><label>'+esc(t)+'</label>'
        + '<select class="newTP" data-ten="'+esc(t)+'">'
        + '<option value="">— Bỏ qua —</option>'
        + LOAI_THAU.map(l=>'<option>'+esc(l)+'</option>').join('')+'</select></div>').join(''),
    function save(){
      const sels = [...document.querySelectorAll('.newTP')].filter(s=>s.value);
      if(!sels.length) return toast('Chưa chọn chuyên môn nào', true);
      let max = 0;
      (S.thaubo||[]).forEach(t=>{ const m=String(t['Mã TP']||'').match(/^TP(\d+)$/); if(m) max=Math.max(max,+m[1]); });
      const ops = [];
      sels.forEach(s=>{
        max++;
        const rec = {'Mã TP':'TP'+String(max).padStart(4,'0'),'Tên / Công ty':s.dataset.ten,
          'Loại thầu':s.value,'Trạng thái':'Đang hợp tác','Ghi chú':'Tạo tự động từ Kiểm tra dữ liệu'};
        (S.thaubo=S.thaubo||[]).push(rec);
        ops.push({action:'saveSubcontractor', data:rec});
      });
      closeModal(); store.saveState(); render();
      toast('✓ Đã lập '+ops.length+' hồ sơ nhà thầu');
      apiBatch(ops).then(j=>{ if(j.ok){ setSync('ok','Đã lưu'); syncAll(false);} })
        .catch(()=>{ const p=store.pending; ops.forEach(o=>p.push(o)); store.pending=p; });
    });
}

function khOf(kho, maKH){ return (S[kho]||[]).filter(x=>String(x['Mã KH'])===String(maKH)); }

/* Tính tiến độ hành trình 9 bước — cùng công thức với CRM */
function khHanhTrinh(lead){
  const bg = khOf('baogia', lead.code), ks = khOf('khaosat', lead.code),
        ls = khOf('lichsulv', lead.code), hd = khOf('hopdongKH', lead.code);
  const co = tt => bg.some(b=>b['Trạng thái']===tt);
  const xong = {
    'Tiếp nhận':true, 'Liên hệ':ls.length>0, 'Khảo sát':ks.length>0, 'Lập báo giá':bg.length>0,
    'Duyệt nội bộ':co('Đã duyệt')||co('Đã gửi khách')||co('Khách chấp thuận'),
    'Gửi khách':co('Đã gửi khách')||co('Khách chấp thuận'),
    'KH chấp thuận':co('Khách chấp thuận'), 'Ký hợp đồng':hd.length>0, 'Tạo dự án':!!lead.maDA
  };
  return {xong, soXong:Object.values(xong).filter(Boolean).length, bg, ks, ls, hd,
    bgMoi: bg.filter(b=>b['Trạng thái']!=='Đã thay thế')
             .sort((a,b)=>(Number(b['Phiên bản'])||0)-(Number(a['Phiên bản'])||0))[0]||null};
}

    + (lead.diachi?' · 📍 '+esc(lead.diachi):'')
    + (lead.loaiCT?' · '+esc(lead.loaiCT):'')
    + '<br><span class="muted">Phụ trách kinh doanh: <b>'+esc(lead.phutrach||'—')+'</b>'
    + ' · Trạng thái CRM: '+esc(lead.trangthai||'—')+'</span></div>';

  /* Thanh hành trình */
  h += '<div class="section-label">Hành trình bán hàng ('+H.soXong+'/9)</div>'
    + '<div style="display:flex;gap:4px;flex-wrap:wrap;margin-bottom:6px">'
    + Object.keys(H.xong).map(k=>'<span class="tag '+(H.xong[k]?'t-ok':'t-pause')+'" style="font-size:10.5px">'
        + (H.xong[k]?'✓ ':'○ ')+esc(k)+'</span>').join('')
    + '</div>';

  /* Hợp đồng */
  h += '<div class="section-label">Hợp đồng</div>';
  if(hd){
    h += '<div class="card" style="margin-bottom:10px"><div class="card-body">'
      + '<div style="display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap">'
      + '<div><b>'+esc(hd['Số HĐ']||'Hợp đồng')+'</b>'
      + '<div class="muted">Ký ngày '+esc(hd['Ngày ký']||'—')+(hd['Người ký']?' · '+esc(hd['Người ký']):'')+'</div></div>'
      + '<div style="text-align:right"><b style="font-size:17px">'+fmtTr(Number(hd['Giá trị (đ)'])||0)+'</b>'
      + (hd['File scan']?'<div><a href="'+esc(hd['File scan'])+'" target="_blank" class="lk" style="font-size:11.5px">📎 Xem bản scan</a></div>':'')
      + '</div></div></div></div>';
  } else h += '<div class="empty" style="padding:14px">Chưa ký hợp đồng</div>';

  /* Đợt thanh toán */
  h += '<div class="section-label">Đợt thanh toán theo hợp đồng ('+dot.length+')</div>';
  if(dot.length){
    const tong = dot.reduce((a,x)=>a+(Number(x['Giá trị (đ)'])||0),0);
    const thu  = dot.reduce((a,x)=>a+(Number(x['Đã thu (đ)'])||0),0);
    h += '<div class="tbl-wrap"><table class="tbl"><thead><tr><th>Đợt</th><th>Đến hạn</th>'
      + '<th class="num">%</th><th class="num">Giá trị</th><th class="num">Đã thu</th><th>Gắn dự án</th></tr></thead><tbody>'
      + [...dot].sort((a,b)=>(a['Ngày đến hạn']||'')>(b['Ngày đến hạn']||'')?1:-1).map(x=>{
          const v=Number(x['Giá trị (đ)'])||0, t=Number(x['Đã thu (đ)'])||0;
          return '<tr><td><b>'+esc(x['Tên đợt']||'')+'</b></td>'
            + '<td class="muted">'+esc(x['Ngày đến hạn']||'—')+'</td>'
            + '<td class="num muted">'+(x['% giá trị HĐ']||'')+'%</td>'
            + '<td class="num">'+fmt(v)+'</td>'
            + '<td class="num" style="color:var(--ok)">'+(t?fmt(t):'–')+'</td>'
            + '<td>'+(x['Mã DA']?'<span class="tag t-ok">'+esc(x['Mã DA'])+'</span>'
                :'<span class="tag t-warn">chờ tạo dự án</span>')+'</td></tr>';
        }).join('')
      + '</tbody></table></div>'
      + '<div class="fin-total"><span class="ft-lbl">Tổng '+dot.length+' đợt · đã thu '+fmtTr(thu)+'</span>'
      + '<span class="ft-val">'+fmtTr(tong)+'</span></div>';
  } else h += '<div class="empty" style="padding:14px">Chưa khai đợt thanh toán ở CRM</div>';

  /* Báo giá */
  h += '<div class="section-label">Báo giá ('+H.bg.length+')</div>';
  if(H.bg.length){
    h += '<div class="tbl-wrap"><table class="tbl"><thead><tr><th>Phiên bản</th><th>Tiêu đề</th>'
      + '<th class="num">Giá trị</th><th>Trạng thái</th><th>Ngày lập</th><th>File</th></tr></thead><tbody>'
      + [...H.bg].sort((a,b)=>(Number(b['Phiên bản'])||0)-(Number(a['Phiên bản'])||0)).map(x=>
          '<tr><td><span class="vchip">v'+(x['Phiên bản']||1)+'</span></td>'
          + '<td><b>'+esc(x['Tiêu đề']||'')+'</b></td>'
          + '<td class="num">'+fmt(x['Giá trị (đ)'])+'</td>'
          + '<td>'+tagTT(x['Trạng thái'])+'</td>'
          + '<td class="muted">'+esc(x['Ngày lập']||'—')+'</td>'
          + '<td>'+(x['File']?'<a href="'+esc(x['File'])+'" target="_blank" class="lk">📎 Mở</a>':'—')+'</td></tr>').join('')
      + '</tbody></table></div>';
  } else h += '<div class="empty" style="padding:14px">Chưa có báo giá</div>';

  /* Khảo sát */
  h += '<div class="section-label">Khảo sát hiện trạng ('+H.ks.length+')</div>';
  if(H.ks.length){
    h += H.ks.map(x=>'<div class="card" style="margin-bottom:7px"><div class="card-body">'
      + '<b>📍 '+esc(x['Địa chỉ']||'—')+'</b>'
      + '<div class="muted">'+esc(x['Ngày']||'')+' · '+(x['Diện tích (m2)']||0)+' m²'
      + (x['Người khảo sát']?' · '+esc(x['Người khảo sát']):'')+'</div>'
      + (x['Nhu cầu']?'<p style="font-size:13px;margin-top:5px">'+esc(x['Nhu cầu'])+'</p>':'')
      + (x['GPS']?'<a href="'+esc(x['GPS'])+'" target="_blank" class="lk" style="font-size:11.5px">◈ Mở GPS</a>':'')
      + '</div></div>').join('');
  } else h += '<div class="empty" style="padding:14px">Chưa khảo sát</div>';

  /* Lịch sử làm việc */
  h += '<div class="section-label">Lịch sử làm việc với khách ('+H.ls.length+')</div>';
  if(H.ls.length){
    h += '<div style="max-height:220px;overflow-y:auto;border:1px solid var(--line);border-radius:var(--r-sm);padding:9px">'
      + [...H.ls].sort((a,b)=>(b['Thời gian']||'')>(a['Thời gian']||'')?1:-1).map(x=>
          '<div style="padding:6px 0;border-bottom:1px solid var(--line);font-size:12.5px">'
          + '<b>'+esc(x['Loại']||'Ghi chú')+':</b> '+esc(x['Nội dung']||'')
          + '<div class="muted" style="font-size:10.5px">'+esc(x['Thời gian']||'')
          + (x['Người ghi']?' · '+esc(x['Người ghi']):'')+'</div></div>').join('')
      + '</div>';
  } else h += '<div class="empty" style="padding:14px">Chưa có ghi nhận</div>';

  h += '<div class="rule" style="margin-top:12px">Dữ liệu trên do đội kinh doanh nhập ở <b>MDC-CRM</b>. '
    + 'PM chỉ đọc để tránh hai nguồn sự thật — cần sửa thì báo người phụ trách '
    + '<b>'+esc(lead.phutrach||'')+'</b> cập nhật bên CRM.</div>';

  openModal('Hồ sơ khách hàng — '+(lead.ten||''), h, null);
}

</script>
</body>
</html>
