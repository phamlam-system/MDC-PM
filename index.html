/* Đối chiếu tiến độ thi công vs tiến độ thanh toán của 1 hợp đồng */
function hdtpTienDo(hd){
  const s = hdtpStats(hd['Mã HĐTP']);
  const key = vnorm(hd['Thầu phụ']||'');
  const cvs = tvSong(S.congviec).filter(c=>c['Mã DA']===hd['Mã DA'] && vnorm(c['Thầu phụ']||'')===key);
  const pctViec = cvs.length
    ? Math.round(cvs.reduce((a,c)=>a+(Number(c['Tiến độ (%)'])||(c['Trạng thái']==='Hoàn thành'?100:0)),0)/cvs.length)
    : null;
  const pctChi = s.gt ? Math.round((s.daChi+s.giu)/s.gt*100) : 0;
  // Cảnh báo: đã chi vượt tiến độ thi công quá 20 điểm %
  const vuot = pctViec!==null && pctChi - pctViec > 20;
  return {pctViec, pctChi, vuot, soViec:cvs.length};
}

/* Bước tiếp theo trong luồng nghiệm thu → duyệt → chi */
function ttpNext(x){
  const s = x['Trạng thái']||'';
  if(s==='Chờ nghiệm thu')            return {lbl:'Nghiệm thu',  to:'Đã nghiệm thu · chờ duyệt', cls:'btn-ghost', need:'edit'};
  if(s==='Đã nghiệm thu · chờ duyệt') return {lbl:'Duyệt chi',   to:'Đã duyệt · chờ chi',        cls:'btn-brass', need:'approve'};
  if(s==='Đã duyệt · chờ chi')        return {lbl:'Đã chi',      to:'Đã thanh toán',             cls:'btn-dark',  need:'edit'};
  return null;
}
function ttpAdvance(code){
  const x = (S.ttthauphu||[]).find(t=>t['Mã TTP']===code);
  if(!x) return toast('Không tìm thấy đợt', true);
  const n = ttpNext(x);
  if(!n) return;
  if(n.need==='approve' && !meCanApprove()) return toast('Bạn không có quyền phê duyệt', true);
  if(n.need==='edit' && !can('edit')) return toast('Không có quyền', true);
  const data = {'Mã TTP':code,'Trạng thái':n.to};
  if(n.to==='Đã nghiệm thu · chờ duyệt'){ x['Ngày nghiệm thu']=x['Ngày nghiệm thu']||today(); data['Ngày nghiệm thu']=x['Ngày nghiệm thu']; }
  if(n.to==='Đã duyệt · chờ chi'){ x['Người duyệt']=user['Họ tên']; x['Ngày duyệt']=today();
    data['Người duyệt']=user['Họ tên']; data['Ngày duyệt']=today(); }
  if(n.to==='Đã thanh toán'){ x['Ngày thanh toán']=x['Ngày thanh toán']||today(); data['Ngày thanh toán']=x['Ngày thanh toán']; }
  x['Trạng thái']=n.to;
  pushOp('saveSubPayment', data);
  toast('✓ '+n.lbl+': '+(x['Hạng mục']||x['Mã TTP']));
}

function tpHopDong(){
  const hds = S.hdthauphu||[];
  const f = window._tphd||'';
  window._hdOpen2 = window._hdOpen2 || {};

  let html = '<div class="fin-pills">'
    + [['','Tất cả'],['hl','Đang hiệu lực'],['chua','Chưa lập đủ đợt'],['no','Còn phải trả'],['vuot','Chi vượt tiến độ'],['xong','Đã thanh lý']]
      .map(p=>'<button class="'+(f===p[0]?'on':'')+'" onclick="window._tphd=\''+p[0]+'\';render()">'+p[1]+'</button>').join('')
    + (can('edit')?'<button class="btn btn-brass" style="margin-left:auto;padding:7px 14px;font-size:12.5px" onclick="formSubContract()">+ Hợp đồng giao thầu</button>':'')
    + '</div>';

  let list = hds.map(h=>({h, s:hdtpStats(h['Mã HĐTP']), td:hdtpTienDo(h)}));
  if(f==='hl')   list = list.filter(x=>x.h['Trạng thái']==='Đang hiệu lực');
  if(f==='chua') list = list.filter(x=>x.s.chuaLap > 0);
  if(f==='no')   list = list.filter(x=>x.s.choChi>0 || x.s.choDuyet>0);
  if(f==='vuot') list = list.filter(x=>x.td.vuot);
  if(f==='xong') list = list.filter(x=>x.h['Trạng thái']==='Đã thanh lý');

  const T = list.reduce((a,x)=>({gt:a.gt+x.s.gt, chi:a.chi+x.s.daChi, giu:a.giu+x.s.giu,
    cho:a.cho+x.s.choChi, duyet:a.duyet+x.s.choDuyet}),{gt:0,chi:0,giu:0,cho:0,duyet:0});
  html += '<div class="kpis">'
    + kpi('Hợp đồng', list.length, 'Tổng '+fmtTr(T.gt))
    + kpi('Đã thanh toán', fmtTr(T.chi), T.gt?Math.round(T.chi/T.gt*100)+'% giá trị HĐ':'—','accent')
    + kpi('Đang giữ lại', fmtTr(T.giu), 'Hoàn sau bảo hành')
    + kpi('Đã duyệt chờ chi', fmtTr(T.cho), T.duyet?'+ '+fmtTr(T.duyet)+' chờ duyệt':'Không có khoản chờ duyệt', T.cho?'bad':'ok')
    + '</div>';

  if(!hds.length) return html+'<div class="empty"><b>Chưa có hợp đồng giao thầu</b>'
    + 'Hợp đồng tạo trong tab Tài chính của từng dự án, hoặc bấm "+ Hợp đồng giao thầu" ở trên.<br>'
    + 'Mỗi hợp đồng có lịch thanh toán riêng: tạm ứng → theo tiến độ → nghiệm thu → quyết toán → giữ lại bảo hành.</div>';

  /* ---- Tổng hợp theo GIAI ĐOẠN THANH TOÁN (toàn bộ HĐ đang lọc) ---- */
  const maHDs = new Set(list.map(x=>x.h['Mã HĐTP']));
  const dotAll = (S.ttthauphu||[]).filter(d=>maHDs.has(d['Mã HĐTP']));
  const byLoai = {};
  LOAI_DOT.forEach(l=>byLoai[l]={n:0, gt:0, chi:0, cho:0, chuaNT:0});
  dotAll.forEach(d=>{
    const l = d['Loại đợt']||'Nghiệm thu';
    if(!byLoai[l]) byLoai[l]={n:0,gt:0,chi:0,cho:0,chuaNT:0};
    const b = byLoai[l]; b.n++; b.gt += Number(d['Giá trị (đ)'])||0;
    if(d['Trạng thái']==='Đã thanh toán') b.chi += ttpChi(d);
    else if(d['Trạng thái']==='Đã duyệt · chờ chi') b.cho += ttpChi(d);
    else if(d['Trạng thái']==='Chờ nghiệm thu') b.chuaNT += Number(d['Giá trị (đ)'])||0;
  });
  const coDot = Object.values(byLoai).some(b=>b.n);
  if(coDot){
    html += '<div class="card"><div class="ct">Tổng hợp theo giai đoạn thanh toán'
      + '<span class="ct-r">'+dotAll.length+' đợt / '+list.length+' hợp đồng</span></div>'
      + '<div class="tbl-wrap"><table class="tbl"><thead><tr><th>Giai đoạn</th><th class="num">Số đợt</th>'
      + '<th class="num">Giá trị</th><th class="num">Đã chi</th><th class="num">Đã duyệt chờ chi</th>'
      + '<th class="num">Chưa nghiệm thu</th><th>Tiến độ chi</th></tr></thead><tbody>';
    LOAI_DOT.filter(l=>byLoai[l].n).forEach(l=>{
      const b = byLoai[l];
      const p = b.gt?Math.round(b.chi/b.gt*100):0;
      html += '<tr><td><span class="tag '+(l==='Tạm ứng'?'t-info':l==='Giữ lại bảo hành'?'t-pause':'t-brass')+'">'+esc(l)+'</span></td>'
        + '<td class="num">'+b.n+'</td>'
        + '<td class="num"><b>'+fmt(b.gt)+'</b></td>'
        + '<td class="num" style="color:var(--ok)">'+fmt(b.chi)+'</td>'
        + '<td class="num" style="color:'+(b.cho?'var(--bad)':'var(--ink-faint)')+'">'+fmt(b.cho)+'</td>'
        + '<td class="num muted">'+fmt(b.chuaNT)+'</td>'
        + '<td><span class="pl-bar-w" style="width:90px"><i style="width:'+p+'%;background:'
          + (p>=100?'var(--ok)':p>=50?'var(--brass)':'var(--line-strong)')+'"></i></span> '
        + '<span style="font-size:11.5px;font-weight:600">'+p+'%</span></td></tr>';
    });
    html += '</tbody></table></div>'
      + '<div class="rule">Giai đoạn <b>Tạm ứng</b> chi trước khi có khối lượng — cần bám sát để thu hồi qua các đợt sau. '
      + '<b>Giữ lại bảo hành</b> chỉ hoàn khi hết hạn bảo hành ghi trong hợp đồng.</div></div>';
  }

  /* ---- Dòng tiền cam kết 6 tháng tới ---- */
  const sapChi = dotAll.filter(d=>d['Ngày đến hạn'] && d['Trạng thái']!=='Đã thanh toán');
  if(sapChi.length){
    const months = {};
    sapChi.forEach(d=>{
      const k = String(d['Ngày đến hạn']).slice(0,7);
      (months[k] = months[k] || {n:0, v:0}); months[k].n++; months[k].v += ttpChi(d);
    });
    const keys = Object.keys(months).sort().slice(0,6);
    const maxV = Math.max(...keys.map(k=>months[k].v), 1);
    html += '<div class="card"><div class="ct">Dòng tiền cam kết phải chi thầu phụ'
      + '<span class="ct-r">'+sapChi.length+' đợt chưa thanh toán</span></div>'
      + '<div class="card-body">'
      + keys.map(k=>{
          const m = months[k], w = Math.round(m.v/maxV*100);
          const qua = k < today().slice(0,7);
          return '<div style="margin-bottom:9px"><div style="display:flex;justify-content:space-between;font-size:12.5px;margin-bottom:3px">'
            + '<span>'+(qua?'<span class="tag t-bad" style="font-size:10px">quá hạn</span> ':'')+'Tháng '+k.slice(5)+'/'+k.slice(0,4)+' <span class="muted">('+m.n+' đợt)</span></span>'
            + '<b>'+fmtTr(m.v)+'</b></div>'
            + '<div class="bar '+(qua?'red':'')+'"><i style="width:'+w+'%"></i></div></div>';
        }).join('')
      + '</div><div class="rule">Số tiền đã trừ phần giữ lại. Dùng để thu xếp dòng tiền trước khi đến hạn nghiệm thu.</div></div>';
  }

  /* ---- Cảnh báo chi vượt tiến độ ---- */
  const vuot = list.filter(x=>x.td.vuot);
  if(vuot.length){
    html += '<div class="card" style="border-color:var(--bad)"><div class="ct" style="color:var(--bad)">⚠ Chi vượt tiến độ thi công ('+vuot.length+')</div>'
      + '<div class="tbl-wrap"><table class="tbl"><tbody>'
      + vuot.map(x=>'<tr class="row-click" onclick="tpToggleHD(\''+esc(x.h['Mã HĐTP'])+'\')">'
        + '<td>'+tpAvatar(x.h['Thầu phụ'])+' <b style="vertical-align:middle">'+esc(x.h['Thầu phụ'])+'</b>'
        + '<div class="muted" style="margin-left:34px">'+esc(projName(x.h['Mã DA']))+' · '+esc(x.h['Hạng mục']||'')+'</div></td>'
        + '<td class="num">Đã chi <b style="color:var(--bad)">'+x.td.pctChi+'%</b> · công việc mới <b>'+x.td.pctViec+'%</b>'
        + '<div class="muted">chênh '+(x.td.pctChi-x.td.pctViec)+' điểm %</div></td></tr>').join('')
      + '</tbody></table></div>'
      + '<div class="rule">Đã thanh toán nhiều hơn khối lượng thực hiện trên 20 điểm %. Rà soát trước khi duyệt đợt tiếp theo.</div></div>';
  }

  /* ---- DANH SÁCH HỢP ĐỒNG (gập/mở xem đợt thanh toán) ---- */
  if(!list.length) return html+'<div class="empty">Không có hợp đồng khớp bộ lọc</div>';

          + (s.chuaLap>0?' · <span style="color:var(--warn)">chưa lập '+fmtTr(s.chuaLap)+'</span>':'')

          + '<i style="width:'+wGiu+'%;background:#7E57C2" title="Giữ lại"></i>'
          + '<i style="width:'+wCho+'%;background:#3A6EA5" title="Đã duyệt chờ chi"></i>'
          + '<i style="width:'+wDuyet+'%;background:#E8A33D" title="Chờ duyệt"></i>'

    if(open){

      if(s.dot.length){
        html += '<div class="tbl-wrap"><table class="tbl"><thead><tr><th>Giai đoạn</th><th>Nội dung đợt</th>'

          const dl = d['Ngày đến hạn'] ? daysLeft(d['Ngày đến hạn']) : null;

            + '<td class="row-click" onclick="formSubPayment(\''+esc(d['Mã TTP'])+'\')"><b>'+esc(d['Hạng mục']||'Đợt thanh toán')+'</b>'

        // dòng tổng

          + '</td></tr>';
        html += '</tbody></table></div>';
      } else {

          + '<button class="btn btn-ghost" style="padding:6px 12px;font-size:12.5px" onclick="event.stopPropagation();window._pjCode=\''+esc(hd['Mã DA'])+'\';window._pjTab=\'taichinh\';go(\'duanDetail\')">Xem dự án →</button>'
          + '</div>';

      html += '</div>';

    html += '</div>';

  html += '<div class="rule">Quy tắc chi: <b>chưa nghiệm thu → không có đề nghị → không chi.</b> '
    + 'Thanh màu: <span style="color:#4B7A3F">■</span> đã chi · <span style="color:#7E57C2">■</span> giữ lại · '

/* ================= TAB 4 · ĐÁNH GIÁ NHÀ THẦU ================= */
function tpDanhGia(){
  const tps = S.thaubo||[];
  let html = '<div class="card"><div class="ct">Đánh giá xét chọn nhà thầu'
    + (can('edit')?'<button class="btn btn-brass" style="margin-left:auto;padding:6px 13px;font-size:12.5px" onclick="formDanhGiaTP()">+ Lập phiếu đánh giá</button>':'')
    + '</div>'
    + '<div style="padding:2px 18px 12px;font-size:11.5px;color:var(--ink-faint)">'
    + 'Lần đánh giá mới nhất mỗi nhà thầu · biểu mẫu <b>BM.MDC.QTTP.02</b> · thang '+TONG_DIEM_TP+' điểm'
    + ' · A ≥200 · B ≥175 · C ≥150 · D &lt;150</div>';

  if(!tps.length) return html+'<div class="empty">Chưa có nhà thầu để đánh giá</div></div>';

  html += '<div class="tbl-wrap"><table class="tbl"><thead><tr><th>Nhà thầu</th><th>Xếp loại</th>'
    + '<th class="num">Điểm</th><th>Điểm vận hành</th><th>Ngày đánh giá</th><th>Kết luận</th></tr></thead><tbody>';
  html += tps.map(t=>{
    const ten = t['Tên / Công ty'];
    const dg = tpDanhGiaMoiNhat(ten);
    const diem = dg ? Number(dg['Điểm'])||0 : null;
    const xl = dg ? xepLoaiTP(diem) : null;
    const cu = dg && dg['Ngày đánh giá'] && daysLeft(dg['Ngày đánh giá']) < -365;
    return '<tr class="row-click" onclick="'+(dg?'formDanhGiaTP(\''+esc(dg['Mã ĐG'])+'\')':'formDanhGiaTP(null,\''+esc(ten)+'\')')+'">'
      + '<td>'+tpAvatar(ten)+' <b style="vertical-align:middle">'+esc(ten)+'</b>'
        + '<div class="muted" style="margin-left:34px">'+esc(t['Loại thầu']||'')+'</div></td>'
      + '<td>'+(xl?'<span class="tag '+xl[3]+'">Loại '+xl[0]+'</span>':'<span class="muted">Chưa đánh giá</span>')+'</td>'
      + '<td class="num">'+(diem!==null?'<b>'+diem+'</b><span class="muted">/'+TONG_DIEM_TP+'</span>':'<span class="muted">—</span>')+'</td>'
      + '<td>'+saoHtml(tpDiemVanHanh(ten))+'</td>'
      + '<td class="muted">'+(dg&&dg['Ngày đánh giá']
          ? esc(dg['Ngày đánh giá'])+(cu?'<div><span class="tag t-warn" style="font-size:10px">quá 12 tháng</span></div>':'')
          : 'Chưa đánh giá')+'</td>'
      + '<td class="muted" style="max-width:230px">'+(dg?esc(String(dg['Kết luận']||'').slice(0,70)):'—')+'</td></tr>';
  }).join('');
  html += '</tbody></table></div></div>';

  // Lịch sử đánh giá
  const all = (S.danhgiaTP||[]).sort((a,b)=>(b['Ngày đánh giá']||'')>(a['Ngày đánh giá']||'')?1:-1);
  if(all.length){
    html += '<div class="card"><div class="ct">Lịch sử đánh giá ('+all.length+' phiếu)</div>'
      + '<div class="tbl-wrap"><table class="tbl"><thead><tr><th>Ngày</th><th>Nhà thầu</th><th>Xếp loại</th>'
      + '<th class="num">Điểm</th><th>Người đánh giá</th></tr></thead><tbody>'
      + all.slice(0,25).map(x=>{
          const xl = xepLoaiTP(Number(x['Điểm'])||0);
          return '<tr class="row-click" onclick="formDanhGiaTP(\''+esc(x['Mã ĐG'])+'\')">'
            + '<td class="muted">'+esc(x['Ngày đánh giá']||'—')+'</td>'
            + '<td><b>'+esc(x['Thầu phụ'])+'</b></td>'
            + '<td><span class="tag '+xl[3]+'">Loại '+xl[0]+'</span></td>'
            + '<td class="num">'+esc(x['Điểm'])+'/'+TONG_DIEM_TP+'</td>'
            + '<td class="muted">'+esc(x['Người đánh giá']||'—')+'</td></tr>';
        }).join('')
      + '</tbody></table></div></div>';
  }
  return html;
}

/* ================= FORM PHIẾU ĐÁNH GIÁ ================= */
function formDanhGiaTP(code, tenGoiY){
  const x = code ? (S.danhgiaTP||[]).find(t=>t['Mã ĐG']===code) : null;
  const isNew = !x;
  if(!can('edit') && isNew) return toast('Không có quyền', true);
  let diem = [];
  try { diem = JSON.parse(x?.['Chi tiết điểm']||'[]'); } catch(e){ diem=[]; }
  const ten = x?.['Thầu phụ'] || tenGoiY || '';
  const s = ten ? tpStats(ten) : null;
  const vh = ten ? tpDiemVanHanh(ten) : null;

  // Gợi ý dữ liệu vận hành thực tế để chấm khách quan
  let goiY = '';
  if(s && s.tongCV){
    goiY = '<div class="tv-hint" style="background:#E8EEF7;color:#2E5A8F">'
      + '<b>Dữ liệu vận hành thực tế</b> — tham khảo khi chấm điểm:<br>'
      + '• Đầu việc đã giao: <b>'+s.tongCV+'</b> · hoàn thành <b>'+s.daHT+'</b>'
      + (s.treHan?' · <span style="color:var(--bad)">trễ hạn '+s.treHan+'</span>':' · không có việc trễ')+'<br>'
      + '• Sự không phù hợp liên quan: <b>'+s.nc+'</b> · sự cố an toàn: <b>'+s.at+'</b><br>'
      + '• Hợp đồng: <b>'+s.hds.length+'</b> · giá trị '+fmtTr(s.gt)+' · đã chi '+fmtTr(s.daChi)+'<br>'
      + '• Điểm vận hành tự động: <b>'+(vh!==null?vh.toFixed(1)+'/5':'chưa chấm')+'</b></div>';
  }

  // Bảng chấm điểm
  let idx = 0, body = '';
  TIEU_CHI_TP.forEach((g,gi)=>{
    const maxG = g[1].reduce((a,c)=>a+c[1],0);
    body += '<div class="dg-group"><div class="dg-gh">'+esc(g[0])
      + '<span class="dg-gm" id="dgG'+gi+'">0/'+maxG+'</span></div>';
    g[1].forEach(c=>{
      const cur = diem[idx];
      body += '<div class="dg-row"><div class="dg-t">'+esc(c[0])
        + '<span class="dg-max">tối đa '+c[1]+'đ</span></div>'
        + '<select class="dg-s" data-g="'+gi+'" data-max="'+c[1]+'" onchange="dgRecalc()">'
        + MUC_DIEM.map(m=>{
            const v = Math.round(c[1]*m[1]);
            return '<option value="'+v+'"'+(cur!==undefined&&Number(cur)===v?' selected':(cur===undefined&&m[1]===0.75?' selected':''))+'>'+m[0]+' ('+v+'đ)</option>';
          }).join('')
        + '</select></div>';
      idx++;
    });
    body += '</div>';
  });

  openModal(isNew?'Phiếu đánh giá xét chọn nhà thầu':'Phiếu đánh giá '+code,
    goiY
    + '<div class="grid2">'
    + fld('Nhà thầu *','<select id="dgTP">'+'<option value="">— Chọn nhà thầu —</option>'
        + (S.thaubo||[]).map(t=>'<option value="'+esc(t['Tên / Công ty'])+'"'+(vnorm(ten)===vnorm(t['Tên / Công ty'])?' selected':'')+'>'+esc(t['Tên / Công ty'])+'</option>').join('')+'</select>')
    + fld('Ngày đánh giá', inp('dgNgay', x?.['Ngày đánh giá']||today(),'date'))
    + '</div>'
    + '<div class="dg-total" id="dgTotal">Tổng điểm: <b>0</b>/'+TONG_DIEM_TP+' — <span id="dgXL">—</span></div>'
    + '<div class="section-label">Bảng chấm điểm — biểu mẫu BM.MDC.QTTP.02</div>'
    + body
    + fld('Kết luận / Kiến nghị', '<textarea id="dgKL" rows="2" placeholder="vd: Sử dụng dịch vụ nhà thầu, đáp ứng yêu cầu chất lượng và tiến độ">'+esc(x?.['Kết luận']||'')+'</textarea>')
    + fld('Người đánh giá', inp('dgNguoi', x?.['Người đánh giá']||user['Họ tên']))
    + fld('Ghi chú','<textarea id="dgGC" rows="2">'+esc(x?.['Ghi chú']||'')+'</textarea>'),
    function save(){
      if(!V('dgTP')) return toast('Chưa chọn nhà thầu', true);
      const sels = [...document.querySelectorAll('.dg-s')];
      const arr = sels.map(s=>Number(s.value)||0);
      const tong = arr.reduce((a,v)=>a+v,0);
      const xl = xepLoaiTP(tong);
      const rec = {'Mã ĐG':code||'','Thầu phụ':V('dgTP'),'Ngày đánh giá':V('dgNgay'),
        'Điểm':tong,'Xếp loại':xl[0],'Chi tiết điểm':JSON.stringify(arr),
        'Kết luận':V('dgKL')||xl[2],'Người đánh giá':V('dgNguoi'),'Ghi chú':V('dgGC'),
        'Biểu mẫu':'BM.MDC.QTTP.02'};
      if(isNew){ rec['Mã ĐG']=tempCode('DG',S.danhgiaTP||[],'Mã ĐG'); (S.danhgiaTP=S.danhgiaTP||[]).push(rec); }
      else Object.assign(x, rec);
      // đồng bộ sao đánh giá về hồ sơ nhà thầu (1–5)
      const tp = (S.thaubo||[]).find(t=>vnorm(t['Tên / Công ty'])===vnorm(V('dgTP')));
      if(tp){ tp['Đánh giá'] = Math.max(1, Math.round(tong/TONG_DIEM_TP*5));
        pushOp('saveSubcontractor', {'Mã TP':tp['Mã TP'],'Đánh giá':tp['Đánh giá']}); }
      closeModal(); pushOp('saveDanhGiaTP', rec);
      toast('✓ Đã lưu: '+tong+'/'+TONG_DIEM_TP+' — Loại '+xl[0]);
    },
    (!isNew && can('deleteAny')) ? function(){ if(!confirm('Xóa phiếu đánh giá?')) return;
      S.danhgiaTP=(S.danhgiaTP||[]).filter(t=>t['Mã ĐG']!==code); closeModal(); pushOp('deleteDanhGiaTP',{code}); toast('Đã xóa'); } : null
  );
  setTimeout(dgRecalc, 40);
}
function dgRecalc(){
  const sels = [...document.querySelectorAll('.dg-s')];
  if(!sels.length) return;
  const gTot = {};
  let tong = 0;
  sels.forEach(s=>{
    const v = Number(s.value)||0, g = s.dataset.g;
    tong += v; gTot[g] = (gTot[g]||0) + v;
  });
  TIEU_CHI_TP.forEach((g,gi)=>{
    const el = document.getElementById('dgG'+gi);
    const maxG = g[1].reduce((a,c)=>a+c[1],0);
    if(el){ el.textContent = (gTot[gi]||0)+'/'+maxG;
      el.style.color = (gTot[gi]||0) >= maxG*0.8 ? 'var(--ok)' : (gTot[gi]||0) >= maxG*0.6 ? 'var(--brass-deep)' : 'var(--warn)'; }
  });
  const xl = xepLoaiTP(tong);
  const t = document.getElementById('dgTotal'), xe = document.getElementById('dgXL');
  if(t) t.innerHTML = 'Tổng điểm: <b>'+tong+'</b>/'+TONG_DIEM_TP+' — <span id="dgXL"><b>Loại '+xl[0]+'</b> · '+xl[2]+'</span>';
  if(t) t.style.borderColor = xl[0]==='A'?'var(--ok)':xl[0]==='B'?'var(--info)':xl[0]==='C'?'var(--warn)':'var(--bad)';
}

    + '</div>';

  if(view==='bangluong') return html + nsBangLuong();

function plThucLinh(b){
  const ht=String(b['Hình thức']||'Tháng');
  const goc = ht==='Công nhật' ? (Number(b['Lương theo công (đ)'])||0) : (Number(b['Lương cơ bản (đ)'])||0);
  return Math.round(goc + (Number(b['Phụ cấp (đ)'])||0) + (Number(b['Tăng ca (đ)'])||0) + (Number(b['Thưởng (đ)'])||0)
    - (Number(b['Tạm ứng (đ)'])||0) - (Number(b['Khấu trừ (đ)'])||0));
}
function payrollGenerate(){
  if(!can('staff')) return toast('Không có quyền',true);
  const ky = nsKyMacDinh();
  const staff=(S.nhansu||[]).filter(n=>/làm việc|đang làm|active/i.test(String(n['Trạng thái']||''))||!n['Trạng thái']);
  const cc=(S.chamcong||[]).filter(c=>String(c['Ngày']||'').slice(0,7)===ky);
  const congByNV={}; cc.forEach(c=>{ if(/nghỉ không phép/i.test(String(c['Loại công']||''))) return; congByNV[c['Mã NV']]=(congByNV[c['Mã NV']]||0)+(Number(c['Số công'])||0); });
  let added=0, updated=0;
  staff.forEach(n=>{
    const ht=String(n['Hình thức lương']||'Tháng');
    const cong=congByNV[n['Mã NV']]||0;
    if(ht==='Công nhật' && cong<=0) return; // thợ không có công thì bỏ qua
    const dg=Number(n['Đơn giá công (đ)'])||0, lcb=Number(n['Lương cơ bản (đ)'])||0;
    const luongCong = ht==='Công nhật' ? Math.round(cong*dg) : 0;
    let b=(S.bangluong||[]).find(x=>String(x['Kỳ lương'])===ky && x['Mã NV']===n['Mã NV']);
    const base = { 'Kỳ lương':ky,'Mã NV':n['Mã NV'],'Họ tên':n['Họ tên'],'Hình thức':ht,
      'Lương cơ bản (đ)':ht==='Tháng'?lcb:0,'Số công':ht==='Công nhật'?cong:'','Đơn giá công (đ)':ht==='Công nhật'?dg:'',
      'Lương theo công (đ)':luongCong };
    if(b){ // cập nhật phần tự tính, giữ phụ cấp/tạm ứng đã nhập tay
      Object.assign(b, base); b['Thực lĩnh (đ)']=plThucLinh(b); Object.assign(b,{'_dirty':1});
      updated++; pushOp('savePayroll', stripU(b));
    } else {
      b = Object.assign({'Mã BL':tempCode('BL',S.bangluong||[],'Mã BL')}, base,
        {'Phụ cấp (đ)':0,'Tăng ca (đ)':0,'Thưởng (đ)':0,'Tạm ứng (đ)':0,'Khấu trừ (đ)':0,'Trạng thái':'Nháp','Người lập':user['Họ tên'],'Ghi chú':''});
      b['Thực lĩnh (đ)']=plThucLinh(b);
      (S.bangluong=S.bangluong||[]).push(b); added++; pushOp('savePayroll', stripU(b));
    }
  });
  render(); toast('Đã tính lương kỳ '+ky+': '+added+' mới, '+updated+' cập nhật');
}
function stripU(o){ const c=Object.assign({},o); delete c._dirty; return c; }

  if(!can('staff')) return toast('Không có quyền',true);
  const x = code ? (S.bangluong||[]).find(t=>t['Mã BL']===code) : null;
  const isNew = !x;
  const ky = x?.['Kỳ lương'] || nsKyMacDinh();
  openModal(isNew?'Thêm dòng lương':'Bảng lương '+code,
    '<div class="grid2">'

const LEAD_CLOSED_KEYS = ['chot','ky hop dong','ky hd','da ky','thang','won','dat coc','hop dong'];

function leadsReady(){
  return (S.leads||[]).filter(l => !l.maDA && (l.ready !== undefined ? l.ready : LEAD_CLOSED_KEYS.some(k => vnorm(l.trangthai).includes(k))));

function photoThumbs(){

// Dùng cho file lớn: bản vẽ CAD, video, PDF nặng. Chỉ lưu link, không tải file lên.
function attachDriveLink(){
  const url = prompt('Dán link file (Google Drive, OneDrive, hoặc URL bất kỳ):');
  if(!url) return;
  const u = url.trim();
  if(!/^https?:\/\//i.test(u)){ toast('Link phải bắt đầu bằng http:// hoặc https://', true); return; }
  let name = prompt('Tên hiển thị cho file này (vd: Bản vẽ kết cấu tầng 2.dwg):', '');
  name = (name||'').trim() || 'Link đính kèm';
  (window.__photos = window.__photos || []).push({ link: u, name: name, doc: true });
  const g = document.getElementById('photoGrid'); if(g) g.innerHTML = photoThumbs();
  toast('✓ Đã đính link: ' + name);
}

// Đọc file bất kỳ → base64 (bỏ tiền tố data:...;base64,)
function fileToBase64(file){
  return new Promise(function(res, rej){
    const r = new FileReader();
    r.onload = function(){ res(String(r.result).split(',')[1]); };
    r.onerror = function(){ rej(new Error('Không đọc được file')); };
    r.readAsDataURL(file);
  });
}
function compressImage(file, maxDim, quality){
  maxDim = maxDim || 1600; quality = quality || 0.82;
  return new Promise(function(res, rej){
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = function(){
      let w = img.width, h = img.height;
      const k = Math.min(1, maxDim / Math.max(w, h));
      w = Math.round(w * k); h = Math.round(h * k);
      const cv = document.createElement('canvas'); cv.width = w; cv.height = h;
      cv.getContext('2d').drawImage(img, 0, 0, w, h);
      URL.revokeObjectURL(url);
      res(cv.toDataURL('image/jpeg', quality).split(',')[1]);
    };
    img.onerror = function(){ URL.revokeObjectURL(url); rej(new Error('Không đọc được ảnh')); };
    img.src = url;
  });
}

    html += '<div class="approve-box">💬 ' + esc(yk) + (c['Người duyệt'] ? '<br><span class="muted">— ' + esc(c['Người duyệt']) + ' · ' + esc(c['Ngày duyệt']||'') + '</span>' : '') + '</div>';

<script>
/* ================================================================
   BIỂU MẪU (MODAL)
================================================================ */
let modalCtx = null;
function openModal(title, bodyHtml, onSave, onDelete){

}
function closeModal(){ document.getElementById('modalBg').classList.remove('open'); }
function fld(label, html){ return '<div class="field"><label>'+label+'</label>'+html+'</div>'; }
function inp(id, val, type, ph){ return '<input id="'+id+'" type="'+(type||'text')+'" value="'+esc(val??'')+'" placeholder="'+esc(ph||'')+'">'; }
function sel(id, arr, val){ return '<select id="'+id+'">'+opt(arr, val)+'</select>'; }
function selProj(id, val){ return '<select id="'+id+'"><option value="">— Chọn dự án —</option>'+S.duan.map(d=>'<option value="'+d['Mã DA']+'"'+(d['Mã DA']===val?' selected':'')+'>'+esc(d['Tên dự án'])+'</option>').join('')+'</select>'; }
function selStaff(id, val){ return '<select id="'+id+'"><option value="">— Chọn người —</option>'+S.nhansu.filter(n=>n['Trạng thái']!=='Nghỉ việc').map(n=>'<option'+(n['Họ tên']===val?' selected':'')+'>'+esc(n['Họ tên'])+'</option>').join('')+'</select>'; }
// Ô thầu phụ/đối tác: input gắn datalist — vừa chọn từ sheet Nhà thầu phụ, vừa gõ tên mới được.
function inpThauPhu(id, val){
  const items = (S.thaubo||[]).filter(t => t['Trạng thái']!=='Ngừng hợp tác');
  const opts = items.map(t => {
    const ten = t['Tên / Công ty']||''; const loai = t['Loại thầu']?(' — '+t['Loại thầu']):'';

  }).join('');
  return '<input id="'+id+'" list="'+id+'_dl" value="'+esc(val??'')+'" placeholder="Chọn thầu phụ hoặc gõ tên đối tác mới" autocomplete="off">'

function V(id){ const el = document.getElementById(id); return el ? el.value.trim() : ''; }

/* ----- Dự án ----- */

        + '</label>').join('') + '</div>';
  const seedBlock = isNew
    ? '<div class="field" style="margin-top:4px">'
      + '<label style="display:flex;gap:8px;align-items:flex-start;cursor:pointer">'

      + '<span><b>Tạo sẵn bộ công việc mẫu theo giai đoạn</b><br><span class="muted">Hạn mỗi việc tính tự động từ ngày bắt đầu. Danh sách thay đổi theo Loại hình:</span></span></label>'
      + '<div id="pSeedPreview" style="border:1px solid var(--brass-soft);border-top:none;border-radius:0 0 var(--r-sm) var(--r-sm);padding:11px 14px;background:#FFFDF8;max-height:240px;overflow-y:auto">'
      + seedPreviewHtml('Thiết kế & Thi công') + '</div></div>'
    : '';
  const zaloBtn = (!isNew && d['SĐT khách']) ? ' ' + btnZalo(d['SĐT khách'], 'Nhắn Zalo khách') : '';
  openModal(isNew ? 'Thêm dự án mới' : 'Dự án ' + code,
    roBanner
    + fld('Tên dự án *', inp('pTen', d?.['Tên dự án'],'text','vd: Căn hộ anh Hùng — Vinhomes Huế'))
    + '<div class="grid2">'
    + fld('Khách hàng', inp('pKH', d?.['Khách hàng']))

    + '</div>'
    + fld('Địa chỉ công trình', inp('pDC', d?.['Địa chỉ công trình']))

    + fld('Giai đoạn', sel('pGD', GIAI_DOAN, d?.['Giai đoạn']||GIAI_DOAN[0]))
    + fld('Giá trị HĐ Thiết kế (đ)', inp('pHDTK', d?.['Giá trị HĐ Thiết kế (đ)'],'number'))
    + fld('Giá trị HĐ Thi công (đ)', inp('pHDTC', d?.['Giá trị HĐ Thi công (đ)'],'number'))
    + fld('Ngân sách chi phí (đ)', inp('pNS', d?.['Ngân sách (đ)'],'number'))
    + fld('Ngày bắt đầu', inp('pBD', d?.['Ngày bắt đầu']||today(),'date'))
    + fld('Ngày kết thúc dự kiến', inp('pKT', d?.['Ngày kết thúc DK'],'date'))

    + fld('Ghi chú', '<textarea id="pGC" rows="2">'+esc(d?.['Ghi chú']||'')+'</textarea>')

        'Tiến độ (%)': d?.['Tiến độ (%)']||0,
        'Ngày bắt đầu':V('pBD'),'Ngày kết thúc DK':V('pKT'),'Phụ trách':V('pPT'),'Trạng thái':V('pTT'),'Ghi chú':V('pGC'),
        'Thành viên': members};
      // Tự liên kết với khách hàng CRM theo SĐT (để dữ liệu dự án hiển thị ngược về CRM)
      if(isNew){
        var _np=function(x){var s=String(x||'').replace(/[^0-9]/g,'');if(s.indexOf('84')===0&&s.length>=11)s=s.slice(2);return s.replace(/^0+/,'');};

/* ----- Công việc ----- */
function tvParticipants(cur){
  const chosen = new Set(String(cur||'').split(',').map(s=>s.trim()).filter(Boolean));

function __lhAutoFillKH(){
  const da = document.getElementById('lhDA').value;

  if(kh && !kh.value) kh.value = d['Khách hàng']||'';

}

    html += vattu.map(x=>'<tr class="row-click" onclick="formPurchase(\''+esc(x['Mã MS'])+'\')"><td><b>'+esc(x['Hạng mục'])+'</b></td><td class="muted">'+esc(projName(x['Mã DA']))+'</td><td>'+esc(x['NCC / Thầu phụ']||'—')+'</td><td class="num">'+esc(x['Số lượng']||'—')+'</td><td class="muted">'+esc(x['Ngày nhận dự kiến']||x['Ngày đặt']||'—')+'</td><td class="num"><b>'+fmt(x['Tổng tiền'])+'</b></td><td>'+tagTT(x['Trạng thái']||'Đang soạn')+'</td></tr>').join('');

        + (photos.length?'<div class="muted" style="margin-top:4px">📷 '+photos.length+' ảnh</div>':'')
        + '</div>';
    });
    html += '</div>';
  });
  html += '</div></div>';
  return html;
}

function msNhaCungCap(all){
  const map={};
  all.forEach(x=>{ const n=(x['NCC / Thầu phụ']||'').trim()||'(chưa ghi NCC)';
    const g=(map[n]=map[n]||{n,don:0,tien:0,nhan:0,loai:new Set(),da:new Set()});
    g.don++; g.tien+=Number(x['Tổng tiền'])||0; if(x['Trạng thái']==='Đã nhận')g.nhan++;
    if(x['Loại'])g.loai.add(x['Loại']); if(x['Mã DA'])g.da.add(x['Mã DA']); });
  const rows=Object.values(map).sort((a,b)=>b.tien-a.tien);
  if(!rows.length) return '<div class="empty" style="padding:30px 20px"><b>Chưa có nhà cung cấp</b>Tạo đơn đặt hàng và ghi tên NCC để tổng hợp ở đây.</div>';
  let h='<div class="kpis">'
    + kpi('Số nhà cung cấp',rows.length,'đã từng đặt hàng')
    + kpi('Tổng chi mua sắm',fmtTr(rows.reduce((a,r)=>a+r.tien,0)),'tất cả đơn','accent')
    + kpi('NCC lớn nhất',esc(rows[0].n),fmtTr(rows[0].tien))
    + '</div>';
  h+='<div class="card"><div class="card-body" style="padding:0"><div class="tbl-wrap"><table class="tbl"><thead><tr><th>Nhà cung cấp</th><th class="num">Số đơn</th><th class="num">Đã nhận</th><th>Nhóm vật tư</th><th class="num">Số dự án</th><th class="num">Tổng giá trị</th></tr></thead><tbody>';
  h+=rows.map(r=>'<tr class="row-click" data-ncc="'+esc(r.n)+'" onclick="msPickNCC(this)"><td><b>'+esc(r.n)+'</b></td><td class="num">'+r.don+'</td><td class="num">'+r.nhan+'/'+r.don+'</td><td class="muted">'+esc([...r.loai].join(', ')||'—')+'</td><td class="num">'+r.da.size+'</td><td class="num"><b>'+fmtTr(r.tien)+'</b></td></tr>').join('');
  h+='</tbody></table></div></div></div>';
  return h;
}

function khoTonHop(){
  // gom theo tên vật tư: tồn = Σnhập − Σxuất
  const map={};
  (S.kho||[]).forEach(g=>{ const k=(g['Vật tư']||'').trim(); if(!k) return;
    const m=map[k]=map[k]||{ten:k,dvt:g['ĐVT']||'',nhap:0,xuat:0,giaTri:0};
    const sl=Number(g['Số lượng'])||0, tt=Number(g['Thành tiền'])||0;
    if(String(g['Loại GD'])==='Xuất'){ m.xuat+=sl; } else { m.nhap+=sl; m.giaTri+=tt; if(g['ĐVT'])m.dvt=g['ĐVT']; }
  });
  return Object.values(map).map(m=>{ m.ton=m.nhap-m.xuat; m.dongia=m.nhap?Math.round(m.giaTri/m.nhap):0; return m; });
}

/* --- SỔ GIAO DỊCH HỢP NHẤT: gom mọi nguồn tiền về 1 định dạng --- */
function finLedger(){
  const L = [];
  const add = o => L.push(o);

  // 1) THU từ khách (đợt thanh toán đã thu)
  (S.thanhtoan||[]).forEach(x=>{
    const thu = Number(x['Đã thu (đ)'])||0;
    if(thu>0) add({dir:'in', loai:'Thu tiền', da:x['Mã DA'],
      dg:(x['Tên đợt']||'Thu tiền hợp đồng'), km:'REV', tien:thu,
      ngay:x['Ngày thu']||x['Ngày đến hạn']||'', tt:'Đã thực hiện',
      code:x['Mã TT'], open:'formPayment'});
  });
  // 2) CHI trực tiếp (chi phí)
  (S.chiphi||[]).forEach(x=>{
    const st = x['Trạng thái duyệt']||'Chờ duyệt';
    add({dir:'out', loai:'Chi trực tiếp', da:x['Mã DA'],
      dg:x['Hạng mục']||'Chi phí', km:x['Khoản mục']||KM_TU_LOAI[x['Loại chi phí']]||'OTH',
      tien:Number(x['Số tiền (đ)'])||0, ngay:x['Ngày chi']||'',
      tt: st==='Đã duyệt' ? 'Đã thực hiện' : st==='Từ chối' ? 'Từ chối' : 'Chờ duyệt',
      code:x['Mã CP'], open:'formExpense'});
  });
  // 3) CHI thầu phụ (đợt đã thanh toán / đã duyệt chờ chi)
  (S.ttthauphu||[]).forEach(x=>{
    const s = x['Trạng thái']||'';
    if(s==='Chờ nghiệm thu') return;
    add({dir:'out', loai:'Chi thầu phụ', da:x['Mã DA'],
      dg:(x['Thầu phụ']||'')+(x['Hạng mục']?' — '+x['Hạng mục']:''), km:'SUB',
      tien:ttpChi(x), ngay:x['Ngày thanh toán']||x['Ngày đến hạn']||'',
      tt: s==='Đã thanh toán' ? 'Đã thực hiện' : s==='Đã duyệt · chờ chi' ? 'Đã duyệt' : 'Chờ duyệt',
      code:x['Mã TTP'], open:'formSubPayment'});
  });
  // 4) CHI mua sắm (đơn đã nhận)
  (S.muasam||[]).forEach(x=>{
    const s = x['Trạng thái']||'';
    if(s==='Hủy'||s==='Đang soạn') return;
    add({dir:'out', loai:'Chi mua sắm', da:x['Mã DA'],
      dg:x['Hạng mục']||'Mua sắm', km: /phụ kiện|thiết bị/i.test(x['Loại']||'') ? 'HDW' : 'MAT',
      tien:Number(x['Tổng tiền'])||0, ngay:x['Ngày đặt']||'',
      tt: s==='Đã nhận' ? 'Đã thực hiện' : 'Đã duyệt',
      code:x['Mã MS'], open:'formPurchase'});
  });
  // 5) TẠM ỨNG & HOÀN ỨNG
  (S.tamung||[]).forEach(x=>{
    const s = x['Trạng thái']||'';
    const ung = Number(x['Số tiền (đ)'])||0, hoan = Number(x['Đã hoàn (đ)'])||0;
    if(s==='Đã chi tạm ứng'||s.startsWith('Đã hoàn')){
      add({dir:'out', loai:'Tạm ứng', da:x['Mã DA'],
        dg:'Tạm ứng '+(x['Người nhận']||'')+(x['Lý do']?' — '+x['Lý do']:''), km:'ADV',
        tien:ung, ngay:x['Ngày tạm ứng']||'', tt:'Đã thực hiện',
        code:x['Mã TU'], open:'formAdvance'});
    }
    if(hoan>0) add({dir:'in', loai:'Hoàn ứng', da:x['Mã DA'],
      dg:'Hoàn ứng '+(x['Người nhận']||''), km:'ADV',
      tien:hoan, ngay:x['Ngày hoàn']||'', tt:'Đã thực hiện',
      code:x['Mã TU'], open:'formAdvance'});
  });
  // 6) THU KHÁC & VỐN
  (S.thukhac||[]).forEach(x=>{
    const ra = /hoàn vốn|trả nợ/i.test(x['Loại']||'');
    add({dir: ra?'out':'in', loai: /góp vốn/i.test(x['Loại']||'')?'Góp vốn':/vay/i.test(x['Loại']||'')?'Vay':'Thu khác',
      da:x['Mã DA']||'', dg:x['Diễn giải']||x['Loại']||'', km:'CAP',
      tien:Number(x['Số tiền (đ)'])||0, ngay:x['Ngày']||'', tt:x['Trạng thái']||'Đã thực hiện',
      code:x['Mã TK'], open:'formOtherIncome'});
  });
  return L.sort((a,b)=>(b.ngay||'')>(a.ngay||'')?1:-1);
}

/* --- Lọc chung theo bộ lọc đang chọn --- */
function finApplyFilter(L){
  const f = window._fnF || {};
  return L.filter(x=>{
    if(f.tt && x.tt!==f.tt) return false;
    if(f.loai && x.loai!==f.loai) return false;
    if(f.km && x.km!==f.km) return false;
    if(f.da && x.da!==f.da) return false;
    if(f.tu && (!x.ngay || x.ngay < f.tu)) return false;
    if(f.den && (!x.ngay || x.ngay > f.den)) return false;
    return true;
  });
}

    + '<input type="date" value="'+esc(f.den||'')+'" onchange="finSetF(\'den\',this.value)">'

    + '<button class="btn btn-ghost" style="padding:6px 11px;font-size:12px;margin-left:auto" onclick="finExport()">⬇ Xuất CSV</button>'

    + '<td class="muted">'+esc(x.da?projName(x.da):'— Toàn công ty —')+'</td>'
    + '<td>'+esc(x.dg||'—')+'</td>'
    + '<td><span class="km" title="'+esc(KM_MAP[x.km]||x.km)+'">'+esc(x.km)+'</span></td>'
    + '<td class="num"><span class="'+(x.dir==='in'?'num-in':'num-out')+'">'+(x.dir==='in'?'+':'−')+fmt(x.tien)+'</span></td>'
    + '<td class="muted">'+esc(x.ngay||'—')+'</td>'
    + '<td>'+tagTT(x.tt)+'</td></tr>').join('');
  html += '</tbody></table></div>'
    + (list.length>300?'<div class="muted" style="padding:9px 18px">Hiển thị 300/'+list.length+' giao dịch — thu hẹp bộ lọc để xem tiếp</div>':'')
    + '</div>'
    + '<div class="fin-total"><span class="ft-lbl">Thu '+fmtTr(tIn)+' · Chi '+fmtTr(tOut)+' · '+list.length+' giao dịch</span>'
    + '<span class="ft-val" style="color:'+(tIn-tOut>=0?'#9BE59B':'#FFB4AB')+'">'+((tIn-tOut)>=0?'+':'')+fmtTr(tIn-tOut)+'</span></div></div>';

}
function finExport(){
  const list = window.__finList||[];
  if(!list.length) return toast('Không có dữ liệu', true);
  const rows = [['Ngày','Loại','Dự án','Diễn giải','Khoản mục','Thu','Chi','Trạng thái']];
  list.forEach(x=>rows.push([x.ngay, x.loai, x.da?projName(x.da):'', x.dg, x.km,
    x.dir==='in'?x.tien:'', x.dir==='out'?x.tien:'', x.tt]));
  const csv = '\uFEFF' + rows.map(r=>r.map(c=>'"'+String(c==null?'':c).replace(/"/g,'""')+'"').join(',')).join('\n');
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));
  a.download = 'MDC_ThuChi_'+today()+'.csv'; a.click();
  toast('✓ Đã xuất '+list.length+' giao dịch');
}

/* ================= TAB 2 · TẠM ỨNG ================= */
function finTamUng(){
  const all = S.tamung||[];
  const f = window._fnTU||'';
  const chuaHoan = all.filter(x=>{
    const ung=Number(x['Số tiền (đ)'])||0, hoan=Number(x['Đã hoàn (đ)'])||0;
    return ung>hoan && x['Trạng thái']!=='Từ chối' && x['Trạng thái']!=='Chờ duyệt';
  });
  const tongUng = all.filter(x=>x['Trạng thái']!=='Từ chối').reduce((a,x)=>a+(Number(x['Số tiền (đ)'])||0),0);
  const tongHoan= all.reduce((a,x)=>a+(Number(x['Đã hoàn (đ)'])||0),0);

    + kpi('Tổng đã tạm ứng', fmtTr(tongUng), all.length+' phiếu')

    + kpi('Chưa hoàn ứng', fmtTr(tongUng-tongHoan), chuaHoan.length+' phiếu còn treo', (tongUng-tongHoan)?'bad':'')
    + kpi('Quá hạn hoàn ứng', quaHan.length, quaHan.length?'Cần thu hồi gấp':'Không có', quaHan.length?'bad':'ok')
    + '</div>';
  html += '<div class="fin-pills">'
    + [['','Tất cả'],['treo','Còn treo'],['quahan','Quá hạn'],['xong','Đã hoàn đủ']]
      .map(p=>'<button class="'+(f===p[0]?'on':'')+'" onclick="window._fnTU=\''+p[0]+'\';render()">'+p[1]+'</button>').join('')
    + '<button class="btn btn-brass" style="margin-left:auto;padding:7px 14px;font-size:12.5px" onclick="formAdvance()">+ Phiếu tạm ứng</button></div>';

  let list = all.slice();
  if(f==='treo') list = chuaHoan;
  if(f==='quahan') list = quaHan;
  if(f==='xong') list = all.filter(x=>(Number(x['Đã hoàn (đ)'])||0) >= (Number(x['Số tiền (đ)'])||0) && (Number(x['Số tiền (đ)'])||0)>0);

  if(!list.length) return html+'<div class="empty"><b>Chưa có phiếu tạm ứng</b>'
    + 'Tạm ứng cho giám sát mua vật tư, ứng thầu phụ, ứng công tác phí — theo dõi đến khi hoàn ứng đủ chứng từ.</div>';
  html += '<div class="card"><div class="card-body" style="padding:0"><div class="tbl-wrap"><table class="tbl">'
    + '<thead><tr><th>Người nhận</th><th>Loại</th><th>Dự án</th><th>Lý do</th><th class="num">Tạm ứng</th>'
    + '<th class="num">Đã hoàn</th><th class="num">Còn lại</th><th>Hạn hoàn</th><th>Trạng thái</th></tr></thead><tbody>';
  html += [...list].sort((a,b)=>(b['Ngày tạm ứng']||'')>(a['Ngày tạm ứng']||'')?1:-1).map(x=>{
    const ung=Number(x['Số tiền (đ)'])||0, hoan=Number(x['Đã hoàn (đ)'])||0, con=ung-hoan;
    const dl = x['Hạn hoàn ứng'] ? daysLeft(x['Hạn hoàn ứng']) : null;
    const late = con>0 && dl!==null && dl<0;
    return '<tr class="row-click" onclick="formAdvance(\''+esc(x['Mã TU'])+'\')">'
      + '<td><b>'+esc(x['Người nhận']||'—')+'</b></td>'
      + '<td><span class="tag t-brass">'+esc(x['Loại']||'')+'</span></td>'
      + '<td class="muted">'+esc(x['Mã DA']?projName(x['Mã DA']):'—')+'</td>'
      + '<td>'+esc(x['Lý do']||'—')+'</td>'

      + '<td>'+(x['Hạn hoàn ứng']?(late?'<span class="tag t-bad">trễ '+Math.abs(dl)+'n</span>':'<span class="muted">'+esc(x['Hạn hoàn ứng'])+'</span>'):'—')+'</td>'

  return html;
}

/* ================= TAB 3 · CÔNG NỢ PHẢI THU ================= */
function finCongNo(){
  const dot = (S.thanhtoan||[]).filter(x=>{
    const con=(Number(x['Giá trị (đ)'])||0)-(Number(x['Đã thu (đ)'])||0);
    return con>0 && x['Trạng thái']!=='Hủy';
  });
  const con = x => (Number(x['Giá trị (đ)'])||0)-(Number(x['Đã thu (đ)'])||0);
  const buckets = [
    {k:'Chưa đến hạn', f:x=>daysLeft(x['Ngày đến hạn'])>=0, hot:false},
    {k:'Quá hạn 1–30', f:x=>{const d=daysLeft(x['Ngày đến hạn']);return d<0&&d>=-30;}, hot:false},
    {k:'Quá hạn 31–60',f:x=>{const d=daysLeft(x['Ngày đến hạn']);return d<-30&&d>=-60;}, hot:true},
    {k:'Quá hạn 61–90',f:x=>{const d=daysLeft(x['Ngày đến hạn']);return d<-60&&d>=-90;}, hot:true},
    {k:'Quá hạn >90',  f:x=>daysLeft(x['Ngày đến hạn'])<-90, hot:true}
  ];
  const tong = dot.reduce((a,x)=>a+con(x),0);
  let html = '<div class="age-grid">' + buckets.map(b=>{
    const items = dot.filter(x=>x['Ngày đến hạn'] && b.f(x));
    const v = items.reduce((a,x)=>a+con(x),0);
    return '<div class="age '+(b.hot&&v?'hot':'')+'"><div class="al">'+b.k+'</div>'
      + '<div class="av" style="color:'+(b.hot&&v?'var(--bad)':'inherit')+'">'+fmtTr(v)+'</div>'
      + '<div class="an">'+items.length+' đợt</div></div>';
  }).join('') + '</div>';

  if(!dot.length) return html+'<div class="empty"><b>Không có công nợ phải thu 🎉</b>Tất cả đợt thanh toán đã thu đủ</div>';

  // Gom theo dự án
  const byDA = {};
  dot.forEach(x=>{ (byDA[x['Mã DA']] = byDA[x['Mã DA']]||[]).push(x); });
  html += '<div class="card"><div class="ct">Công nợ theo dự án<span class="ct-r">tổng '+fmtTr(tong)+'</span></div>'
    + '<div class="tbl-wrap"><table class="tbl"><thead><tr><th>Dự án / Khách hàng</th><th>Đợt còn nợ</th>'
    + '<th class="num">Giá trị HĐ</th><th class="num">Đã thu</th><th class="num">Còn phải thu</th><th>Quá hạn lâu nhất</th></tr></thead><tbody>';
  Object.keys(byDA).sort((a,b)=>byDA[b].reduce((s,x)=>s+con(x),0)-byDA[a].reduce((s,x)=>s+con(x),0)).forEach(da=>{
    const items = byDA[da];
    const d = S.duan.find(v=>v['Mã DA']===da) || {};
    const allDot = (S.thanhtoan||[]).filter(x=>x['Mã DA']===da);
    const gt = allDot.reduce((a,x)=>a+(Number(x['Giá trị (đ)'])||0),0);
    const thu= allDot.reduce((a,x)=>a+(Number(x['Đã thu (đ)'])||0),0);
    const worst = Math.min(...items.map(x=>daysLeft(x['Ngày đến hạn'])??999));
    return html += '<tr class="row-click" onclick="window._pjCode=\''+esc(da)+'\';window._pjTab=\'taichinh\';go(\'duanDetail\')">'
      + '<td><b>'+esc(d['Tên dự án']||da)+'</b>'+(d['Khách hàng']?'<div class="muted">'+esc(d['Khách hàng'])+(d['SĐT khách']?' · '+esc(d['SĐT khách']):'')+'</div>':'')+'</td>'
      + '<td>'+items.length+'/'+allDot.length+'</td>'
      + '<td class="num">'+fmt(gt)+'</td><td class="num" style="color:var(--ok)">'+fmt(thu)+'</td>'
      + '<td class="num"><b style="color:var(--bad)">'+fmt(items.reduce((a,x)=>a+con(x),0))+'</b></td>'
      + '<td>'+(worst<0?'<span class="tag t-bad">trễ '+Math.abs(worst)+' ngày</span>':'<span class="muted">chưa đến hạn</span>')+'</td></tr>';
  });
  html += '</tbody></table></div>'
    + '<div class="fin-total"><span class="ft-lbl">Tổng công nợ phải thu</span><span class="ft-val">'+fmtTr(tong)+'</span></div></div>';

  // Chi tiết từng đợt quá hạn
  const late = dot.filter(x=>x['Ngày đến hạn'] && daysLeft(x['Ngày đến hạn'])<0)
    .sort((a,b)=>(a['Ngày đến hạn']>b['Ngày đến hạn']?1:-1));
  if(late.length){
    html += '<div class="card"><div class="ct" style="color:var(--bad)">Đợt quá hạn cần thu hồi ('+late.length+')</div>'
      + '<div style="margin-top:6px">' + late.map(x=>
        '<div class="od" onclick="formPayment(\''+esc(x['Mã TT'])+'\')"><div class="oi">⚠</div>'
        + '<div class="ot"><b>'+esc(projName(x['Mã DA']))+' — '+esc(x['Tên đợt']||'')+'</b>'
        + '<span>Hạn '+esc(x['Ngày đến hạn'])+' · trễ '+Math.abs(daysLeft(x['Ngày đến hạn']))+' ngày'
        + ((Number(x['Đã thu (đ)'])||0)>0?' · đã thu một phần':'')+'</span></div>'
        + '<div class="ov" style="color:var(--bad)">'+fmtTr(con(x))+'</div></div>').join('')
      + '</div></div>';
  }
  return html;
}

/* ================= TAB 4 · THU KHÁC VÀ VỐN ================= */

    + kpi('Thu khác thuần', fmtTr(vao-ra), all.length+' bút toán','accent')

  if(!all.length) return html+'<div class="empty"><b>Chưa có bút toán thu khác</b>'

  html += '<div class="card"><div class="card-body" style="padding:0"><div class="tbl-wrap"><table class="tbl">'
    + '<thead><tr><th>Ngày</th><th>Loại</th><th>Diễn giải</th><th>Dự án</th><th>Nguồn / Đối tác</th><th class="num">Số tiền</th></tr></thead><tbody>';
  html += [...all].sort((a,b)=>(b['Ngày']||'')>(a['Ngày']||'')?1:-1).map(x=>{
    const ra2 = /hoàn vốn|trả nợ/i.test(x['Loại']||'');
    return '<tr class="row-click" onclick="formOtherIncome(\''+esc(x['Mã TK'])+'\')">'
      + '<td class="muted">'+esc(x['Ngày']||'—')+'</td>'
      + '<td><span class="tag '+(/góp vốn/i.test(x['Loại']||'')?'t-ok':/vay/i.test(x['Loại']||'')?'t-warn':'t-brass')+'">'+esc(x['Loại']||'')+'</span></td>'
      + '<td><b>'+esc(x['Diễn giải']||'—')+'</b></td>'
      + '<td class="muted">'+esc(x['Mã DA']?projName(x['Mã DA']):'— Toàn công ty —')+'</td>'
      + '<td class="muted">'+esc(x['Nguồn']||'—')+'</td>'
      + '<td class="num"><span class="'+(ra2?'num-out':'num-in')+'">'+(ra2?'−':'+')+fmt(x['Số tiền (đ)'])+'</span></td></tr>';
  }).join('');
  html += '</tbody></table></div></div>'
    + '<div class="fin-total"><span class="ft-lbl">Vào '+fmtTr(vao)+' · Ra '+fmtTr(ra)+'</span>'

  return html;

/* ================= TAB 5 · LÃI/LỖ DỰ ÁN ================= */
function finLaiLo(){
  const rows = S.duan.map(d=>{
    const da = d['Mã DA'];
    const R = projRevenue(da), C = projCost(da);
    const hd = R.hd, ps = R.ps, doanhThu = R.tong;
    const cp = C.trucTiep, tp = C.thauPhu, ms = C.muaSam, chi = C.tong;
    const lai = doanhThu-chi;
    const bien= doanhThu?Math.round(lai/doanhThu*1000)/10:0;
    const thu = (S.thanhtoan||[]).filter(x=>x['Mã DA']===da).reduce((a,x)=>a+(Number(x['Đã thu (đ)'])||0),0);
    return {d,da,doanhThu,hd,ps,chi,cp,tp,ms,lai,bien,thu};
  }).filter(r=>r.doanhThu||r.chi);

  const sortK = window._fnSort||'lai';
  rows.sort((a,b)=> sortK==='bien' ? a.bien-b.bien : a.lai-b.lai);
  const T = rows.reduce((a,r)=>({dt:a.dt+r.doanhThu, chi:a.chi+r.chi, lai:a.lai+r.lai}),{dt:0,chi:0,lai:0});
  const lo = rows.filter(r=>r.lai<0);
  const mong = rows.filter(r=>r.lai>=0 && r.bien<15 && r.doanhThu>0);

  let html = '<div class="kpis">'
    + kpi('Tổng doanh thu', fmtTr(T.dt), rows.length+' dự án','accent')
    + kpi('Tổng chi phí', fmtTr(T.chi), T.dt?Math.round(T.chi/T.dt*100)+'% doanh thu':'—')
    + kpi('Lãi gộp', fmtTr(T.lai), T.dt?'Biên '+(Math.round(T.lai/T.dt*1000)/10)+'%':'—', T.lai<0?'bad':'accent')
    + kpi('Dự án lỗ', lo.length, lo.length?'Cần rà soát ngay':(mong.length?mong.length+' dự án biên mỏng <15%':'Tất cả có lãi'), lo.length?'bad':'ok')
    + '</div>';
  if(lo.length||mong.length){
    html += '<div class="card" style="border-color:'+(lo.length?'var(--bad)':'var(--warn)')+'">'
      + '<div class="ct" style="color:'+(lo.length?'var(--bad)':'var(--warn)')+'">⚠ Cảnh báo hiệu quả</div><div class="card-body">'
      + (lo.length?'<p style="font-size:13px;margin-bottom:6px"><b style="color:var(--bad)">'+lo.length+' dự án đang lỗ:</b> '
          + esc(lo.slice(0,3).map(r=>r.d['Tên dự án']+' ('+fmtTr(r.lai)+')').join(' · '))+'</p>':'')
      + (mong.length?'<p style="font-size:13px"><b style="color:var(--warn)">'+mong.length+' dự án biên lãi mỏng &lt;15%:</b> '
          + esc(mong.slice(0,3).map(r=>r.d['Tên dự án']+' ('+r.bien+'%)').join(' · '))+'</p>':'')
      + '</div></div>';
  }
  html += '<div class="fin-pills">Sắp xếp: '
    + '<button class="'+(sortK==='lai'?'on':'')+'" onclick="window._fnSort=\'lai\';render()">Lãi thấp nhất</button>'
    + '<button class="'+(sortK==='bien'?'on':'')+'" onclick="window._fnSort=\'bien\';render()">Biên % thấp nhất</button></div>';

  if(!rows.length) return html+'<div class="empty">Chưa có dữ liệu doanh thu / chi phí</div>';

/* ================= TAB 6 · DỰ TOÁN VÀ CHI PHÍ ================= */
function finDuToan(){
  const daSel = window._fnDT||'';
  let html = '<div class="fin-filters">'
    + '<select onchange="window._fnDT=this.value;render()"><option value="">Toàn công ty</option>'
    + S.duan.map(d=>'<option value="'+d['Mã DA']+'"'+(daSel===d['Mã DA']?' selected':'')+'>'+esc(d['Tên dự án'])+'</option>').join('')
    + '</select></div>';

  const cp = (S.chiphi||[]).filter(x=>!daSel||x['Mã DA']===daSel);
  const tp = (S.ttthauphu||[]).filter(x=>(!daSel||x['Mã DA']===daSel)&&x['Trạng thái']==='Đã thanh toán');
  const ms = (S.muasam||[]).filter(x=>(!daSel||x['Mã DA']===daSel)&&x['Trạng thái']==='Đã nhận');
  // gom chi theo khoản mục
  const byKM = {};
  cp.forEach(x=>{ const k=x['Khoản mục']||KM_TU_LOAI[x['Loại chi phí']]||'OTH'; byKM[k]=(byKM[k]||0)+(Number(x['Số tiền (đ)'])||0); });
  tp.forEach(x=>{ byKM['SUB']=(byKM['SUB']||0)+ttpChi(x); });
  ms.forEach(x=>{ const k=x['Khoản mục']||(/phụ kiện|thiết bị/i.test(x['Loại']||'')?'HDW':'MAT'); byKM[k]=(byKM[k]||0)+(Number(x['Tổng tiền'])||0); });
  const tongChi = Object.values(byKM).reduce((a,v)=>a+v,0);

  const duan = daSel ? S.duan.filter(d=>d['Mã DA']===daSel) : S.duan;
  const ns = duan.reduce((a,d)=>a+(Number(d['Ngân sách (đ)'])||0),0);
  const conLai = ns - tongChi;
  const pct = ns?Math.round(tongChi/ns*100):0;

  // ★ v3.0 — cảnh báo bản ghi nghi ghi trùng với module Thầu phụ
  const CC = projCost(daSel);
  if(CC.nghiTrung.length){
    html += '<div class="card" style="border-color:var(--warn);margin-bottom:14px">'
      + '<div class="ct" style="color:var(--warn)">⚠ Nghi ghi trùng chi phí thầu phụ ('+CC.nghiTrung.length+' khoản · '+fmtTr(CC.vNghiTrung)+')</div>'
      + '<div class="card-body"><p style="font-size:12.5px;line-height:1.6">Các khoản dưới đây ghi ở <b>Chi phí</b> với loại “Thầu phụ”, '
      + 'trong khi dự án đã quản lý thầu phụ bằng <b>hợp đồng giao thầu</b>. Hệ thống đã <b>tự loại khỏi tổng chi</b> để không tính hai lần — '
      + 'nên chuyển hẳn sang module Thầu phụ rồi xóa bản ghi này.</p></div>'
      + '<div class="tbl-wrap"><table class="tbl"><tbody>'
      + CC.nghiTrung.slice(0,10).map(x=>'<tr class="row-click" onclick="formExpense(\''+esc(x['Mã CP'])+'\')">'
        + '<td><b>'+esc(x['Hạng mục'])+'</b><div class="muted">'+esc(projName(x['Mã DA']))+' · '+esc(x['Ngày chi']||'')+'</div></td>'
        + '<td class="num">'+fmt(x['Số tiền (đ)'])+'</td></tr>').join('')
      + '</tbody></table></div></div>';
  }
  html += '<div class="kpis">'
    + kpi('Dự toán (ngân sách)', ns?fmtTr(ns):'Chưa đặt', duan.length+' dự án')
    + kpi('Thực chi', fmtTr(CC.tong), 'Trực tiếp '+fmtTr(CC.trucTiep)+' · thầu phụ '+fmtTr(CC.thauPhu)+' · mua sắm '+fmtTr(CC.muaSam), ns&&(CC.tong/ns*100)>100?'bad':'')
    + kpi('Còn lại', ns?fmtTr(conLai):'—', conLai<0?'ĐÃ VƯỢT dự toán':'Chưa sử dụng', conLai<0?'bad':'accent')
    + kpi('Khoản mục chi', Object.keys(byKM).length, 'trên '+KHOAN_MUC.length+' nhóm')
    + '</div>';

  if(!tongChi) return html+'<div class="empty"><b>Chưa có chi phí ghi nhận</b>Ghi chi phí, thanh toán thầu phụ hoặc mua sắm để phân tích theo khoản mục</div>';

  // Bảng khoản mục
  html += '<div class="card"><div class="ct">Cơ cấu chi phí theo khoản mục</div>'
    + '<div class="tbl-wrap"><table class="tbl"><thead><tr><th>Mã</th><th>Khoản mục</th>'
    + '<th class="num">Thực chi</th><th>Tỷ trọng</th></tr></thead><tbody>';
  html += KHOAN_MUC.filter(k=>byKM[k[0]]).sort((a,b)=>byKM[b[0]]-byKM[a[0]]).map(k=>{
    const v = byKM[k[0]], w = Math.round(v/tongChi*1000)/10;
    return '<tr><td><span class="km" title="'+esc(k[2])+'">'+k[0]+'</span></td>'
      + '<td><b>'+esc(k[1])+'</b><div class="muted" style="font-size:10.5px">'+esc(k[2])+'</div></td>'
      + '<td class="num"><b>'+fmt(v)+'</b></td>'
      + '<td><span class="pl-bar-w" style="width:110px"><i style="width:'+w+'%;background:var(--brass)"></i></span> '
      + '<span style="font-size:11.5px;font-weight:600">'+w+'%</span></td></tr>';
  }).join('');
  html += '</tbody></table></div>'
    + '<div class="fin-total"><span class="ft-lbl">Tổng thực chi</span><span class="ft-val">'+fmtTr(tongChi)+'</span></div></div>';

  // Dự toán vs thực chi từng dự án
  if(!daSel){
    const rows = S.duan.filter(d=>Number(d['Ngân sách (đ)'])>0);
    if(rows.length){
      html += '<div class="card"><div class="ct">Dự toán vs thực chi từng dự án</div>'
        + '<div class="tbl-wrap"><table class="tbl"><thead><tr><th>Dự án</th><th class="num">Dự toán</th>'
        + '<th class="num">Thực chi</th><th class="num">Chênh lệch</th><th>Mức dùng</th></tr></thead><tbody>';
      html += rows.map(d=>{
        const b = Number(d['Ngân sách (đ)'])||0;
        const c = (S.chiphi||[]).filter(x=>x['Mã DA']===d['Mã DA']).reduce((a,x)=>a+(Number(x['Số tiền (đ)'])||0),0)
                + (S.ttthauphu||[]).filter(x=>x['Mã DA']===d['Mã DA']&&x['Trạng thái']==='Đã thanh toán').reduce((a,x)=>a+ttpChi(x),0);
        const p = Math.round(c/b*100), ch = b-c;
        return '<tr class="row-click" onclick="window._fnDT=\''+esc(d['Mã DA'])+'\';render()">'
          + '<td><b>'+esc(d['Tên dự án'])+'</b></td>'
          + '<td class="num">'+fmt(b)+'</td><td class="num">'+fmt(c)+'</td>'
          + '<td class="num"><b class="'+(ch>=0?'num-in':'num-out')+'">'+(ch>=0?'+':'')+fmt(ch)+'</b></td>'
          + '<td><span class="pl-bar-w" style="width:100px"><i style="width:'+Math.min(100,p)+'%;background:'
            + (p>=100?'var(--bad)':p>=85?'var(--warn)':'var(--ok)')+'"></i></span> '
          + '<span style="font-size:11.5px;font-weight:700;color:'+(p>=100?'var(--bad)':p>=85?'var(--warn)':'var(--ok)')+'">'+p+'%</span></td></tr>';
      }).join('');
      html += '</tbody></table></div><div class="rule">Dự án vượt 85% dự toán được tô cam, vượt 100% tô đỏ — nên rà soát trước khi phát sinh thêm chi phí.</div></div>';
    }
  }
  return html;
}

  const base=window._docLatest?latestOf(src):src;

  const daKy=base.filter(x=>x['Trạng thái']==='Đã ký');
  const kf=window._docKpi||'';
  html+='<div class="doc-kpis">'
    + dkCard('','Tổng số hồ sơ',base.length,'🗄','#E8EEF7','#2E5A8F',kf==='')
    + dkCard('cho','Chờ tôi duyệt',choToi.length,'◷','#FFF3E0','#E65100',kf==='cho')
    + dkCard('bh','Đã ban hành',banHanh.length,'✓','var(--ok-bg)','var(--ok)',kf==='bh')
    + dkCard('ky','Đã ký',daKy.length,'🖊','#EDE7F6','#5E35B1',kf==='ky')
    + '</div>';
  // Tab phạm vi
  const scopeTabs=[['all','Tổng quan'],['company','Hồ sơ công ty'],['project','Hồ sơ dự án']];

/* --- Tạo phiên bản mới từ hồ sơ hiện có --- */
function docNewVersion(code){
  const x = (S.hosoTL||[]).find(t=>t['Mã TL']===code);
  if(!x) return;
  const maxV = (S.hosoTL||[]).filter(r=>r['Mã hồ sơ']===x['Mã hồ sơ'])
    .reduce((a,r)=>Math.max(a, Number(r['Phiên bản'])||1), 0);
  if(!confirm('Tạo phiên bản v'+(maxV+1)+' của "'+x['Tiêu đề']+'"?\nBản cũ v'+maxV+' vẫn được giữ để truy vết.')) return;
  const rec = Object.assign({}, x, {
    'Mã TL': tempCode('TL', S.hosoTL||[], 'Mã TL'),
    'Phiên bản': maxV+1, 'Trạng thái':'Nháp', 'Ngày': today(),
    'Người tải lên': user['Họ tên'],
    'Người duyệt':'', 'Ngày duyệt':'', 'Người ký':'', 'Ngày ký':'',
    'File đính kèm': JSON.stringify([]),
    'Mô tả': (x['Mô tả']||'')
  });
  (S.hosoTL=S.hosoTL||[]).push(rec);
  closeModal(); pushOp('saveDocument', rec);
  toast('Đã tạo v'+(maxV+1)+' — mở để đính kèm file mới');
  setTimeout(()=>formDocument(rec['Mã TL']), 350);
}
